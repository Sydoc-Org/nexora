[project]
name = "nexora"
# Keep in sync with nx_lib/version.py (tests/unit/test_version.py enforces it).
version = "2.5.63"
description = "Sydoc internal portal: workitems, invoices, chat, admin"
requires-python = ">=3.13"
readme = "README.md"
license = { file = "LICENSE" }

# Runtime dependencies are mirrored to requirements.txt for IIS/wfastcgi.
# requirements.txt is generated from uv.lock — do not edit it by hand.
dependencies = [
    "Flask==3.1.2",
    "Werkzeug==3.1.3",
    "itsdangerous==2.2.0",
    "flask-babel==4.0.0",
    "Flask-Caching==2.3.1",
    "Flask-Limiter==3.12",
    "Flask-Session==0.8.0",
    "flask-talisman==1.1.0",
    "Flask-WTF==1.2.2",
    "pyodbc==5.2.0",
    "SQLAlchemy==2.0.45",
    "bcrypt==4.3.0",
    "pyotp==2.9.0",
    "qrcode==8.2",
    "python-dotenv==1.1.1",
    "requests==2.32.4",
    "pillow==11.3.0",
    "python-magic-bin==0.4.14",
    "prompt_toolkit==3.0.51",
    "openpyxl==3.1.5",
    "sqlglot>=30.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-html==4.1.1",
    "pytest-playwright==0.5.2",
    "playwright==1.49.1",
    "pytest-rerunfailures==15.0",
    "pytest-cov==6.0.0",
    "coverage[toml]==7.6.10",
    "defusedxml==0.7.1",
    "ruff==0.7.4",
    "mypy==1.13.0",
    "pre-commit==4.0.1",
    "gitlint-core==0.19.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
    ".venv",
    "venv",
    "translations",
    "static",
    "sql",
    "var",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # function calls in default args (Flask pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803"]      # allow camelCase fixtures
"nx_main.py" = ["E402"]            # late imports after Flask app setup
"nx_lib/cli.py" = [
    "N806",                        # intentional UPPER_SNAKE for animation / render-loop constants
    "RUF001", "RUF002", "RUF003",  # intentional Unicode (× α › —) in 3D render scene + UI strings
]
"nx_lib/cli_doctor.py" = ["RUF001"]  # intentional en-dash – in the "skip" glyph

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["^translations/", "^static/", "^sql/", "^var/", "^\\.venv/"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--junitxml=var/test-results/junit.xml",
    "--html=var/test-results/report.html",
    "--self-contained-html",
    "--cov=nx_lib",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:var/test-results/coverage-html",
    "--cov-report=xml:var/test-results/coverage.xml",
]
markers = [
    "flaky_e2e: end-to-end browser tests that may be retried via pytest-rerunfailures",
]
filterwarnings = [
    "ignore::DeprecationWarning:flask_session.*",
    "ignore::DeprecationWarning:flask_limiter.*",
    # in-memory storage is fine for the test suite; production concern is
    # tracked via the TODO in nx_lib/extensions.py.
    "ignore::UserWarning:flask_limiter.*",
]

[tool.coverage.run]
source = ["nx_lib"]
branch = true
omit = [
    "nx_lib/__init__.py",
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# fail_under is intentionally 0 — per-module ratcheting via
# tests/unit/test_coverage_thresholds.py is the real gate. A global floor
# would block local test runs while phase-1/2/3 tests are still being added.
fail_under = 0
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if sys.stdout.isatty",
]
