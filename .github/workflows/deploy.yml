name: Deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          D:\sydoc\tools\py\python.exe -m pip install --quiet -r requirements.txt
          D:\sydoc\tools\py\python.exe -m pip install --quiet -r requirements-dev.txt
          # Self-hosted runner: `pip install --quiet -r` can no-op when a
          # newer ruff is already installed system-wide, causing the format
          # check to diverge from dev. Force the pinned version explicitly.
          D:\sydoc\tools\py\python.exe -m pip install --quiet --force-reinstall ruff==0.7.4

      - name: Show tool versions
        shell: powershell
        run: |
          D:\sydoc\tools\py\python.exe --version
          D:\sydoc\tools\py\python.exe -m ruff --version

      # The self-hosted runner has a persistent workspace. Files added before
      # `.gitattributes` got `*.py text eol=lf` (2026-05-13) were cached with
      # CRLF endings and actions/checkout has not re-normalised them on
      # subsequent runs. ruff's `format.line-ending = "lf"` then flags those
      # files as needing reformat even though their content is identical to
      # what dev sees locally. Re-normalise to LF before any ruff step.
      - name: Normalize Python line endings to LF
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          Get-ChildItem -Path nx_lib, nx_main.py, tests -Recurse -Include *.py | ForEach-Object {
            $text = [System.IO.File]::ReadAllText($_.FullName, $utf8NoBom)
            $normalized = $text -replace "`r`n", "`n"
            if ($normalized -ne $text) {
              [System.IO.File]::WriteAllText($_.FullName, $normalized, $utf8NoBom)
              Write-Host "  fixed: $($_.FullName)"
            }
          }

      - name: Ruff lint
        shell: powershell
        run: D:\sydoc\tools\py\python.exe -m ruff check nx_lib nx_main.py tests

      - name: Ruff format check
        shell: powershell
        run: D:\sydoc\tools\py\python.exe -m ruff format --check nx_lib nx_main.py tests

      - name: Install Playwright chromium
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          D:\sydoc\tools\py\python.exe -m playwright install chromium

      - name: Copy TEST.env into workspace env/
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $src = "C:\sydoc\runner-secrets\TEST.env"
          if (-not (Test-Path $src)) {
            throw "Runner is missing $src. Provision it once on the runner machine."
          }
          # env/ already exists in the workspace via env/*.env.example tracking.
          # config.py loads env/{ENVIRONMENT}.env (PR 8 of dev-env upgrade).
          Copy-Item $src "${{ github.workspace }}\env\TEST.env" -Force

      - name: Verify env/TEST.env
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $testEnv = "${{ github.workspace }}\env\TEST.env"
          $envLine = Get-Content $testEnv | Where-Object { $_ -match '^\s*ENVIRONMENT\s*=' } | Select-Object -First 1
          if ($envLine -notmatch '^\s*ENVIRONMENT\s*=\s*"?TEST"?\s*$') {
            throw "env/TEST.env must contain 'ENVIRONMENT=TEST'. Found: '$envLine'"
          }

      - name: Reset NEXORA_TEST database
        shell: powershell
        run: .\scripts\test-db-reset.ps1

      - name: Run pytest
        shell: powershell
        env:
          ENVIRONMENT: TEST
        run: |
          $ErrorActionPreference = 'Stop'
          D:\sydoc\tools\py\python.exe -m pytest tests `
            --reruns 2 --only-rerun flaky_e2e `
            -p no:cacheprovider `
            -o junit_logging=all

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: var/test-results/
          if-no-files-found: warn

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Verify prod env files
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $deployDir = "D:\sydoc\nexora"
          # The root-level .env stays put — it is the env-selector that
          # sets ENVIRONMENT=PROD so the loader picks the right secrets file.
          $envFile = "$deployDir\.env"
          # PROD.env moved into env/ in PR 8 of the dev-env upgrade. The
          # loader in nx_lib/config.py still has a one-release fallback to
          # the legacy root location (emits a DeprecationWarning), so a
          # missed move on SYAPP01 won't take the site down.
          $prodEnvFile = "$deployDir\env\PROD.env"
          $legacyProdEnvFile = "$deployDir\PROD.env"

          if (-not (Test-Path $envFile)) {
            throw "Aborting deploy: $envFile not found."
          }
          $envLine = Get-Content $envFile | Where-Object { $_ -match '^\s*ENVIRONMENT\s*=' } | Select-Object -First 1
          if ($envLine -notmatch '^\s*ENVIRONMENT\s*=\s*"?PROD"?\s*$') {
            throw "Aborting deploy: $envFile must contain 'ENVIRONMENT=PROD'. Found: '$envLine'"
          }
          Write-Host "Verified: $envFile has ENVIRONMENT=PROD"

          if (Test-Path $prodEnvFile) {
            Write-Host "Verified: $prodEnvFile exists"
          } elseif (Test-Path $legacyProdEnvFile) {
            Write-Warning "PROD.env is still at the legacy root location ($legacyProdEnvFile). Move it to $prodEnvFile to silence the DeprecationWarning the app emits at startup."
          } else {
            throw "Aborting deploy: neither $prodEnvFile nor $legacyProdEnvFile exists. The app will fail to load secrets without one of them."
          }

      - name: Apply DB migrations to PROD
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Runs BEFORE the app pool stop so a failed migration leaves the
          # existing app serving old code on old schema -- nothing breaks.
          # The runner reads env/PROD.env from CWD; PROD.env lives at the
          # deploy target (gitignored), so copy it into the workspace's
          # env/ temporarily. Fall back to the legacy root location if PR 8
          # files haven't been moved on SYAPP01 yet.
          $envSrcNew = "D:\sydoc\nexora\env\PROD.env"
          $envSrcLegacy = "D:\sydoc\nexora\PROD.env"
          $envDst = "${{ github.workspace }}\env\PROD.env"
          if (Test-Path $envSrcNew) {
            Copy-Item $envSrcNew $envDst -Force
          } elseif (Test-Path $envSrcLegacy) {
            Write-Warning "Using legacy PROD.env at $envSrcLegacy (move it to $envSrcNew to silence the DeprecationWarning)."
            Copy-Item $envSrcLegacy $envDst -Force
          } else {
            throw "Neither $envSrcNew nor $envSrcLegacy exists on SYAPP01."
          }
          # The runner service inherits the System PATH from when it was last
          # started. If SqlCmd was added after that, shutil.which("sqlcmd") in
          # db-migrate.py returns None until the runner service is restarted.
          # Prepend the well-known install dir defensively (db-migrate.py also
          # has an in-Python fallback for the same reason).
          $env:PATH = "C:\Program Files\SqlCmd;$env:PATH"
          try {
            D:\sydoc\tools\py\python.exe scripts/db-migrate.py --env PROD --yes
          } finally {
            Remove-Item $envDst -Force -ErrorAction SilentlyContinue
          }

      - name: Stop app pool and service
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module WebAdministration

          $pool = "DefaultAppPool"
          Write-Host "App pool '$pool' initial state: $((Get-WebAppPoolState -Name $pool).Value)"

          # Wait out any in-flight transition so we don't hit 0x80070425
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-WebAppPoolState -Name $pool).Value -in @('Starting','Stopping')) {
            if ((Get-Date) -gt $deadline) {
              throw "App pool '$pool' stuck in transition: $((Get-WebAppPoolState -Name $pool).Value)"
            }
            Start-Sleep -Seconds 2
          }

          if ((Get-WebAppPoolState -Name $pool).Value -eq 'Started') {
            Stop-WebAppPool -Name $pool
          }

          # Block until w3wp.exe has actually exited and handles are released
          $deadline = (Get-Date).AddSeconds(120)
          while ((Get-WebAppPoolState -Name $pool).Value -ne 'Stopped') {
            if ((Get-Date) -gt $deadline) {
              throw "App pool '$pool' did not stop within 120s (state: $((Get-WebAppPoolState -Name $pool).Value))"
            }
            Start-Sleep -Seconds 2
          }
          Write-Host "App pool '$pool' is Stopped."

          $svc = Get-Service -Name 'ngrok' -ErrorAction SilentlyContinue
          if ($svc -and $svc.Status -ne 'Stopped') {
            Stop-Service -Name 'ngrok' -Force
            $svc.WaitForStatus('Stopped', '00:01:00')
          }
          Write-Host "Service 'ngrok' is Stopped."

      - name: Sync to deploy folder
        shell: powershell
        run: |
          robocopy "${{ github.workspace }}" "D:\sydoc\nexora" /MIR /R:3 /W:2 `
            /XD .git .github .claude .claude-flow .gitnexus .playwright-mcp .superpowers .swarm .vscode .idea __pycache__ var bin session logs uploads screenshots backups scripts sql tests test-results docs `
            /XF *.env *.env.example ngrok.yaml .gitignore .mcp.json AGENTS.md CLAUDE.md nx.ps1 babel.cfg messages.pot requirements.txt requirements-dev.txt README.md pyproject.toml
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          # /XF excludes *.env.example from being copied AND from being purged,
          # so any *.env.example already on SYAPP01 from earlier deploys would
          # stay forever. Sweep them: prod only needs PROD.env in env/.
          Remove-Item "D:\sydoc\nexora\env\*.env.example" -Force -ErrorAction SilentlyContinue
          # Sweep dev-only var/ subdirs left behind by older Flask startups
          # (nx_lib/config.py used to mkdir them unconditionally). Only delete
          # if empty so we never touch user data.
          foreach ($d in 'screenshots','backups','test-results') {
            $p = "D:\sydoc\nexora\var\$d"
            if ((Test-Path $p) -and ((Get-ChildItem -LiteralPath $p -Force -ErrorAction SilentlyContinue).Count -eq 0)) {
              Remove-Item -LiteralPath $p -Force
            }
          }
          exit 0

      - name: Start app pool and service
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module WebAdministration

          $pool = "DefaultAppPool"
          # Defensive: don't issue Start while in a transition
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-WebAppPoolState -Name $pool).Value -in @('Starting','Stopping')) {
            if ((Get-Date) -gt $deadline) {
              throw "App pool '$pool' stuck in transition: $((Get-WebAppPoolState -Name $pool).Value)"
            }
            Start-Sleep -Seconds 2
          }

          if ((Get-WebAppPoolState -Name $pool).Value -eq 'Stopped') {
            Start-WebAppPool -Name $pool
          }

          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-WebAppPoolState -Name $pool).Value -ne 'Started') {
            if ((Get-Date) -gt $deadline) {
              throw "App pool '$pool' did not start within 60s (state: $((Get-WebAppPoolState -Name $pool).Value))"
            }
            Start-Sleep -Seconds 2
          }
          Write-Host "App pool '$pool' is Started."

          Start-Service -Name 'ngrok'
          (Get-Service -Name 'ngrok').WaitForStatus('Running', '00:01:00')
          Write-Host "Service 'ngrok' is Running."
