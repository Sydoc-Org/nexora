name: Deploy
# Three hosted environments (#338):
#   any branch push  -> fast tests -> deploy DEV     (D:\sydoc\nexora-dev,     ENVIRONMENT=INT)
#   push to main     -> fast tests -> deploy STAGING (D:\sydoc\nexora-staging, ENVIRONMENT=STAGING)
#   v* tag push      -> fast tests -> deploy PROD    (D:\sydoc\nexora,         ENVIRONMENT=PROD)
# The deploy steps live in deploy-env.yml (reusable); the callers are at the
# bottom of this file. No pull_request trigger: every branch push already runs
# the fast tier and its check shows on the PR.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    # Inert-file changes skip the whole pipeline: docs/, *.md and .claude/
    # are all excluded from the robocopy mirror, so there is nothing to test
    # or deploy. Mixed pushes (code + docs) still run everything. (GitHub
    # ignores paths filters for tag pushes -- a release always runs.)
    # Exception: docs/howto/reporting-guide.md IS runtime content (served
    # in-app at /reporting/guide), so it is re-included after the negations
    # (paths patterns: last match wins).
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "!.claude/**"
      - "!.claudeignore"
      - "docs/howto/reporting-guide.md"
  schedule:
    # 01:30 daily: redeploy main to STAGING after the 01:00 DB refresh on
    # PRDSQL01 (ops/staging-refresh.sql) so pending migrations are re-applied
    # to the freshly restored copy -- #338.
    - cron: "30 1 * * *"
    # e2e cadence: nightly on main and on demand (Actions -> Deploy -> Run
    # workflow), not on every push -- see the "Run E2E tests" step.
    - cron: "0 3 * * 1-5"
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted
    # A newer push to the same ref supersedes a still-running test job — cancel it.
    # Never applied to the deploy job: cancelling mid-robocopy would leave
    # PROD half-mirrored.
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          D:\sydoc\tools\py\python.exe -m pip install --quiet -r requirements.txt
          D:\sydoc\tools\py\python.exe -m pip install --quiet -r requirements-dev.txt
          # Self-hosted runner: `pip install --quiet -r` can no-op when a
          # newer ruff is already installed system-wide, causing the format
          # check to diverge from dev. Force the pinned version explicitly.
          D:\sydoc\tools\py\python.exe -m pip install --quiet --force-reinstall ruff==0.7.4

      - name: Show tool versions
        shell: powershell
        run: |
          D:\sydoc\tools\py\python.exe --version
          D:\sydoc\tools\py\python.exe -m ruff --version

      # The self-hosted runner has a persistent workspace. Files added before
      # `.gitattributes` got `*.py text eol=lf` (2026-05-13) were cached with
      # CRLF endings and actions/checkout has not re-normalised them on
      # subsequent runs. ruff's `format.line-ending = "lf"` then flags those
      # files as needing reformat even though their content is identical to
      # what dev sees locally. Re-normalise to LF before any ruff step.
      - name: Normalize Python line endings to LF
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          Get-ChildItem -Path nx_lib, nx_main.py, tests -Recurse -Include *.py | ForEach-Object {
            $text = [System.IO.File]::ReadAllText($_.FullName, $utf8NoBom)
            $normalized = $text -replace "`r`n", "`n"
            if ($normalized -ne $text) {
              [System.IO.File]::WriteAllText($_.FullName, $normalized, $utf8NoBom)
              Write-Host "  fixed: $($_.FullName)"
            }
          }

      - name: Ruff lint
        shell: powershell
        run: D:\sydoc\tools\py\python.exe -m ruff check nx_lib nx_main.py scripts tests

      - name: Ruff format check
        shell: powershell
        run: D:\sydoc\tools\py\python.exe -m ruff format --check nx_lib nx_main.py scripts tests

      - name: Mypy
        shell: powershell
        run: D:\sydoc\tools\py\python.exe -m mypy nx_lib nx_main.py

      - name: Install Playwright chromium
        if: github.event.schedule == '0 3 * * 1-5' || github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          D:\sydoc\tools\py\python.exe -m playwright install chromium

      - name: Copy TEST.env into workspace env/
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $src = "C:\sydoc\runner-secrets\TEST.env"
          if (-not (Test-Path $src)) {
            throw "Runner is missing $src. Provision it once on the runner machine."
          }
          # env/ already exists in the workspace via env/*.env.example tracking.
          # config.py loads env/{ENVIRONMENT}.env (PR 8 of dev-env upgrade).
          Copy-Item $src "${{ github.workspace }}\env\TEST.env" -Force

      - name: Verify env/TEST.env
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $testEnv = "${{ github.workspace }}\env\TEST.env"
          $envLine = Get-Content $testEnv | Where-Object { $_ -match '^\s*ENVIRONMENT\s*=' } | Select-Object -First 1
          if ($envLine -notmatch '^\s*ENVIRONMENT\s*=\s*"?TEST"?\s*$') {
            throw "env/TEST.env must contain 'ENVIRONMENT=TEST'. Found: '$envLine'"
          }

      # No database reset step: pytest creates its own NEXORA_TEST_<user>_<pid>
      # from sql/test/schema.sql + seed.sql and drops it (tests/conftest.py).

      # Two tiers, cheap first: default collection order is alphabetical, so
      # `pytest tests` used to run the 10-minute e2e suite BEFORE unit tests —
      # a trivial unit failure surfaced last. Fast tier covers everything
      # except tests/e2e (including root-level test files).
      #
      # The fast tier runs on every event (incl. the 01:30 staging redeploy);
      # e2e is the 03:00 cron / on demand only (see its `if`).
      - name: Run unit + integration tests
        shell: powershell
        env:
          ENVIRONMENT: TEST
        run: |
          $ErrorActionPreference = 'Stop'
          D:\sydoc\tools\py\python.exe -m pytest tests --ignore=tests/e2e `
            -p no:cacheprovider `
            -o junit_logging=all `
            --junitxml=var/test-results/junit-fast.xml `
            --html=var/test-results/report-fast.html

      # e2e is ~15 min of the ~21 min test job, so it no longer runs on every
      # PR (each pytest run creates its own NEXORA_TEST_* database): nightly on main
      # (schedule) and on demand (workflow_dispatch). The fast tier still gates
      # every PR and every merge commit. If a merge breaks something only e2e
      # catches, the nightly run says so the next morning; revert and fix
      # forward. The step has a hard timeout: a hung browser used to hold the
      # database lock for hours and stall every other push and CI run.
      - name: Run E2E tests
        if: github.event.schedule == '0 3 * * 1-5' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 25
        shell: powershell
        env:
          ENVIRONMENT: TEST
        run: |
          $ErrorActionPreference = 'Stop'
          D:\sydoc\tools\py\python.exe -m pytest tests/e2e `
            -p no:cacheprovider `
            -o junit_logging=all `
            --junitxml=var/test-results/junit-e2e.xml `
            --html=var/test-results/report-e2e.html

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: var/test-results/
          if-no-files-found: warn

  # Deploys queue, never cancel — cancelling mid-robocopy would leave a host
  # half-mirrored. One concurrency group per environment.

  # dev = whatever topic branch was pushed last (#338)
  deploy-dev:
    needs: test
    if: github.event_name == 'push' && github.ref_type == 'branch' && github.ref != 'refs/heads/main'
    concurrency:
      group: dev-deploy
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-env.yml
    with:
      env_name: INT
      deploy_dir: 'D:\sydoc\nexora-dev'
      app_pool: nexora-dev

  # staging = main, plus the nightly redeploy after the DB refresh. The schedule
  # event checks out the default branch, so it always redeploys main.
  deploy-staging:
    needs: test
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'schedule' && github.event.schedule == '30 1 * * *')
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-env.yml
    with:
      env_name: STAGING
      deploy_dir: 'D:\sydoc\nexora-staging'
      app_pool: nexora-staging

  # prod = a v* tag (CONTRIBUTING.md -> Releases). Only prod registers the
  # Windows scheduled tasks.
  deploy-prod:
    needs: test
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-env.yml
    with:
      env_name: PROD
      deploy_dir: 'D:\sydoc\nexora'
      app_pool: DefaultAppPool
      register_tasks: true
