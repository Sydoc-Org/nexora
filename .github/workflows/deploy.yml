name: Deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Stop app pool and service
        shell: powershell
        run: |
          Import-Module WebAdministration
          Stop-WebAppPool -Name "DefaultAppPool" -ErrorAction SilentlyContinue
          Stop-Service -Name "ngrok" -Force -ErrorAction SilentlyContinue

      - name: Sync to deploy folder
        shell: powershell
        run: |
          robocopy "${{ github.workspace }}" "D:\sydoc\nexora" /MIR /R:3 /W:2 /XD .git .github session logs uploads __pycache__ .vscode .idea /XF *.env ngrok.yaml
          if ($LASTEXITCODE -lt 8) { exit 0 } else { exit $LASTEXITCODE }

      - name: Start app pool and service
        shell: powershell
        run: |
          Import-Module WebAdministration
          Start-WebAppPool -Name "DefaultAppPool"
          Start-Service -Name "ngrok"