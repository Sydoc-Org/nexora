# Read-only look at PROD from off-box.
#
# WinRM to SYAPP01 is blocked by the VPN/network ACL (see
# docs/howto/winrm-prod-access.md), and only SMB + RDP get through. The
# self-hosted runner already executes ON SYAPP01, so this workflow borrows it
# to answer the handful of questions that need a process on the server rather
# than a file read over the admin share.
#
# Deliberately has no command input: every step is a fixed, read-only probe.
# Nothing here writes, restarts, or prints a secret value.
#
# Two accepted trade-offs:
#   * Everything printed lands in the Actions run log -- private repo, but
#     visible to anyone with read access for the retention window. app.log can
#     carry request paths and usernames, so treat a run as sharing that window
#     internally. Env KEY NAMES are printed; values never are.
#   * `runs-on: self-hosted` is unscoped, matching deploy.yml. There is one
#     runner and it lives on SYAPP01; add a label filter here and in deploy.yml
#     together if a second one ever joins.
name: PROD diagnostics

on:
  workflow_dispatch:
    inputs:
      log_lines:
        description: "Lines of app.log to tail"
        required: false
        default: "80"

jobs:
  diagnose:
    runs-on: self-hosted
    steps:
      - name: App log
        shell: powershell
        # log_lines reaches the script through the environment, never through
        # a ${{ }} interpolation into the body -- an input like "80; <command>"
        # would otherwise run as PowerShell. Digits only, else the default.
        env:
          LOG_LINES: ${{ inputs.log_lines }}
        run: |
          $n = 80
          if ($env:LOG_LINES -match '^[0-9]{1,5}$') { $n = [int]$env:LOG_LINES }
          $log = "D:\sydoc\nexora\var\logs\system\app.log"
          if (-not (Test-Path $log)) { "MISSING: $log"; exit 0 }
          $f = Get-Item $log
          "last write : $($f.LastWriteTime)  ($([math]::Round($f.Length/1KB)) KB)"
          "--- tail $n ---"
          Get-Content $log -Tail $n

      - name: IIS state
        shell: powershell
        run: |
          Import-Module WebAdministration
          Get-ChildItem IIS:\AppPools | Select-Object Name, State | Format-Table -AutoSize | Out-String
          Get-ChildItem IIS:\Sites | Select-Object Name, State | Format-Table -AutoSize | Out-String

      - name: PROD env keys
        shell: powershell
        run: |
          # Key names only -- values never leave the box.
          $envFile = "D:\sydoc\nexora\env\PROD.env"
          if (-not (Test-Path $envFile)) { "MISSING: $envFile"; exit 0 }
          (Get-Content $envFile | Where-Object { $_ -match '^\s*[A-Za-z_]' } |
            ForEach-Object { ($_ -split '=', 2)[0].Trim() }) -join "`n"

      - name: Disk and uptime
        shell: powershell
        run: |
          Get-PSDrive -PSProvider FileSystem |
            Where-Object { $_.Used -ne $null } |
            Select-Object Name,
              @{n = 'UsedGB'; e = { [math]::Round($_.Used / 1GB, 1) }},
              @{n = 'FreeGB'; e = { [math]::Round($_.Free / 1GB, 1) }} |
            Format-Table -AutoSize | Out-String
          "booted: $((Get-CimInstance Win32_OperatingSystem).LastBootUpTime)"

      - name: Outage monitor state
        shell: powershell
        run: |
          $state = "D:\sydoc\nexora\var\outage-state.json"
          if (Test-Path $state) {
            "last write: $((Get-Item $state).LastWriteTime)"
            Get-Content $state -Raw
          } else { "no outage-state.json yet" }
