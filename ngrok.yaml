version: 3

agent:
  authtoken: 

endpoints:
  - name: nexora-app
    url: https://nexora.sydoc.ch
    upstream:
      url: 80
    traffic_policy:
      on_http_request:
        - name: "Block Bots"
          expressions:
            - "req.user_agent.name in ['Googlebot', 'Bingbot', 'ChatGPT-User', 'GPTBot', 'Bytespider']"
          actions:
            - type: deny
              config:
                status_code: 403