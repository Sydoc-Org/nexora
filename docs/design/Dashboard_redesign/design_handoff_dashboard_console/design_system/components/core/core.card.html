  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 9.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--nx-text-meta); }
</style>
<div id="root"></div>
<script type="text/babel" data-presets="react">

let Button, IconButton, Label, CountPill;
function Card() {
  return (
    <div className="stack">
      <div className="row">
        <Button variant="primary">Speichern</Button>
        <Button icon="fas fa-rotate">Aktualisieren</Button>
        <Button variant="tint" icon="fas fa-play">Ausführen</Button>
        <Button variant="ghost">Abbrechen</Button>
        <Button variant="danger">Löschen</Button>

        <Button size="sm">27px</Button>

        <Button size="lg">33px console</Button>

        <IconButton icon="fas fa-gear" label="Einstellungen" variant="outline" />
      </div>
      <div className="row">
        <Label tone="green">Verarbeitet</Label>
        <Label tone="amber">Offen</Label>
        <Label tone="red">Fehler</Label>
        <Label tone="blue">Importiert</Label>
        <Label tone="gray" dot={false}>Archiv</Label>
        <CountPill label="Offen" value="1,247" />

    </div>

nexoraDS('../../').then(function (NS) {
  ({ Button, IconButton, Label, CountPill } = NS);
