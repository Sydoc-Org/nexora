<!-- @dsCard group="Type" viewport="700x200" name="Schibsted Grotesk — UI scale" subtitle="One page title, one section title, one control size" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px 18px; background: var(--nx-card); font-family: var(--nx-font); color: var(--nx-text); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw { display: flex; flex-direction: column; gap: 6px; width: 96px; }
  .chip { height: 44px; border-radius: 8px; border: 1px solid var(--nx-border); }
  .name { font-size: 10.5px; font-weight: 600; color: var(--nx-text); }
  .hex { font-family: var(--nx-mono); font-size: 9.5px; color: var(--nx-text-meta); }
  .cap { font-size: 9.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--nx-text-meta); }
  table { border-collapse: collapse; font-size: 11.5px; }
  td { padding: 3px 14px 3px 0; color: var(--nx-text-sec); }
  td.k { font-family: var(--nx-mono); color: var(--nx-text); }
</style>

<div style="display:flex;flex-direction:column;gap:8px">
  <div style="font-size:22px;font-weight:600;letter-spacing:-.5px">Dashboard <span class="hex">22 / 600 / −.5px</span></div>
  <div style="font-size:15px;font-weight:700;letter-spacing:-.02em">Rückstand <span class="hex">15 / 700 / −.02em</span></div>
  <div style="font-size:13px">Tabellenzelle, Formulartext <span class="hex">13 / 400</span></div>
  <div style="font-size:12.5px;font-weight:600">Aktualisieren (Control) <span class="hex">12.5 / 600</span></div>
  <div style="font-size:11.5px;color:var(--nx-text-meta)">Aktualisiert 06:47:12 · neu in 27s <span class="hex">11.5 / 400</span></div>
  <div class="cap">Verlauf 14 Tage <span class="hex" style="letter-spacing:0">10 / 700 / .09em</span></div>
</div>
