<!-- @dsCard group="Brand" viewport="700x230" name="Boxes → rules" subtitle="The one rule of the slim system: a hairline instead of a card" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px 18px; background: var(--nx-card); font-family: var(--nx-font); color: var(--nx-text); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw { display: flex; flex-direction: column; gap: 6px; width: 96px; }
  .chip { height: 44px; border-radius: 8px; border: 1px solid var(--nx-border); }
  .name { font-size: 10.5px; font-weight: 600; color: var(--nx-text); }
  .hex { font-family: var(--nx-mono); font-size: 9.5px; color: var(--nx-text-meta); }
  .cap { font-size: 9.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--nx-text-meta); }
  table { border-collapse: collapse; font-size: 11.5px; }
  td { padding: 3px 14px 3px 0; color: var(--nx-text-sec); }
  td.k { font-family: var(--nx-mono); color: var(--nx-text); }
</style>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">
  <div>
    <div class="cap" style="color:var(--nx-danger)">Vorher</div>
    <div style="margin-top:8px;background:var(--nx-card);border:1px solid var(--nx-border);border-radius:10px;padding:12px 14px;box-shadow:0 1px 2px rgba(16,24,40,.04)">
      <div class="cap">Heute importiert</div>
      <div style="font-family:var(--nx-mono);font-size:24px;font-weight:600;margin-top:6px">595</div>
    </div>
    <div style="margin-top:10px;background:var(--nx-card);border:1px solid var(--nx-border);border-radius:10px;padding:12px 14px;box-shadow:0 1px 2px rgba(16,24,40,.04)">
      <div class="cap">Rückstand</div>
      <div style="font-family:var(--nx-mono);font-size:24px;font-weight:600;margin-top:6px">1,247</div>
    </div>
  </div>
  <div>
    <div class="cap" style="color:var(--nx-success)">Nachher</div>
    <div style="margin-top:8px;display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--nx-border)">
      <div style="padding:12px 16px 12px 0">
        <div class="cap">Heute importiert</div>
        <div style="font-family:var(--nx-mono);font-size:24px;font-weight:600;margin-top:6px">595</div>
      </div>
      <div style="padding:12px 0 12px 16px;border-left:1px solid var(--nx-divider)">
        <div class="cap">Rückstand</div>
        <div style="font-family:var(--nx-mono);font-size:24px;font-weight:600;margin-top:6px">1,247</div>
      </div>
    </div>
    <p style="font-size:11px;color:var(--nx-text-meta);margin:10px 0 0">Same information, one line instead of four frames and two shadows.</p>
  </div>
</div>
