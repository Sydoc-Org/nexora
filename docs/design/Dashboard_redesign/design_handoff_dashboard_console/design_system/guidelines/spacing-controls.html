<!-- @dsCard group="Spacing" viewport="700x140" name="Control heights" subtitle="29px on slim pages, 33px in the console — never mixed in one row" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px 18px; background: var(--nx-card); font-family: var(--nx-font); color: var(--nx-text); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw { display: flex; flex-direction: column; gap: 6px; width: 96px; }
  .chip { height: 44px; border-radius: 8px; border: 1px solid var(--nx-border); }
  .name { font-size: 10.5px; font-weight: 600; color: var(--nx-text); }
  .hex { font-family: var(--nx-mono); font-size: 9.5px; color: var(--nx-text-meta); }
  .cap { font-size: 9.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--nx-text-meta); }
  table { border-collapse: collapse; font-size: 11.5px; }
  td { padding: 3px 14px 3px 0; color: var(--nx-text-sec); }
  td.k { font-family: var(--nx-mono); color: var(--nx-text); }
</style>

<div style="display:flex;align-items:flex-end;gap:16px">
  <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><span class="cap">27 sm</span><button style="height:27px;padding:0 9px;font:600 11.5px var(--nx-font);border:1px solid var(--nx-border);border-radius:8px;background:var(--nx-card);color:var(--nx-text)">Aktion</button></div>
  <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><span class="cap">29 slim</span><button style="height:29px;padding:0 11px;font:600 12.5px var(--nx-font);border:1px solid var(--nx-border);border-radius:8px;background:var(--nx-card);color:var(--nx-text)">Aktion</button></div>
  <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><span class="cap">33 console</span><button style="height:33px;padding:0 12px;font:600 12.5px var(--nx-font);border:1px solid var(--nx-border);border-radius:8px;background:var(--nx-card);color:var(--nx-text)">Aktion</button></div>
  <table style="margin-left:12px"><tr><td class="k">--ctl-h</td><td>29px</td></tr><tr><td class="k">--ctl-h-lg</td><td>33px</td></tr><tr><td class="k">--ctl-px</td><td>11px</td></tr></table>
</div>
