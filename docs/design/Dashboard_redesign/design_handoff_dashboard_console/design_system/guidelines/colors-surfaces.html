<!-- @dsCard group="Colors" viewport="700x140" name="Surfaces & lines" subtitle="Two greys and two line weights carry the whole slim layout" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px 18px; background: var(--nx-card); font-family: var(--nx-font); color: var(--nx-text); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw { display: flex; flex-direction: column; gap: 6px; width: 96px; }
  .chip { height: 44px; border-radius: 8px; border: 1px solid var(--nx-border); }
  .name { font-size: 10.5px; font-weight: 600; color: var(--nx-text); }
  .hex { font-family: var(--nx-mono); font-size: 9.5px; color: var(--nx-text-meta); }
  .cap { font-size: 9.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--nx-text-meta); }
  table { border-collapse: collapse; font-size: 11.5px; }
  td { padding: 3px 14px 3px 0; color: var(--nx-text-sec); }
  td.k { font-family: var(--nx-mono); color: var(--nx-text); }
</style>

<div class="row">
  <div class="sw"><div class="chip" style="background:var(--nx-page)"></div><span class="name">page</span><span class="hex">#f9fafb</span></div>
  <div class="sw"><div class="chip" style="background:var(--nx-card)"></div><span class="name">card / raised</span><span class="hex">#ffffff</span></div>
  <div class="sw"><div class="chip" style="background:var(--nx-sunken)"></div><span class="name">sunken</span><span class="hex">#f3f4f6</span></div>
  <div class="sw"><div class="chip" style="background:var(--nx-card);border-color:var(--nx-border)"></div><span class="name">rule</span><span class="hex">#e5e7eb</span></div>
  <div class="sw"><div class="chip" style="background:var(--nx-card);border-color:var(--nx-divider)"></div><span class="name">hairline</span><span class="hex">#f3f4f6</span></div>
  <div class="sw"><div class="chip" style="background:var(--nx-card);border-color:var(--nx-border-strong)"></div><span class="name">border-strong</span><span class="hex">#d1d5db</span></div>
</div>
