<!-- @dsCard group="Brand" viewport="700x150" name="Dark mode" subtitle="Same layout, slate surfaces, amber lifts to #fbbf24" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px 18px; background: var(--nx-card); font-family: var(--nx-font); color: var(--nx-text); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw { display: flex; flex-direction: column; gap: 6px; width: 96px; }
  .chip { height: 44px; border-radius: 8px; border: 1px solid var(--nx-border); }
  .name { font-size: 10.5px; font-weight: 600; color: var(--nx-text); }
  .hex { font-family: var(--nx-mono); font-size: 9.5px; color: var(--nx-text-meta); }
  .cap { font-size: 9.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--nx-text-meta); }
  table { border-collapse: collapse; font-size: 11.5px; }
  td { padding: 3px 14px 3px 0; color: var(--nx-text-sec); }
  td.k { font-family: var(--nx-mono); color: var(--nx-text); }
</style>

<div class="dark" style="all:unset"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
  <div style="background:#ffffff;border:1px solid #e5e7eb;border-radius:8px;padding:14px 16px">
    <div style="font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#9ca3af">Rückstand</div>
    <div style="font-family:var(--nx-mono);font-size:26px;font-weight:600;color:#1f2937;margin-top:6px">1,247</div>
    <div style="font-size:11px;font-weight:600;color:#b45309;margin-top:5px">+4% <span style="font-weight:400;color:#9ca3af">vs. gestern</span></div>
  </div>
  <div style="background:#1e293b;border:1px solid #334155;border-radius:8px;padding:14px 16px">
    <div style="font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#64748b">Rückstand</div>
    <div style="font-family:var(--nx-mono);font-size:26px;font-weight:600;color:#e2e8f0;margin-top:6px">1,247</div>
    <div style="font-size:11px;font-weight:600;color:#fcd34d;margin-top:5px">+4% <span style="font-weight:400;color:#64748b">vs. gestern</span></div>
  </div>
</div>
