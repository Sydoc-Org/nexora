<!-- @dsCard group="Type" viewport="700x150" name="Numbers — mono, tabular" subtitle="Every figure a user compares runs in the mono stack" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px 18px; background: var(--nx-card); font-family: var(--nx-font); color: var(--nx-text); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw { display: flex; flex-direction: column; gap: 6px; width: 96px; }
  .chip { height: 44px; border-radius: 8px; border: 1px solid var(--nx-border); }
  .name { font-size: 10.5px; font-weight: 600; color: var(--nx-text); }
  .hex { font-family: var(--nx-mono); font-size: 9.5px; color: var(--nx-text-meta); }
  .cap { font-size: 9.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--nx-text-meta); }
  table { border-collapse: collapse; font-size: 11.5px; }
  td { padding: 3px 14px 3px 0; color: var(--nx-text-sec); }
  td.k { font-family: var(--nx-mono); color: var(--nx-text); }
</style>

<div style="display:flex;align-items:flex-end;gap:34px">
  <div>
    <div class="cap">KPI</div>
    <div style="font-family:var(--nx-mono);font-variant-numeric:tabular-nums;font-size:32px;font-weight:600;letter-spacing:-1.4px;line-height:1;margin-top:8px">1,247</div>
    <div style="margin-top:6px;font-size:11px;font-weight:600;color:var(--nx-accent-hover)">+4% <span style="font-weight:400;color:var(--nx-text-meta)">vs. gestern</span></div>
  </div>
  <div>
    <div class="cap">Tabelle</div>
    <div style="font-family:var(--nx-mono);font-variant-numeric:tabular-nums;font-size:13px;margin-top:8px;line-height:1.7">DOC-882314<br>DOC-882311<br>DOC-882308</div>
  </div>
  <div>
    <div class="cap">Meta</div>
    <div style="font-family:var(--nx-mono);font-variant-numeric:tabular-nums;font-size:11px;color:var(--nx-text-meta);margin-top:8px;line-height:1.7">06:41<br>06:38<br>06:35</div>
  </div>
</div>
