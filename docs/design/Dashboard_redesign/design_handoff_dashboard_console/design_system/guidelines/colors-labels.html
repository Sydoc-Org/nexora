<!-- @dsCard group="Colors" viewport="700x110" name="Label pastels" subtitle="bg/fg pairs for status labels — never for page surfaces" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px 18px; background: var(--nx-card); font-family: var(--nx-font); color: var(--nx-text); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw { display: flex; flex-direction: column; gap: 6px; width: 96px; }
  .chip { height: 44px; border-radius: 8px; border: 1px solid var(--nx-border); }
  .name { font-size: 10.5px; font-weight: 600; color: var(--nx-text); }
  .hex { font-family: var(--nx-mono); font-size: 9.5px; color: var(--nx-text-meta); }
  .cap { font-size: 9.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--nx-text-meta); }
  table { border-collapse: collapse; font-size: 11.5px; }
  td { padding: 3px 14px 3px 0; color: var(--nx-text-sec); }
  td.k { font-family: var(--nx-mono); color: var(--nx-text); }
</style>

<div class="row" style="align-items:center">
  <span style="display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:11.5px;background:var(--nx-l-green);color:var(--nx-l-green-fg)"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>green</span>
  <span style="display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:11.5px;background:var(--nx-l-amber);color:var(--nx-l-amber-fg)"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>amber</span>
  <span style="display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:11.5px;background:var(--nx-l-red);color:var(--nx-l-red-fg)"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>red</span>
  <span style="display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:11.5px;background:var(--nx-l-blue);color:var(--nx-l-blue-fg)"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>blue</span>
  <span style="display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:11.5px;background:var(--nx-l-indigo);color:var(--nx-l-indigo-fg)"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>indigo</span>
  <span style="display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:11.5px;background:var(--nx-l-gray);color:var(--nx-l-gray-fg)"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>gray</span>
</div>
