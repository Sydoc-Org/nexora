<!-- @dsCard group="Colors" viewport="700x150" name="Accent (amber) & status" subtitle="Amber is the default operations accent; indigo remains a theme" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px 18px; background: var(--nx-card); font-family: var(--nx-font); color: var(--nx-text); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw { display: flex; flex-direction: column; gap: 6px; width: 96px; }
  .chip { height: 44px; border-radius: 8px; border: 1px solid var(--nx-border); }
  .name { font-size: 10.5px; font-weight: 600; color: var(--nx-text); }
  .hex { font-family: var(--nx-mono); font-size: 9.5px; color: var(--nx-text-meta); }
  .cap { font-size: 9.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--nx-text-meta); }
  table { border-collapse: collapse; font-size: 11.5px; }
  td { padding: 3px 14px 3px 0; color: var(--nx-text-sec); }
  td.k { font-family: var(--nx-mono); color: var(--nx-text); }
</style>

<div class="row">
  <div class="sw"><div class="chip" style="background:var(--nx-accent)"></div><span class="name">accent</span><span class="hex">#d97706</span></div>
  <div class="sw"><div class="chip" style="background:var(--nx-accent-hover)"></div><span class="name">accent-hover</span><span class="hex">#b45309</span></div>
  <div class="sw"><div class="chip" style="background:var(--nx-accent-tint)"></div><span class="name">accent-tint</span><span class="hex">#fef7ed</span></div>
  <div class="sw"><div class="chip" style="background:var(--nx-brand-grad);border-color:transparent"></div><span class="name">brand-grad</span><span class="hex">icon chips only</span></div>
  <div class="sw"><div class="chip" style="background:var(--nx-success)"></div><span class="name">success</span><span class="hex">#059669</span></div>
  <div class="sw"><div class="chip" style="background:var(--nx-warning)"></div><span class="name">warning</span><span class="hex">#d97706</span></div>
  <div class="sw"><div class="chip" style="background:var(--nx-danger)"></div><span class="name">danger</span><span class="hex">#dc2626</span></div>
</div>
