<!-- @dsCard group="Colors" viewport="700x120" name="Text" subtitle="Three greys: body, secondary, meta" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px 18px; background: var(--nx-card); font-family: var(--nx-font); color: var(--nx-text); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw { display: flex; flex-direction: column; gap: 6px; width: 96px; }
  .chip { height: 44px; border-radius: 8px; border: 1px solid var(--nx-border); }
  .name { font-size: 10.5px; font-weight: 600; color: var(--nx-text); }
  .hex { font-family: var(--nx-mono); font-size: 9.5px; color: var(--nx-text-meta); }
  .cap { font-size: 9.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--nx-text-meta); }
  table { border-collapse: collapse; font-size: 11.5px; }
  td { padding: 3px 14px 3px 0; color: var(--nx-text-sec); }
  td.k { font-family: var(--nx-mono); color: var(--nx-text); }
</style>

<div style="display:flex;flex-direction:column;gap:9px">
  <div style="font-size:15px;font-weight:700;color:var(--nx-text)">Verarbeitete Dokumente im Zeitverlauf <span class="hex">--nx-text · #1f2937</span></div>
  <div style="font-size:13px;color:var(--nx-text-sec)">Tabellenzellen, Formulartext, Prozessnamen <span class="hex">--nx-text-sec · #6b7280</span></div>
  <div style="font-size:11.5px;color:var(--nx-text-meta)">Meta, Legenden, Zeitstempel, Achsenbeschriftung <span class="hex">--nx-text-meta · #9ca3af</span></div>
</div>
