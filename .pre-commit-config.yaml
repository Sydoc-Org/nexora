# pre-commit framework config
# Install: uv sync (or pip install pre-commit), then run:
#   pre-commit install --install-hooks
#   pre-commit install --hook-type commit-msg
#   pre-commit install --hook-type pre-push
# Run on all files: pre-commit run --all-files

default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
        # .claude/ agent docs contain detection regex patterns that look
        # like private-key markers (security-auditor.md etc). Real secrets
        # live in .claude/settings.local.json which is gitignored.
        exclude: '^\.claude/'
      - id: end-of-file-fixer
        # *.xml: Task Scheduler definitions must be UTF-16 (the engine rejects
        # UTF-8 outright). Appending a newline makes the byte count odd and the
        # file stops decoding — see .gitattributes.
        exclude: '^(translations/|static/|sql/|messages\.pot$|.*\.xml$)'
      - id: mixed-line-ending
        args: [--fix=lf]
        # sql/ is auto-generated by mssql-scripter (CRLF) and normalized to LF
        # by .gitattributes `* text=auto`, so this fixer just churns it on
        # Windows — exclude it like end-of-file-fixer / trailing-whitespace do.
        # *.xml is UTF-16 (see above): rewriting its line endings corrupts it.
        exclude: '^(sql/.*|.*\.(ps1|bat|cmd|xml)|web\.config)$'
      - id: trailing-whitespace
        exclude: '^(translations/|static/|sql/|.*\.xml$)'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies: []
        args: [--ignore-missing-imports, --no-strict-optional]
        files: '^(nx_lib/|nx_main\.py)'
        stages: [manual]  # advisory; run via `pre-commit run mypy --all-files --hook-stage manual`

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: sql-migrate-int
        name: Apply pending SQL migrations to INT
        entry: python scripts/db-migrate.py --env INT
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: sql-sync-check
        name: Verify per-object SQL DDL matches INT
        entry: python sql/sync-from-db.py --check
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: branch-name-guard
        name: Branch-name convention guard
        entry: powershell -ExecutionPolicy Bypass -File scripts/git-hooks/branch-name-guard.ps1
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true

      # Two tiers, cheap first (default collection order is alphabetical, so
      # a single `pytest tests` ran e2e browsers BEFORE unit tests). fail_fast
      # stops the push before the 10-minute e2e tier when the fast tier fails.
      # E2E retries are armed by tests/e2e/conftest.py (pytest.mark.flaky),
      # not CLI flags: --only-rerun is an error-text regex, and
      # "--only-rerun flaky_e2e" never matched anything, so no test was
      # ever actually retried.
      - id: pytest-fast-pre-push
        name: Unit + integration tests (pre-push gate)
        entry: python -m pytest tests --ignore=tests/e2e
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
        fail_fast: true

      - id: pytest-e2e-pre-push
        name: E2E test suite (pre-push gate)
        entry: python -m pytest tests/e2e
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
