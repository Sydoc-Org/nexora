# pre-commit framework config
# Install: uv sync (or pip install pre-commit), then run:
#   pre-commit install --install-hooks
#   pre-commit install --hook-type commit-msg
#   pre-commit install --hook-type pre-push
# Run on all files: pre-commit run --all-files

default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
        # .claude/ agent docs contain detection regex patterns that look
        # like private-key markers (security-auditor.md etc). Real secrets
        # live in .claude/settings.local.json which is gitignored.
        exclude: '^\.claude/'
      - id: end-of-file-fixer
        # *.xml: Task Scheduler definitions must be UTF-16 (the engine rejects
        # UTF-8 outright). Appending a newline makes the byte count odd and the
        # file stops decoding — see .gitattributes.
        exclude: '^(translations/|static/|sql/|messages\.pot$|.*\.xml$)'
      - id: mixed-line-ending
        args: [--fix=lf]
        # sql/ is auto-generated by mssql-scripter (CRLF) and normalized to LF
        # by .gitattributes `* text=auto`, so this fixer just churns it on
        # Windows — exclude it like end-of-file-fixer / trailing-whitespace do.
        # *.xml is UTF-16 (see above): rewriting its line endings corrupts it.
        exclude: '^(sql/.*|.*\.(ps1|bat|cmd|xml)|web\.config)$'
      - id: trailing-whitespace
        exclude: '^(translations/|static/|sql/|.*\.xml$)'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: mypy
        name: mypy type check
        entry: python -m mypy nx_lib nx_main.py
        language: system
        pass_filenames: false
        files: '^(nx_lib/|nx_main\.py|pyproject\.toml)'
        stages: [pre-commit]

      - id: sql-migrate-int
        name: Apply pending SQL migrations to INT
        entry: python scripts/db-migrate.py --env INT
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: sql-sync-check
        name: Verify per-object SQL DDL matches INT
        entry: python sql/sync-from-db.py --check
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: reporting-help-sync
        name: Reporting help/docs sync nudge (non-blocking)
        entry: python scripts/check-reporting-help-sync.py
        language: system
        pass_filenames: false
        files: '^(templates/(reporting\.html|_reporting_simple\.html|reporting_metrics\.html|reporting_sources\.html|js/_reporting_)|static/js/reporting_|nx_lib/views/reporting/.*\.py)'
        verbose: true
        stages: [pre-commit]

      - id: branch-name-guard
        name: Branch-name convention guard
        entry: powershell -ExecutionPolicy Bypass -File scripts/git-hooks/branch-name-guard.ps1
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true

      # No test run on push any more: CI's `test` job (deploy.yml) runs the same
      # fast tier on every PR and on main, so a local run was a second pass over
      # the same suite against the same shared NEXORA_TEST, ~10 minutes per push
      # and one more contender for the database lock. Run tests you touched
      # with `pytest <path> -q` before pushing; the PR gate catches the rest.
