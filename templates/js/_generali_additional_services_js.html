<script src="{{ static_v('js/generali_crud.js') }}"></script>
<script nonce="{{ csp_nonce() }}">
    const API_PREFIX = window.API_PREFIX;
    // formatDate/formatDateTime/formatHours: shared with nx_core.js (Task 12).
    const formatDate = window.NX.formatDate;
    const formatDateTime = window.NX.formatDateTime;
    const formatHours = window.NX.formatHours;

    let categoriesData = {};
    let translationsMap = {};

    function populateParentSelect(selectEl, selected) {
        const current = selected !== undefined ? selected : selectEl.value;
        while (selectEl.options.length > 1) selectEl.remove(1);
        Object.keys(categoriesData).sort().forEach(parent => {
            const opt = document.createElement('option');
            opt.value = parent;
            opt.textContent = translationsMap[parent] || parent;
            if (parent === current) opt.selected = true;
            selectEl.appendChild(opt);
        });
    }

    function populateSubSelect(selectEl, parent, selected) {
        while (selectEl.options.length > 0) selectEl.remove(0);

        if (!parent) {
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = {{ _("Select parent first") | tojson }};
            selectEl.appendChild(placeholder);
            selectEl.disabled = false;
            return;
        }

        const subs = categoriesData[parent] || [];
        if (subs.length === 0) {
            const opt = document.createElement('option');
            opt.value = '';
            opt.textContent = '—';
            selectEl.appendChild(opt);
            selectEl.disabled = true;
            return;
        }

        selectEl.disabled = false;
        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = {{ _("Select…") | tojson }};
        selectEl.appendChild(placeholder);
        subs.forEach(sub => {
            const opt = document.createElement('option');
            opt.value = sub;
            opt.textContent = translationsMap[sub] || sub;
            if (sub === selected) opt.selected = true;
            selectEl.appendChild(opt);
        });
    }

    function loadCategories() {
        fetch(API_PREFIX + 'api/generali/attendance/categories?locale={{ current_lang }}', {headers: {
                'X-CSRFToken': csrfToken
                }})
            .then(r => r.json())
            .then(data => {
                if (!data.success) return;
                categoriesData = data.categories || {};
                translationsMap = data.translations || {};

                populateParentSelect(document.getElementById('filterParentCategory'));
                const filterParent = document.getElementById('filterParentCategory');
                filterParent.options[0].textContent = {{ _("All") | tojson }};

                if (canAdd) populateParentSelect(document.getElementById('addParentCategory'));
                populateParentSelect(document.getElementById('editParentCategory'));
            })
            .catch(e => console.error('Failed to load categories', e));
    }

    function buildParams(page) {
        const p = new URLSearchParams();
        const start  = document.getElementById('filterStartDate').value;
        const end    = document.getElementById('filterEndDate').value;
        const parent = document.getElementById('filterParentCategory').value;
        const sub    = document.getElementById('filterSubCategory').value;
        const org    = document.getElementById('filterOrganizationCode').value;
        const userId = document.getElementById('filterUserId')?.value || '';
        if (start)  p.set('startDate', start);
        if (end)    p.set('endDate', end);
        if (parent) p.set('parentCategory', parent);
        if (sub)    p.set('subCategory', sub);
        if (org)    p.set('organizationcode', org);
        if (userId) p.set('userId', userId);
        p.set('page', page);
        return p;
    }

    function loadOrganizations() {
        fetch(API_PREFIX + 'api/generali/attendance/organizations', {
            headers: { 'X-CSRFToken': csrfToken }
        })
        .then(r => r.json())
        .then(data => {
            if (!data.success) return;
            const sel = document.getElementById('filterOrganizationCode');
            if (!sel) return;
            (data.organizations || []).forEach(o => {
                const opt = document.createElement('option');
                opt.value = o.code;
                opt.textContent = o.name || o.code;
                sel.appendChild(opt);
            });
        })
        .catch(e => console.error('Failed to load organizations', e));
    }

    function renderRow(r) {
        const editable  = crud.canEditRecord(r);
        const deletable = crud.canDeleteRecord(r);
        const showActions = crud.canEdit || crud.canDelete;
        let actionBtns = '';
        // #193 finding 10: onclick="" attribute handlers aren't nonce-covered by CSP —
        // row actions go through the delegated tbody listener below instead.
        if (crud.canEdit)   actionBtns += `<button ${editable  ? '' : 'disabled'} class="edit-record-btn inline-flex items-center gap-1 text-xs font-semibold px-2 py-1 rounded-lg transition mr-1 ${editable  ? 'text-[var(--nx-accent)] hover:text-[var(--nx-accent-hover)] hover:bg-[var(--nx-accent-tint)]' : 'text-gray-300 cursor-not-allowed'}" data-id="${r.id}" data-testid="generali-additional-services-row-edit-${r.id}"><i class="fas fa-pen text-xs"></i></button>`;
        if (crud.canDelete) actionBtns += `<button ${deletable ? '' : 'disabled'} class="delete-record-btn inline-flex items-center gap-1 text-xs font-semibold px-2 py-1 rounded-lg transition ${deletable ? 'text-red-500 hover:text-red-700 hover:bg-red-50' : 'text-gray-300 cursor-not-allowed'}" data-id="${r.id}" data-testid="generali-additional-services-row-delete-${r.id}"><i class="fas fa-trash text-xs"></i></button>`;
        const actionsCell = showActions ? `<td class="px-4 py-3 text-center whitespace-nowrap">${actionBtns}</td>` : '';

        const tParent = translationsMap[r.parentCategory] || r.parentCategory || '—';
        const tSub    = translationsMap[r.subCategory]    || r.subCategory    || '—';
        return `<tr data-record-id="${r.id}" data-for-date="${r.forDate || ''}" data-parent="${(r.parentCategory||'').replace(/"/g,'&quot;')}" data-sub="${(r.subCategory||'').replace(/"/g,'&quot;')}" data-effort="${r.effortInHours !== null ? r.effortInHours : ''}">
            <td class="px-4 py-3 text-center whitespace-nowrap">
                <span class="text-sm font-semibold nx-mono">${formatDate(r.forDate)}</span>
            </td>
            <td class="px-4 py-3 text-center whitespace-nowrap">
                <span class="text-sm">${r.fullname || r.userId || '—'}</span>
            </td>
            <td class="px-4 py-3 text-left">
                <span class="text-sm">${tParent}</span>
            </td>
            <td class="px-4 py-3 text-left">
                <span class="text-sm" style="color:var(--nx-text-sec)">${tSub}</span>
            </td>
            <td class="px-4 py-3 text-center whitespace-nowrap">
                <span class="nx-label nx-label--indigo nx-label--nodot">${formatHours(r.effortInHours)} h</span>
            </td>
            <td class="px-4 py-3 text-center whitespace-nowrap">
                <span class="text-xs nx-mono" style="color:var(--nx-text-sec)">${formatDateTime(r.recordDateTime)}</span>
            </td>
            ${actionsCell}
        </tr>`;
    }

    function showExportError(msg) {
        const errDiv = document.createElement('div');
        errDiv.className = 'nx-flash nx-flash--error fixed bottom-4 right-4 z-50 shadow-lg';
        errDiv.setAttribute('role', 'alert');
        const icon = document.createElement('i');
        icon.className = 'fas fa-circle-exclamation';
        const span = document.createElement('span');
        span.textContent = msg;
        errDiv.appendChild(icon);
        errDiv.appendChild(span);
        document.body.appendChild(errDiv);
        setTimeout(() => errDiv.remove(), 4000);
    }

    const crud = window.NX.generaliCrud.create({
        tableElementId: 'attendanceTable',
        tbodyId: 'attendanceTbody',
        paginationContainerId: 'paginationControls',
        showingCountId: 'showingCount',
        totalCountId: 'totalCount',
        recordsEndpoint: API_PREFIX + 'api/generali/attendance',
        colSpanBase: 6,
        renderRow: renderRow,
        buildParams: buildParams,
        emptyTitle: {{ _("No records found") | tojson }},
        emptySub: {{ _("Try adjusting your filters or resetting the search.") | tojson }},
        totalDisplay: { elementId: 'totalHoursDisplay', field: 'totalHours', format: v => formatHours(v) + ' h' },
        exportRowMapper: r => ({
            'ID':            r.id,
            'Date':          r.forDate ? r.forDate.split('T')[0] : '',
            'Full Name':     r.fullname,
            'User ID':       r.userId,
            'Category':      r.parentCategory,
            'Sub Category':  r.subCategory,
            'Effort (h)':    r.effortInHours,
            'Recorded At':   r.recordDateTime ? r.recordDateTime.replace('T', ' ').substring(0, 16) : ''
        }),
        exportSheetName: 'Additional Services',
        exportFilenamePrefix: 'generali_additionalservices',
        exportFailedText: {{ _("Export failed.") | tojson }},
        showExportError: showExportError
    });
    const canAdd = crud.canAdd;

    let _filterTimer;
    const applyFiltersSoon = () => { clearTimeout(_filterTimer); _filterTimer = setTimeout(() => crud.loadRecords(1), 350); };
    document.querySelectorAll('.nx-filter select').forEach(s => s.addEventListener('change', applyFiltersSoon));
    document.getElementById('resetFilterBtn').addEventListener('click', () => {
        document.getElementById('filterStartDate').value = '';
        document.getElementById('filterEndDate').value = '';
        document.getElementById('filterParentCategory').value = '';
        populateSubSelect(document.getElementById('filterSubCategory'), '');
        document.getElementById('filterOrganizationCode').value = '';
        const fu = document.getElementById('filterUserId');
        if (fu) fu.value = '';
        crud.loadRecords(1);
    });

    document.getElementById('filterParentCategory').addEventListener('change', function() {
        const filterSub = document.getElementById('filterSubCategory');
        populateSubSelect(filterSub, this.value);
        filterSub.options[0].textContent = {{ _("All") | tojson }};
    });

    flatpickr('#filterStartDate', { dateFormat: 'Y-m-d', allowInput: true, onChange: applyFiltersSoon });
    flatpickr('#filterEndDate',   { dateFormat: 'Y-m-d', allowInput: true, onChange: applyFiltersSoon });

    {% if can_add %}
    function loadOrgUsers() {
        if (!crud.canAddForOrg && !crud.canAddTransOrg) return;
        fetch(API_PREFIX + 'api/generali/attendance/orgUsers', {
            headers: { 'X-CSRFToken': csrfToken }
        })
        .then(r => r.json())
        .then(data => {
            if (!data.success) return;
            const sel = document.getElementById('addUserId');
            if (!sel) return;
            (data.users || []).forEach(u => {
                const opt = document.createElement('option');
                opt.value = u.userId;
                opt.textContent = u.fullname || u.userId;
                sel.appendChild(opt);
            });
        })
        .catch(e => console.error('Failed to load org users', e));
    }

    function openAddModal() {
        document.getElementById('addForDate').value = '';
        document.getElementById('addParentCategory').value = '';
        populateSubSelect(document.getElementById('addSubCategory'), '');
        document.getElementById('addEffortHours').value = '';
        if (crud.canAddForOrg) document.getElementById('addUserId').value = '';
        document.getElementById('addModalError').classList.add('hidden');
        document.getElementById('addModalErrorText').textContent = '';
        document.getElementById('addModal').classList.remove('hidden');
        document.getElementById('addModal').classList.add('flex');
    }

    function closeAddModal() {
        document.getElementById('addModal').classList.add('hidden');
        document.getElementById('addModal').classList.remove('flex');
    }

    document.getElementById('openAddModalBtn').addEventListener('click', openAddModal);
    document.getElementById('closeAddModalBtn').addEventListener('click', closeAddModal);
    document.getElementById('cancelAddModalBtn').addEventListener('click', closeAddModal);

    document.getElementById('addParentCategory').addEventListener('change', function() {
        populateSubSelect(document.getElementById('addSubCategory'), this.value);
    });

    flatpickr('#addForDate', { dateFormat: 'Y-m-d', allowInput: true, maxDate: 'today', minDate: crud.getAddMinDate() });

    document.getElementById('submitAddBtn').addEventListener('click', function() {
        const forDate    = document.getElementById('addForDate').value.trim();
        const parent     = document.getElementById('addParentCategory').value;
        const sub        = document.getElementById('addSubCategory').value;
        const effort     = document.getElementById('addEffortHours').value;
        const errEl      = document.getElementById('addModalError');
        const errTextEl  = document.getElementById('addModalErrorText');

        const addHasSubs = (categoriesData[parent] || []).length > 0;
        if (!forDate || !parent || (addHasSubs && !sub) || !effort) {
            errTextEl.textContent = {{ _("Please fill in all fields.") | tojson }};
            errEl.classList.remove('hidden');
            return;
        }

        const payload = { forDate, parentCategory: parent, subCategory: sub || null, effortInHours: parseFloat(effort) };
        if (crud.canAddForOrg) {
            const selectedUser = document.getElementById('addUserId').value;
            if (selectedUser) payload.userId = parseInt(selectedUser, 10);
        }

        this.disabled = true;
        fetch(API_PREFIX + 'api/generali/attendance', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
            body: JSON.stringify(payload)
        })
        .then(r => r.json())
        .then(data => {
            this.disabled = false;
            if (data.success) {
                closeAddModal();
                crud.loadRecords(1);
            } else {
                errTextEl.textContent = data.error || {{ _("Error saving record.") | tojson }};
                errEl.classList.remove('hidden');
            }
        })
        .catch(() => {
            this.disabled = false;
            errTextEl.textContent = {{ _("Network error.") | tojson }};
            errEl.classList.remove('hidden');
        });
    });
    {% endif %}

    let editingId = null;

    function openEditModal(id) {
        editingId = id;

        const row = document.querySelector(`[data-record-id="${id}"]`);
        if (!row) return;

        const forDate = row.dataset.forDate || '';
        const parent  = row.dataset.parent  || '';
        const sub     = row.dataset.sub     || '';
        const effort  = row.dataset.effort  || '';

        document.getElementById('editForDate').value = forDate;

        populateParentSelect(document.getElementById('editParentCategory'), parent);
        populateSubSelect(document.getElementById('editSubCategory'), parent, sub);
        document.getElementById('editEffortHours').value = effort;
        document.getElementById('editError').classList.add('hidden');
        document.getElementById('editError').textContent = '';

        document.getElementById('editModal').classList.remove('hidden');
        document.getElementById('editModal').classList.add('flex');
    }

    function closeEditModal() {
        document.getElementById('editModal').classList.add('hidden');
        document.getElementById('editModal').classList.remove('flex');
        editingId = null;
    }

    document.getElementById('closeEditBtn').addEventListener('click', closeEditModal);
    document.getElementById('cancelEditBtn').addEventListener('click', closeEditModal);

    document.getElementById('editParentCategory').addEventListener('change', function() {
        populateSubSelect(document.getElementById('editSubCategory'), this.value);
    });

    flatpickr('#editForDate', { dateFormat: 'Y-m-d', allowInput: true, maxDate: 'today' });

    document.getElementById('saveEditBtn').addEventListener('click', function() {
        const forDate = document.getElementById('editForDate').value.trim();
        const parent  = document.getElementById('editParentCategory').value;
        const sub     = document.getElementById('editSubCategory').value;
        const effort  = document.getElementById('editEffortHours').value;
        const errEl   = document.getElementById('editError');

        const editHasSubs = (categoriesData[parent] || []).length > 0;
        if (!forDate || !parent || (editHasSubs && !sub) || !effort) {
            errEl.textContent = {{ _("Please fill in all fields.") | tojson }};
            errEl.classList.remove('hidden');
            return;
        }

        this.disabled = true;
        fetch(API_PREFIX + `api/generali/attendance/${editingId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
            body: JSON.stringify({ forDate, parentCategory: parent, subCategory: sub || null, effortInHours: parseFloat(effort) })
        })
        .then(r => r.json())
        .then(data => {
            this.disabled = false;
            if (data.success) {
                closeEditModal();
                crud.loadRecords(crud.getCurrentPage());
            } else {
                errEl.textContent = data.error || {{ _("Error saving record.") | tojson }};
                errEl.classList.remove('hidden');
            }
        })
        .catch(() => {
            this.disabled = false;
            errEl.textContent = {{ _("Network error.") | tojson }};
            errEl.classList.remove('hidden');
        });
    });

    let pendingDeleteId = null;

    function deleteRecord(id) {
        pendingDeleteId = id;
        document.getElementById('deleteModal').classList.remove('hidden');
        document.getElementById('deleteModal').classList.add('flex');
    }

    function closeDeleteModal() {
        document.getElementById('deleteModal').classList.add('hidden');
        document.getElementById('deleteModal').classList.remove('flex');
        pendingDeleteId = null;
    }

    document.getElementById('cancelDeleteBtn').addEventListener('click', closeDeleteModal);

    document.getElementById('attendanceTbody').addEventListener('click', function(e) {
        const editBtn = e.target.closest('.edit-record-btn');
        if (editBtn && !editBtn.disabled) { openEditModal(editBtn.dataset.id); return; }
        const deleteBtn = e.target.closest('.delete-record-btn');
        if (deleteBtn && !deleteBtn.disabled) deleteRecord(deleteBtn.dataset.id);
    });

    document.getElementById('deleteModal').addEventListener('click', function(e) {
        if (e.target === this) closeDeleteModal();
    });

    document.getElementById('confirmDeleteBtn').addEventListener('click', function() {
        if (!pendingDeleteId) return;
        const id = pendingDeleteId;
        this.disabled = true;
        this.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i>{{ _("Deleting…") }}';
        fetch(API_PREFIX + `api/generali/attendance/${id}`, {
            headers: { 'X-CSRFToken': csrfToken },
            method: 'DELETE'
        })
        .then(r => r.json())
        .then(data => {
            this.disabled = false;
            this.innerHTML = {{ _("Delete") | tojson }};
            closeDeleteModal();
            if (data.success) crud.loadRecords(crud.getCurrentPage());
            else {
                // show error inline via a brief toast-style approach
                showExportError(data.error || {{ _("Error deleting record.") | tojson }});
            }
        })
        .catch(() => {
            this.disabled = false;
            this.innerHTML = {{ _("Delete") | tojson }};
            closeDeleteModal();
        });
    });

    loadCategories();
    loadOrganizations();
    nxUserFilter.init(API_PREFIX + 'api/generali/attendance/filterUsers', applyFiltersSoon);
    {% if can_add %}loadOrgUsers();{% endif %}
    crud.loadRecords(1);
</script>
