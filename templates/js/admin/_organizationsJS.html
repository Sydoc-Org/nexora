<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <script>
        const organizationModal = document.getElementById('organizationModal');
        const modalTitle = document.getElementById('modalTitle');
        const organizationForm = document.getElementById('organizationForm');
        const organizationcodeInput = document.getElementById('organizationcode');
       
        const confirmationModal = document.getElementById('confirmationModal');
        const confirmMessage = document.getElementById('confirmMessage');
        const confirmBtn = document.getElementById('confirmBtn');
        const cancelBtn = document.getElementById('cancelBtn');

        const API_PREFIX = window.location.href.includes("nexora") ? "/nexora/" : "/";
        function showNotification(message, type = 'success') {
            const container = document.getElementById('notification-container');

            const notification = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-green-500' : 'bg-red-500';
            const icon = type === 'success' 
                ? '<i class="fas fa-check-circle"></i>' 
                : '<i class="fas fa-exclamation-circle"></i>';

            notification.className = `flex items-center w-full p-4 text-white ${bgColor} rounded-lg shadow-lg transform transition-all duration-300 opacity-0 translate-x-full`;
            
            notification.innerHTML = `
                <div class="text-xl">${icon}</div>
                <div class="ml-3 text-sm font-medium">${message}</div>
            `;

            container.appendChild(notification);

            setTimeout(() => {
                notification.classList.remove('opacity-0', 'translate-x-full');
            }, 10);

            setTimeout(() => {
                notification.classList.add('opacity-0', 'translate-x-full');
                setTimeout(() => {
                    notification.remove();
                }, 300); 
            }, 5000);
        }

        function openModal() {
            organizationModal.classList.remove('hidden');
            setTimeout(() => {
                organizationModal.classList.remove('opacity-0');
                organizationModal.querySelector('.modal-content').classList.remove('scale-95');
            }, 10);
        }

        function closeModal(event) {
            if (event && event.target !== organizationModal) return;
            organizationModal.classList.add('opacity-0');
            organizationModal.querySelector('.modal-content').classList.add('scale-95');
            setTimeout(() => organizationModal.classList.add('hidden'), 300);
        }

        function openAddOrganizationModal() {
            organizationForm.reset();
            modalTitle.textContent = `{{ _("Add a new Organization") }}`;
            document.getElementById('organizationname').required = true;
            openModal();
        }

        function openEditOrganizationModal(organization) {
            organizationForm.reset();
            modalTitle.textContent = `{{ _("Edit Organization") }}`;
            
            organizationcodeInput.value = organization.organizationcode; 
            
            document.getElementById('organizationname').value = organization.organization;
            openModal();
        }

        function escapeHtml(str) {
            if (str == null) return '';
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        }

        function renderOrgRow(org) {
            const orgJson = JSON.stringify(org).replace(/"/g, '&quot;');
            return `<tr class="bg-white border-b hover:bg-gray-50">
                <td class="px-6 py-4 font-medium text-gray-900">${escapeHtml(org.organizationcode)}</td>
                <td class="px-6 py-4 font-medium text-gray-900">${escapeHtml(org.organization)}</td>
                <td class="px-6 py-4 text-right">
                    <button data-organization="${orgJson}" class="edit-organization-btn font-medium text-indigo-600 hover:text-indigo-800 mr-4">{{ _("Edit") }}</button>
                    <button onclick="deleteorganization('${escapeHtml(org.organizationcode)}')" class="font-medium text-red-600 hover:text-red-800">{{ _("Delete") }}</button>
                </td>
            </tr>`;
        }

        async function refreshOrgsTable() {
            try {
                const response = await fetch(`${API_PREFIX}api/admin/organizations/list`, {
                    headers: { 'X-CSRFToken': csrfToken }
                });
                if (!response.ok) return;
                const orgs = await response.json();
                document.getElementById('orgs-tbody').innerHTML = orgs.map(renderOrgRow).join('');
            } catch (error) {
                console.error('Failed to refresh organizations table:', error);
            }
        }

        organizationForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            const data = Object.fromEntries(new FormData(organizationForm).entries());
            const organizationcode = organizationcodeInput.value;
            const url =  organizationcode ? `${API_PREFIX}admin/organizations/edit/${organizationcode}` : `${API_PREFIX}admin/organizations/add`

            try {
                const response = await fetch(url, {
                    method: 'POST', headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken
                },
                    body: JSON.stringify(data)
                });

                if (response.status === 403) {
                    showNotification(`{{ _("You do not have permission to perform this action.") }}`, 'error');
                    return;
                }

                const result = await response.json();
                if (response.ok) {
                    closeModal(null);
                    showNotification(`{{ _("Success") }}`);
                    refreshOrgsTable();
                } else {
                    showNotification(`{{ _("Error:") }} ${result.message}`, 'error');
                }
            } catch (error) {
                console.error('Form submission error:', error);
                showNotification(`{{ _("An unexpected network error occurred.") }}`, 'error');
            }
        });

        let confirmCallback = null;

        function showConfirmationModal(message, onConfirm) {
            confirmMessage.textContent = message;
            confirmCallback = onConfirm;
            confirmationModal.classList.remove('hidden');
            setTimeout(() => {
                confirmationModal.classList.remove('opacity-0');
                confirmationModal.querySelector('.modal-content').classList.remove('scale-95');
            }, 10);
        }

        function hideConfirmationModal() {
            confirmationModal.classList.add('opacity-0');
            confirmationModal.querySelector('.modal-content').classList.add('scale-95');
            setTimeout(() => confirmationModal.classList.add('hidden'), 300);
        }

        confirmBtn.addEventListener('click', () => {
            if (confirmCallback) confirmCallback();
            hideConfirmationModal();
        });

        cancelBtn.addEventListener('click', hideConfirmationModal);


        async function deleteorganization(organizationcode) {
            const deletionTask = async () => {
                try {
                    const response = await fetch(`${API_PREFIX}admin/organizations/delete/${organizationcode}`, {
                        headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken  
                        },
                    method: 'DELETE' });
                    
                    if (response.status === 403) {
                        showNotification(`{{ _("You do not have permission to delete this Organization.") }}`, 'error');
                        return;
                    }

                    const result = await response.json();
                    if (response.ok) {
                        showNotification('{{ _("Success") }}');
                        refreshOrgsTable();
                    } else {
                        showNotification(`{{ _("Error:") }} ${result.message}`, 'error');
                    }
                } catch (error) {
                    console.error('Delete error:', error);
                    showNotification(`{{ _("An unexpected network error occurred.") }}`, 'error');
                }
            };
            showConfirmationModal(`{{ _("Are you sure you want to delete this Organization? This action cannot be undone.") }}`, deletionTask);
        }

        document.addEventListener('click', (e) => {
            const editBtn = e.target.closest('.edit-organization-btn');
            if (editBtn) {
                const organizationdata = JSON.parse(editBtn.dataset.organization);
                openEditOrganizationModal(organizationdata);
            }
        });

    </script>
</body>

</html>
