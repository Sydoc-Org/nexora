<script>
    const API_PREFIX = window.location.href.includes("nexora") ? "/nexora/" : "/";
    const editorModal = document.getElementById('editorModal');
    const profileMetaFields = document.getElementById('profileMetaFields');
    let currentMode = 'profile'; 

    function showNotification(message, type = 'success') {
        const container = document.getElementById('notification-container');
        const notification = document.createElement('div');
        const bgColor = type === 'success' ? 'bg-green-500' : 'bg-red-500';
        notification.className = `flex items-center w-full p-4 text-white ${bgColor} rounded-lg shadow-lg mb-2 transition-all duration-500`;
        notification.innerHTML = `<span class="flex-1">${message}</span>`;
        container.appendChild(notification);
        setTimeout(() => notification.remove(), 4000);
    }

    function switchTab(tabName) {
        document.getElementById('tab-overview').classList.add('hidden');
        document.getElementById('tab-profiles').classList.add('hidden');

        const btnBaseClass = "inline-block p-4 border-b-2 border-transparent rounded-t-lg hover:text-gray-600 hover:border-gray-300";
        const btnActiveClass = "inline-block p-4 text-indigo-600 border-b-2 border-indigo-600 rounded-t-lg active";
        
        document.getElementById('tab-overview-btn').className = btnBaseClass;
        document.getElementById('tab-profiles-btn').className = btnBaseClass;

        document.getElementById(`tab-${tabName}`).classList.remove('hidden');
        document.getElementById(`tab-${tabName}-btn`).className = btnActiveClass;
    }

    function openEditorModal(title, mode) {
        currentMode = mode;
        document.getElementById('editorModalTitle').innerText = title;
        
        document.querySelectorAll('input[type=radio][value=None]').forEach(r => r.checked = true);

            document.querySelectorAll('input[type=radio]').forEach(r => {
            r.disabled = false;
            if(r.parentElement) r.parentElement.classList.remove('opacity-50', 'cursor-not-allowed');
        });

        const modalBody = document.getElementById('editorModal');
        modalBody.onchange = function(e) {
            if (e.target.type === 'radio') {
                updateSpecialConstraints(e.target);
            }
        };

        updateSpecialConstraints();

        if (mode === 'profile') {
            profileMetaFields.classList.remove('hidden');
        } else {
            profileMetaFields.classList.add('hidden');
        }

        editorModal.classList.remove('hidden');
        setTimeout(() => {
            editorModal.classList.remove('opacity-0');
            editorModal.querySelector('div.transform').classList.remove('scale-95');
        }, 10);
    }

    function closeEditorModal() {
        editorModal.classList.add('opacity-0');
        editorModal.querySelector('div.transform').classList.add('scale-95');
        setTimeout(() => editorModal.classList.add('hidden'), 300);
    }


    function openProfileModal() {
        openEditorModal('{{ _("Create New Access Profile") }}', 'profile');
        document.getElementById('editTargetId').value = 0; 
        document.getElementById('profileName').value = '';
        document.getElementById('profileDesc').value = '';
    }

    async function editProfile(id, name, desc) {
        openEditorModal(`{{ _("Edit Profile:") }} ${name}`, 'profile');
        document.getElementById('editTargetId').value = id;
        document.getElementById('profileName').value = name;
        document.getElementById('profileDesc').value = desc;

        try {
            const res = await fetch(`${API_PREFIX}api/admin/access_profile/${id}/details`);
            const data = await res.json();
            if(data.success) {
                applyPermissionsToUI(data.permissions);
            }
        } catch(e) { console.error(e); }
    }
    let allUsersData = [];

    async function searchUsers() {
        const query = document.getElementById('userSearchInput').value;
        const res = await fetch(`${API_PREFIX}api/admin/users`); 
        const users = await res.json();
        
        const resultsContainer = document.getElementById('userSearchResults');
        resultsContainer.innerHTML = '';

        const filtered = users.filter(u => u.fullname.toLowerCase().includes(query.toLowerCase()) || u.username.toLowerCase().includes(query.toLowerCase()));

        filtered.forEach(u => {
            const li = document.createElement('li');
            li.className = "flex justify-between items-center p-3 bg-gray-50 rounded hover:bg-indigo-50 cursor-pointer border";
            li.innerHTML = `<span>${u.fullname} (${u.username})</span> <button class="text-xs bg-indigo-600 text-white px-2 py-1 rounded">{{ _("Manage Permissions") }}</button>`;
            li.onclick = () => openUserOverrideModal(u.userID, u.username);
            resultsContainer.appendChild(li);
        });
    }

    async function openUserOverrideModal(userId, username) {
        openEditorModal(`{{ _("Overrides for user:") }} ${username}`, 'user');
        document.getElementById('editTargetId').value = userId;

        try {
            const res = await fetch(`${API_PREFIX}api/admin/user_overrides/${userId}`);
            const data = await res.json();
            if(data.success) {
                
                for (const [permId, effect] of Object.entries(data.overrides)) {
                    const radio = document.querySelector(`input[name="perm_${permId}"][value="${effect}"]`);
                    if(radio) radio.checked = true;
                }

            }
        } catch(e) { console.error(e); }
    }


    function applyPermissionsToUI(permissionsList) {
            permissionsList.forEach(p => {
                const radio = document.querySelector(`input[name="perm_${p.PermissionID}"][value="${p.Effect}"]`);
                if (radio) radio.checked = true;
            });
        updateSpecialConstraints();
    }

    async function savePermissions() {
        const targetId = document.getElementById('editTargetId').value;
        const permissions = [];
        
        document.querySelectorAll('.permission-row').forEach(row => {
            const permId = row.dataset.permId;
            const checked = row.querySelector(`input[name="perm_${permId}"]:checked`);
            if (checked && checked.value !== 'None') {
                permissions.push({ PermissionID: permId, Effect: checked.value });
            }
        });

        let url, payload;

        if (currentMode === 'profile') {
            url = `${API_PREFIX}api/admin/access_profile/save`;
            payload = {
                accessId: targetId == 0 ? null : targetId,
                name: document.getElementById('profileName').value,
                description: document.getElementById('profileDesc').value,
                permissions: permissions
            };
        } else {
            url = `${API_PREFIX}api/admin/user_overrides/save`;
            payload = {
                userId: targetId,
                overrides: permissions
            };
        }

        try {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await res.json();
            if (result.success) {
                showNotification(result.message);
                closeEditorModal();
                if(currentMode === 'profile') setTimeout(() => location.reload(), 1000);
            } else {
                showNotification(result.message, 'error');
            }
        } catch (e) {
            showNotification('{{ _("Network error") }}', 'error');
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        fetchAllUsers();
    });

    async function fetchAllUsers() {
        const tableBody = document.getElementById('overviewTableBody');
        
        try {
            const res = await fetch(`${API_PREFIX}api/admin/users`);
            if (!res.ok) throw new Error('Failed to load');
            
            allUsersData = await res.json();
            
            renderOverviewTable(allUsersData);
            
        } catch (error) {
            console.error(error);
            tableBody.innerHTML = `<tr><td colspan="4" class="px-6 py-4 text-center text-red-500">{{ _("Error loading data.") }}</td></tr>`;
        }
    }
    function renderOverviewTable(users) {
        const tbody = document.getElementById('overviewTableBody');
        tbody.innerHTML = '';

        if (users.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">{{ _("No users found.") }}</td></tr>`;
            return;
        }

        users.forEach(u => {
            const tr = document.createElement('tr');
            tr.className = "bg-white border-b hover:bg-gray-50 transition";

            const hasOverrides = u.OverrideCount > 0;
            const overrideBadge = hasOverrides 
                ? `<span class="px-2 py-1 text-xs font-semibold text-yellow-700 bg-yellow-100 rounded-full border border-yellow-200">${u.OverrideCount} {{ _("Overrides") }}</span>`
                : `<span class="px-2 py-1 text-xs font-semibold text-gray-500 bg-gray-100 rounded-full">{{ _("Default") }}</span>`;

            const profileName = u.AccessProfileName || `<span class="text-red-400 italic">{{ _("No Profile") }}</span>`;

            tr.innerHTML = `
                <td class="px-6 py-4">
                    <div class="text-sm font-medium text-gray-900">${u.fullname}</div>
                    <div class="text-xs text-gray-500">@${u.username}</div>
                </td>
                <td class="px-6 py-4 text-sm text-gray-700">
                    ${profileName}
                </td>
                <td class="px-6 py-4 text-center">
                    ${overrideBadge}
                </td>
                <td class="px-6 py-4 text-right">
                    <button onclick="openUserOverrideModal('${u.userID}', '${u.username}')" 
                        class="text-indigo-600 hover:text-indigo-900 font-medium text-sm">
                        {{ _("Manage Permissions") }}
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function filterOverviewTable() {
        const query = document.getElementById('overviewSearchInput').value.toLowerCase();
        const filtered = allUsersData.filter(u => 
            (u.fullname && u.fullname.toLowerCase().includes(query)) || 
            (u.username && u.username.toLowerCase().includes(query)) ||
            (u.AccessProfileName && u.AccessProfileName.toLowerCase().includes(query))
        );
        renderOverviewTable(filtered);
    }

    function filterUsers() {
        const query = document.getElementById('userSearchInput').value.toLowerCase();
        
        const filtered = allUsersData.filter(u => 
            (u.fullname && u.fullname.toLowerCase().includes(query)) || 
            (u.username && u.username.toLowerCase().includes(query))
        );
        
        renderUserList(filtered);
    }

function updateSpecialConstraints(triggerElement = null) {
    CONSTRAINT_CONFIG.forEach(group => {
        let isExceptionActive = false;

        if (group.exceptions && group.exceptions.length > 0) {
            isExceptionActive = group.exceptions.some(ex => {
                const radio = document.querySelector(`input[name="perm_${ex.id}"][value="${ex.value}"]`);
                return radio && radio.checked;
            });
        }

        if (isExceptionActive) {
            group.members.forEach(id => toggleRowInputs(id, false)); 
            return; 
        }

        
        let activeMemberIds = [];
        group.members.forEach(id => {
            const r = document.querySelector(`input[name="perm_${id}"][value="A"]`);
            if (r && r.checked) activeMemberIds.push(id);
        });

        // 3. Fallback Logic: If 0 are active, force fallback
        if (activeMemberIds.length === 0) {
            const radioToCheck = document.querySelector(`input[name="perm_${group.fallback}"][value="A"]`);
            if (radioToCheck) {
                radioToCheck.checked = true;
                activeMemberIds.push(group.fallback); 
            }
        }

        // 4. Exactly One Logic (Mutual Exclusion)
        if (group.mode === 'EXACTLY_ONE') {
            if (activeMemberIds.length > 1) {
                // BUG FIX START: Check if the trigger belongs to THIS group
                if (triggerElement && triggerElement.value === 'A') {
                    const clickedId = parseInt(triggerElement.name.replace('perm_', ''));
                    
                    // Only apply 'clicked' logic if the clicked ID is actually in this group
                    if (group.members.includes(clickedId)) {
                        activeMemberIds.forEach(id => {
                            if (id !== clickedId) setPermissionNone(id);
                        });
                        activeMemberIds = [clickedId]; 
                    } else {
                        // If trigger was from a different group, just keep the first found active member
                        // to ensure consistency and fix the double-active state
                         for (let i = 1; i < activeMemberIds.length; i++) {
                            setPermissionNone(activeMemberIds[i]);
                        }
                        activeMemberIds = [activeMemberIds[0]];
                    }
                } else {
                    // Default/Load behavior: Keep first, disable others
                    for (let i = 1; i < activeMemberIds.length; i++) {
                        setPermissionNone(activeMemberIds[i]);
                    }
                    activeMemberIds = [activeMemberIds[0]];
                }
                // BUG FIX END
            }
        }

        // 5. Locking Logic (Disable None/Deny buttons)
        group.members.forEach(id => {
            const allowRadio = document.querySelector(`input[name="perm_${id}"][value="A"]`);
            const isCurrentRowActive = allowRadio && allowRadio.checked;

            if (group.mode === 'AT_LEAST_ONE') {
                if (isCurrentRowActive && activeMemberIds.length === 1) {
                    toggleRowInputs(id, true); 
                } else {
                    toggleRowInputs(id, false);
                }
            } 
            else if (group.mode === 'EXACTLY_ONE') {
                if (isCurrentRowActive) {
                    toggleRowInputs(id, true);
                } else {
                    toggleRowInputs(id, false);
                }
            }
        });
    });
}
function setPermissionNone(id) {
    const NoneRadio = document.querySelector(`input[name="perm_${id}"][value="None"]`);
    if (NoneRadio) NoneRadio.checked = true;
}

function toggleRowInputs(id, shouldDisable) {
    const otherRadios = document.querySelectorAll(`input[name="perm_${id}"]:not([value="A"])`);
    otherRadios.forEach(r => {
        r.disabled = shouldDisable;
        if (shouldDisable) {
            r.parentElement.classList.add('opacity-50', 'cursor-not-allowed');
        } else {
            r.parentElement.classList.remove('opacity-50', 'cursor-not-allowed');
        }
    });
}
</script>
