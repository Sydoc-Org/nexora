<script>
    let currentPage = 1;
    let fetchedLogsData = [];
    const API_PREFIX = window.location.href.includes("nexora") ? "/nexora/" : "/";

    // Sub-day presets (e.g. "Last hour") need minute-level precision, but
    // filterStart/filterEnd are native <input type="date"> fields that can
    // only hold date-only values. When a sub-day preset is active, this
    // carries the precise "YYYY-MM-DD HH:MM:SS" bounds actually sent to the
    // backend; the date inputs still show a same-day approximation for
    // display. Cleared whenever a day-granularity preset or manual date
    // edit takes over.
    let presetRangeOverride = null;

    function escapeHtml(str) {
        if (str == null) return '';
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    async function fetchLogs(page) {
        currentPage = page;
        const user = document.getElementById('filterUser').value;
        const method = document.getElementById('filterMethod').value;
        const path = document.getElementById('filterPath').value;

        const status = document.getElementById('filterStatus').value;
        const start = presetRangeOverride ? presetRangeOverride.start : document.getElementById('filterStart').value;
        const end = presetRangeOverride ? presetRangeOverride.end : document.getElementById('filterEnd').value;
        const org = document.getElementById('filterOrg')?.value || '';

        const tbody = document.getElementById('logsTableBody');
        tbody.innerHTML = `<tr><td colspan="6" class="admin-empty"><i class="fas fa-circle-notch fa-spin"></i>   {{ _("Loading logs...") }}</td></tr>`;

        try {
            const params = new URLSearchParams({
                page: page,
                username: user,
                method: method,
                path: path,
                status: status,
                start_date: start,
                end_date: end,
                organization: org
            });

            const res = await fetch(`${API_PREFIX}api/admin/logs/search?${params}`, {
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                }
            });
            const data = await res.json();

            tbody.innerHTML = '';
            fetchedLogsData = data.logs;

            if (data.logs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="admin-empty"><i class="fas fa-search"></i>   {{ _("No logs found matching criteria.") }}</td></tr>`;
                updatePagination(0, 1, 0);
                return;
            }

            data.logs.forEach((log, index) => {
                const statusCode = parseInt(log.HttpResponseCode);
                let statusTone = 'error', statusLabel = `${statusCode} Error`, statusIcon = 'fa-bomb';
                if (statusCode >= 200 && statusCode < 300) { statusTone = 'ok';   statusLabel = `${statusCode} OK`;   statusIcon = 'fa-check'; }
                else if (statusCode >= 400 && statusCode < 500) { statusTone = 'warn'; statusLabel = `${statusCode} Warn`; statusIcon = 'fa-exclamation-triangle'; }

                const dateObj = new Date(log.Timestamp);
                const dateStr = dateObj.toLocaleDateString();
                const timeStr = dateObj.toLocaleTimeString();
                const method = log.HttpRequestMethod || '';
                const methodClass = 'log-method--' + method;
                const path = log.Path || '';
                const pathShort = path.length > 40 ? path.substring(0, 40) + '…' : path;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <div style="font-weight:500">${escapeHtml(dateStr)}</div>
                        <div style="font-size:11px;color:var(--nx-text-meta)">${escapeHtml(timeStr)}</div>
                    </td>
                    <td>${escapeHtml(log.Username || 'Anonymous')}</td>
                    <td>
                        <span class="log-method ${methodClass}">${escapeHtml(method)}</span>
                        <span class="nx-mono" title="${escapeHtml(path)}" style="font-size:11px">${escapeHtml(pathShort)}</span>
                    </td>
                    <td><span class="log-status log-status--${statusTone}"><i class="fas ${statusIcon}" style="font-size:10px;margin-right:4px"></i>${escapeHtml(statusLabel)}</span></td>
                    <td><span class="nx-mono" style="font-size:11px">${escapeHtml(log.RequestIpAddress || '')}</span></td>
                    <td class="align-right">
                        <button onclick="openLogModal(${index})" class="nx-btn nx-btn--ghost nx-btn--sm" style="color:var(--nx-accent)" type="button" data-testid="admin-logs-view-${index}">
                            {{ _("View") }} <i class="fas fa-expand-alt" style="font-size:10px;margin-left:4px"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            updatePagination(data.page, data.pages, data.total);

        } catch(e) {
            console.error(e);
            tbody.innerHTML = `<tr><td colspan="6" class="admin-empty" style="color:var(--nx-danger)"><i class="fas fa-circle-exclamation"></i>   {{ _("Error loading logs.") }}</td></tr>`;
        }
    }

    function updatePagination(page, pages, total) {
        document.getElementById('pageInfo').innerText = `{{ _("Page") }} ${page} {{ _("of") }} ${pages} (${total} {{ _("total") }})`;
        document.getElementById('prevBtn').disabled = page <= 1;
        document.getElementById('nextBtn').disabled = page >= pages;
    }

    function changePage(delta) {
        fetchLogs(currentPage + delta);
    }

    /* ---- Saved filter presets (localStorage) ---- */
    const PRESETS_KEY = 'nexora.admin.logs.presets';
    const PRESET_FIELDS = {
        username:     'filterUser',
        method:       'filterMethod',
        path:         'filterPath',
        status:       'filterStatus',
        organization: 'filterOrg',
        start_date:   'filterStart',
        end_date:     'filterEnd',
    };

    function loadPresets() {
        try { return JSON.parse(localStorage.getItem(PRESETS_KEY) || '[]'); }
        catch { return []; }
    }
    function savePresets(list) {
        localStorage.setItem(PRESETS_KEY, JSON.stringify(list));
    }
    function captureCurrentFilters() {
        const out = {};
        for (const [param, elId] of Object.entries(PRESET_FIELDS)) {
            const el = document.getElementById(elId);
            out[param] = el ? el.value : '';
        }
        return out;
    }
    function applyPreset(filters) {
        for (const [param, elId] of Object.entries(PRESET_FIELDS)) {
            const el = document.getElementById(elId);
            if (el) el.value = filters[param] || '';
        }
        // The static time-range presets shouldn't look "active" anymore, and
        // any sub-day precision override from a previous "Last hour" click
        // no longer applies — the saved preset's own (date-only) values win.
        document.querySelectorAll('.log-preset.is-active').forEach(b => b.classList.remove('is-active'));
        presetRangeOverride = null;
        fetchLogs(1);
    }
    function renderSavedPresets() {
        const container = document.getElementById('savedPresetsContainer');
        if (!container) return;
        const presets = loadPresets();
        container.innerHTML = '';
        if (presets.length === 0) {
            const empty = document.createElement('span');
            empty.className = 'saved-preset-empty';
            empty.textContent = '{{ _("None yet — save a filter to recall it later.") }}';
            container.appendChild(empty);
            return;
        }
        presets.forEach((p, idx) => {
            const chip = document.createElement('span');
            chip.className = 'saved-preset';
            chip.title = '{{ _("Apply") }}: ' + (p.name || '');
            const name = document.createElement('span');
            name.className = 'name';
            name.textContent = p.name || '';
            name.addEventListener('click', () => applyPreset(p.filters || {}));
            const del = document.createElement('span');
            del.className = 'del';
            del.title = '{{ _("Delete preset") }}';
            del.innerHTML = '<i class="fas fa-times"></i>';
            del.addEventListener('click', (e) => {
                e.stopPropagation();
                const list = loadPresets();
                list.splice(idx, 1);
                savePresets(list);
                renderSavedPresets();
            });
            chip.appendChild(name);
            chip.appendChild(del);
            container.appendChild(chip);
        });
    }
    function promptSavePreset() {
        const name = (prompt('{{ _("Name this filter preset:") }}') || '').trim();
        if (!name) return;
        const list = loadPresets();
        // Replace in place if name already exists
        const existing = list.findIndex(p => p.name === name);
        const entry = { name, filters: captureCurrentFilters() };
        if (existing >= 0) list[existing] = entry; else list.push(entry);
        savePresets(list);
        renderSavedPresets();
    }

    function exportLogsCsv() {
        // Build the same param set the search uses so the export matches
        // exactly what's on screen. Browser handles the file download.
        const params = new URLSearchParams({
            username: document.getElementById('filterUser').value,
            method:   document.getElementById('filterMethod').value,
            path:     document.getElementById('filterPath').value,
            status:   document.getElementById('filterStatus').value,
            start_date: presetRangeOverride ? presetRangeOverride.start : document.getElementById('filterStart').value,
            end_date:   presetRangeOverride ? presetRangeOverride.end : document.getElementById('filterEnd').value,
            organization: document.getElementById('filterOrg')?.value || '',
        });
        window.location.href = `${API_PREFIX}api/admin/logs/export.csv?${params}`;
    }

    const modal = document.getElementById('logDetailsModal');
    const modalBackdrop = document.getElementById('modalBackdrop');
    const modalPanel = document.getElementById('modalPanel');

    function openLogModal(index) {
        if (!fetchedLogsData[index]) return;
        const log = fetchedLogsData[index];

        document.getElementById('modalUser').textContent = log.Username || 'Anonymous';
        document.getElementById('modalAction').textContent = `${log.HttpRequestMethod} ${log.Path}`;
        document.getElementById('modalTime').textContent = new Date(log.Timestamp).toLocaleString();

        const durationText = log.durationSeconds ? ` (${log.durationSeconds}s)` : '';
        document.getElementById('modalTime').textContent += durationText;

        const codeBlock = document.getElementById('modalCodeContent');
        let formattedDetails = log.Args;

        try {
            if (log.Args && log.Args !== 'NULL') {
                const jsonObj = JSON.parse(log.Args);
                formattedDetails = JSON.stringify(jsonObj, null, 2);
            } else {
                formattedDetails = {{ _("No arguments provided.") | tojson }};
            }
        } catch (e) {
            formattedDetails = log.Args || "{{ _('No arguments provided.') }}";
        }

        codeBlock.textContent = formattedDetails;

        modal.classList.remove('hidden');
        void modal.offsetWidth;

        modalBackdrop.classList.remove('opacity-0');
        modalPanel.classList.remove('opacity-0', 'translate-y-4', 'sm:translate-y-0', 'sm:scale-95');
        modalPanel.classList.add('opacity-100', 'translate-y-0', 'sm:scale-100');
    }

    function closeLogModal() {
        modalBackdrop.classList.add('opacity-0');
        modalPanel.classList.add('opacity-0', 'translate-y-4', 'sm:translate-y-0', 'sm:scale-95');
        modalPanel.classList.remove('opacity-100', 'translate-y-0', 'sm:scale-100');

        setTimeout(() => {
            modal.classList.add('hidden');
        }, 300);
    }

    function copyToClipboard() {
        const text = document.getElementById('modalCodeContent').textContent;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.querySelector('#modalPanel button i.fa-copy');
            if(btn) {
                btn.className = 'fas fa-check text-green-400';
                setTimeout(() => btn.className = 'fas fa-copy', 2000);
            }
        });
    }

    document.addEventListener('keydown', function(event) {
        if (event.key === "Escape" && !modal.classList.contains('hidden')) {
            closeLogModal();
        }
    });

    modalBackdrop.addEventListener('click', closeLogModal);

    // Pre-fill filters from the URL query string (e.g. /admin/logs?username=foo)
    // so deep-links from other admin pages land on a filtered view.
    (function applyUrlFilters() {
        const qs = new URLSearchParams(window.location.search);
        const map = {
            username: 'filterUser',
            method:   'filterMethod',
            path:     'filterPath',
            status:   'filterStatus',
            organization: 'filterOrg',
            start_date: 'filterStart',
            end_date:   'filterEnd',
        };
        for (const [param, elId] of Object.entries(map)) {
            const v = qs.get(param);
            if (v == null) continue;
            const el = document.getElementById(elId);
            if (el) el.value = v;
        }
    })();

    fetchLogs(1);
    renderSavedPresets();
    const savePresetBtn = document.getElementById('savePresetBtn');
    if (savePresetBtn) savePresetBtn.addEventListener('click', promptSavePreset);

    // Live filtering — fire as soon as any filter changes. Text inputs are
    // debounced so we don't hammer the API on every keystroke.
    (function wireLiveFilters() {
        let textTimer = null;
        const debouncedFetch = () => {
            clearTimeout(textTimer);
            textTimer = setTimeout(() => fetchLogs(1), 300);
        };
        const textIds = ['filterUser', 'filterPath'];
        const instantIds = ['filterMethod', 'filterStatus', 'filterOrg'];
        textIds.forEach(id => {
            const el = document.getElementById(id);
            if (el) el.addEventListener('input', debouncedFetch);
        });
        instantIds.forEach(id => {
            const el = document.getElementById(id);
            if (el) el.addEventListener('change', () => fetchLogs(1));
        });
        // filterStart/filterEnd need the stale sub-day presetRangeOverride
        // cleared in THIS SAME handler, before fetchLogs(1) reads it — a
        // separate listener registered later (e.g. on DOMContentLoaded) would
        // still fire after this one already fetched with the stale override,
        // so the user's first manual date edit after a "Last hour" click
        // would silently be discarded.
        ['filterStart', 'filterEnd'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.addEventListener('change', () => {
                document.querySelectorAll('.log-preset.is-active').forEach(b => b.classList.remove('is-active'));
                presetRangeOverride = null;
                fetchLogs(1);
            });
        });
    })();

    document.addEventListener('DOMContentLoaded', function () {
        const presets = document.querySelectorAll('.log-preset');
        const startEl = document.getElementById('filterStart');
        const endEl   = document.getElementById('filterEnd');
        if (!startEl || !endEl) return;

        function toDateInput(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        // Same as toDateInput but keeps time-of-day, for sub-day presets.
        // Format matches what the backend already expects for its end_date
        // end-of-day suffix ("YYYY-MM-DD HH:MM:SS"), so it round-trips
        // through the same SQL parameter without extra parsing.
        function toDateTimeInput(d) {
            const hh = String(d.getHours()).padStart(2, '0');
            const mi = String(d.getMinutes()).padStart(2, '0');
            const ss = String(d.getSeconds()).padStart(2, '0');
            return `${toDateInput(d)} ${hh}:${mi}:${ss}`;
        }

        presets.forEach(btn => {
            btn.addEventListener('click', () => {
                presets.forEach(b => b.classList.remove('is-active'));
                btn.classList.add('is-active');

                const now = new Date();
                let start = new Date(now);
                presetRangeOverride = null;
                switch (btn.dataset.preset) {
                    case '1h':
                        start.setHours(now.getHours() - 1);
                        // A date-only bound would round this out to the whole
                        // current day (see toDateInput below) — send exact
                        // datetime bounds instead so "last hour" means one hour.
                        presetRangeOverride = { start: toDateTimeInput(start), end: toDateTimeInput(now) };
                        break;
                    case '24h': start.setHours(0, 0, 0, 0); break;
                    case '7d':  start.setDate(now.getDate() - 7); break;
                    case '30d': start.setDate(now.getDate() - 30); break;
                }
                // The visible date inputs stay date-only (that's all
                // <input type="date"> can hold); presetRangeOverride, when
                // set, is what actually gets sent to the backend.
                startEl.value = toDateInput(start);
                endEl.value   = toDateInput(now);
                fetchLogs(1);
            });
        });
        // Manual-edit clearing of presetRangeOverride lives in wireLiveFilters()
        // now, in the same handler that triggers the refetch — see comment there.
    });
</script>
