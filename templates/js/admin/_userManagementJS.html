<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <script>
        const userModal = document.getElementById('userModal');
        const modalTitle = document.getElementById('modalTitle');
        const userForm = document.getElementById('userForm');
        const userIdInput = document.getElementById('userId');
        const usernameInput = document.getElementById('username');
        const passwordHelp = document.getElementById('password-help');

        const confirmationModal = document.getElementById('confirmationModal');
        const confirmMessage = document.getElementById('confirmMessage');
        const confirmBtn = document.getElementById('confirmBtn');
        const cancelBtn = document.getElementById('cancelBtn');

        const API_PREFIX = window.location.href.includes("sydocportal") ? "/sydocportal/" : "/";
        function showNotification(message, type = 'success') {
            const container = document.getElementById('notification-container');

            const notification = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-green-500' : 'bg-red-500';
            const icon = type === 'success' 
                ? '<i class="fas fa-check-circle"></i>' 
                : '<i class="fas fa-exclamation-circle"></i>';

            notification.className = `flex items-center w-full p-4 text-white ${bgColor} rounded-lg shadow-lg transform transition-all duration-300 opacity-0 translate-x-full`;
            
            notification.innerHTML = `
                <div class="text-xl">${icon}</div>
                <div class="ml-3 text-sm font-medium">${message}</div>
            `;

            container.appendChild(notification);

            setTimeout(() => {
                notification.classList.remove('opacity-0', 'translate-x-full');
            }, 10);

            setTimeout(() => {
                notification.classList.add('opacity-0', 'translate-x-full');
                setTimeout(() => {
                    notification.remove();
                }, 300); 
            }, 5000);
        }

        function openModal() {
            userModal.classList.remove('hidden');
            setTimeout(() => {
                userModal.classList.remove('opacity-0');
                userModal.querySelector('.modal-content').classList.remove('scale-95');
            }, 10);
        }

        function closeModal(event) {
            if (event && event.target !== userModal) return;
            userModal.classList.add('opacity-0');
            userModal.querySelector('.modal-content').classList.add('scale-95');
            setTimeout(() => userModal.classList.add('hidden'), 300);
        }

        function openAddUserModal() {
            userForm.reset();
            userIdInput.value = '';
            modalTitle.textContent = `{{ _("Add new user") }}`;
            passwordHelp.classList.add('hidden');
            usernameInput.disabled = false;
            document.getElementById('password').required = true;
            openModal();
        }

        function openEditUserModal(user) {
            userForm.reset();
            modalTitle.textContent = `{{ _("Edit user") }}`;
            userIdInput.value = user.userID;
            usernameInput.value = user.username;
            usernameInput.disabled = false;
            document.getElementById('fullname').value = user.fullname;
            document.getElementById('email').value = user.email;
            document.getElementById('company').value = user.company;
            document.getElementById('scope').value = user.scope;
            document.getElementById('access').value = user.access;
            document.getElementById('subscription').value = user.subscription;
            passwordHelp.classList.remove('hidden');
            document.getElementById('password').required = false;
            openModal();
        }

        userForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            const data = Object.fromEntries(new FormData(userForm).entries());
            const userId = userIdInput.value;
            const url =  userId ? `${API_PREFIX}admin/users/edit/${userId}` : `${API_PREFIX}admin/users/add`

            if (userId && !data.password) delete data.password;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if (response.ok) {
                    showNotification(`{{ _("Success") }}`);
                    setTimeout(() => window.location.reload(), 1500);
                } else {
                    showNotification(`{{ _("Error:") }} ${result.message}`, 'error');
                }
            } catch (error) {
                console.error('Form submission error:', error);
                showNotification(`{{ _("An unexpected network error occurred.") }}`, 'error');
            }
        });

        let confirmCallback = null;

        function showConfirmationModal(message, onConfirm) {
            confirmMessage.textContent = message;
            confirmCallback = onConfirm;
            confirmationModal.classList.remove('hidden');
            setTimeout(() => {
                confirmationModal.classList.remove('opacity-0');
                confirmationModal.querySelector('.modal-content').classList.remove('scale-95');
            }, 10);
        }

        function hideConfirmationModal() {
            confirmationModal.classList.add('opacity-0');
            confirmationModal.querySelector('.modal-content').classList.add('scale-95');
            setTimeout(() => confirmationModal.classList.add('hidden'), 300);
        }

        confirmBtn.addEventListener('click', () => {
            if (confirmCallback) confirmCallback();
            hideConfirmationModal();
        });

        cancelBtn.addEventListener('click', hideConfirmationModal);


        async function deleteUser(userId) {
            const deletionTask = async () => {
                try {
                    const response = await fetch(`${API_PREFIX}admin/users/delete/${userId}`, { method: 'DELETE' });
                    const result = await response.json();
                    if (response.ok) {
                        showNotification('{{ _("Success") }}');
                        setTimeout(() => window.location.reload(), 1500);
                    } else {
                        showNotification(`{{ _("Error:") }} ${result.message}`, 'error');
                    }
                } catch (error) {
                    console.error('Delete error:', error);
                    showNotification(`{{ _("An unexpected network error occurred.") }}`, 'error');
                }
            };
            showConfirmationModal(`{{ _("Are you sure you want to delete this user? This action cannot be undone.") }}`, deletionTask);
        }

        function timeAgo(date) {
            const seconds = Math.floor((new Date() - new Date(date)) / 1000);
            let interval = seconds / 31536000;
            if (interval > 1) return Math.floor(interval) + ` {{ _("years ago") }}`;
            interval = seconds / 2592000;
            if (interval > 1) return Math.floor(interval) + ` {{ _("months ago") }}`;
            interval = seconds / 86400;
            if (interval > 1) return Math.floor(interval) + ` {{ _("days ago") }}`;
            interval = seconds / 3600;
            if (interval > 1) return Math.floor(interval) + ` {{ _("hours ago") }}`;
            interval = seconds / 60;
            if (interval > 1) return Math.floor(interval) + ` {{ _(" minutes ago") }}`;
            return Math.floor(seconds) + ` {{ _("seconds ago") }}`;
        }

        async function fetchRecentLogs() {
            const logsBody = document.getElementById('recent-logs-body');
            try {
                const response = await fetch(`${API_PREFIX}api/admin/recent_logs`);
                if (!response.ok) throw new Error('Failed to fetch logs');
                const logs = await response.json();

                logsBody.innerHTML = '';
                if (logs.length === 0) {
                    logsBody.innerHTML = `<tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">{{ _("No recent logs found.") }}</td></tr>`;
                    return;
                }

                logs.forEach(log => {
                    const row = document.createElement('tr');
                    row.className = 'bg-white border-b hover:bg-gray-50';
                    const statusColor = log.ActionStatus === "SUCCESS" ? 'text-green-600' : 'text-red-600';
                    const timestamp = new Date(log.Timestamp + 'Z').toLocaleString();

                    row.innerHTML = `
                        <td class="px-6 py-3 text-xs text-gray-600">${timestamp}</td>
                        <td class="px-6 py-3 font-medium">${log.Username}</td>
                        <td class="px-6 py-3">${log.ActionType}</td>
                        <td class="px-6 py-3 font-semibold ${statusColor}">${log.ActionStatus}</td>
                    `;
                    logsBody.appendChild(row);
                });
            } catch (error) {
                console.error("Error fetching recent logs:", error);
                logsBody.innerHTML = `<tr><td colspan="4" class="px-6 py-4 text-center text-red-500">{{ _("Could not load logs.") }}</td></tr>`;
            }
        }

        async function fetchActiveSessions() {
            const sessionsBody = document.getElementById('active-sessions-body');
            try {
                const response = await fetch(`${API_PREFIX}api/admin/active_sessions`);
                if (!response.ok) throw new Error('Failed to fetch sessions');
                const sessions = await response.json();

                sessionsBody.innerHTML = '';
                if (sessions.length === 0) {
                    sessionsBody.innerHTML = `<tr><td colspan="3" class="px-6 py-4 text-center text-gray-500">{{ _("No active sessions found.") }}</td></tr>`;
                    return;
                }

                sessions.forEach(session => {
                    const row = document.createElement('tr');
                    row.className = 'bg-white border-b hover:bg-gray-50';
                    
                    // <td class="px-6 py-4 font-medium">${session.SessionID}</td>
                    row.innerHTML = `
                        <td class="px-6 py-4 font-medium">${session.Username}</td>
                        <td class="px-6 py-4 font-medium">${session.Userid}</td>
                        <td class="px-6 py-4 text-gray-600">${session.IPAddress}</td>
                        <td class="px-6 py-4">${timeAgo(session.LastActivity + 'Z')}</td>
                    `;
                    sessionsBody.appendChild(row);
                });
            } catch (error) {
                console.error("Error fetching active sessions:", error);
                sessionsBody.innerHTML = `<tr><td colspan="3" class="px-6 py-4 text-center text-red-500">{{ _("Could not load sessions.") }}</td></tr>`;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.edit-user-btn').forEach(button => {
                button.addEventListener('click', () => {
                    const userData = JSON.parse(button.dataset.user);
                    openEditUserModal(userData);
                });
            });
            fetchRecentLogs();
            fetchActiveSessions();

            setInterval(fetchRecentLogs, 30000);
            setInterval(fetchActiveSessions, 30000);
        });

    </script>
</body>

</html>
