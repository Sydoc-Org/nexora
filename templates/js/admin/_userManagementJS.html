<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <script>
        const userModal = document.getElementById('userModal');
        const modalTitle = document.getElementById('modalTitle');
        const userForm = document.getElementById('userForm');
        const userIdInput = document.getElementById('userId');
        const usernameInput = document.getElementById('username');
        const passwordHelp = document.getElementById('password-help');

        const confirmationModal = document.getElementById('confirmationModal');
        const confirmMessage = document.getElementById('confirmMessage');
        const confirmBtn = document.getElementById('confirmBtn');
        const cancelBtn = document.getElementById('cancelBtn');

        const API_PREFIX = window.location.href.includes("nexora") ? "/nexora/" : "/";
        function showNotification(message, type = 'success') {
            const container = document.getElementById('notification-container');

            const notification = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-green-500' : 'bg-red-500';
            const icon = type === 'success' 
                ? '<i class="fas fa-check-circle"></i>' 
                : '<i class="fas fa-exclamation-circle"></i>';

            notification.className = `flex items-center w-full p-4 text-white ${bgColor} rounded-lg shadow-lg transform transition-all duration-300 opacity-0 translate-x-full`;
            
            notification.innerHTML = `
                <div class="text-xl">${icon}</div>
                <div class="ml-3 text-sm font-medium">${message}</div>
            `;

            container.appendChild(notification);

            setTimeout(() => {
                notification.classList.remove('opacity-0', 'translate-x-full');
            }, 10);

            setTimeout(() => {
                notification.classList.add('opacity-0', 'translate-x-full');
                setTimeout(() => {
                    notification.remove();
                }, 300); 
            }, 5000);
        }

        function openModal() {
            userModal.classList.remove('hidden');
            setTimeout(() => {
                userModal.classList.remove('opacity-0');
                userModal.querySelector('.modal-content').classList.remove('scale-95');
            }, 10);
        }

        function closeModal(event) {
            if (event && event.target !== userModal) return;
            userModal.classList.add('opacity-0');
            userModal.querySelector('.modal-content').classList.add('scale-95');
            setTimeout(() => userModal.classList.add('hidden'), 300);
        }

        function openAddUserModal() {
            userForm.reset();
            userIdInput.value = '';
            modalTitle.textContent = `{{ _("Add new user") }}`;
            passwordHelp.classList.add('hidden');
            usernameInput.disabled = false;
            document.getElementById('password').required = true;
            openModal();
        }

        function openEditUserModal(user) {
            userForm.reset();
            modalTitle.textContent = `{{ _("Edit user") }}`;
            
            userIdInput.value = user.userID;
            usernameInput.value = user.username;
            usernameInput.disabled = false;
            document.getElementById('fullname').value = user.fullname;
            document.getElementById('email').value = user.email;
            document.getElementById('accessprofile').value = user.accessprofile;
            document.getElementById('organization').value = user.organization;

            passwordHelp.classList.remove('hidden');
            document.getElementById('password').required = false;
            openModal();
        }

        function escapeHtml(str) {
            if (str == null) return '';
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        }

        function renderUserRow(user) {
            const userJson = JSON.stringify(user).replace(/"/g, '&quot;');
            return `<tr class="bg-white border-b hover:bg-gray-50">
                <td class="px-6 py-4 font-medium text-gray-900">${escapeHtml(user.username)}</td>
                <td class="px-6 py-4">${escapeHtml(user.fullname)}</td>
                <td class="px-6 py-4">${escapeHtml(user.email)}</td>
                <td class="px-6 py-4">${escapeHtml(user.accessprofile)}</td>
                <td class="px-6 py-4">${escapeHtml(user.organization)}</td>
                <td class="px-6 py-4 text-right">
                    <button data-user="${userJson}" class="edit-user-btn font-medium text-indigo-600 hover:text-indigo-800 mr-4">{{ _("Edit") }}</button>
                    <button onclick="deleteUser(${user.userID})" class="font-medium text-red-600 hover:text-red-800">{{ _("Delete") }}</button>
                </td>
            </tr>`;
        }

        async function refreshUsersTable() {
            try {
                const response = await fetch(`${API_PREFIX}api/admin/users/list`, {
                    headers: { 'X-CSRFToken': csrfToken }
                });
                if (!response.ok) return;
                const users = await response.json();
                document.getElementById('users-tbody').innerHTML = users.map(renderUserRow).join('');
            } catch (error) {
                console.error('Failed to refresh users table:', error);
            }
        }

        userForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            const data = Object.fromEntries(new FormData(userForm).entries());
            const userId = userIdInput.value;
            const url =  userId ? `${API_PREFIX}admin/users/edit/${userId}` : `${API_PREFIX}admin/users/add`

            if (userId && !data.password) delete data.password;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken},
                    body: JSON.stringify(data)
                });

                if (response.status === 403) {
                    showNotification(`{{ _("You do not have permission to perform this action.") }}`, 'error');
                    return;
                }

                const result = await response.json();
                if (response.ok) {
                    closeModal(null);
                    showNotification(`{{ _("Success") }}`);
                    refreshUsersTable();
                } else {
                    showNotification(`{{ _("Error:") }} ${result.message}`, 'error');
                }
            } catch (error) {
                console.error('Form submission error:', error);
                showNotification(`{{ _("An unexpected network error occurred.") }}`, 'error');
            }
        });

        let confirmCallback = null;

        function showConfirmationModal(message, onConfirm) {
            confirmMessage.textContent = message;
            confirmCallback = onConfirm;
            confirmationModal.classList.remove('hidden');
            setTimeout(() => {
                confirmationModal.classList.remove('opacity-0');
                confirmationModal.querySelector('.modal-content').classList.remove('scale-95');
            }, 10);
        }

        function hideConfirmationModal() {
            confirmationModal.classList.add('opacity-0');
            confirmationModal.querySelector('.modal-content').classList.add('scale-95');
            setTimeout(() => confirmationModal.classList.add('hidden'), 300);
        }

        confirmBtn.addEventListener('click', () => {
            if (confirmCallback) confirmCallback();
            hideConfirmationModal();
        });

        cancelBtn.addEventListener('click', hideConfirmationModal);


        async function deleteUser(userId) {
            const deletionTask = async () => {
                try {
                    const response = await fetch(`${API_PREFIX}admin/users/delete/${userId}`, { headers: {'X-CSRFToken': csrfToken}, method: 'DELETE' });
                    
                    // NEW: Explicitly check for 403 before parsing JSON
                    if (response.status === 403) {
                        showNotification(`{{ _("You do not have permission to delete this user.") }}`, 'error');
                        return;
                    }

                    const result = await response.json();
                    if (response.ok) {
                        showNotification('{{ _("Success") }}');
                        refreshUsersTable();
                    } else {
                        showNotification(`{{ _("Error:") }} ${result.message}`, 'error');
                    }
                } catch (error) {
                    console.error('Delete error:', error);
                    showNotification(`{{ _("An unexpected network error occurred.") }}`, 'error');
                }
            };
            showConfirmationModal(`{{ _("Are you sure you want to delete this user? This action cannot be undone.") }}`, deletionTask);
        }


        document.addEventListener('click', (e) => {
            const editBtn = e.target.closest('.edit-user-btn');
            if (editBtn) {
                const userData = JSON.parse(editBtn.dataset.user);
                openEditUserModal(userData);
            }
        });

    </script>
</body>

</html>
