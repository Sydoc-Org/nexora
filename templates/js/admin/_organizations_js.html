    <script nonce="{{ csp_nonce() }}">
        // Organizations list (tenancy redesign): tenant tabs, search, row
        // navigation and the organization sheet. Branding and process sources
        // moved to the organization detail view.
        const API_PREFIX = window.API_PREFIX;
        const showNotification = window.NX.toast;
        const forbidden = `{{ _("You do not have permission to perform this action.") }}`;
        const reload = () => window.location.reload();

        async function send(url, method, body) {
            try {
                const response = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                    body: body === undefined ? undefined : JSON.stringify(body)
                });
                if (response.status === 403) { showNotification(forbidden, 'error'); return false; }
                const result = await response.json();
                if (response.ok) { showNotification(result.message || `{{ _("Success") }}`); return true; }
                showNotification(`{{ _("Error:") }} ${result.message}`, 'error');
                return false;
            } catch (error) {
                console.error('request failed:', error);
                showNotification(`{{ _("An unexpected network error occurred.") }}`, 'error');
                return false;
            }
        }

        // ---- Confirm dialog -------------------------------------------------
        const confirmEl = document.getElementById('admConfirm');
        const confirmBody = document.getElementById('admConfirmBody');
        let confirmCallback = null;
        function askConfirm(message, onConfirm) {
            confirmBody.textContent = message;
            confirmCallback = onConfirm;
            confirmEl.classList.remove('hidden');
        }
        function closeConfirm() { confirmEl.classList.add('hidden'); confirmCallback = null; }
        document.getElementById('admConfirmOk').addEventListener('click', () => {
            const cb = confirmCallback; closeConfirm(); if (cb) cb();
        });
        document.getElementById('admConfirmCancel').addEventListener('click', closeConfirm);
        confirmEl.addEventListener('click', (e) => { if (e.target === confirmEl) closeConfirm(); });

        // ---- Side sheet ------------------------------------------------------
        function sheet(name) {
            const panel = document.getElementById(`${name}Sheet`);
            const back = document.getElementById(`${name}SheetBack`);
            if (!panel || !back) return null;
            const api = {
                open() { panel.classList.remove('hidden'); back.classList.remove('hidden'); },
                close() { panel.classList.add('hidden'); back.classList.add('hidden'); },
            };
            back.addEventListener('click', api.close);
            document.getElementById(`${name}SheetClose`)?.addEventListener('click', api.close);
            document.getElementById(`${name}SheetCancel`)?.addEventListener('click', api.close);
            return api;
        }
        const orgSheet = sheet('org');
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { orgSheet?.close(); closeConfirm(); }
        });

        // ---- Tenant tabs + search ---------------------------------------------
        const searchInput = document.getElementById('orgSearch');
        const tbody = document.getElementById('orgs-tbody');
        const emptyNote = document.getElementById('orgs-empty');
        let activeFilter = '';

        function applyFilters() {
            if (!tbody) return;
            const q = (searchInput?.value || '').trim().toLowerCase();
            let shown = 0;
            tbody.querySelectorAll('tr[data-search]').forEach(tr => {
                const matchesTab = !activeFilter || tr.dataset.nxState === activeFilter;
                const matchesQuery = !q || tr.dataset.search.includes(q);
                const visible = matchesTab && matchesQuery;
                tr.classList.toggle('hidden', !visible);
                if (visible) shown++;
            });
            emptyNote?.classList.toggle('hidden', shown > 0 || !tbody.querySelector('tr[data-search]'));
        }

        document.querySelectorAll('[data-nx-filter]').forEach(tab => {
            tab.addEventListener('click', () => {
                activeFilter = tab.dataset.nxFilter;
                document.querySelectorAll('[data-nx-filter]').forEach(t =>
                    t.classList.toggle('adm-tab--active', t === tab));
                applyFilters();
            });
        });
        searchInput?.addEventListener('input', applyFilters);

        // ---- Row navigation ----------------------------------------------------
        tbody?.addEventListener('click', (e) => {
            if (e.target.closest('button, a, input, label')) return;
            const row = e.target.closest('tr[data-nx-href]');
            if (row) window.location.href = row.dataset.nxHref;
        });

        // ---- Organization sheet -------------------------------------------------
        const orgForm = document.getElementById('orgForm');
        const orgOriginalCode = document.getElementById('orgOriginalCode');
        const orgNameInput = document.getElementById('organizationname');
        const orgTenantSelect = document.getElementById('orgTenantCode');
        const orgTenantNote = document.getElementById('orgTenantNote');
        const orgCodeHint = document.getElementById('orgCodeHint');
        let orgTenantAtOpen = '';

        // The amber note only earns its place when the pick actually changes.
        orgTenantSelect?.addEventListener('change', () => {
            orgTenantNote?.classList.toggle('hidden', orgTenantSelect.value === orgTenantAtOpen);
        });

        document.getElementById('addOrgBtn')?.addEventListener('click', () => {
            orgForm.reset();
            document.getElementById('orgSheetTitle').textContent = `{{ _("Add organization") }}`;
            orgOriginalCode.value = '';
            orgTenantAtOpen = '';
            orgTenantNote?.classList.add('hidden');
            orgCodeHint?.classList.remove('hidden');
            orgSheet.open();
        });

        window.openEditOrgSheet = function (o) {
            orgForm.reset();
            document.getElementById('orgSheetTitle').textContent = `{{ _("Edit organization") }}`;
            orgOriginalCode.value = o.organizationcode;
            orgNameInput.value = o.organization || '';
            orgTenantSelect.value = o.tenant_code || '';
            orgTenantAtOpen = o.tenant_code || '';
            orgTenantNote?.classList.add('hidden');
            // The code is derived on create and never changes afterwards.
            orgCodeHint?.classList.add('hidden');
            orgSheet.open();
        };

        orgForm?.addEventListener('submit', async (event) => {
            event.preventDefault();
            const code = orgOriginalCode.value;
            const data = { organizationname: orgNameInput.value, tenantcode: orgTenantSelect.value };
            const url = code
                ? `${API_PREFIX}admin/organizations/edit/${encodeURIComponent(code)}`
                : `${API_PREFIX}admin/organizations/add`;
            if (await send(url, 'POST', data)) { orgSheet.close(); reload(); }
        });

        window.confirmDeleteOrganization = function (code, onDone) {
            askConfirm(`{{ _("Delete this organization? Its process sources become unassigned.") }}`, async () => {
                const url = `${API_PREFIX}admin/organizations/delete/${encodeURIComponent(code)}`;
                if (await send(url, 'DELETE')) (onDone || reload)();
            });
        };

        applyFilters();
    </script>
