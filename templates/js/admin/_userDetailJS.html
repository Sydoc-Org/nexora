<script>
    const API_PREFIX = window.location.href.includes("nexora") ? "/nexora/" : "/";

    function userDetailToast(msg, tone) {
        const container = document.getElementById('notification-container');
        if (!container) { alert(msg); return; }
        const el = document.createElement('div');
        el.style.cssText = 'background:#fff;border:1px solid var(--a-border);padding:10px 14px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.06);font-size:13px;margin-bottom:8px;';
        if (tone === 'error') el.style.borderColor = 'var(--a-danger)';
        el.textContent = msg;
        container.appendChild(el);
        setTimeout(() => el.remove(), 3500);
    }

    document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('userProfileForm');
        if (!form) return;

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const userId = form.dataset.userId;
            const fd = new FormData(form);
            const payload = {};
            fd.forEach((value, key) => { payload[key] = value; });
            // The edit endpoint expects JSON, treats empty password as "no change"
            if (!payload.password) delete payload.password;

            try {
                const res = await fetch(`${API_PREFIX}admin/users/edit/${userId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken
                    },
                    body: JSON.stringify(payload)
                });

                const result = await res.json().catch(() => ({}));
                if (res.ok && result.success) {
                    userDetailToast(result.message || '{{ _("User saved.") }}', 'success');
                    // Clear password field after successful save
                    const pw = document.getElementById('fld-password');
                    if (pw) pw.value = '';
                } else {
                    userDetailToast(result.message || '{{ _("Save failed.") }}', 'error');
                }
            } catch (err) {
                console.error(err);
                userDetailToast('{{ _("Network error") }}', 'error');
            }
        });
    });

    // ─── Tabs (Effective / Overrides) ───────────────────────────────────
    function switchPermTab(name) {
        ['effective', 'overrides'].forEach(n => {
            const btn  = document.getElementById('perm-tab-' + n + '-btn');
            const pane = document.getElementById('perm-tab-' + n);
            if (btn)  btn.classList.toggle('is-active', n === name);
            if (pane) pane.classList.toggle('hidden',   n !== name);
        });
    }

    // ─── Permission overrides ──────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', async function () {
        const form = document.getElementById('overridesForm');
        if (!form) return;

        const userId = form.dataset.userId;

        // Load current overrides and apply to radios
        try {
            const res = await fetch(`${API_PREFIX}api/admin/user_overrides/${userId}`, {
                headers: { 'X-CSRFToken': csrfToken }
            });
            const data = await res.json().catch(() => ({}));
            if (res.ok && data.success) {
                for (const [permId, effect] of Object.entries(data.overrides || {})) {
                    const radio = document.querySelector(`input[name="perm_${permId}"][value="${effect}"]`);
                    if (radio) radio.checked = true;
                }
            }
        } catch (err) {
            console.error('Failed to load overrides:', err);
        }

        updateOverrideSummary();

        // Keep summary current
        form.addEventListener('change', (e) => {
            if (e.target.type === 'radio') updateOverrideSummary();
        });

        // Per-tab search filter (overrides table only)
        const search = document.getElementById('overrideSearch');
        if (search) {
            search.addEventListener('input', () => {
                const q = search.value.trim().toLowerCase();
                form.querySelectorAll('tr[data-search]').forEach(tr => {
                    tr.style.display = !q || tr.dataset.search.includes(q) ? '' : 'none';
                });
            });
        }

        // Save
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const overrides = [];
            form.querySelectorAll('tr[data-perm-id]').forEach(tr => {
                const permId = tr.dataset.permId;
                const checked = tr.querySelector(`input[name="perm_${permId}"]:checked`);
                if (checked && checked.value !== 'None') {
                    overrides.push({ PermissionID: Number(permId), Effect: checked.value });
                }
            });

            try {
                const res = await fetch(`${API_PREFIX}api/admin/user_overrides/save`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken
                    },
                    body: JSON.stringify({ userId: Number(userId), overrides })
                });
                const result = await res.json().catch(() => ({}));
                if (res.ok && result.success) {
                    userDetailToast(result.message || '{{ _("Overrides saved.") }}', 'success');
                    if (typeof loadEffectivePermissions === 'function') loadEffectivePermissions();
                } else {
                    userDetailToast(result.message || '{{ _("Save failed.") }}', 'error');
                }
            } catch (err) {
                console.error(err);
                userDetailToast('{{ _("Network error") }}', 'error');
            }
        });
    });

    function updateOverrideSummary() {
        const form = document.getElementById('overridesForm');
        const el = document.getElementById('overrideSummary');
        if (!form || !el) return;
        let allow = 0, deny = 0;
        form.querySelectorAll('tr[data-perm-id]').forEach(tr => {
            const permId = tr.dataset.permId;
            const checked = tr.querySelector(`input[name="perm_${permId}"]:checked`);
            if (checked?.value === 'A') allow++;
            else if (checked?.value === 'D') deny++;
        });
        el.textContent = `${allow} {{ _("allow") }} · ${deny} {{ _("deny") }}`;
    }

    // ─── Delete user (Danger zone) ──────────────────────────────────────
    document.addEventListener('DOMContentLoaded', function () {
        const btn   = document.getElementById('deleteUserBtn');
        const modal = document.getElementById('confirmDeleteModal');
        const msg   = document.getElementById('confirmDeleteMessage');
        const ok    = document.getElementById('confirmDeleteBtn');
        if (!btn || !modal || !msg || !ok) return;

        btn.addEventListener('click', () => {
            const username = btn.dataset.username || '';
            msg.textContent = `{{ _("This will permanently delete") }} "${username}". {{ _("This action cannot be undone.") }}`;
            modal.style.display = 'flex';
        });

        ok.addEventListener('click', async () => {
            const userId = btn.dataset.userId;
            ok.disabled = true;
            try {
                const res = await fetch(`${API_PREFIX}admin/users/delete/${userId}`, {
                    method: 'DELETE',
                    headers: { 'X-CSRFToken': csrfToken }
                });
                const result = await res.json().catch(() => ({}));
                if (res.ok && result.success) {
                    window.location.href = "{{ url_for('admin_access_control') }}";
                } else {
                    userDetailToast(result.message || '{{ _("Delete failed.") }}', 'error');
                    modal.style.display = 'none';
                }
            } catch (err) {
                console.error(err);
                userDetailToast('{{ _("Network error") }}', 'error');
                modal.style.display = 'none';
            } finally {
                ok.disabled = false;
            }
        });
    });

    // ─── Sign out everywhere ────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', function () {
        const btn = document.getElementById('signOutAllBtn');
        if (!btn) return;
        btn.addEventListener('click', async () => {
            const uname = btn.dataset.username || '';
            if (!confirm(`{{ _("Sign out ALL active sessions for") }} "${uname}"? {{ _("They will be forced to log in again.") }}`)) return;
            btn.disabled = true;
            try {
                const res = await fetch(`${API_PREFIX}admin/users/${btn.dataset.userId}/revoke_all`, {
                    method: 'POST',
                    headers: { 'X-CSRFToken': csrfToken }
                });
                const result = await res.json().catch(() => ({}));
                if (res.ok && result.success) {
                    userDetailToast(`{{ _("Revoked") }} ${result.revoked} {{ _("session(s).") }}`, 'success');
                } else {
                    userDetailToast(result.message || '{{ _("Revoke failed.") }}', 'error');
                }
            } catch {
                userDetailToast('{{ _("Network error") }}', 'error');
            } finally {
                btn.disabled = false;
            }
        });
    });

    // ─── Effective permissions ──────────────────────────────────────────
    let loadEffectivePermissions; // defined inside IIFE, exposed for callers
    (function () {
        const tbody = document.getElementById('effTbody');
        if (!tbody) return;
        const userId = tbody.dataset.userId;
        const summary = document.getElementById('effSummary');
        const search  = document.getElementById('effSearch');

        function sourceBadge(src) {
            const span = document.createElement('span');
            span.className = 'admin-badge';
            if (src === 'profile')        { span.classList.add('admin-badge--gray');  span.textContent = '{{ _("Profile") }}'; }
            else if (src === 'override-allow') { span.classList.add('admin-badge--green'); span.textContent = '{{ _("Override · Allow") }}'; }
            else if (src === 'override-deny')  { span.classList.add('admin-badge--red');   span.textContent = '{{ _("Override · Deny") }}'; }
            else                            { span.classList.add('admin-badge--amber'); span.textContent = '{{ _("Profile · Deny") }}'; }
            return span;
        }

        function renderRows(entries, isDenied) {
            entries.forEach(e => {
                const tr = document.createElement('tr');
                tr.dataset.search = ((e.Code || '') + ' ' + (e.Description || '')).toLowerCase();
                if (isDenied) tr.style.opacity = '0.55';

                const tdPerm = document.createElement('td');
                const code = document.createElement('div');
                const codeMono = document.createElement('span');
                codeMono.className = 'admin-mono';
                codeMono.textContent = e.Code || '';
                code.appendChild(codeMono);
                if (isDenied) {
                    const tag = document.createElement('span');
                    tag.style.cssText = 'font-size:10px;margin-left:8px;color:var(--a-danger);text-transform:uppercase;letter-spacing:0.6px;font-weight:600';
                    tag.textContent = '{{ _("Denied") }}';
                    code.appendChild(tag);
                }
                const desc = document.createElement('div');
                desc.style.cssText = 'font-size:12px;color:var(--a-text-sec);margin-top:2px';
                desc.textContent = e.Description || '';
                tdPerm.appendChild(code);
                tdPerm.appendChild(desc);

                const tdSrc = document.createElement('td');
                tdSrc.className = 'align-right';
                tdSrc.appendChild(sourceBadge(e.source));

                tr.appendChild(tdPerm);
                tr.appendChild(tdSrc);
                tbody.appendChild(tr);
            });
        }

        function applySearch() {
            const q = (search?.value || '').trim().toLowerCase();
            tbody.querySelectorAll('tr[data-search]').forEach(tr => {
                tr.style.display = (!q || tr.dataset.search.includes(q)) ? '' : 'none';
            });
        }

        loadEffectivePermissions = async function () {
            while (tbody.firstChild) tbody.removeChild(tbody.firstChild);
            const loadingTr = document.createElement('tr');
            const loadingTd = document.createElement('td');
            loadingTd.setAttribute('colspan', '2');
            loadingTd.className = 'admin-empty';
            loadingTd.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
            loadingTd.appendChild(document.createTextNode('  {{ _("Loading...") }}'));
            loadingTr.appendChild(loadingTd);
            tbody.appendChild(loadingTr);

            try {
                const res = await fetch(`${API_PREFIX}api/admin/users/${userId}/effective_permissions`, {
                    headers: { 'X-CSRFToken': csrfToken }
                });
                const data = await res.json().catch(() => ({}));
                while (tbody.firstChild) tbody.removeChild(tbody.firstChild);

                if (!res.ok || !data.success) {
                    const tr = document.createElement('tr');
                    const td = document.createElement('td');
                    td.setAttribute('colspan', '2');
                    td.className = 'admin-empty';
                    td.style.color = 'var(--a-danger)';
                    td.textContent = '{{ _("Could not load effective permissions.") }}';
                    tr.appendChild(td);
                    tbody.appendChild(tr);
                    return;
                }

                const granted = data.granted || [];
                const denied  = data.denied  || [];

                if (granted.length === 0 && denied.length === 0) {
                    const tr = document.createElement('tr');
                    const td = document.createElement('td');
                    td.setAttribute('colspan', '2');
                    td.className = 'admin-empty';
                    td.textContent = '{{ _("This user has no permissions.") }}';
                    tr.appendChild(td);
                    tbody.appendChild(tr);
                } else {
                    renderRows(granted, false);
                    renderRows(denied, true);
                }

                const fromProfile  = granted.filter(g => g.source === 'profile').length;
                const fromOverride = granted.filter(g => g.source === 'override-allow').length;
                if (summary) {
                    summary.textContent = granted.length + ' {{ _("granted") }}'
                        + ' · ' + fromProfile + ' {{ _("profile") }}'
                        + ' · ' + fromOverride + ' {{ _("override") }}';
                }
                applySearch();
            } catch (err) {
                console.error(err);
                while (tbody.firstChild) tbody.removeChild(tbody.firstChild);
                const tr = document.createElement('tr');
                const td = document.createElement('td');
                td.setAttribute('colspan', '2');
                td.className = 'admin-empty';
                td.style.color = 'var(--a-danger)';
                td.textContent = '{{ _("Could not load effective permissions.") }}';
                tr.appendChild(td);
                tbody.appendChild(tr);
            }
        };

        if (search) search.addEventListener('input', applySearch);
        document.addEventListener('DOMContentLoaded', loadEffectivePermissions);
    })();

    // ─── Activity (last 7 days) ─────────────────────────────────────────
    (function () {
        const tbody = document.getElementById('activityTbody');
        if (!tbody) return;

        const userId = tbody.dataset.userId;
        let currentPage = 1;
        const prevBtn = document.getElementById('activityPrevBtn');
        const nextBtn = document.getElementById('activityNextBtn');
        const info    = document.getElementById('activityPageInfo');

        function esc(s) {
            if (s == null) return '';
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        }

        function statusBadge(code) {
            const n = parseInt(code);
            if (isNaN(n)) return '<span class="log-status log-status--warn">?</span>';
            if (n >= 200 && n < 300) return '<span class="log-status log-status--ok">' + n + '</span>';
            if (n >= 400 && n < 500) return '<span class="log-status log-status--warn">' + n + '</span>';
            return '<span class="log-status log-status--error">' + n + '</span>';
        }

        function relativeTime(iso) {
            if (!iso) return '';
            // Server emits ISO-8601 (server-local time, naive). Parse directly;
            // Date() treats naive ISO as local, which matches a same-TZ server.
            const t = new Date(iso);
            if (isNaN(t.getTime())) return '';
            const seconds = Math.max(0, Math.floor((Date.now() - t.getTime()) / 1000));
            if (seconds < 60) return '{{ _("just now") }}';
            const m = Math.floor(seconds / 60);
            if (m < 60) return m + ' {{ _("min ago") }}';
            const h = Math.floor(m / 60);
            if (h < 24) return h + ' {{ _("h ago") }}';
            return Math.floor(h / 24) + ' {{ _("d ago") }}';
        }

        async function load(page) {
            currentPage = page;
            while (tbody.firstChild) tbody.removeChild(tbody.firstChild);
            const loadingTr = document.createElement('tr');
            const loadingTd = document.createElement('td');
            loadingTd.setAttribute('colspan', '3');
            loadingTd.className = 'admin-empty';
            loadingTd.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
            loadingTd.appendChild(document.createTextNode('   {{ _("Loading...") }}'));
            loadingTr.appendChild(loadingTd);
            tbody.appendChild(loadingTr);
            try {
                const res = await fetch(`${API_PREFIX}api/admin/users/${userId}/activity?page=${page}`, {
                    headers: { 'X-CSRFToken': csrfToken }
                });
                const data = await res.json().catch(() => ({}));
                while (tbody.firstChild) tbody.removeChild(tbody.firstChild);
                if (!res.ok || !data.entries) {
                    const tr = document.createElement('tr');
                    const td = document.createElement('td');
                    td.setAttribute('colspan', '3');
                    td.className = 'admin-empty';
                    td.style.color = 'var(--a-danger)';
                    td.textContent = '{{ _("Could not load activity.") }}';
                    tr.appendChild(td);
                    tbody.appendChild(tr);
                    return;
                }
                if (data.total === 0) {
                    const tr = document.createElement('tr');
                    const td = document.createElement('td');
                    td.setAttribute('colspan', '3');
                    td.className = 'admin-empty';
                    td.textContent = '{{ _("No recorded activity in the last 7 days.") }}';
                    tr.appendChild(td);
                    tbody.appendChild(tr);
                    info.textContent = '';
                    prevBtn.disabled = true;
                    nextBtn.disabled = true;
                    return;
                }
                data.entries.forEach(e => {
                    const tr = document.createElement('tr');

                    // Time cell
                    const tdTime = document.createElement('td');
                    tdTime.setAttribute('title', esc(e.Timestamp || ''));
                    tdTime.textContent = relativeTime(e.Timestamp);

                    // Action cell
                    const tdAction = document.createElement('td');
                    const path = e.Path || '';
                    const pathShort = path.length > 60 ? path.substring(0, 60) + '…' : path;
                    const method = e.HttpRequestMethod || '';
                    const methodSpan = document.createElement('span');
                    methodSpan.className = 'log-method log-method--' + esc(method);
                    methodSpan.textContent = method;
                    const pathSpan = document.createElement('span');
                    pathSpan.className = 'admin-mono';
                    pathSpan.style.fontSize = '11px';
                    pathSpan.textContent = pathShort;
                    tdAction.appendChild(methodSpan);
                    tdAction.appendChild(document.createTextNode(' '));
                    tdAction.appendChild(pathSpan);

                    // Status cell — statusBadge only emits trusted integer values wrapped in safe class names
                    const tdStatus = document.createElement('td');
                    tdStatus.className = 'align-right';
                    tdStatus.innerHTML = statusBadge(e.HttpResponseCode);

                    tr.appendChild(tdTime);
                    tr.appendChild(tdAction);
                    tr.appendChild(tdStatus);
                    tbody.appendChild(tr);
                });
                info.textContent = '{{ _("Page") }} ' + data.page + ' {{ _("of") }} ' + data.pages + ' (' + data.total + ' {{ _("entries") }})';
                prevBtn.disabled = data.page <= 1;
                nextBtn.disabled = data.page >= data.pages;
            } catch (err) {
                while (tbody.firstChild) tbody.removeChild(tbody.firstChild);
                const tr = document.createElement('tr');
                const td = document.createElement('td');
                td.setAttribute('colspan', '3');
                td.className = 'admin-empty';
                td.style.color = 'var(--a-danger)';
                td.textContent = '{{ _("Could not load activity.") }}';
                tr.appendChild(td);
                tbody.appendChild(tr);
            }
        }

        prevBtn.addEventListener('click', () => load(Math.max(1, currentPage - 1)));
        nextBtn.addEventListener('click', () => load(currentPage + 1));
        document.addEventListener('DOMContentLoaded', () => load(1));
    })();
</script>
