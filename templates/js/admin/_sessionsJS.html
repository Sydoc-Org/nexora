<script>
        const API_PREFIX = window.location.href.includes("nexora") ? "/nexora/" : "/";

        function escapeHtml(str) {
            if (str == null) return '';
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        }

         function timeAgo(date) {
                let seconds = Math.floor((new Date() - new Date(date)) / 1000);

                if (seconds < 0) {
                    seconds = 0;
                }

                let interval = seconds / 31536000;
                if (interval > 1) return Math.floor(interval) + ` {{ _("years ago") }}`;
                
                interval = seconds / 2592000;
                if (interval > 1) return Math.floor(interval) + ` {{ _("months ago") }}`;
                
                interval = seconds / 86400;
                if (interval > 1) return Math.floor(interval) + ` {{ _("days ago") }}`;
                
                interval = seconds / 3600;
                if (interval > 1) return Math.floor(interval) + ` {{ _("hours ago") }}`;
                
                interval = seconds / 60;
                if (interval > 1) return Math.floor(interval) + ` {{ _("minutes ago") }}`;
                
                if (seconds < 5) return `{{ _("Just now") }}`;

                return Math.floor(seconds) + ` {{ _("seconds ago") }}`;
            }

        async function fetchActiveSessions() {
            const sessionsBody = document.getElementById('active-sessions-body');
            sessionsBody.innerHTML = `<tr><td colspan="4" class="admin-empty"><i class="fas fa-spinner fa-spin"></i> &nbsp; {{ _("Loading...") }}</td></tr>`;
            
            try {
                const response = await fetch(`${API_PREFIX}api/admin/active_sessions`, {headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken  
                }});
                if (!response.ok) throw new Error('Failed to fetch sessions');
                const sessions = await response.json();

                sessionsBody.innerHTML = '';
                if (sessions.length === 0) {
                    sessionsBody.innerHTML = `<tr><td colspan="4" class="admin-empty"><i class="fas fa-user-slash"></i> &nbsp; {{ _("No active sessions found.") }}</td></tr>`;
                    return;
                }

                sessions.forEach(session => {
                    const row = document.createElement('tr');
                    const rawTs = session.LastActivity ? session.LastActivity + 'Z' : null;
                    row.innerHTML = `
                        <td>${escapeHtml(session.Username)}</td>
                        <td><span class="admin-mono">${escapeHtml(String(session.Userid))}</span></td>
                        <td>${escapeHtml(session.IPAddress)}</td>
                        <td title="${escapeHtml(rawTs || '')}">${rawTs ? timeAgo(rawTs) : ''}</td>
                    `;
                    sessionsBody.appendChild(row);
                });
            } catch (error) {
                console.error("Error fetching active sessions:", error);
                sessionsBody.innerHTML = `<tr><td colspan="4" class="admin-empty" style="color:var(--a-danger)"><i class="fas fa-circle-exclamation"></i> &nbsp; {{ _("Could not load sessions.") }}</td></tr>`;
            }
        }

        document.addEventListener('DOMContentLoaded', fetchActiveSessions);
        setInterval(fetchActiveSessions, 30000); 
    </script>
