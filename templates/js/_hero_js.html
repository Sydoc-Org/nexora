    <script nonce="{{ csp_nonce() }}">
        function showContentImmediately() {
            const preloader = document.getElementById('preloader');
            const headerLogo = document.getElementById('header-logo-wrapper');
            const siginin = document.getElementById('signin');
            const mainContent = document.getElementById('main-content-wrapper');
            if (preloader) preloader.style.display = 'none';
            if (headerLogo) headerLogo.style.opacity = '1';
            if (siginin) siginin.style.opacity = '1';
            if (mainContent) mainContent.style.opacity = '1';
        }

        function runPreloaderAnimation() {
            const preloader = document.getElementById('preloader');
            const preloaderLogo = document.getElementById('preloader-logo');
            const headerLogo = document.getElementById('header-logo-wrapper');
            const siginin = document.getElementById('signin');
            const mainContent = document.getElementById('main-content-wrapper');

            if (!preloader || !preloaderLogo || !headerLogo || !siginin || !mainContent) {
                console.error('Preloader elements not found!');
                showContentImmediately();
                return;
            }

            const preloaderTitle = preloader.querySelector('.nexora-title');
            const preloadersubTitle = preloader.querySelector('.nexora-subtitle');

            setTimeout(() => {
                const endRect = headerLogo.getBoundingClientRect();
                const startRect = preloaderLogo.getBoundingClientRect();

                const deltaX = endRect.left - startRect.left;
                const deltaY = endRect.top - startRect.top;

                preloaderLogo.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(1)`;

                preloader.style.backgroundColor = 'transparent';
                if (preloaderTitle) preloaderTitle.style.opacity = '0';
                if (preloadersubTitle) preloadersubTitle.style.opacity = '0';
                setTimeout(() => {
                    headerLogo.style.opacity = '1';
                    siginin.style.opacity = '1';
                    mainContent.style.opacity = '1';
                }, 900);

                setTimeout(() => {
                    preloader.style.display = 'none';
                }, 1000);

            }, 1000);
        }

        // Guaranteed fallback: if load event never fires (bfcache, blocked resource, etc.)
        // the preloader will be hidden after 4 seconds no matter what
        const preloaderFallback = setTimeout(showContentImmediately, 4000);

        window.addEventListener('load', () => {
            clearTimeout(preloaderFallback);
            runPreloaderAnimation();
        });

        // Handle back-forward cache restores — load event does not re-fire on bfcache
        window.addEventListener('pageshow', (e) => {
            if (e.persisted) {
                clearTimeout(preloaderFallback);
                showContentImmediately();
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const progressLine = document.getElementById('progress-line');
            const statusText = document.getElementById('status-text');
            const stepElements = document.querySelectorAll('.process-step');

            const steps = [
                { text: 'Importing Document...', progress: '0%' },
                { text: 'Extracting Key Data...', progress: '33%' },
                { text: 'Validating Information...', progress: '66%' },
                { text: 'Delivering Securely', progress: '100%' }
            ];

            const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

            const updateStatusText = async (newText) => {
                statusText.style.opacity = '0';
                await wait(400);
                statusText.textContent = newText;
                statusText.style.opacity = '1';
            };

            const resetAnimation = async () => {
                statusText.style.opacity = '0';
                await wait(400);

                progressLine.style.width = '0%';

                stepElements.forEach(stepEl => {
                    const iconWrapper = stepEl.querySelector('.step-icon-wrapper');
                    const icon = stepEl.querySelector('i');
                    const label = stepEl.querySelector('p');

                    iconWrapper.classList.remove('active', 'completed');
                    iconWrapper.style.transform = 'scale(1)';
                    label.classList.remove('active', 'completed');
                    icon.className = `fas ${icon.dataset.originalIcon} text-2xl text-gray-400 dark:text-slate-500`;
                });

                await wait(500);
                statusText.textContent = {{ _("Waiting for new document...") | tojson }};
                statusText.style.opacity = '1';
            };

            const runAnimation = async () => {
                await updateStatusText(steps[0].text);

                const firstStep = stepElements[0];
                firstStep.querySelector('.step-icon-wrapper').classList.add('active');
                firstStep.querySelector('p').classList.add('active');

                await wait(2000);

                for (let i = 1; i < steps.length; i++) {
                    const prevStep = stepElements[i - 1];
                    const currentStep = stepElements[i];

                    progressLine.style.width = steps[i].progress;
                    await wait(800);

                    await updateStatusText(steps[i].text);

                    prevStep.querySelector('.step-icon-wrapper').classList.remove('active');
                    prevStep.querySelector('.step-icon-wrapper').classList.add('completed');
                    prevStep.querySelector('p').classList.remove('active');
                    prevStep.querySelector('p').classList.add('completed');
                    prevStep.querySelector('i').className = 'fas fa-check text-2xl';

                    currentStep.querySelector('.step-icon-wrapper').classList.add('active');
                    currentStep.querySelector('p').classList.add('active');

                    await wait(2000);
                }

                await updateStatusText({{ _("Process Complete!") | tojson }});
                const lastStep = stepElements[steps.length - 1];
                lastStep.querySelector('.step-icon-wrapper').classList.remove('active');
                lastStep.querySelector('.step-icon-wrapper').classList.add('completed');
                lastStep.querySelector('i').className = 'fas fa-check text-2xl';

                await wait(4000);
                await resetAnimation();
                await wait(1000);
                runAnimation();
            };

            if (document.getElementById('animation-container')) {
                 document.fonts.ready.then(() => {
                    runAnimation();
                });
            }

            // Theme toggle (sun/moon). Shares localStorage keys with
            // _header.html's prefs system (nexora-ui-prefs primary,
            // legacy nexora-theme fallback) so a choice made here already
            // carries over once the user logs in, even though only this
            // page has a toggle switch for now (issue: dark mode rollout,
            // landing page first).
            var themeToggle = document.getElementById('theme-toggle');
            if (themeToggle) {
                var syncPressed = function () {
                    themeToggle.setAttribute('aria-pressed', document.documentElement.classList.contains('dark') ? 'true' : 'false');
                };
                syncPressed();
                themeToggle.addEventListener('click', function () {
                    var root = document.documentElement;
                    var dark = !root.classList.contains('dark');
                    root.classList.toggle('dark', dark);
                    syncPressed();
                    try {
                        var stored = {};
                        try { stored = JSON.parse(localStorage.getItem('nexora-ui-prefs')) || {}; } catch (e) {}
                        stored.theme = dark ? 'dark' : 'light';
                        localStorage.setItem('nexora-ui-prefs', JSON.stringify(stored));
                        localStorage.setItem('nexora-theme', dark ? 'dark' : 'light');
                    } catch (e) {}
                });
            }
        });
        </script>
