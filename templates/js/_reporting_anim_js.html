<script nonce="{{ csp_nonce() }}">
/* Reporting page animation layer (Motion — motion.dev).
 *
 * Purely additive polish for the BI builder: entrance, result-row reveal,
 * view-switch fades, spring-in modals, button micro-interactions, field-list
 * stagger. It observes the DOM that js/_reporting_js.html already produces and
 * never reads or mutates reporting state, so the builder works identically with
 * this file removed.
 *
 * Degrades safely: if the user prefers reduced motion, or the Motion CDN script
 * is unavailable, it reveals all content and does nothing else. */
(function () {
  var rootEl = document.documentElement;
  function reveal() { rootEl.classList.remove('rp-anim'); }

  var prefersReduced = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var M = window.Motion;

  // No Motion (CDN blocked) or reduced-motion preference: show everything.
  if (!M || prefersReduced) { reveal(); return; }

  var animate = M.animate, stagger = M.stagger, hover = M.hover, press = M.press;
  var EASE = [0.22, 1, 0.36, 1]; // soft ease-out

  function $(sel, ctx) { return (ctx || document).querySelector(sel); }
  function all(sel, ctx) {
    return Array.prototype.slice.call((ctx || document).querySelectorAll(sel));
  }

  // --- 1. Entrance: the three columns rise + fade in, lightly staggered. ----
  // Motion writes inline opacity (which beats the .rp-anim opacity:0 rule), so
  // there is no flash; we drop the class once the entrance finishes (or after a
  // failsafe timeout) purely as cleanup.
  try {
    var columns = [
      $('.reporting-fields'), $('.reporting-results'), $('.reporting-wells')
    ].filter(Boolean);
    if (columns.length) {
      var entrance = animate(columns, { opacity: 1, y: [14, 0] },
        { duration: 0.5, delay: stagger(0.08), ease: EASE });
      if (entrance && entrance.finished && entrance.finished.then) {
        entrance.finished.then(reveal, reveal);
      }
    } else {
      reveal();
    }
  } catch (e) { reveal(); }
  setTimeout(reveal, 2500); // ultimate failsafe

  // --- 2. Result rows stream in after Run (the data "arrives"). -------------
  var resultsWrap = $('#rpResults');
  if (resultsWrap) {
    new MutationObserver(function (muts) {
      muts.forEach(function (m) {
        Array.prototype.forEach.call(m.addedNodes, function (node) {
          if (node.nodeType !== 1) return;
          if (node.tagName === 'TABLE') {
            var rows = all('tbody tr', node);
            if (!rows.length) return;
            // Cap the staggered set so a 5k-row grid stays snappy; the rest are
            // already visible (no inline opacity applied to them).
            var head = rows.slice(0, 40);
            animate(head, { opacity: [0, 1], y: [6, 0] },
              { duration: 0.28, delay: stagger(0.012), ease: EASE });
          } else if (node.classList && (
                     node.classList.contains('reporting-empty') ||
                     node.classList.contains('reporting-error'))) {
            animate(node, { opacity: [0, 1], y: [4, 0] },
              { duration: 0.25, ease: EASE });
          }
        });
      });
    }).observe(resultsWrap, { childList: true });
  }

  // --- 3. Chart / Pivot containers fade in when switched to. ---------------
  ['#rpChart', '#rpPivot'].forEach(function (sel) {
    var el = $(sel);
    if (!el) return;
    new MutationObserver(function () {
      if (!el.hidden) {
        animate(el, { opacity: [0, 1], y: [10, 0] }, { duration: 0.32, ease: EASE });
      }
    }).observe(el, { attributes: true, attributeFilter: ['hidden'] });
  });

  // --- 4. Modals spring in (backdrop fades, dialog scales up). -------------
  all('.reporting-modal').forEach(function (modal) {
    var box = $('.reporting-modal-box', modal);
    new MutationObserver(function () {
      if (modal.hidden || !box) return;
      animate(modal, { opacity: [0, 1] }, { duration: 0.18, ease: 'linear' });
      animate(box, { opacity: [0, 1], scale: [0.92, 1], y: [12, 0] },
        { type: 'spring', stiffness: 420, damping: 30 });
    }).observe(modal, { attributes: true, attributeFilter: ['hidden'] });
  });

  // --- 5. Button + toggle micro-interactions (hover lift, press settle). ----
  all('.reporting-btn, .reporting-mode-toggle button, .reporting-view-toggle button')
    .forEach(function (el) {
      hover(el, function () {
        animate(el, { scale: 1.04 }, { duration: 0.16, ease: EASE });
        return function () { animate(el, { scale: 1 }, { duration: 0.2, ease: EASE }); };
      });
      press(el, function () {
        animate(el, { scale: 0.96 }, { duration: 0.1, ease: EASE });
        return function () { animate(el, { scale: 1 }, { duration: 0.18, ease: EASE }); };
      });
    });

  // --- 6. Field-list items ease in on (re)population. ----------------------
  // Skip while a search filter is active so typing stays instant; animate on
  // initial load and when the search box is cleared.
  var fieldList = $('#rpFieldList');
  if (fieldList) {
    new MutationObserver(function () {
      var search = $('#rpFieldSearch');
      if (search && search.value) return;
      var items = all('li', fieldList);
      if (!items.length) return;
      animate(items, { opacity: [0, 1], x: [-6, 0] },
        { duration: 0.22, delay: stagger(0.015), ease: EASE });
    }).observe(fieldList, { childList: true });
  }
}());
</script>
