<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <script>
        const API_PREFIX = window.location.href.includes("nexora") ? "/nexora/" : "/";
        let animationTimeouts = [];
        let mentionableUsers = [];

        function cancelAllAnimations() {
            animationTimeouts.forEach(clearTimeout);
            animationTimeouts = [];

            const allRows = document.querySelectorAll('#workitemsTable tbody tr.workitem-row');
            allRows.forEach(row => {
                row.classList.remove('opacity-0');
                row.style.transform = '';
            });
        }

        function logAction(actionType, resourceId, details, status, IsInternalError) {
            fetch(`${API_PREFIX}log_action`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    action_type: actionType,
                    resource_id: resourceId,
                    details: details,
                    status: status,
                    IsInternalError: IsInternalError
                }),
            }).catch((err) => console.error("Logging failed:", err));
        }

        function closeAllDetails() {
            document.querySelectorAll("[id^='details-row-']").forEach((detailsRow) => {
                detailsRow.classList.remove('open');
                detailsRow.setAttribute('hidden', true);
            });

            document.querySelectorAll(".indicator").forEach((chevron) => {
                chevron.classList.remove('open');
                chevron.classList.remove('glyphicon-chevron-down-custom');
                chevron.classList.add('glyphicon-chevron-up-custom');
            });
        }

        function exportToCSV() {
            try {
                let csv = [];
                const table = document.getElementById("workitemsTable");
                const rows = table.querySelectorAll(
                    'tr:not([style*="display: none"]):not(.details-row)'
                );

                const headers = Array.from(rows[0].cells)
                    .slice(0, -1)
                    .map((cell) => cell.textContent.trim());
                csv.push(headers.join(";"));

                for (let i = 1; i < rows.length; i++) {
                    const row = Array.from(rows[i].cells)
                        .slice(0, -1)
                        .map((cell) => {
                            let text = cell.textContent.trim();
                            if (/[;\n"]/.test(text)) {
                                text = `"${text.replace(/"/g, '""')}"`;
                            }
                            return text;
                        });
                    csv.push(row.join(";"));
                }

                const csvString = csv.join("\n");
                const blob = new Blob([csvString], { type: "text/csv" });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `workitems_${new Date().toISOString().split("T")[0]}.csv`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);

                logAction("exportWorkitemsCSV", 'workitemOverview', JSON.stringify({
                    searchInput: getCurrentFilterOrSearch().search || "none",
                    filteredFor: getCurrentFilterOrSearch().status || "All",
                }), "SUCCESS", 0);
            }
            catch (err) {
                logAction("exportWorkitemsCSV", 'workitemOverview', JSON.stringify({
                    error: err,
                    searchInput: getCurrentFilterOrSearch().search || "none",
                    filteredFor: getCurrentFilterOrSearch().status || "All",
                }), "FAILURE", 1);
            }
        }

        function getCurrentFilterOrSearch() {
            const statusFilter = document.getElementById("statusFilter");
            const searchInput = document.getElementById("searchInput");
            return {
                status: statusFilter.value,
                search: searchInput.value,
            };
        }

        async function loadHistory(workitemId) {
            const historyContainer = document.getElementById(`history-container-${workitemId}`);
            if (!historyContainer) {
                console.error(`History container not found for workitem ID: ${workitemId}`);
                return;
            }

            if (historyContainer.dataset.loaded === 'true') {
                return;
            }

            try {
                const response = await fetch(`${API_PREFIX}api/get_audithistory/${workitemId}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                const historyData = await response.json();

                historyContainer.innerHTML = '';

                if (historyData.length === 0) {
                    historyContainer.innerHTML = `<p class="text-gray-500">{{ _("No history available for this item") }}</p>`;
                } else {
                    const timeline = document.createElement('div');
                    timeline.className = 'border-l-2 border-indigo-200 ml-2';

                    historyData.forEach(item => {
                        const eventElement = document.createElement('div');
                        eventElement.className = 'relative mb-4 pl-6';

                        const dot = document.createElement('div');
                        dot.className = 'absolute -left-[7px] top-1 h-3 w-3 rounded-full bg-indigo-500';
                        eventElement.appendChild(dot);

                        const eventText = document.createElement('p');
                        eventText.className = 'text-sm text-gray-800';
                        eventText.innerHTML = `<strong class="font-semibold">${item.Step}:</strong> ${item.Activity}`;
                        eventElement.appendChild(eventText);

                        const detailsText = document.createElement('p');
                        detailsText.className = 'text-xs text-gray-500 mt-1';
                        const eventDate = new Date(item.DateTime);
                        const formattedDate = eventDate.toLocaleString(undefined, {
                            year: 'numeric', month: '2-digit', day: '2-digit',
                            hour: '2-digit', minute: '2-digit'
                        });
                        detailsText.textContent = formattedDate;
                        eventElement.appendChild(detailsText);

                        timeline.appendChild(eventElement);
                    });
                    historyContainer.appendChild(timeline);
                }

                historyContainer.dataset.loaded = 'true';

            } catch (error) {
                console.error('Failed to load history:', error);
                historyContainer.innerHTML = `<p class="text-red-500">{{ _("Could not load history") }}</p>`;
            }
        }
function renderTagsInDetails(workitemId, barcode, tags) {
    const container = document.getElementById(`tags-container-${workitemId}`);
    if (!container) return;
    container.innerHTML = tags.map(tag => `
        <span class="flex items-center text-sm font-semibold px-3 py-1 rounded-full" style="background-color:${tag.color}20; color:${tag.color};">
            ${tag.name}
            <button class="remove-tag-btn ml-2 text-xs" data-tag-id="${tag.id}" data-barcode="${barcode}">
                <i class="fas fa-times-circle opacity-50 hover:opacity-100"></i>
            </button>
        </span>
    `).join('');
}


async function refreshWorkitemUI(barcode, workitemId) {
    try {
        const response = await fetch(`${API_PREFIX}api/workitem/${barcode}`);
        if (!response.ok) throw new Error('Failed to fetch updated workitem data.');
        
        const workitem = await response.json();
        const tags = workitem.tags || [];

        const previewContainer = document.getElementById(`tags-preview-${barcode}`);
        if (previewContainer) {
            previewContainer.innerHTML = tags.map(tag => 
                `<span class="text-xs font-semibold px-2 py-0.5 rounded-full" style="background-color:${tag.color}20; color:${tag.color};">${tag.name}</span>`
            ).join('');
        }
        
        const detailsContainer = document.getElementById(`tags-container-${workitemId}`);
        if (detailsContainer) {
            renderTagsInDetails(workitemId, barcode, tags); 
        }

    } catch (error) {
        console.error("Failed to refresh workitem UI:", error);
    }
}

        async function loadCollaborationData(workitemId, barcode) {
            const commentsContainer = document.getElementById(`comments-container-${workitemId}`);
            const prioritySelector = document.getElementById(`priority-select-${workitemId}`);
            const assignSelector = document.getElementById(`assign-select-${workitemId}`);
            const tagsContainer = document.getElementById(`tags-container-${workitemId}`);
            mentionableUsers.forEach(user =>
                {
                    let option = document.createElement('option');
                    option.text = user.fullname
                    option.value = user.userID
                    assignSelector.add(option)
                }
            )
            if (!commentsContainer || commentsContainer.dataset.loaded === 'true') return;
            try {
                const response = await fetch(`${API_PREFIX}api/workitem/${barcode}/interactions`);
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                const data = await response.json();
                prioritySelector.value = data.priority;
                assignSelector.value = data.assigneduserid;
                renderTagsInDetails(workitemId, barcode, data.tags)
                commentsContainer.innerHTML = '';
                if (data.comments.length === 0) {
                    commentsContainer.innerHTML = `<p class="text-gray-500 text-sm p-2">{{ _("No comments yet.") }}</p>`;
                } else {
                    data.comments.forEach(comment => {
                        const commentEl = document.createElement('div');
                        commentEl.className = 'flex items-start gap-2.5';
                        const commentDate = new Date(comment.Timestamp).toLocaleString();
                        commentEl.innerHTML = `
                            <img class="w-8 h-8 rounded-full" src="/static/images/${comment.userID}-Icon.png" onerror="this.src='/static/images/default-icon.png'" alt="${comment.username} avatar">
                            <div class="flex flex-col w-full max-w-[320px] leading-1.5 p-3 border-gray-200 bg-gray-100 rounded-e-xl rounded-es-xl">
                                <div class="flex items-center space-x-2 rtl:space-x-reverse">
                                    <span class="text-sm font-semibold text-gray-900">${comment.username}</span>
                                    <span class="text-sm font-normal text-gray-500">${commentDate}</span>
                                </div>
                                <p class="text-sm font-normal py-2 text-gray-900">${comment.CommentText.replace(/@(\w+)/g, '<strong class="text-indigo-600">@$1</strong>')}</p>
                            </div>`;
                        commentsContainer.appendChild(commentEl);
                    });
                }
                commentsContainer.dataset.loaded = 'true';
            } catch (error) {
                console.error('Failed to load collaboration data:', error);
                commentsContainer.innerHTML = `<p class="text-red-500">{{ _("Could not load comments.") }}</p>`;
            }
        }

        function renderWorkitemTimeline(container) {
            if (!container || container.dataset.rendered === 'true') return;

            const currentStage = container.dataset.currentStage;
            const status = container.dataset.status;
            const progressLine = container.querySelector('.progress-line');
            const stepElements = container.querySelectorAll('.process-step');
            
            const stages = ['Import', 'Extraction', 'Validation', 'Delivery'];
            const stageIndex = stages.indexOf(currentStage);
            const scaleFactors = { 0: 0, 1: 0.3334, 2: 0.6667, 3: 1 };

            const progressValues = { 0: '0%', 1: '33%', 2: '66%', 3: '100%' };

            stepElements.forEach(step => {
                step.querySelector('.step-icon-wrapper').classList.remove('active', 'completed');
                step.querySelector('.step-label').classList.remove('active', 'completed');
            });

            if (status === 'Done') {
                 stepElements.forEach(step => {
                    step.querySelector('.step-icon-wrapper').classList.add('completed');
                    step.querySelector('.step-label').classList.add('completed');
                });
                progressLine.style.transform = `scaleX(1)`;
            } else if (stageIndex !== -1) {
                for (let i = 0; i < stageIndex; i++) {
                    stepElements[i].querySelector('.step-icon-wrapper').classList.add('completed');
                    stepElements[i].querySelector('.step-label').classList.add('completed');
                }
                stepElements[stageIndex].querySelector('.step-icon-wrapper').classList.add('active');
                stepElements[stageIndex].querySelector('.step-label').classList.add('active');
                progressLine.style.transform = `scaleX(${scaleFactors[stageIndex]})`;
            } else {
                progressLine.style.transform = `scaleX(0)`;
            }

            container.dataset.rendered = 'true';
        }

        async function toggleDetailsAndLoadImages(event) {
            try {
                const button = event.currentTarget;
                const workitemid = button.dataset.workitemid;
                const barcode = button.dataset.barcode;
                const detailsRow = document.getElementById(`details-row-${workitemid}`);
                const chevron = button.querySelector('.indicator');
                const timelineContainer = detailsRow.querySelector('[id^="timeline-container-"]');
                renderWorkitemTimeline(timelineContainer);

                if (!detailsRow) {
                    console.error('Could not find detail elements for workitem:', workitemid);
                    return;
                }

                const isOpening = detailsRow.hasAttribute('hidden');

                if (isOpening) {
                    detailsRow.removeAttribute('hidden');
                    setTimeout(() => {
                        detailsRow.classList.add('open');
                        chevron.classList.add('open');
                    }, 10);
                } else {
                    detailsRow.classList.remove('open');
                    chevron.classList.remove('open');
                    detailsRow.addEventListener('transitionend', () => {
                        detailsRow.hidden = true;
                    }, { once: true });
                }
                chevron.classList.toggle('glyphicon-chevron-up-custom');
                chevron.classList.toggle('glyphicon-chevron-down-custom');

                if (!isOpening) {
                    return; 
                }


                const commentsContainer = document.getElementById(`comments-container-${workitemid}`);
                if (commentsContainer && commentsContainer.dataset.loaded !== 'true') {
                    loadCollaborationData(workitemid, barcode);
                }

                const imageContainer = document.getElementById(`image-container-${workitemid}`);
                if (imageContainer) {
                    const isLoaded = imageContainer.dataset.loaded === 'true';
                    if (isLoaded) {
                        return; 
                    }

                    imageContainer.innerHTML = `<p class="text-gray-500 animate-pulse">{{ _("Checking for media...") }}</p>`;
                    try {
                        loadHistory(workitemid);
                        const infoResponse = await fetch(`${API_PREFIX}api/get_media_info/${workitemid}`);
                        if (!infoResponse.ok) throw new Error('Could not fetch media information.');
                        
                        const mediaInfo = await infoResponse.json();
                        const imageCount = mediaInfo.media_count;
                        const fields = mediaInfo.fields || {};
                        const fieldsContainer = document.getElementById(`fields-container-${workitemid}`);
                        if (fieldsContainer) {
                            if (Object.keys(fields).length > 0) {
                                const fieldLabels = {
                                    DocDate: '{{ _("Document Date") }}', DocType: '{{ _("Document Type") }}',
                                    OwnerNr: '{{ _("Owner No.") }}', OwnerName: '{{ _("Owner Name") }}',
                                    PropertyNr: '{{ _("Property No.") }}', PropertyName: '{{ _("Property Name") }}',
                                    TenantNr: '{{ _("Tenant No.") }}', TenantName: '{{ _("Tenant Name") }}',
                                    BroadcastNr: '{{ _("Broadcast No.") }}', Branch: '{{ _("Branch") }}',
                                    CrdName: '{{ _("Creditor Name") }}', DocNo: '{{ _("Document No.") }}',
                                    CrdNo: '{{ _("Creditor No.") }}', GrossAmount: '{{ _("Gross Amount") }}',
                                    NetAmount: '{{ _("Net Amount") }}', VatAmount: '{{ _("VAT Amount") }}'
                                };
                                let fieldsHtml = '<dl class="divide-y divide-gray-200">';
                                for (const key in fields) {
                                    if (Object.hasOwnProperty.call(fields, key) && fields[key]) {
                                        const label = fieldLabels[key] || key;
                                        fieldsHtml += `
                                            <div class="py-2 flex justify-between items-center gap-4">
                                                <dt class="text-gray-500 truncate">${label}</dt>
                                                <dd class="font-semibold text-gray-900 text-right">${fields[key]}</dd>
                                            </div>`;
                                    }
                                }
                                fieldsHtml += '</dl>';
                                fieldsContainer.innerHTML = fieldsHtml;
                            } else {
                                fieldsContainer.innerHTML = `<p class="text-gray-500 p-2">{{ _("No additional details found.") }}</p>`;
                            }
                        }
                        imageContainer.dataset.loaded = 'true';

                        if (imageCount === 0) {
                            imageContainer.innerHTML = `<p class="text-gray-500">{{ _("No media found for this workitem.") }}</p>`;
                            return;
                        }

                        imageContainer.innerHTML = '';
                        imageContainer.classList.remove('justify-center', 'items-center');
                        imageContainer.classList.add('flex-wrap', 'gap-4', 'justify-start');

                        for (let i = 0; i < imageCount; i++) {
                            loadImage(imageContainer, workitemid, i);
                        }
                        logAction('toggleDetails', 'workitemOverview', null, 'SUCCESS', 0);
                    } catch (error) {
                        console.error('Error loading media info:', error);
                        logAction('toggleDetails', 'workitemOverview', error, "FAILURE", 1);
                        imageContainer.innerHTML = `<p class="text-red-500">{{ _("Could not load media.") }}</p>`;
                        imageContainer.dataset.loaded = 'true';
                    }
                } else {
                    logAction('toggleDetails', 'workitemOverview', { access: 'restricted' }, 'SUCCESS', 0)
                }
            }
            catch (error) {
                logAction('toggleDetails', 'workitemOverview', error, "FAILURE", 1)
            }
        }

        async function loadImage(container, workitemid, index) {
            const placeholder = document.createElement('div');
            placeholder.className = 'flex justify-center items-center w-40 h-40 bg-gray-200 rounded animate-pulse';
            container.appendChild(placeholder);

            try {
                const apiUrl = `${API_PREFIX}api/get_media_raw/${workitemid}/${index}`;
                const response = await fetch(apiUrl);

                if (!response.ok) {
                    throw new Error(`Status ${response.status}`);
                }

                const imageBlob = await response.blob();
                const imageUrl = URL.createObjectURL(imageBlob);

                const imgElement = document.createElement('img');
                imgElement.src = imageUrl;
                imgElement.alt = `{{ _("Media") }} ${index + 1} {{ _("for workitem ") }}${workitemid}`;
                imgElement.className = 'w-40 h-40 object-cover rounded shadow-lg workitem-image cursor-pointer';

                imgElement.onload = () => {
                    placeholder.replaceWith(imgElement);
                };

                imgElement.onerror = () => {
                    URL.revokeObjectURL(imageUrl);
                    throw new Error('Image could not be loaded into element.');
                }


            } catch (error) {
                console.error(`Error loading image index ${index}:`, error);
                placeholder.innerHTML = `<div class="text-center text-xs text-red-600 p-2">{{ _("Failed to load image ") }}${index + 1}</div>`;
                placeholder.classList.remove('animate-pulse', 'bg-gray-200');
                placeholder.classList.add('bg-red-100', 'border', 'border-red-400');
            }
        }

    async function handlePostComment(event) {
        event.preventDefault();
        const form = event.target;
        const barcode = form.dataset.barcode;
        const workitemid = form.closest('.details-row').id.split('-')[2];
        const textarea = form.querySelector('textarea');
        const commentText = textarea.value.trim();
        if (!commentText) return;

        try {
            const response = await fetch(`${API_PREFIX}api/workitem/${barcode}/comment`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ commentText })
            });
            if (!response.ok) throw new Error('Failed to post comment.');
            
            textarea.value = '';
            const commentsContainer = document.getElementById(`comments-container-${workitemid}`);
            commentsContainer.dataset.loaded = 'false'; 
            loadCollaborationData(workitemid, barcode);

        } catch(error) {
            console.error("Comment post error:", error);
        }
    }
    
    async function fetchMentionableUsers() {
            try {
                const response = await fetch(`${API_PREFIX}api/users`);
                if (!response.ok) throw new Error('Could not fetch users');
                mentionableUsers = await response.json();
            } catch (error) {
                console.error("Failed to fetch users for mentions:", error);
            }
        }
        
        function insertMention(username, textarea) {
            const text = textarea.value;
            const cursorPos = textarea.selectionStart;
            const textToCursor = text.substring(0, cursorPos);
            const mentionMatch = textToCursor.match(/@(\w*)$/);
            if (mentionMatch) {
                const startIndex = mentionMatch.index;
                const newText = text.substring(0, startIndex) + `@${username} ` + text.substring(cursorPos);
                textarea.value = newText;
                textarea.focus();
                const newCursorPos = startIndex + username.length + 2;
                textarea.setSelectionRange(newCursorPos, newCursorPos);
            }
        }
        
        function renderAutocompleteList(users, listElement, textarea) {
            listElement.innerHTML = '';
            if (users.length === 0) {
                listElement.classList.add('hidden');
                return;
            }
            users.forEach(user => {
                const item = document.createElement('div');
                item.className = 'p-2 hover:bg-indigo-100 cursor-pointer text-sm border-b';
                item.textContent = `${user.fullname} (@${user.username})`;
                item.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    insertMention(user.username, textarea);
                    listElement.classList.add('hidden');
                });
                listElement.appendChild(item);
            });
            listElement.classList.remove('hidden');
        }

        function handleMentionInput(event) {
            const textarea = event.target;
            const wrapper = textarea.closest('[id^="comment-form-wrapper-"]');
            const autocompleteList = wrapper.querySelector('.mention-autocomplete-list');
            const text = textarea.value;
            const cursorPos = textarea.selectionStart;
            const textToCursor = text.substring(0, cursorPos);
            const mentionMatch = textToCursor.match(/@(\w*)$/);
            if (mentionMatch) {
                const searchTerm = mentionMatch[1].toLowerCase();
                const filteredUsers = mentionableUsers.filter(user => user.username.toLowerCase().startsWith(searchTerm));
                renderAutocompleteList(filteredUsers, autocompleteList, textarea);
            } else {
                autocompleteList.classList.add('hidden');
            }
        }

        async function handleSetPriority(event) {
            const selector = event.target;
            const barcode = selector.dataset.barcode;
            const priority = parseInt(selector.value, 10);
            try {
                const response = await fetch(`${API_PREFIX}api/workitem/${barcode}/priority`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ priority })
                });
                if (!response.ok) throw new Error('Failed to set priority.');
                const indicatorCell = document.getElementById(`priority-indicator-${barcode}`);
                let iconHtml = '';
                if (priority === 3) iconHtml = `<span title="{{ _('High Priority') }}"><i class="fas fa-flag text-red-500"></i></span>`;
                else if (priority === 2) iconHtml = `<span title="{{ _('Medium Priority') }}"><i class="fas fa-flag text-yellow-500"></i></span>`;
                else if (priority === 1) iconHtml = `<span title="{{ _('Low Priority') }}"><i class="fas fa-flag text-blue-500"></i></span>`;
                indicatorCell.innerHTML = iconHtml;
            } catch (error) {
                console.error("Set priority error:", error);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchMentionableUsers(); 
            fetchAllTags(); 

            const importBtn = document.getElementById('importBtn');
            const importFileInput = document.getElementById('importFile');

            if (importBtn && importFileInput) {
                importBtn.addEventListener('click', () => {
                    importFileInput.click(); 
                });

                importFileInput.addEventListener('change', () => {
                    if (importFileInput.files.length > 0) {
                        const file = importFileInput.files[0];
                        const formData = new FormData();
                        formData.append('importFile', file);

                        importBtn.disabled = true;
                        importBtn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i>{{ _("Importing...") }}`;

                        fetch(`${API_PREFIX}import_workitems`, {
                            method: 'POST',
                            body: formData,
                        })
                        .then(response => {
                            if (response.redirected) {
                                window.location.href = response.url;
                            } else {
                                console.error('Import failed. The server did not redirect.');
                                importBtn.disabled = false;
                                importBtn.innerHTML = `<i class="fas fa-upload mr-2"></i>{{ _("Import") }}`;
                            }
                        })
                        .catch(error => {
                            console.error('An error occurred during the file import:', error);
                            importBtn.disabled = false;
                            importBtn.innerHTML = `<i class="fas fa-upload mr-2"></i>{{ _("Import") }}`;
                            alert('An unexpected error occurred. Please try again.');
                        });
                    }
                });
            }

            const filterForm = document.getElementById('filterForm');
            async function fetchAndUpdateWorkitems(page = 1) {
                const formData = new FormData(filterForm);
                formData.set('page', page);
                const params = new URLSearchParams(formData);
                const url = `${API_PREFIX}api/workitems?${params.toString()}`;
                const newUrl = `${window.location.pathname}?${params.toString()}`;
                window.history.pushState({ path: newUrl }, '', newUrl);

                try {

let allTags = [];

async function fetchAllTags() {
    try {
        const response = await fetch(`${API_PREFIX}api/tags`);
        if (!response.ok) throw new Error('Could not fetch tags');
        allTags = await response.json();
        
        const datalist = document.getElementById('taglist');
        datalist.innerHTML = '';
        allTags.forEach(tag => {
            const option = document.createElement('option');
            option.value = tag.TagName;
            datalist.appendChild(option);
        });
    } catch (error) {
        console.error("Failed to fetch tags:", error);
    }
}


async function handleAddTag(event) {
    const button = event.currentTarget;
    const barcode = button.dataset.barcode;
    const workitemId = button.dataset.workitemid;
    const tagName = document.getElementById(`tag-input-${workitemId}`).value.trim();
    const tagColor = document.getElementById(`tag-color-${workitemId}`).value;

    if (!tagName) return;

    try {
        const response = await fetch(`${API_PREFIX}api/workitem/${barcode}/tags`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tagName, tagColor })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Failed to add tag.');
        
         document.getElementById(`tag-input-${workitemId}`).value = '';
        refreshWorkitemUI(barcode, workitemId); 

    } catch(error) {
        console.error("Add tag error:", error);
    }
}

async function handleRemoveTag(event) {
    const button = event.currentTarget;
    const barcode = button.dataset.barcode;
    const tagId = button.dataset.tagId;
    const workitemId = button.closest('.details-row').id.split('-')[2];

    try {
        const response = await fetch(`${API_PREFIX}api/workitem/${barcode}/tags/${tagId}`, {
            method: 'DELETE'
        });
        if (!response.ok) throw new Error('Failed to remove tag.');
        
        refreshWorkitemUI(barcode, workitemId);
    } catch(error) {
        console.error("Remove tag error:", error);
    }
}




            function renderPagination(pagination) {
            const { currentPage, totalPages, totalItems, perPage } = pagination;
            document.getElementById('showingCount').textContent = (currentPage - 1) * perPage + (totalItems > 0 ? 1 : 0) + '-' + Math.min(currentPage * perPage, totalItems);
            document.getElementById('totalCount').textContent = totalItems;

            const controlsContainer = document.getElementById('paginationControls');
            if (!controlsContainer) return;
            controlsContainer.innerHTML = '';

            if (totalPages <= 1) return;

            const prevDisabled = currentPage === 1 ? 'opacity-50 cursor-not-allowed bg-gray-100' : 'hover:bg-gray-50';
            const nextDisabled = currentPage === totalPages ? 'opacity-50 cursor-not-allowed bg-gray-100' : 'hover:bg-gray-50';

            const paginationHtml = `
                <a href="#" data-page="${currentPage - 1}" class="pagination-link px-3 py-1 border rounded-lg text-sm transition-colors ${prevDisabled}">
                    <i class="fas fa-chevron-left mr-1"></i> Previous
                </a>
                <span class="text-sm text-gray-600">
                    Page ${currentPage} of ${totalPages}
                </span>
                <a href="#" data-page="${currentPage + 1}" class="pagination-link px-3 py-1 border rounded-lg text-sm transition-colors ${nextDisabled}">
                    Next <i class="fas fa-chevron-right ml-1"></i>
                </a>
            `;
            controlsContainer.innerHTML = paginationHtml;
        }

            let sortState = {
                columnIndex: -1,
                ascending: true
            };

            function sortTable(columnIndex) {
                const table = document.getElementById("workitemsTable");
                const tbody = table.tBodies[0];
                const headers = table.querySelectorAll('.sortable-header');

                if (sortState.columnIndex === columnIndex) {
                    sortState.ascending = !sortState.ascending;
                } else {
                    sortState.columnIndex = columnIndex;
                    sortState.ascending = true;
                }

                const rowsToSort = Array.from(tbody.querySelectorAll(".workitem-row")).map(row => {
                    return {
                        mainRow: row,
                        detailsRow: row.nextElementSibling 
                    };
                });

                rowsToSort.sort((a, b) => {
                    const aCell = a.mainRow.cells[columnIndex];
                    const bCell = b.mainRow.cells[columnIndex];
                    if (!aCell || !bCell) return 0;

                    const aText = aCell.textContent.trim();
                    const bText = bCell.textContent.trim();
                    
                    let comparison = 0;
                    if (columnIndex === 2) {
                        const parseDate = (str) => {
                            const [datePart, timePart] = str.split(' - ');
                            const [day, month, year] = datePart.split('. ');
                            return new Date(`${year}-${month}-${day}T${timePart}:00`);
                        };
                        comparison = parseDate(aText) - parseDate(bText);
                    } else {
                        comparison = aText.localeCompare(bText, undefined, { numeric: true });
                    }

                    return sortState.ascending ? comparison : -comparison;
                });

                tbody.innerHTML = ''; 
                rowsToSort.forEach(pair => {
                    tbody.appendChild(pair.mainRow);
                    if (pair.detailsRow && pair.detailsRow.classList.contains('details-row')) {
                        tbody.appendChild(pair.detailsRow);
                    }
                });

                headers.forEach((header, index) => {
                    const icon = header.querySelector('i');
                    if (icon) {
                        icon.className = 'fas fa-sort text-gray-400 group-hover:text-gray-600 transition-colors';
                        if (index === columnIndex) {
                            icon.classList.remove('fa-sort');
                            icon.classList.add(sortState.ascending ? 'fa-sort-up' : 'fa-sort-down');
                            icon.classList.add('text-indigo-600');
                        }
                    }
                });
            }

            const tableHead = document.querySelector('#workitemsTable thead');
            if (tableHead) {
                tableHead.addEventListener('click', (event) => {
                    const header = event.target.closest('.sortable-header');
                    if (header) {
                        const colIndex = parseInt(header.dataset.columnIndex, 10);
                        sortTable(colIndex);
                    }
                });
            }
            
            filterForm.addEventListener('submit', (e) => {
                e.preventDefault();
                fetchAndUpdateWorkitems();
            });

            ['processFilterWorkitemOverview', 'statusFilter', 'startDate', 'endDate', 'priorityFilter', 'assignedUserFilter'].forEach(id => {                   
                document.getElementById(id).addEventListener('change', () => fetchAndUpdateWorkitems());
            });
            document.getElementById('searchInput').addEventListener('input', () => fetchAndUpdateWorkitems());
            document.getElementById('tagFilterInput').addEventListener('input', () => fetchAndUpdateWorkitems()); 

            document.getElementById('paginationContainer').addEventListener('click', (e) => {
                const link = e.target.closest('.pagination-link');
                if (link) {
                    e.preventDefault();
                    const page = parseInt(link.dataset.page, 10);
                    if (page > 0) { 
                        fetchAndUpdateWorkitems(page);
                    }
                }
            });

            const tbody = document.getElementById('workitemsTbody');
            tbody.addEventListener('click', (event) => {
                const toggleButton = event.target.closest('.details-toggle-button');
                if (toggleButton) {
                    toggleDetailsAndLoadImages({ currentTarget: toggleButton });
                    return; 
                }

                const addTagButton = event.target.closest('.add-tag-btn');
                if (addTagButton) {
                    handleAddTag({ currentTarget: addTagButton });
                }
                const removeTagButton = event.target.closest('.remove-tag-btn');
                if (removeTagButton) {
                    handleRemoveTag({ currentTarget: removeTagButton });
                }
            });
            tbody.addEventListener('submit', (event) => {
                if (event.target.classList.contains('comment-form')) {
                    handlePostComment(event);
                }
            });
            tbody.addEventListener('change', (event) => {
                if (event.target.classList.contains('priority-selector')) {
                    handleSetPriority(event);
                }
            });
            tbody.addEventListener('change', (event) => {
                if (event.target.classList.contains('assign-selector')) {
                    handleAssigning(event);
                }
            });
            tbody.addEventListener('input', (event) => {
                if (event.target.tagName === 'TEXTAREA' && event.target.closest('.comment-form')) {
                    handleMentionInput(event);
                }
            });
            tbody.addEventListener('focusout', (event) => {
                if (event.target.tagName === 'TEXTAREA' && event.target.closest('.comment-form')) {
                    const wrapper = event.target.closest('[id^="comment-form-wrapper-"]');
                    const autocompleteList = wrapper.querySelector('.mention-autocomplete-list');
                    setTimeout(() => autocompleteList.classList.add('hidden'), 200);
                }
            });

            const toggleBtn = document.getElementById('toggleAdvancedFilterBtn');
            const advancedContainer = document.getElementById('advancedFilterContainer');
            if (toggleBtn) {
                toggleBtn.addEventListener('click', () => advancedContainer.classList.toggle('hidden'));
            }

            let currentImages = [];
            let currentIndex = 0;

            const modal = document.getElementById("imageModal");
            const modalImg = document.getElementById("modalImage");
            const closeBtn = document.querySelector(".modal-close");
            const prevBtn = document.querySelector(".modal-prev");
            const nextBtn = document.querySelector(".modal-next");

            function showImage(index) {
                if (index >= 0 && index < currentImages.length) {
                    modalImg.src = currentImages[index];
                    currentIndex = index;
                    prevBtn.style.display = index > 0 ? 'block' : 'none';
                    nextBtn.style.display = index < currentImages.length - 1 ? 'block' : 'none';
                }
            }

            const closeModal = () => {
                modal.style.display = "none";
                currentImages = []; 
                currentIndex = 0;
            };

            document.addEventListener('click', (event) => {
                if (event.target.classList.contains('workitem-image')) {
                    const imageContainer = event.target.closest('[id^="image-container-"]');
                    const allImages = Array.from(imageContainer.querySelectorAll('.workitem-image'));
                    
                    currentImages = allImages.map(img => img.src);
                    const clickedIndex = allImages.findIndex(img => img.src === event.target.src);
                    
                    if (clickedIndex !== -1) {
                        modal.style.display = "flex";
                        showImage(clickedIndex);
                    }
                }
            });

            closeBtn.addEventListener('click', closeModal);
            modal.addEventListener('click', (event) => {
                if (event.target === modal) {
                    closeModal();
                }
            });

            prevBtn.addEventListener('click', (e) => {
                e.stopPropagation(); 
                showImage(currentIndex - 1);
            });

            nextBtn.addEventListener('click', (e) => {
                e.stopPropagation(); 
                showImage(currentIndex + 1);
            });
            
            document.addEventListener('keydown', (event) => {
                if (modal.style.display === "flex") {
                    if (event.key === 'Escape') {
                        closeModal();
                    } else if (event.key === 'ArrowLeft') {
                        event.preventDefault();
                        showImage(currentIndex - 1);
                    } else if (event.key === 'ArrowRight') {
                        event.preventDefault();
                        showImage(currentIndex + 1);
                    }
                }
            });
        });
    </script>
