<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <script>
        const API_PREFIX = window.location.href.includes("sydocportal") ? "/sydocportal/" : "/";
        let animationTimeouts = [];

        function cancelAllAnimations() {
            animationTimeouts.forEach(clearTimeout);
            animationTimeouts = [];

            const allRows = document.querySelectorAll('#workitemsTable tbody tr.workitem-row');
            allRows.forEach(row => {
                row.classList.remove('opacity-0');
                row.style.transform = '';
            });
        }

        function logAction(actionType, resourceId, details, status, IsInternalError) {
            fetch(`${API_PREFIX}log_action`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    action_type: actionType,
                    resource_id: resourceId,
                    details: details,
                    status: status,
                    IsInternalError: IsInternalError
                }),
            }).catch((err) => console.error("Logging failed:", err));
        }

    function applyAllFilters() {
        closeAllDetails();
        cancelAllAnimations();

        const searchTerm = document.getElementById("searchInput").value.toLowerCase();
        const selectedStatus = document.getElementById("statusFilter").value;
        const startDateValue = document.getElementById("startDate").value;
        const endDateValue = document.getElementById("endDate").value;

        const startDate = startDateValue ? new Date(startDateValue) : null;
        const endDate = endDateValue ? new Date(endDateValue) : null;

        if (startDate) startDate.setHours(0, 0, 0, 0);
        if (endDate) endDate.setHours(23, 59, 59, 999);

        const rows = document.querySelectorAll(".workitem-row");
        let visibleCount = 0;

        rows.forEach(row => {
            const text = row.textContent.toLowerCase();
            const rowStatus = row.dataset.status;
            const rowTimestamp = row.dataset.timestamp;
            const rowDate = rowTimestamp ? new Date(rowTimestamp) : null;

            const searchMatch = text.includes(searchTerm);
            const statusMatch = !selectedStatus || rowStatus === selectedStatus;
            
            let dateMatch = true;
            if (rowDate) {
                const isAfterStart = !startDate || rowDate >= startDate;
                const isBeforeEnd = !endDate || rowDate <= endDate;
                dateMatch = isAfterStart && isBeforeEnd;
            } else if (startDate || endDate) {
                dateMatch = false;
            }
            
            if (searchMatch && statusMatch && dateMatch) {
                row.style.display = "";
                visibleCount++;
            } else {
                row.style.display = "none";
            }
        });

        document.getElementById("showingCount").textContent = visibleCount;
    }

    document.getElementById("searchInput").addEventListener("keyup", applyAllFilters);

    document.getElementById("statusFilter").addEventListener("change", function () {
        logAction("filterWorkitems", "workitemOverview", JSON.stringify({ by_status: this.value }), "SUCCESS", 0);
        applyAllFilters();
    });

        function closeAllDetails() {
            document.querySelectorAll("[id^='details-row-']").forEach((detailsRow) => {
                detailsRow.classList.remove('open');
                detailsRow.setAttribute('hidden', true);
            });

            document.querySelectorAll(".indicator").forEach((chevron) => {
                chevron.classList.remove('open');
                chevron.classList.remove('glyphicon-chevron-down-custom');
                chevron.classList.add('glyphicon-chevron-up-custom');
            });
        }

        function sortTable(columnIndex) {
            const table = document.getElementById("workitemsTable");
            const tbody = table.tBodies[0];
            const rows = Array.from(tbody.rows);

            const workitemRows = Array.from(tbody.querySelectorAll(".workitem-row"));

            workitemRows.sort((a, b) => {
                const aValue = a.cells[columnIndex].textContent.trim();
                const bValue = b.cells[columnIndex].textContent.trim();

                if (columnIndex === 0) {
                    return (
                        parseInt(aValue.replace("#", "")) - parseInt(bValue.replace("#", ""))
                    );
                }

                if (columnIndex === 2) {
                    return new Date(aValue) - new Date(bValue);
                }
                return aValue.localeCompare(bValue);
            });

            rows.forEach((row) => tbody.appendChild(row));
        }

        function exportToCSV() {
            try {
                let csv = [];
                const table = document.getElementById("workitemsTable");
                const rows = table.querySelectorAll(
                    'tr:not([style*="display: none"]):not(.details-row)'
                );

                // Add headers
                const headers = Array.from(rows[0].cells)
                    .slice(0, -1)
                    .map((cell) => cell.textContent.trim());
                csv.push(headers.join(";"));

                // Add rows
                for (let i = 1; i < rows.length; i++) {
                    const row = Array.from(rows[i].cells)
                        .slice(0, -1)
                        .map((cell) => {
                            let text = cell.textContent.trim();
                            if (/[;\n"]/.test(text)) {
                                text = `"${text.replace(/"/g, '""')}"`;
                            }
                            return text;
                        });
                    csv.push(row.join(";"));
                }

                // Download CSV
                const csvString = csv.join("\n");
                const blob = new Blob([csvString], { type: "text/csv" });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `workitems_${new Date().toISOString().split("T")[0]}.csv`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);

                logAction("exportWorkitemsCSV", 'workitemOverview', JSON.stringify({
                    searchInput: getCurrentFilterOrSearch().search || "none",
                    filteredFor: getCurrentFilterOrSearch().status || "All",
                }), "SUCCESS", 0);
            }
            catch (err) {
                logAction("exportWorkitemsCSV", 'workitemOverview', JSON.stringify({
                    error: err,
                    searchInput: getCurrentFilterOrSearch().search || "none",
                    filteredFor: getCurrentFilterOrSearch().status || "All",
                }), "FAILURE", 1);
            }
        }

        function getCurrentFilterOrSearch() {
            const statusFilter = document.getElementById("statusFilter");
            const searchInput = document.getElementById("searchInput");
            return {
                status: statusFilter.value,
                search: searchInput.value,
            };
        }

        async function loadHistory(workitemId) {
            const historyContainer = document.getElementById(`history-container-${workitemId}`);
            if (!historyContainer) {
                console.error(`History container not found for workitem ID: ${workitemId}`);
                return;
            }

            if (historyContainer.dataset.loaded === 'true') {
                return;
            }

            try {
                const response = await fetch(`${API_PREFIX}api/get_audithistory/${workitemId}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                const historyData = await response.json();

                historyContainer.innerHTML = '';

                if (historyData.length === 0) {
                    historyContainer.innerHTML = `<p class="text-gray-500">{{ _("No history available for this item") }}</p>`;
                } else {
                    const timeline = document.createElement('div');
                    timeline.className = 'border-l-2 border-indigo-200 ml-2';

                    historyData.forEach(item => {
                        const eventElement = document.createElement('div');
                        eventElement.className = 'relative mb-4 pl-6';

                        const dot = document.createElement('div');
                        dot.className = 'absolute -left-[7px] top-1 h-3 w-3 rounded-full bg-indigo-500';
                        eventElement.appendChild(dot);

                        const eventText = document.createElement('p');
                        eventText.className = 'text-sm text-gray-800';
                        eventText.innerHTML = `<strong class="font-semibold">${item.Step}:</strong> ${item.Activity}`;
                        eventElement.appendChild(eventText);

                        const detailsText = document.createElement('p');
                        detailsText.className = 'text-xs text-gray-500 mt-1';
                        const eventDate = new Date(item.DateTime);
                        const formattedDate = eventDate.toLocaleString(undefined, {
                            year: 'numeric', month: '2-digit', day: '2-digit',
                            hour: '2-digit', minute: '2-digit'
                        });
                        detailsText.textContent = formattedDate;
                        eventElement.appendChild(detailsText);

                        timeline.appendChild(eventElement);
                    });
                    historyContainer.appendChild(timeline);
                }

                historyContainer.dataset.loaded = 'true';

            } catch (error) {
                console.error('Failed to load history:', error);
                historyContainer.innerHTML = `<p class="text-red-500">{{ _("Could not load history") }}</p>`;
            }
        }

        async function loadCollaborationData(workitemId, barcode) {
            const commentsContainer = document.getElementById(`comments-container-${workitemId}`);
            const prioritySelector = document.getElementById(`priority-select-${workitemId}`);
            if (!commentsContainer || commentsContainer.dataset.loaded === 'true') return;

            try {
                const response = await fetch(`${API_PREFIX}api/workitem/${barcode}/interactions`);
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                const data = await response.json();
                
                prioritySelector.value = data.priority;

                commentsContainer.innerHTML = '';
                if (data.comments.length === 0) {
                    commentsContainer.innerHTML = `<p class="text-gray-500 text-sm p-2">{{ _("No comments yet.") }}</p>`;
                } else {
                    data.comments.forEach(comment => {
                        const commentEl = document.createElement('div');
                        commentEl.className = 'flex items-start gap-2.5';
                        const commentDate = new Date(comment.Timestamp + 'Z').toLocaleString();
                        commentEl.innerHTML = `
                            <img class="w-8 h-8 rounded-full" src="/static/images/${comment.userID}-Icon.png" onerror="this.src='/static/images/default-icon.png'" alt="${comment.username} avatar">
                            <div class="flex flex-col w-full max-w-[320px] leading-1.5 p-3 border-gray-200 bg-gray-100 rounded-e-xl rounded-es-xl">
                                <div class="flex items-center space-x-2 rtl:space-x-reverse">
                                    <span class="text-sm font-semibold text-gray-900">${comment.username}</span>
                                    <span class="text-sm font-normal text-gray-500">${commentDate}</span>
                                </div>
                                <p class="text-sm font-normal py-2 text-gray-900">${comment.CommentText.replace(/@(\w+)/g, '<strong class="text-indigo-600">@$1</strong>')}</p>
                            </div>`;
                        commentsContainer.appendChild(commentEl);
                    });
                }
                commentsContainer.dataset.loaded = 'true';
            } catch (error) {
                console.error('Failed to load collaboration data:', error);
                commentsContainer.innerHTML = `<p class="text-red-500">{{ _("Could not load comments.") }}</p>`;
            }
        }

        async function toggleDetailsAndLoadImages(event) {
            try {
                const button = event.currentTarget;
                const workitemid = button.dataset.workitemid;
                const barcode = button.dataset.barcode;
                const detailsRow = document.getElementById(`details-row-${workitemid}`);
                const imageContainer = document.getElementById(`image-container-${workitemid}`);
                const chevron = button.querySelector('.indicator');

                if (!detailsRow || !imageContainer) {
                    console.error('Could not find detail elements for workitem:', workitemid);
                    return;
                }

                const isHidden = detailsRow.hasAttribute('hidden');
                if (isHidden) {
                    detailsRow.removeAttribute('hidden');
                    setTimeout(() => {
                        detailsRow.classList.add('open');
                        chevron.classList.add('open');
                    }, 10);
                } else {
                    detailsRow.classList.remove('open');
                    chevron.classList.remove('open');
                    detailsRow.addEventListener('transitionend', () => {
                        detailsRow.hidden = true;
                    }, { once: true });
                }

                chevron.classList.toggle('glyphicon-chevron-up-custom');
                chevron.classList.toggle('glyphicon-chevron-down-custom');

                if (!isHidden) {
                    return;
                }

                const isLoaded = imageContainer.dataset.loaded === 'true';
                if (isLoaded) {
                    return;
                }

                imageContainer.innerHTML = `<p class="text-gray-500 animate-pulse">{{ _("Checking for media...") }}</p>`;
                try {
                    loadHistory(workitemid);
                    loadCollaborationData(workitemid, barcode);
                    const infoResponse = await fetch(`${API_PREFIX}api/get_media_info/${workitemid}`);
                    if (!infoResponse.ok) {
                        throw new Error('Could not fetch media information.');
                    }
                    const mediaInfo = await infoResponse.json();
                    const imageCount = mediaInfo.media_count;

                    imageContainer.dataset.loaded = 'true';

                    if (imageCount === 0) {
                        imageContainer.innerHTML = `<p class="text-gray-500">{{ _("No media found for this workitem.") }}</p>`;
                        return;
                    }

                    imageContainer.innerHTML = '';
                    imageContainer.classList.remove('justify-center', 'items-center');
                    imageContainer.classList.add('flex-wrap', 'gap-4', 'justify-start');

                    const imagePromises = [];
                    for (let i = 0; i < imageCount; i++) {
                        imagePromises.push(loadImage(imageContainer, workitemid, i));
                    }
                    logAction('toggleDetails', 'workitemOverview', null, 'SUCCESS', 0)
                } catch (error) { 
                    console.error('Error loading media info:', error);
                    logAction('toggleDetails', 'workitemOverview', error, "FAILURE", 1)
                    imageContainer.innerHTML = `<p class="text-red-500">{{ _("Could not load media.") }}</p>`;
                    imageContainer.dataset.loaded = 'true';
                }
            }
            catch (error) {
                logAction('toggleDetails', 'workitemOverview', error, "FAILURE", 1)
            }
        }

        async function loadImage(container, workitemid, index) {
            const placeholder = document.createElement('div');
            placeholder.className = 'flex justify-center items-center w-40 h-40 bg-gray-200 rounded animate-pulse';
            container.appendChild(placeholder);

            try {
                const apiUrl = `${API_PREFIX}api/get_media_raw/${workitemid}/${index}`;
                const response = await fetch(apiUrl);

                if (!response.ok) {
                    throw new Error(`Status ${response.status}`);
                }

                const imageBlob = await response.blob();
                const imageUrl = URL.createObjectURL(imageBlob);

                const imgElement = document.createElement('img');
                imgElement.src = imageUrl;
                imgElement.alt = `{{ _("Media") }} ${index + 1} {{ _("for workitem ") }}${workitemid}`;
                imgElement.className = 'w-40 h-40 object-cover rounded shadow-lg workitem-image cursor-pointer';

                imgElement.onload = () => {
                    placeholder.replaceWith(imgElement);
                };

                imgElement.onerror = () => {
                    URL.revokeObjectURL(imageUrl);
                    throw new Error('Image could not be loaded into element.');
                }


            } catch (error) {
                console.error(`Error loading image index ${index}:`, error);
                placeholder.innerHTML = `<div class="text-center text-xs text-red-600 p-2">{{ _("Failed to load image ") }}${index + 1}</div>`;
                placeholder.classList.remove('animate-pulse', 'bg-gray-200');
                placeholder.classList.add('bg-red-100', 'border', 'border-red-400');
            }
        }

async function handlePostComment(event) {
    event.preventDefault();
    const form = event.target;
    const barcode = form.dataset.barcode;
    const workitemid = form.closest('.details-row').id.split('-')[2];
    const textarea = form.querySelector('textarea');
    const commentText = textarea.value.trim();
    if (!commentText) return;

    try {
        const response = await fetch(`${API_PREFIX}api/workitem/${barcode}/comment`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ commentText })
        });
        if (!response.ok) throw new Error('Failed to post comment.');
        
        textarea.value = '';
        const commentsContainer = document.getElementById(`comments-container-${workitemid}`);
        commentsContainer.dataset.loaded = 'false'; 
        loadCollaborationData(workitemid, barcode);

    } catch(error) {
        console.error("Comment post error:", error);
    }
}
        

async function handleSetPriority(event) {
    const selector = event.target;

    const barcode = selector.dataset.barcode;
    const priority = parseInt(selector.value, 10);

    try {
         const response = await fetch(`${API_PREFIX}api/workitem/${barcode}/priority`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ priority })
        });
        if (!response.ok) throw new Error('Failed to set priority.');
        
        const indicatorCell = document.getElementById(`priority-indicator-${barcode}`);
        let iconHtml = '';
        if (priority === 3) iconHtml = `<span title="{{ _('High Priority') }}"><i class="fas fa-flag text-red-500"></i></span>`;
        else if (priority === 2) iconHtml = `<span title="{{ _('Medium Priority') }}"><i class="fas fa-flag text-yellow-500"></i></span>`;
        else if (priority === 1) iconHtml = `<span title="{{ _('Low Priority') }}"><i class="fas fa-flag text-blue-500"></i></span>`;
        indicatorCell.innerHTML = iconHtml;

    } catch(error) {
        console.error("Set priority error:", error);
    }
}
    document.addEventListener('DOMContentLoaded', () => {
        const modal = document.getElementById("imageModal");
        const modalImg = document.getElementById("modalImage");
        const closeBtn = document.querySelector(".modal-close");

        document.addEventListener('click', function (event) {
            if (event.target && event.target.classList.contains('workitem-image')) {
                modal.style.display = "flex";
                modalImg.src = event.target.src;
            }
        });

        function closeModal() {
            modal.style.display = "none";
        }

        closeBtn.addEventListener('click', closeModal);

        modal.addEventListener('click', function (event) {
            if (event.target === modal) {
                closeModal();
            }
        });

        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape' && modal.style.display === "flex") {
                closeModal();
            }
        });
        const detailButtons = document.querySelectorAll('.details-toggle-button');
        detailButtons.forEach(button => {
            button.addEventListener('click', toggleDetailsAndLoadImages);
        });

        const animatedElements = document.querySelectorAll('.animate-on-load');
        animatedElements.forEach(el => {
            const delay = el.style.getPropertyValue('--delay') || '0ms';
            setTimeout(() => {
                el.classList.remove('opacity-0', 'translate-y-4');
            }, parseInt(delay));
        });
        document.getElementById('workitemsTbody').addEventListener('submit', (event) => {
            if (event.target.classList.contains('comment-form')) {
                handlePostComment(event);
            }
        });
        
        document.getElementById('workitemsTbody').addEventListener('change', (event) => {
            if (event.target.classList.contains('priority-selector')) {
                handleSetPriority(event);
            }
        });
        const tableRows = document.querySelectorAll('#workitemsTable tbody tr.workitem-row');
        tableRows.forEach(row => {
            const delay = row.style.getPropertyValue('--delay') || '0ms';
            const timeoutId = setTimeout(() => {
                row.style.transform = 'translateX(-15px)';
                row.classList.remove('opacity-0');
                setTimeout(() => {
                    row.style.transform = 'translateX(0)';
                }, 10);
            }, 200 + parseInt(delay));
            animationTimeouts.push(timeoutId);
        });

        const toggleBtn = document.getElementById('toggleAdvancedFilterBtn');
        const advancedContainer = document.getElementById('advancedFilterContainer');
        const applyBtn = document.getElementById('applyFiltersBtn');
        const resetBtn = document.getElementById('resetFiltersBtn');

        if (toggleBtn) {
             toggleBtn.addEventListener('click', () => {
                advancedContainer.classList.toggle('hidden');
            });
        }

        if (applyBtn) {
            applyBtn.addEventListener('click', () => {
                logAction("filterWorkitemsAdvanced", "workitemOverview", JSON.stringify({
                    by_status: document.getElementById("statusFilter").value,
                    from_date: document.getElementById("startDate").value,
                    to_date: document.getElementById("endDate").value,
                    search_term: document.getElementById("searchInput").value
                }), "SUCCESS", 0);
                applyAllFilters();
            });
        }

        if (resetBtn) {
            resetBtn.addEventListener('click', () => {
                document.getElementById('startDate').value = '';
                document.getElementById('endDate').value = '';
                logAction("resetWorkitemsAdvancedFilter", "workitemOverview", null, "SUCCESS", 0);
                applyAllFilters();
            });
        }
    });
    </script>
</body>

</html>
