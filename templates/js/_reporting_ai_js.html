<script>
(function () {
  "use strict";
  var API_PREFIX = window.location.href.includes("nexora") ? "/nexora/" : "/";
  var modeAi = document.getElementById("rpModeAi");
  var panel = document.getElementById("rpAiPanel");
  if (!modeAi || !panel) return;

  var modeTable = document.getElementById("rpModeTable");
  var modeSql = document.getElementById("rpModeSql");
  var sqlPanel = document.getElementById("rpSqlPanel");
  var sqlEditor = document.getElementById("rpSqlEditor");
  var promptEl = document.getElementById("rpAiPrompt");
  var askBtn = document.getElementById("rpAiAsk");
  var resultEl = document.getElementById("rpAiResult");
  var sqlEl = document.getElementById("rpAiSql");
  var explainEl = document.getElementById("rpAiExplain");
  var invalidEl = document.getElementById("rpAiInvalid");
  var insertBtn = document.getElementById("rpAiInsert");
  var copyBtn = document.getElementById("rpAiCopy");
  var errorEl = document.getElementById("rpAiError");
  // Sidebars that setMode() hides in SQL mode — mirror its mechanism so AI mode
  // hides them too (setMode uses querySelector + style.display = 'none' | '').
  var fieldsEl = document.querySelector(".reporting-fields");
  var wellsEl = document.querySelector(".reporting-wells");
  var lastSql = "";

  var modeBuild = document.getElementById("rpAiModeBuild");
  var modeSqlBtn = document.getElementById("rpAiModeSql");          // may be absent (no ai.sql)
  var defResult = document.getElementById("rpAiDefResult");
  var defSummary = document.getElementById("rpAiDefSummary");
  var defInvalid = document.getElementById("rpAiDefInvalid");
  var openBuilderBtn = document.getElementById("rpAiOpenBuilder");
  var makeChartBtn = document.getElementById("rpAiMakeChart");
  var hintBuild = document.getElementById("rpAiHintBuild");
  var hintSql = document.getElementById("rpAiHintSql");
  var aiSurface = "build";                                          // "build" | "sql" | "agent"
  var lastDef = null;

  // Agent (Surface C) elements + state
  var modeAgentBtn = document.getElementById("rpAiModeAgent");
  var hintAgent = document.getElementById("rpAiHintAgent");
  var agentResult = document.getElementById("rpAiAgentResult");
  var agentThreadEl = document.getElementById("rpAiAgentThread");
  var agentTraceWrap = document.getElementById("rpAiAgentTraceWrap");
  var agentTraceEl = document.getElementById("rpAiAgentTrace");
  var agentTurnsEl = document.getElementById("rpAiAgentTurns");
  var agentInvalid = document.getElementById("rpAiAgentInvalid");
  var agentOpenBuilderBtn = document.getElementById("rpAiAgentOpenBuilder");
  var agentInsertSqlBtn = document.getElementById("rpAiAgentInsertSql");
  var agentThread = [];          // [{q, a}] — drives the conversation + follow-up context
  var lastAgentDef = null;
  var lastAgentSql = "";

  // In-flight indicator shared by all three surfaces. Rotating lines mirror
  // the Simple pane's component; the agent surface gets a "takes a minute"
  // line since agent runs are the longest waits. tojson handles quoting.
  var aiLoadingEl = document.getElementById("rpAiLoading");
  var aiLoadingTextEl = document.getElementById("rpAiLoadingText");
  var aiLoadingTimer = null;
  var I18N_AI_REPORT = {{ _("AI report")|tojson }};
  var I18N_AI_COPIED = {{ _("Copied")|tojson }};
  var AI_LINES = [
    {{ _("Asking the AI…")|tojson }},
    {{ _("Drafting your report…")|tojson }},
    {{ _("Checking the result…")|tojson }}
  ];
  var AGENT_LINES = [
    {{ _("Asking the AI…")|tojson }},
    {{ _("The agent is working step by step — this can take a minute…")|tojson }},
    {{ _("Checking the result…")|tojson }}
  ];

  function showAiLoading(lines) {
    if (!aiLoadingEl) return;
    var i = 0;
    aiLoadingTextEl.textContent = lines[0];
    aiLoadingEl.hidden = false;
    if (aiLoadingTimer) clearInterval(aiLoadingTimer);
    aiLoadingTimer = setInterval(function () {
      i = (i + 1) % lines.length;
      aiLoadingTextEl.textContent = lines[i];
    }, 3000);
  }
  function hideAiLoading() {
    if (aiLoadingTimer) { clearInterval(aiLoadingTimer); aiLoadingTimer = null; }
    if (aiLoadingEl) aiLoadingEl.hidden = true;
  }

  function csrfToken() {
    var m = document.querySelector('meta[name="csrf-token"]');
    return m ? m.getAttribute("content") : "";
  }

  function setSurface(s) {
    aiSurface = s;
    if (modeBuild) modeBuild.classList.toggle("active", s === "build");
    if (modeSqlBtn) modeSqlBtn.classList.toggle("active", s === "sql");
    if (modeAgentBtn) modeAgentBtn.classList.toggle("active", s === "agent");
    if (hintBuild) hintBuild.hidden = s !== "build";
    if (hintSql) hintSql.hidden = s !== "sql";
    if (hintAgent) hintAgent.hidden = s !== "agent";
    // hide all result blocks + error on switch; the agent thread persists so a
    // user can flip away and back, but its result block hides until shown again.
    if (resultEl) resultEl.hidden = true;
    if (defResult) defResult.hidden = true;
    if (agentResult) agentResult.hidden = !(s === "agent" && agentThread.length);
    if (errorEl) errorEl.hidden = true;
    if (askBtn) askBtn.textContent = (s === "agent" && agentThread.length)
      ? '{{ _("Ask follow-up") }}' : '{{ _("Ask") }}';
  }
  if (modeBuild) modeBuild.addEventListener("click", function () { setSurface("build"); });
  if (modeSqlBtn) modeSqlBtn.addEventListener("click", function () { setSurface("sql"); });
  if (modeAgentBtn) modeAgentBtn.addEventListener("click", function () { setSurface("agent"); });

  function summarize(def) {
    var cols = (def.columns || []).map(function (c) { return c.header || c.field; }).join(", ");
    var parts = [
      '"' + (def.title || '{{ _("report") }}') + '"',
      '{{ _("source") }} ' + def.source,
      '{{ _("columns") }}: ' + cols
    ];
    if ((def.filters || []).length) parts.push(def.filters.length + ' {{ _("filter(s)") }}');
    if ((def.sort || []).length) parts.push('{{ _("sorted") }}');
    return parts.join(" · ");
  }

  function askBuild(question) {
    askBtn.disabled = true;
    errorEl.hidden = true;
    showAiLoading(AI_LINES);
    fetch(API_PREFIX + "api/reporting/ai/build", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-CSRFToken": csrfToken() },
      body: JSON.stringify({ question: question })
    }).then(function (r) {
      return r.json().then(function (data) { return { ok: r.ok, data: data }; });
    }).then(function (res) {
      askBtn.disabled = false;
      hideAiLoading();
      if (!res.ok) {
        errorEl.textContent = (res.data && res.data.error) || '{{ _("Error") }}';
        errorEl.hidden = false; defResult.hidden = true; return;
      }
      lastDef = res.data.definition;
      defSummary.textContent = lastDef ? summarize(lastDef) : (res.data.explanation || "");
      defInvalid.hidden = res.data.valid !== false;
      openBuilderBtn.disabled = !lastDef || res.data.valid === false;
      defResult.hidden = false;
      if (makeChartBtn) makeChartBtn.hidden = !(lastDef && lastDef.chartHint && res.data.valid !== false);
    }).catch(function () {
      askBtn.disabled = false;
      hideAiLoading();
      errorEl.textContent = '{{ _("Network error") }}'; errorEl.hidden = false;
    });
  }

  function askSql(question) {
    askBtn.disabled = true;
    errorEl.hidden = true;
    showAiLoading(AI_LINES);
    fetch(API_PREFIX + "api/reporting/ai/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-CSRFToken": csrfToken() },
      body: JSON.stringify({ question: question })
    }).then(function (r) {
      return r.json().then(function (data) { return { ok: r.ok, status: r.status, data: data }; });
    }).then(function (res) {
      askBtn.disabled = false;
      hideAiLoading();
      if (!res.ok) {
        errorEl.textContent = (res.data && res.data.error) || '{{ _("Error") }}';
        errorEl.hidden = false;
        resultEl.hidden = true;
        return;
      }
      lastSql = res.data.sql || "";
      ReportingSqlFormat.render(sqlEl, lastSql);
      explainEl.textContent = res.data.explanation || "";
      invalidEl.hidden = res.data.valid !== false;
      resultEl.hidden = false;
    }).catch(function () {
      askBtn.disabled = false;
      hideAiLoading();
      errorEl.textContent = '{{ _("Network error") }}';
      errorEl.hidden = false;
    });
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function renderAgentThread() {
    if (!agentThreadEl) return;
    agentThreadEl.innerHTML = agentThread.map(function (turn) {
      return '<div class="reporting-ai-turn">' +
        '<p class="reporting-ai-q"><span class="reporting-ai-q-badge">{{ _("You") }}</span>' +
        escapeHtml(turn.q) + '</p>' +
        '<p class="reporting-ai-a">' + escapeHtml(turn.a || '{{ _("(no answer)") }}') + '</p>' +
        '</div>';
    }).join("");
  }

  function renderAgentTrace(trace, turns) {
    if (!agentTraceEl || !agentTraceWrap) return;
    if (!trace || !trace.length) { agentTraceWrap.hidden = true; return; }
    agentTraceEl.innerHTML = trace.map(function (step) {
      var ok = step.result && step.result.ok;
      var chip = '<span class="reporting-ai-step-chip ' +
        (ok ? "is-ok" : "is-err") + '">' + (ok ? "✓" : "✗") + '</span>';
      var detail = ok ? "" : ' — ' + escapeHtml((step.result && step.result.error) || "");
      var meta = "";
      if (ok && step.result && typeof step.result.rowCount === "number") {
        meta = ' <span class="reporting-ai-step-meta">' +
          step.result.rowCount + ' {{ _("rows") }}</span>';
      }
      return '<li class="reporting-ai-step">' + chip +
        '<code class="reporting-ai-step-name">' + escapeHtml(step.name) + '</code>' +
        meta + detail + '</li>';
    }).join("");
    if (agentTurnsEl) agentTurnsEl.textContent =
      (turns || trace.length) + ' {{ _("steps") }}';
    agentTraceWrap.hidden = false;
  }

  function agentContext() {
    // Carry only the model's own prior answer as follow-up context (schema-only:
    // no result rows are echoed back here — the server never returned any to us).
    if (!agentThread.length) return "";
    var last = agentThread[agentThread.length - 1];
    return '(Continuing our conversation. Your previous answer was: "' +
      (last.a || "") + '")\n\n';
  }

  function askAgent(question) {
    askBtn.disabled = true;
    errorEl.hidden = true;
    showAiLoading(AGENT_LINES);
    fetch(API_PREFIX + "api/reporting/ai/agent", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-CSRFToken": csrfToken() },
      body: JSON.stringify({
        question: agentContext() + question,
        // Active source lets the server gate run_sql to sources it can reach.
        source: (document.getElementById("rpSource") || {}).value || null
      })
    }).then(function (r) {
      return r.json().then(function (data) { return { ok: r.ok, data: data }; });
    }).then(function (res) {
      askBtn.disabled = false;
      hideAiLoading();
      if (!res.ok) {
        errorEl.textContent = (res.data && res.data.error) || '{{ _("Error") }}';
        errorEl.hidden = false; agentResult.hidden = true; return;
      }
      var d = res.data;
      agentThread.push({ q: question, a: d.answer || "" });
      renderAgentThread();
      renderAgentTrace(d.toolTrace, d.turns);
      lastAgentDef = d.definition || null;
      lastAgentSql = d.sql || "";
      if (agentOpenBuilderBtn) agentOpenBuilderBtn.hidden = !lastAgentDef;
      if (agentInsertSqlBtn) agentInsertSqlBtn.hidden = !(lastAgentSql && sqlEditor);
      if (agentInvalid)
        agentInvalid.hidden = !!(d.answer && (lastAgentDef || lastAgentSql));
      agentResult.hidden = false;
      promptEl.value = "";
      askBtn.textContent = '{{ _("Ask follow-up") }}';
    }).catch(function () {
      askBtn.disabled = false;
      hideAiLoading();
      errorEl.textContent = '{{ _("Network error") }}'; errorEl.hidden = false;
    });
  }

  function ask() {
    var question = (promptEl.value || "").trim();
    if (!question) { promptEl.focus(); return; }
    if (aiSurface === "build") return askBuild(question);
    if (aiSurface === "agent") return askAgent(question);
    return askSql(question);
  }

  function showAiMode() {
    [modeTable, modeSql, modeAi].forEach(function (b) { if (b) b.classList.remove("active"); });
    modeAi.classList.add("active");
    if (sqlPanel) sqlPanel.hidden = true;
    // FIX A — hide the field/wells sidebars in AI mode (symmetric with setMode's
    // SQL-mode hiding). setMode('table') restores them with style.display = ''.
    if (fieldsEl) fieldsEl.style.display = "none";
    if (wellsEl) wellsEl.style.display = "none";
    // With both sidebars hidden, let the results column span the full width
    // (otherwise grid auto-placement drops it into the narrow first track).
    var main = document.querySelector(".reporting-main");
    if (main) main.classList.add("reporting-main--single");
    panel.hidden = false;
    setSurface(aiSurface);
  }
  modeAi.addEventListener("click", showAiMode);

  // FIX 1 — panel persistence: hide AI panel when user switches to Table or SQL mode.
  // These listeners fire alongside the existing setMode listeners in _reporting_js.html.
  if (modeTable) {
    modeTable.addEventListener("click", function () {
      panel.hidden = true;
      modeAi.classList.remove("active");
    });
  }
  if (modeSql) {
    modeSql.addEventListener("click", function () {
      panel.hidden = true;
      modeAi.classList.remove("active");
    });
  }

  askBtn.addEventListener("click", ask);
  promptEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); ask(); }
  });

  if (insertBtn) insertBtn.addEventListener("click", function () {
    if (!lastSql || !sqlEditor) return;
    sqlEditor.value = lastSql;
    // FIX 2 — disabled SQL button: modeSql is disabled when user lacks reporting.sql.run.
    // If it is enabled, delegate to the existing mode-switch handler (setMode('sql')).
    // If it is disabled, manually reveal the SQL panel so the inserted SQL is visible.
    if (modeSql && !modeSql.disabled) {
      modeSql.click();  // triggers setMode('sql') in _reporting_js.html
    } else if (sqlPanel) {
      // degrade gracefully: show SQL panel, hide AI panel, fix active state
      panel.hidden = true;
      modeAi.classList.remove("active");
      sqlPanel.hidden = false;
    }
    sqlEditor.focus();
  });

  if (copyBtn) copyBtn.addEventListener("click", function () {
    if (!navigator.clipboard || !lastSql) return;
    navigator.clipboard.writeText(lastSql).then(function () {
      var prev = copyBtn.textContent;
      copyBtn.textContent = I18N_AI_COPIED;
      setTimeout(function () { copyBtn.textContent = prev; }, 1200);
    }).catch(function () { /* clipboard unavailable (non-HTTPS / unfocused) */ });
  });

  if (openBuilderBtn) openBuilderBtn.addEventListener("click", function () {
    if (!lastDef || !window.Reporting || !window.Reporting.applyDefinition) return;
    window.Reporting.applyDefinition(lastDef, lastDef.title || I18N_AI_REPORT, null);
    panel.hidden = true;
    modeAi.classList.remove("active");
  });

  if (makeChartBtn) makeChartBtn.addEventListener("click", function () {
    if (!lastDef || !window.Reporting || !window.Reporting.applyDefinitionAndChart) return;
    window.Reporting.applyDefinitionAndChart(lastDef, lastDef.chartHint);
    panel.hidden = true;
    modeAi.classList.remove("active");
  });

  if (agentOpenBuilderBtn) agentOpenBuilderBtn.addEventListener("click", function () {
    if (!lastAgentDef || !window.Reporting || !window.Reporting.applyDefinition) return;
    window.Reporting.applyDefinition(lastAgentDef, lastAgentDef.title || I18N_AI_REPORT, null);
    panel.hidden = true;
    modeAi.classList.remove("active");
  });

  if (agentInsertSqlBtn) agentInsertSqlBtn.addEventListener("click", function () {
    if (!lastAgentSql || !sqlEditor) return;
    sqlEditor.value = lastAgentSql;
    if (modeSql && !modeSql.disabled) {
      modeSql.click();  // setMode('sql') in _reporting_js.html
    } else if (sqlPanel) {
      panel.hidden = true;
      modeAi.classList.remove("active");
      sqlPanel.hidden = false;
    }
    sqlEditor.focus();
  });
})();
</script>
