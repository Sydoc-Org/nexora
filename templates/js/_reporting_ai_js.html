<script nonce="{{ csp_nonce() }}">
/* AI chat panel: a docked slide-over (same shell pattern as the drill-through
   drawer) that talks to the agentic /api/reporting/ai/agent endpoint. Every
   question threads the running chat.history back to the server (Task 1's
   `history` param) so follow-ups carry real conversational context instead of
   the old single-shot Surfaces A/B/C. Exposes window.ReportingChat.{open,send}
   so the Simple tab (Task 4) can route its own "ask AI" affordances here. */
(function () {
  "use strict";
  var API_PREFIX = window.API_PREFIX;

  var toggleBtn = document.getElementById("rpChatToggle");
  var panel = document.getElementById("rpChatPanel");
  if (!toggleBtn || !panel) return;

  var closeBtn = document.getElementById("rpChatClose");
  var thread = document.getElementById("rpChatThread");
  var emptyEl = document.getElementById("rpChatEmpty");
  var form = document.getElementById("rpChatForm");
  var input = document.getElementById("rpChatInput");
  var sendBtn = document.getElementById("rpChatSend");
  if (!closeBtn || !thread || !form || !input || !sendBtn) return;

  // Advanced-pane elements the "Open in builder" / "Insert SQL" chips reach
  // into -- always present in the DOM (just hidden when Simple is active).
  var modeSql = document.getElementById("rpModeSql");
  var sqlPanel = document.getElementById("rpSqlPanel");
  var sqlEditor = document.getElementById("rpSqlEditor");

  sendBtn.addEventListener("animationend", function (e) {
    if (e.animationName === "rp-send-launch") sendBtn.classList.remove("is-sending");
  });

  var I18N = {
    noAnswer: {{ _("(no answer)")|tojson }},
    howWorked: {{ _("How the agent worked")|tojson }},
    steps: {{ _("steps")|tojson }},
    rows: {{ _("rows")|tojson }},
    openBuilder: {{ _("Open report")|tojson }},
    insertSql: {{ _("Insert into SQL editor")|tojson }},
    showQuery: {{ _("Show query")|tojson }},
    hideQuery: {{ _("Hide query")|tojson }},
    netError: {{ _("Network error")|tojson }},
    continueBtn: {{ _("Continue")|tojson }},
    continuing: {{ _("Continuing…")|tojson }},
    reportTitle: {{ _("AI report")|tojson }},
    followups: [
      {{ _("Only this quarter")|tojson }},
      {{ _("Break down by process")|tojson }},
      {{ _("Show it as a chart")|tojson }}
    ]
  };
  // Live progress labels. The server streams what the agent is actually doing
  // (see the NDJSON branch of /api/reporting/ai/agent); these name each phase.
  var STEP_START = {{ _("Asking Eddard…")|tojson }};
  var STEP_THINKING = {{ _("Thinking…")|tojson }};
  var STEP_WORKING = {{ _("Working…")|tojson }};
  var BUILD_TITLE = {{ _("Building your report…")|tojson }};
  var STEP_LABELS = {
    build_definition: {{ _("Building the report…")|tojson }},
    run_definition: {{ _("Running the report…")|tojson }},
    validate_sql: {{ _("Checking the query…")|tojson }},
    run_sql: {{ _("Running the query…")|tojson }},
    compute_stats: {{ _("Crunching the numbers…")|tojson }}
  };

  var chat = { history: [], busy: false };   // history: [{role, content}]
  var tickerEl = null;
  var tickerTextEl = null;
  var tickerStepsEl = null;
  var buildStageEl = null;

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function csrfToken() {
    var m = document.querySelector('meta[name="csrf-token"]');
    return m ? m.getAttribute("content") : "";
  }

  // ----- Panel drag functionality -----
  var dragState = { isDragging: false, startX: 0, startY: 0, startLeft: 0, startTop: 0 };

  function startDrag(e) {
    if (e.button !== 0) return; // Only left mouse button
    dragState.isDragging = true;
    dragState.startX = e.clientX;
    dragState.startY = e.clientY;
    var rect = panel.getBoundingClientRect();
    dragState.startLeft = rect.left;
    dragState.startTop = rect.top;
    panel.classList.add("is-dragging");
    panel.style.transition = "none";
    document.body.style.cursor = "grabbing";
    e.preventDefault();
  }

  function moveDrag(e) {
    if (!dragState.isDragging) return;
    var dx = e.clientX - dragState.startX;
    var dy = e.clientY - dragState.startY;
    var newLeft = dragState.startLeft + dx;
    var newTop = dragState.startTop + dy;

    // Clamp to viewport
    var maxLeft = window.innerWidth - panel.offsetWidth;
    var maxTop = window.innerHeight - panel.offsetHeight;
    newLeft = Math.max(0, Math.min(newLeft, maxLeft));
    newTop = Math.max(0, Math.min(newTop, maxTop));

    panel.style.position = "fixed";
    panel.style.right = "auto";
    panel.style.bottom = "auto";
    panel.style.left = newLeft + "px";
    panel.style.top = newTop + "px";
  }

  function endDrag(e) {
    if (!dragState.isDragging) return;
    dragState.isDragging = false;
    panel.classList.remove("is-dragging");
    panel.style.transition = "";
    document.body.style.cursor = "";
  }

  var panelHead = document.querySelector(".reporting-chat-head");
  if (panelHead) {
    panelHead.addEventListener("mousedown", startDrag);
    document.addEventListener("mousemove", moveDrag);
    document.addEventListener("mouseup", endDrag);
    document.addEventListener("mouseleave", endDrag);
  }

  // ----- Panel open/close -----

  function openPanel(prefill) {
    // The drill-through drawer is still a modal right-edge slide-over with its
    // own backdrop, so it would dim and block this panel. The chat supersedes
    // it (see .reporting-drill-panel / .reporting-chat-panel in reporting.css).
    if (window.ReportingDrill) ReportingDrill.close();
    panel.hidden = false;
    toggleBtn.setAttribute("aria-expanded", "true");
    if (typeof prefill === "string" && prefill) {
      input.value = prefill;
      autosize();
    }
    input.focus();
  }

  // `returnFocus` is false when the panel closes without the user asking it to
  // (nothing to hand focus back to). Non-modal means the page keeps working
  // while the chat is open, so we must not yank focus out of whatever the user
  // is typing in just because Escape or the × was pressed elsewhere.
  function closePanel(returnFocus) {
    panel.hidden = true;
    toggleBtn.setAttribute("aria-expanded", "false");
    if (returnFocus !== false) toggleBtn.focus();
  }

  toggleBtn.addEventListener("click", function () {
    if (panel.hidden) openPanel(); else closePanel();
  });
  closeBtn.addEventListener("click", function () { closePanel(); });
  // Non-modal: no backdrop, so clicking the page does NOT close the chat --
  // that is the point, the page stays usable underneath. Escape still closes,
  // but only while focus is inside the panel; otherwise Escape belongs to
  // whatever the user is actually working in.
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape" || panel.hidden) return;
    if (panel.contains(document.activeElement)) closePanel();
  });

  // ----- Thread rendering -----

  function pushMsg(role, html) {
    if (emptyEl) emptyEl.hidden = true;
    var div = document.createElement("div");
    // Task 7: nx-rise entrance (fill-mode backwards, never both -- see
    // nexora-ui.css) -- a freshly created node every call, so no
    // hidden-toggle trick is needed to replay it.
    div.className = "rp-chat-msg rp-chat-msg--" + role + " nx-rise";
    div.setAttribute("data-testid", "rp-chat-msg-" + role);
    div.innerHTML = html;
    thread.appendChild(div);
    thread.scrollTop = thread.scrollHeight;
    return div;
  }

  function startTicker() {
    tickerEl = document.createElement("div");
    tickerEl.className = "rp-chat-ticker rp-chat-build";
    tickerEl.setAttribute("role", "status");
    tickerEl.setAttribute("data-testid", "rp-chat-ticker");
    tickerEl.innerHTML = '<div class="rp-build-title"><i></i><i></i><i></i><span></span></div>' +
      '<ol class="rp-build-steps" data-testid="rp-build-steps"></ol>';
    // Eddard builds a report above the real step list while we wait; the
    // pulsing dots stay as the fallback on any page that didn't render his
    // <template> (issue #212).
    var mascotTpl = document.getElementById("rpChatWorkingMascot");
    if (mascotTpl) {
      Array.prototype.forEach.call(tickerEl.querySelectorAll(".rp-build-title i"),
        function (dot) { dot.remove(); });
      tickerEl.insertBefore(mascotTpl.content.cloneNode(true), tickerEl.firstChild);
      buildStageEl = tickerEl.querySelector(".ed-stage");
      if (window.NexoraEddard) window.NexoraEddard.startBuild(buildStageEl);
    }
    tickerTextEl = tickerEl.querySelector(".rp-build-title span");
    tickerStepsEl = tickerEl.querySelector(".rp-build-steps");
    tickerTextEl.textContent = STEP_START;
    thread.appendChild(tickerEl);
    thread.scrollTop = thread.scrollHeight;
  }

  // A progress event either updates the title (thinking/note) or appends a
  // build-step row (tool). The previous running row flips to done -- the
  // stream carries no per-tool completion event, so "the next thing started"
  // is the completion signal.
  function tickerEvent(ev) {
    if (!tickerEl) return;
    if (ev.phase === "preview") {
      // Server-distilled numbers from the tool the agent just ran -- Eddard's
      // mock report becomes a live preview of the actual answer (#212).
      if (buildStageEl && window.NexoraEddard) NexoraEddard.setPreview(buildStageEl, ev);
      return;
    }
    if (ev.phase === "tool") {
      tickerTextEl.textContent = BUILD_TITLE;
      var prev = tickerStepsEl.querySelector(".is-running");
      if (prev) { prev.classList.remove("is-running"); prev.classList.add("is-done"); }
      var li = document.createElement("li");
      li.className = "rp-build-step is-running";
      li.textContent = STEP_LABELS[ev.name] || STEP_WORKING;
      tickerStepsEl.appendChild(li);
    } else {
      tickerTextEl.textContent = stepLabel(ev);
    }
    thread.scrollTop = thread.scrollHeight;
  }

  function stopTicker() {
    // Stop the build loop first -- the ticker (and Eddard's stage with it) is
    // about to leave the DOM, and its interval would keep painting a detached
    // node forever.
    if (buildStageEl && window.NexoraEddard) window.NexoraEddard.stopBuild(buildStageEl);
    buildStageEl = null;
    if (tickerEl && tickerEl.parentNode) tickerEl.parentNode.removeChild(tickerEl);
    tickerEl = null; tickerTextEl = null; tickerStepsEl = null;
  }

  // A progress event -> the line shown in the ticker. The model's own preamble
  // ("note") beats our canned labels when it wrote one; it is untrusted text so
  // it only ever lands in textContent, never innerHTML.
  function stepLabel(ev) {
    if (ev.phase === "note" && ev.text) {
      var t = String(ev.text).replace(/\s+/g, " ").trim();
      return t.length > 120 ? t.slice(0, 119) + "…" : t;
    }
    if (ev.phase === "tool") return STEP_LABELS[ev.name] || STEP_WORKING;
    if (ev.phase === "thinking") {
      return ev.turn > 1 ? STEP_THINKING + " (" + ev.turn + ")" : STEP_THINKING;
    }
    return STEP_WORKING;
  }

  // Read an NDJSON body, handing each parsed line to onEvent as it arrives.
  function readNdjson(resp, onEvent) {
    var reader = resp.body.getReader();
    var decoder = new TextDecoder();
    var buf = "";
    function pump() {
      return reader.read().then(function (chunk) {
        if (chunk.value) buf += decoder.decode(chunk.value, { stream: true });
        var lines = buf.split("\n");
        buf = lines.pop();          // keep the trailing partial line
        for (var i = 0; i < lines.length; i++) {
          if (!lines[i].trim()) continue;
          try { onEvent(JSON.parse(lines[i])); } catch (e) { /* skip a bad line */ }
        }
        return chunk.done ? undefined : pump();
      });
    }
    return pump();
  }

  function errorBubble(msg) {
    return '<p class="reporting-ai-error">' + escapeHtml(msg || I18N.netError) + "</p>";
  }

  // Ported verbatim from the old renderAgentTrace's per-step chip markup, now
  // rendered inline (per-turn) inside a collapsed <details> instead of a
  // single shared trace element.
  function traceHtml(trace, turns) {
    if (!trace || !trace.length) return "";
    var steps = trace.map(function (step) {
      var ok = step.result && step.result.ok;
      var chip = '<span class="reporting-ai-step-chip ' +
        (ok ? "is-ok" : "is-err") + '">' + (ok ? "✓" : "✗") + "</span>";
      var detail = ok ? "" : " — " + escapeHtml((step.result && step.result.error) || "");
      var meta = "";
      if (ok && step.result && typeof step.result.rowCount === "number") {
        meta = ' <span class="reporting-ai-step-meta">' +
          step.result.rowCount + " " + escapeHtml(I18N.rows) + "</span>";
      }
      return '<li class="reporting-ai-step">' + chip +
        '<code class="reporting-ai-step-name">' + escapeHtml(step.name) + "</code>" +
        meta + detail + "</li>";
    }).join("");
    return '<details class="reporting-ai-trace-wrap">' +
      '<summary class="reporting-ai-trace-summary">' + escapeHtml(I18N.howWorked) +
      ' · <span>' + (turns || trace.length) + " " + escapeHtml(I18N.steps) + "</span></summary>" +
      '<ol class="reporting-ai-trace">' + steps + "</ol></details>";
  }

  function aiTurnHtml(d) {
    var answer = escapeHtml(d.answer || I18N.noAnswer).replace(/\n/g, "<br>");
    var html = '<p class="rp-chat-answer">' + answer + "</p>";
    html += traceHtml(d.toolTrace, d.turns);

    var chips = "";
    if (d.definition) {
      chips += '<button type="button" class="nx-btn nx-btn--secondary nx-btn--sm rp-chat-open-builder" ' +
        'data-testid="rp-chat-open-builder">' + escapeHtml(I18N.openBuilder) + "</button>";
    }
    if (d.sql && sqlEditor) {
      chips += '<button type="button" class="nx-btn nx-btn--secondary nx-btn--sm rp-chat-insert-sql" ' +
        'data-testid="rp-chat-insert-sql">' + escapeHtml(I18N.insertSql) + "</button>";
    }
    if (d.sql) {
      chips += '<button type="button" class="nx-btn nx-btn--ghost nx-btn--sm rp-chat-show-sql" ' +
        'data-testid="rp-chat-show-sql">' + escapeHtml(I18N.showQuery) + "</button>";
    }
    // Issue #153: offer a fresh run with raised turn/budget caps when the loop
    // hit a cap without a final answer. Not a resume -- the server re-runs the
    // question from scratch, so canContinue is false once MAX_CONTINUE_ATTEMPTS
    // is reached (see api_ai_agent).
    if (d.canContinue) {
      chips += '<button type="button" class="nx-btn nx-btn--secondary nx-btn--sm rp-chat-continue" ' +
        'data-testid="rp-chat-continue">' + escapeHtml(I18N.continueBtn) + "</button>";
    }
    if (chips) html += '<div class="rp-chat-actions">' + chips + "</div>";
    if (d.sql) html += '<pre class="reporting-ai-sql rp-chat-sql-preview" hidden data-testid="rp-chat-sql-preview"></pre>';

    html += '<div class="rp-chat-actions">' + I18N.followups.map(function (t) {
      return '<button type="button" class="rp-chat-starter rp-chat-followup" data-testid="rp-chat-followup">' +
        escapeHtml(t) + "</button>";
    }).join("") + "</div>";
    return html;
  }

  // Attaches listeners to the turn bubble just appended to the thread (node),
  // scoped to that node so multiple turns never share/duplicate handlers.
  // `question` is the text that produced `d`, needed to re-send on Continue.
  function wireTurnActions(node, d, question) {
    if (!node) return;

    var openBtn = node.querySelector(".rp-chat-open-builder");
    if (openBtn) openBtn.addEventListener("click", function () {
      if (!d.definition) return;
      var def = d.definition;
      if (def.chartHint && def.chartHint.type && !def.chartType) def.chartType = def.chartHint.type;
      if (window.ReportingSimple && window.ReportingSimple.openDefinition) {
        if (window.ReportingTabs) window.ReportingTabs.show("simple");
        window.ReportingSimple.openDefinition(def, def.title || I18N.reportTitle);
      } else if (window.Reporting && window.Reporting.applyDefinition) {
        window.Reporting.applyDefinition(def, def.title || I18N.reportTitle, null);
        if (window.Reporting.run) window.Reporting.run();
        if (window.ReportingTabs) window.ReportingTabs.show("advanced");
      }
      closePanel();
    });

    var insertBtn = node.querySelector(".rp-chat-insert-sql");
    if (insertBtn) insertBtn.addEventListener("click", function () {
      if (!d.sql || !sqlEditor) return;
      sqlEditor.value = d.sql;
      if (window.ReportingTabs) window.ReportingTabs.show("advanced");
      // Degrade gracefully when the user lacks reporting.sql.run (rpModeSql
      // stays disabled): reveal the SQL panel directly for review, mirroring
      // the old agentInsertSqlBtn fallback.
      if (modeSql && !modeSql.disabled) modeSql.click();
      else if (sqlPanel) sqlPanel.hidden = false;
      sqlEditor.focus();
      closePanel();
    });

    var showBtn = node.querySelector(".rp-chat-show-sql");
    var pre = node.querySelector(".rp-chat-sql-preview");
    if (showBtn && pre) showBtn.addEventListener("click", function () {
      var willShow = pre.hidden;
      if (willShow && !pre.dataset.rendered) {
        if (window.ReportingSqlFormat) window.ReportingSqlFormat.render(pre, d.sql);
        pre.dataset.rendered = "1";
      }
      pre.hidden = !willShow;
      showBtn.textContent = willShow ? I18N.hideQuery : I18N.showQuery;
    });

    var followups = node.querySelectorAll(".rp-chat-followup");
    for (var i = 0; i < followups.length; i++) {
      followups[i].addEventListener("click", function () {
        var t = this.textContent.trim();
        // "Show it as a chart" on an answer that already carries a report
        // definition: open it in the builder — a model round-trip can only
        // answer in prose, it cannot draw.
        if (t === I18N.followups[2] && d.definition && openBtn) { openBtn.click(); return; }
        send(t);
      });
    }

    var continueBtn = node.querySelector(".rp-chat-continue");
    if (continueBtn) continueBtn.addEventListener("click", function () {
      send(question, (d.continueAttempt || 0) + 1);
    });
  }

  // ----- Answer depth (Quick / Balanced / Deep) -----

  // Absent from the DOM entirely when the configured model cannot honour an
  // effort level (see supports_effort in nx_lib/reporting/ai.py), so every
  // reference below is optional and `send` falls back to the server default.
  // ponytail: the choice lives for the life of the panel only. Persisting it
  // means an `aieffort` key in UI_PREF_CHOICES (nx_lib/ui_prefs.py) -- add it
  // if users start re-picking every visit.
  var effortBtn = document.getElementById("rpChatEffortBtn");
  var effortMenu = document.getElementById("rpChatEffortMenu");
  var effortLabel = document.getElementById("rpChatEffortLabel");
  var effortOpts = effortMenu
    ? Array.prototype.slice.call(effortMenu.querySelectorAll(".rp-effort__opt"))
    : [];

  function currentEffort() {
    for (var i = 0; i < effortOpts.length; i++) {
      if (effortOpts[i].getAttribute("aria-checked") === "true") {
        return effortOpts[i].getAttribute("data-effort");
      }
    }
    return null;
  }

  function openEffort(open) {
    if (!effortBtn) return;
    effortMenu.hidden = !open;
    effortBtn.setAttribute("aria-expanded", open ? "true" : "false");
  }

  if (effortBtn) {
    effortBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      openEffort(effortMenu.hidden);
    });

    effortOpts.forEach(function (opt) {
      opt.addEventListener("click", function () {
        effortOpts.forEach(function (o) {
          o.setAttribute("aria-checked", String(o === opt));
        });
        // Mirror the pick onto the trigger: label plus how many bars are lit.
        effortLabel.textContent = opt.getAttribute("data-label");
        var srcMeter = opt.querySelector(".rp-effort__meter");
        var btnMeter = effortBtn.querySelector(".rp-effort__meter");
        if (srcMeter && btnMeter) {
          btnMeter.setAttribute("data-bars", srcMeter.getAttribute("data-bars"));
        }
        openEffort(false);
        input.focus();
      });
    });

    // Dismiss on focus leaving the picker, NOT on a document-level click:
    // tests/unit/test_ui_chrome_regressions.py forbids a document click handler
    // in this file, because one previously closed the whole panel on any click
    // on the page once the backdrop was removed. Deferring a tick and reading
    // activeElement also survives the mousedown-blur that would otherwise close
    // the menu before an option's click could land.
    var effortRoot = effortBtn.closest(".rp-effort");
    effortRoot.addEventListener("focusout", function () {
      setTimeout(function () {
        if (!effortMenu.hidden && !effortRoot.contains(document.activeElement)) {
          openEffort(false);
        }
      }, 120);
    });
    effortRoot.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !effortMenu.hidden) {
        openEffort(false);
        effortBtn.focus();
      }
    });
  }

  // ----- Send -----

  // `continueAttempt` is 0 for a normal question; > 0 when re-sent via the
  // Continue chip after the loop hit max_turns/budget (issue #153) -- same
  // question, threaded into history like any other follow-up, just with the
  // server-side turn/budget cap raised.
  function send(text, continueAttempt) {
    text = String(text == null ? "" : text).trim();
    continueAttempt = continueAttempt || 0;
    if (chat.busy || !text) return;
    pushMsg("user", continueAttempt
      ? "<em>" + escapeHtml(I18N.continuing) + "</em>"
      : escapeHtml(text).replace(/\n/g, "<br>"));
    input.value = ""; input.style.height = "";
    chat.busy = true; sendBtn.disabled = true; startTicker();
    // Launch the arrow. Class is removed on animationend so a rapid second
    // send re-triggers it instead of being swallowed.
    sendBtn.classList.add("is-sending");
    fetch(API_PREFIX + "api/reporting/ai/agent", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-CSRFToken": csrfToken() },
      body: JSON.stringify({
        question: text,
        history: chat.history,
        // Ask for the NDJSON progress stream. The server still answers plain
        // JSON to anything that does not (and stubbed tests do not), so the
        // content-type below decides how to read the body.
        stream: true,
        // Active source lets the server gate run_sql to sources it can reach.
        source: (document.getElementById("rpSource") || {}).value || null,
        continueAttempt: continueAttempt,
        // null when the picker is absent; the server then uses its own
        // default rather than trusting a level the model cannot honour.
        effort: currentEffort()
      })
    }).then(function (r) {
      var ct = r.headers.get("content-type") || "";
      if (r.ok && ct.indexOf("x-ndjson") !== -1 && r.body && r.body.getReader) {
        var last = null;
        return readNdjson(r, function (ev) {
          if (ev.done) { last = ev; return; }
          tickerEvent(ev);
        }).then(function () {
          // A stream that ends without its `done` line died in transit.
          return { ok: !!last && !last.error, data: last || {} };
        });
      }
      return r.json().then(function (data) { return { ok: r.ok, data: data }; });
    }).then(function (res) {
      stopTicker(); chat.busy = false; sendBtn.disabled = false;
      if (!res.ok) {
        pushMsg("ai", errorBubble((res.data && res.data.error) || I18N.netError));
        return;
      }
      chat.history.push({ role: "user", content: text });
      // #178 A3: thread the produced artifacts back with the answer so a
      // follow-up ("show it as a chart") keeps the same source and data.
      var mem = res.data.answer || "";
      if (res.data.sql) {
        mem += "\n[sql from this answer]\n" + String(res.data.sql).slice(0, 1500);
      }
      if (res.data.definition) {
        try {
          mem += "\n[report definition from this answer]\n" +
            JSON.stringify(res.data.definition).slice(0, 1200);
        } catch (e) { /* non-serializable definition: skip the suffix */ }
      }
      chat.history.push({ role: "assistant", content: mem });
      var node = pushMsg("ai", aiTurnHtml(res.data));
      wireTurnActions(node, res.data, text);
    }).catch(function () {
      stopTicker(); chat.busy = false; sendBtn.disabled = false;
      pushMsg("ai", errorBubble(I18N.netError));
    });
  }

  // ----- Input: submit, Enter/Shift+Enter, autosize -----

  function autosize() {
    input.style.height = "";
    input.style.height = input.scrollHeight + "px";
  }
  input.addEventListener("input", autosize);

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    send(input.value);
  });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send(input.value);
    }
  });

  // Starter suggestion chips in the empty state -- send their own text.
  Array.prototype.forEach.call(document.querySelectorAll("#rpChatEmpty .rp-chat-starter"), function (btn) {
    btn.addEventListener("click", function () { send(btn.textContent.trim()); });
  });

  window.ReportingChat = { open: openPanel, send: send };
})();
</script>
