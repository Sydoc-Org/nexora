<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <script nonce="{{ csp_nonce() }}">
        const API_PREFIX = window.location.href.includes("nexora") ? "/nexora/" : "/";
        // Smallest perPage the filter/pagination controls offer. Doubles as the
        // "fast chunk" size in fetchAndUpdateWorkitems (further down this same
        // script): when a larger perPage is picked (e.g. 1000), it fires a
        // small perPage=40 request first so *something* renders almost
        // immediately, then follows up with the real, full-size request in the
        // background instead of leaving the table on the spinner for the whole
        // round trip. Declared here, at the very top, rather than next to
        // fetchAndUpdateWorkitems itself, so there's no possible ordering
        // question about it being ready before the DOMContentLoaded-registered
        // initial-load call further down references it.
        const FAST_CHUNK_PER_PAGE = 40;
        // Source-highlight confidence helpers (shared by the field list, thumbnails
        // and the lightbox overlay). field_sources entries may carry an optional
        // 0..1 `confidence`; map it to a colour bucket and a rounded percentage.
        // No confidence -> '' (boxes keep the neutral "located" orange).
        window.srcConfClass = function (conf) {
            if (typeof conf !== 'number' || isNaN(conf)) return '';
            if (conf >= 0.9) return 'src-conf-high';
            if (conf >= 0.7) return 'src-conf-med';
            return 'src-conf-low';
        };
        window.srcConfPct = function (conf) {
            if (typeof conf !== 'number' || isNaN(conf)) return '';
            return Math.round(conf * 100) + '%';
        };
        let animationTimeouts = [];
        let fieldConfig = {
            search_options: {},
            labels: {}
        };
        let pendingImportFiles = [];

        // Helpers now live in _workitem_detail_panel_js.html (shared). Alias the bare
        // names the lightbox + tbody delegation still call by reference.
        const srcEsc = window.srcEsc, allSources = window.allSources,
              tableCellSources = window.tableCellSources, renderTableGrids = window.renderTableGrids,
              buildSourceDetailsHtml = window.buildSourceDetailsHtml,
              renderThumbOverlay = window.renderThumbOverlay, refreshThumbOverlays = window.refreshThumbOverlays,
              loadImage = window.loadImage, loadImagesInBatch = window.loadImagesInBatch,
              loadHistory = window.loadHistory,
              renderWorkitemTimeline = window.renderWorkitemTimeline;

        window.__workitemDetailPerms = {
          images:      {{ 'true' if details_images_perm else 'false' }},
          audit:       {{ 'true' if details_audit_perm else 'false' }},
          fields:      {{ 'true' if details_fields_perm else 'false' }},
        };
        let _inRegisterByWid = {};

        function showNotification(message, type = 'success') {
            const container = document.getElementById('notification-container');

            const notification = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-green-500' : 'bg-red-500';
            const icon = type === 'success'
                ? '<i class="fas fa-check-circle"></i>'
                : '<i class="fas fa-exclamation-circle"></i>';

            notification.className = `flex items-center w-full p-4 text-white ${bgColor} rounded-lg shadow-lg transform transition-all duration-300 opacity-0 translate-x-full`;

            notification.innerHTML = `
                <div class="text-xl">${icon}</div>
                <div class="ml-3 text-sm font-medium">${message}</div>
            `;

            container.appendChild(notification);

            setTimeout(() => {
                notification.classList.remove('opacity-0', 'translate-x-full');
            }, 10);

            setTimeout(() => {
                notification.classList.add('opacity-0', 'translate-x-full');
                setTimeout(() => {
                    notification.remove();
                }, 700);
            }, 5000);
        }

        function cancelAllAnimations() {
            animationTimeouts.forEach(clearTimeout);
            animationTimeouts = [];

            const allRows = document.querySelectorAll('#workitemsTable tbody tr.workitem-row');
            allRows.forEach(row => {
                row.classList.remove('opacity-0');
                row.style.transform = '';
            });
        }

        function closeAllDetails() {
            document.querySelectorAll("[id^='details-row-']").forEach((detailsRow) => {
                detailsRow.classList.remove('open');
                detailsRow.setAttribute('hidden', true);
            });

            document.querySelectorAll(".indicator").forEach((chevron) => {
                chevron.classList.remove('open');
                chevron.classList.remove('glyphicon-chevron-down-custom');
                chevron.classList.add('glyphicon-chevron-up-custom');
            });
        }

        function getCurrentFilterOrSearch() {
            const statusFilter = document.getElementById("statusFilter");
            const searchInput = document.getElementById("searchInput");
            return {
                status: statusFilter.value,
                search: searchInput.value,
            };
        }

        async function toggleDetailsAndLoadImages(event) {
          try {
            const button = event.currentTarget;
            const workitemid = button.dataset.workitemid;
            const rowKey = button.dataset.rowkey || workitemid;
            const detailsRow = document.getElementById(`details-row-${rowKey}`);
            if (!detailsRow) return;
            const chevron = button.querySelector('.indicator');
            const isOpening = detailsRow.hasAttribute('hidden');

            // The detail panel's internal element ids and its client lookup are
            // keyed on the bare workitem id, which two clients can share. Rather
            // than re-key the whole shared panel, keep at most ONE panel open per
            // id: opening the other client's row collapses the first.
            if (isOpening) {
              document.querySelectorAll('tr.details-row:not([hidden])').forEach(other => {
                if (other === detailsRow) return;
                const otherKey = other.id.replace('details-row-', '');
                if (!otherKey.endsWith(`-${workitemid}`)) return;
                other.classList.remove('open');
                other.setAttribute('hidden', '');
                other.dataset.initialized = '';
                const otherTd = other.querySelector('td');
                if (otherTd) otherTd.innerHTML = '';
                const otherBtn = document.querySelector(`button[data-rowkey="${otherKey}"] .indicator`);
                if (otherBtn) otherBtn.classList.remove('open');
              });
            }

            if (isOpening && detailsRow.dataset.initialized !== 'true') {
              const td = detailsRow.querySelector('td');
              td.dataset.status = detailsRow.dataset.status || '';
              td.dataset.currentStage = detailsRow.dataset.currentStage || '';
              NexoraWorkitemDetail.render(workitemid, td, {
                readOnly: false,
                perms: window.__workitemDetailPerms,
                client: detailsRow.dataset.client || '',   // disambiguates colliding ids

                inRegisterPid: _inRegisterByWid[rowKey] || null,  // P3 (defaults null; keyed by client+id, not bare wid)
              });
              detailsRow.dataset.initialized = 'true';
            }

            if (isOpening) {
              detailsRow.removeAttribute('hidden');
              setTimeout(() => { detailsRow.classList.add('open'); chevron.classList.add('open'); }, 10);
            } else {
              detailsRow.classList.remove('open');
              chevron.classList.remove('open');
              detailsRow.addEventListener('transitionend', () => { detailsRow.hidden = true; }, { once: true });
            }
            chevron.classList.toggle('glyphicon-chevron-up-custom');
            chevron.classList.toggle('glyphicon-chevron-down-custom');
          } catch (error) { /* pass */ }
        }

        function openImportModal(files) {
            const fileArray = Array.from(files).filter(f => f.type === 'application/pdf');

            if (fileArray.length === 0) {
                showNotification({{ _("Please select valid PDF files.") | tojson }}, 'error');
                return;
            }

            pendingImportFiles = fileArray;

            const modal = document.getElementById('importProcessModal');
            const nameDisplay = document.getElementById('importFileNameDisplay');
            const select = document.getElementById('importProcessSelect');
            const errorMsg = document.getElementById('importErrorMsg');

            if (modal && nameDisplay && select) {
                nameDisplay.textContent = pendingImportFiles.length > 1
                    ? `${pendingImportFiles.length} {{ _("files selected") }}`
                    : `${pendingImportFiles[0].name}`;

                select.value = "";
                errorMsg.classList.add('hidden');
                modal.classList.remove('hidden');
            }
        }

        function closeImportModal() {
            const modal = document.getElementById('importProcessModal');
            if (modal) modal.classList.add('hidden');
            pendingImportFile = null;
            const importFileInput = document.getElementById('importFile');
            if(importFileInput) importFileInput.value = '';
        }

async function uploadBatchFiles(files, processName) {
    if (!files || files.length === 0 || !processName) return;

    const importBtn = document.getElementById('importBtn');
    const modalBtn = document.getElementById('confirmImportBtn');

    if (importBtn) importBtn.disabled = true;
    if (modalBtn) {
        modalBtn.disabled = true;
        modalBtn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i>`;
    }

    let successCount = 0;
    let failCount = 0;

    for (const file of files) {
        const formData = new FormData();
        formData.append('importFile', file);
        formData.append('processName', processName);

        try {
            const response = await fetch(`${API_PREFIX}import_workitems`, {
                headers: {'X-CSRFToken': csrfToken},
                method: 'POST',
                body: formData,
            });

            if (response.ok || response.redirected) {
                successCount++;
            } else {
                failCount++;
            }
        } catch (error) {
            console.error(`Error uploading ${file.name}:`, error);
            failCount++;
        }
    }

    if (successCount > 0) {
        showNotification(`Successfully imported ${successCount} files.`);
        setTimeout(() => window.location.reload(), 1500);
    }

    if (failCount > 0) {
        showNotification(`Failed to import ${failCount} files.`, 'error');
        resetImportUI();
    }

    closeImportModal();
}


        async function fetchPageInitData() {
            try {
                const res = await fetch(`${API_PREFIX}api/workitems_page_init`, {
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken }
                });
                if (!res.ok) throw new Error('page init failed');
                const data = await res.json();

                fieldConfig = data.field_config || { search_options: {}, labels: {} };
                window.fieldConfig = fieldConfig;

            } catch (e) {
                console.error('Failed to fetch page init data:', e);
            }
        }

    function resetImportUI() {
        const importBtn = document.getElementById('importBtn');
        const modalBtn = document.getElementById('confirmImportBtn');
        if (importBtn) {
            importBtn.disabled = false;
            importBtn.innerHTML = `<i class="fas fa-upload mr-2"></i>{{ _("Import") }}`;
        }
        if (modalBtn) {
            modalBtn.disabled = false;
            modalBtn.innerHTML = `{{ _("Import File") }}`;
        }
    }

        document.addEventListener('DOMContentLoaded', () => {
            // Init combobox interaction for existing doc field rows
            document.querySelectorAll('.doc-field-combobox').forEach(initDocFieldCombobox);

            fetchPageInitData().then(() => {
                const process = document.getElementById('prcfW')?.value || 'all';
                document.querySelectorAll('.doc-filter-field').forEach(hiddenInput => fillDocFieldSelect(hiddenInput, process));
            });

            // Load initial workitems client-side (read page from URL to support direct links)
            const _initPage = parseInt(new URLSearchParams(window.location.search).get('page') || '1', 10);
            fetchAndUpdateWorkitems(_initPage);

            // Prepared-documents link: rendered server-side (perm + MS02 active),
            // but its PDBS-process gating must update live as the process dropdown
            // changes -- the dropdown updates the page via AJAX with no full reload,
            // so a server-only {% raw %}{% if %}{% endraw %} would only refresh on F5.
            const _updatePreparedDocsLink = () => {
                const link = document.querySelector('[data-testid="prepared-docs-link"]');
                if (!link) return;
                let procs = [];
                try { procs = JSON.parse(link.dataset.pdocProcesses || '[]'); } catch (e) { procs = []; }
                const sel = document.getElementById('prcfW')?.value || 'all';
                // Multi-select (issue #150): the register is reachable as soon as
                // one selected process is a prepared-documents process.
                const shown = sel !== 'all' && sel.split(',').some(p => procs.includes(p));
                link.classList.toggle('hidden', !shown);
            };
            document.getElementById('prcfW')?.addEventListener('change', _updatePreparedDocsLink);
            _updatePreparedDocsLink();

            // Prevent full-page form submit fallback
            document.getElementById('filterForm')?.addEventListener('submit', e => e.preventDefault());

            const filterForm = document.getElementById('filterForm');
            const docFieldSel = document.getElementById('docFieldFilter');
            if(docFieldSel) {
                docFieldSel.setAttribute('data-selected', "{{ docfield or '' }}");
            }
            document.getElementById('docValueInput').blur();
            const toggleBtn = document.getElementById('toggleAdvancedFilterBtn');
            const advancedContainer = document.getElementById('advancedFilterContainer');

            let _mainSearchDebounce;
            function debounceSearch(fn) {
                clearTimeout(_mainSearchDebounce);
                _mainSearchDebounce = setTimeout(fn, 300);
            }

            if (toggleBtn && advancedContainer) {
                toggleBtn.addEventListener('click', () => {
                    advancedContainer.classList.toggle('hidden');
                });
                // Auto-open when the URL restored an advanced filter, so
                // active-but-hidden filters can't silently narrow the list.
                if (['startDate', 'endDate', 'docFieldFilter', 'docValueInput']
                    .some(id => document.getElementById(id)?.value)) {
                    advancedContainer.classList.remove('hidden');
                }
            }

            const datePreset = document.getElementById('datePreset');
            if (datePreset) {
                const pad = n => String(n).padStart(2, '0');
                const fmtDay = (d, end) =>
                    `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${end ? '23:59:59' : '00:00:00'}`;
                datePreset.addEventListener('change', () => {
                    if (!datePreset.value) return;
                    const from = new Date(), to = new Date();
                    switch (datePreset.value) {
                        case 'yesterday': from.setDate(from.getDate() - 1); to.setDate(to.getDate() - 1); break;
                        case 'this_week': from.setDate(from.getDate() - ((from.getDay() + 6) % 7)); break;
                        case 'last_7_days': from.setDate(from.getDate() - 6); break;
                        case 'this_month': from.setDate(1); break;
                    }
                    document.getElementById('startDate').value = fmtDay(from, false);
                    document.getElementById('endDate').value = fmtDay(to, true);
                    fetchAndUpdateWorkitems();
                });
                // Hand-editing a date means the range is custom again.
                ['startDate', 'endDate'].forEach(id => {
                    document.getElementById(id)?.addEventListener('input', () => { datePreset.value = ''; });
                });
            }

            async function fetchFieldConfig() {
                try {
                    const res = await fetch(`${API_PREFIX}api/config/fields`, {
                        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken }
                    });
                    if (!res.ok) throw new Error('Failed to fetch field config');

                    const data = await res.json();
                    fieldConfig = data;
                    window.fieldConfig = fieldConfig;

                    const process = document.getElementById('prcfW')?.value || 'all';
                    document.querySelectorAll('.doc-filter-field').forEach(hiddenInput => {
                        fillDocFieldSelect(hiddenInput, process);
                    });

                } catch (e) {
                    console.error("Error loading field config:", e);
                }
            }

            function fillDocFieldSelect(hiddenInput, process) {
                const selectedValue = hiddenInput.getAttribute('data-selected') || hiddenInput.value || '';
                // `process` is 'all' or a comma-joined multi-selection (issue #150):
                // offer the union of the selected processes' fields.
                const opts = fieldConfig.search_options || {};
                const procs = (!process || process === 'all') ? Object.keys(opts) : process.split(',');
                const fieldMap = new Map();
                procs.forEach(p => (opts[p] || []).forEach(f => fieldMap.set(f.value, f)));
                const fields = Array.from(fieldMap.values()).sort((a, b) => a.label.localeCompare(b.label));

                hiddenInput._docFieldOptions = fields;

                const wrapper = hiddenInput.closest('.doc-field-combobox');
                const searchInput = wrapper?.querySelector('.doc-filter-field-search');

                if (fields.length === 0) {
                    hiddenInput.value = '';
                    if (searchInput) { searchInput.value = ''; searchInput.placeholder = "{{ _('No fields available') }}"; }
                    return;
                }

                const match = fields.find(f => f.value === selectedValue);
                if (match) {
                    hiddenInput.value = match.value;
                    hiddenInput._userSelected = true;
                    if (searchInput) searchInput.value = match.label;
                } else {
                    // Value-first (issue #148): no silent auto-select -- empty
                    // field means "search all fields".
                    hiddenInput.value = '';
                    hiddenInput._userSelected = false;
                    if (searchInput) searchInput.value = '';
                }
            }

            function initDocFieldCombobox(wrapper) {
                const searchInput = wrapper.querySelector('.doc-filter-field-search');
                const hiddenInput = wrapper.querySelector('.doc-filter-field');
                const dropdown = wrapper.querySelector('.doc-field-dropdown');
                if (!searchInput || !hiddenInput || !dropdown) return;

                function renderDropdown(query) {
                    const options = hiddenInput._docFieldOptions || [];
                    const q = (query || '').toLowerCase().trim();
                    const filtered = q
                        ? options.filter(f => f.label.toLowerCase().includes(q) || f.value.toLowerCase().includes(q))
                        : options;
                    dropdown.innerHTML = '';
                    // "All fields" pseudo-option: clears the field -> value-first
                    // search across every permitted field (issue #148).
                    const allDiv = document.createElement('div');
                    allDiv.className = 'px-4 py-2 text-sm cursor-pointer hover:bg-[var(--nx-accent-tint)] border-b border-gray-100' +
                        (!hiddenInput.value ? ' bg-[var(--nx-accent-tint)] font-semibold text-[var(--nx-accent-hover)]' : ' text-gray-500 italic');
                    allDiv.textContent = "{{ _('All fields') }}";
                    allDiv.addEventListener('mousedown', (e) => {
                        e.preventDefault();
                        hiddenInput.value = '';
                        hiddenInput._userSelected = false;
                        searchInput.value = '';
                        dropdown.classList.add('hidden');
                        hiddenInput.dispatchEvent(new Event('change', { bubbles: true }));
                    });
                    dropdown.appendChild(allDiv);
                    if (filtered.length === 0) {
                        const div = document.createElement('div');
                        div.className = 'px-4 py-2 text-sm text-gray-500 italic';
                        div.textContent = 'No results';
                        dropdown.appendChild(div);
                    } else {
                        filtered.forEach(f => {
                            const div = document.createElement('div');
                            const isSelected = f.value === hiddenInput.value;
                            div.className = 'px-4 py-2 text-sm cursor-pointer hover:bg-[var(--nx-accent-tint)]' +
                                (isSelected ? ' bg-[var(--nx-accent-tint)] font-semibold text-[var(--nx-accent-hover)]' : ' text-gray-700');
                            div.textContent = f.label;
                            div.addEventListener('mousedown', (e) => {
                                e.preventDefault();
                                hiddenInput.value = f.value;
                                hiddenInput._userSelected = true;
                                searchInput.value = f.label;
                                dropdown.classList.add('hidden');
                                hiddenInput.dispatchEvent(new Event('change', { bubbles: true }));
                            });
                            dropdown.appendChild(div);
                        });
                    }
                    dropdown.classList.remove('hidden');
                }

                function closeDropdown() {
                    dropdown.classList.add('hidden');
                    if (hiddenInput._userSelected) {
                        // Restore the selected field's label
                        const opts = hiddenInput._docFieldOptions || [];
                        const current = opts.find(f => f.value === hiddenInput.value);
                        if (current) searchInput.value = current.label;
                    } else {
                        searchInput.value = '';
                    }
                }

                searchInput.addEventListener('input', () => renderDropdown(searchInput.value));
                searchInput.addEventListener('focus', () => renderDropdown(searchInput.value));
                // Close on a real click outside the combobox -- NOT on blur. Dragging the
                // dropdown's native scrollbar blurs the input without dispatching a DOM
                // mousedown we can cancel, so the old blur-based close hid the list
                // mid-scroll: a long field list looked un-scrollable to mouse users.
                document.addEventListener('mousedown', (e) => {
                    if (!dropdown.classList.contains('hidden') && !wrapper.contains(e.target)) {
                        closeDropdown();
                    }
                });
                // Keyboard: Tab/Escape leaves the combobox -> close. We deliberately do
                // NOT close on plain blur, so grabbing the dropdown's native scrollbar
                // (which blurs the input) keeps the list open instead of hiding mid-scroll.
                searchInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' || e.key === 'Tab') closeDropdown();
                });
            }

            // Row 1's "x" clears rather than removes it -- it's the anchor row
            // and always exists (issue #185). Only worth showing once there's
            // actually something to clear.
            function syncClearButton(row) {
                const btn = row.querySelector('.clear-doc-filter');
                if (!btn) return;
                const field = row.querySelector('.doc-filter-field');
                const value = row.querySelector('.doc-filter-value');
                const hasContent = !!(field?.value || value?.value);
                btn.classList.toggle('hidden', !hasContent);
            }

            function addDocFilterRow() {
                const tpl = document.getElementById('docFilterRowTemplate');
                const container = document.getElementById('docFiltersContainer');
                const process = document.getElementById('prcfW')?.value || 'all';
                if (!tpl || !container) return;
                const node = tpl.content.firstElementChild.cloneNode(true);
                const hiddenInput = node.querySelector('.doc-filter-field');
                fillDocFieldSelect(hiddenInput, process);
                const combo = node.querySelector('.doc-field-combobox');
                if (combo) initDocFieldCombobox(combo);
                container.appendChild(node);
            }


            (function initMultiDocFilters() {
                const container = document.getElementById('docFiltersContainer');
                const addBtn = document.getElementById('addDocFilterBtn');
                if (!container) return;

                if (addBtn) addBtn.addEventListener('click', addDocFilterRow);

                container.addEventListener('input', (e) => {
                    if (e.target.classList.contains('doc-filter-value')) {
                        const row = e.target.closest('.doc-filter-row');
                        debounceFetchRowSuggestions(row, e.target.value);
                        syncClearButton(row);
                    }
                });

                container.addEventListener('focusin', (e) => {
                    if (e.target.classList.contains('doc-filter-value')) {
                        const row = e.target.closest('.doc-filter-row');
                        fetchRowSuggestions(row, e.target.value);
                    }
                });

                container.addEventListener('keydown', (e) => {
                    if (e.target.classList.contains('doc-filter-value') && e.key === 'Enter') {
                        e.preventDefault();
                        hideRowList(e.target.closest('.doc-filter-row'));
                        const form = document.getElementById('filterForm');
                        if (form?.requestSubmit) form.requestSubmit(); else fetchAndUpdateWorkitems();
                    }
                });

                container.addEventListener('click', (e) => {
                    const item = e.target.closest('.doc-row-suggestion');
                    if (item) {
                        const row = item.closest('.doc-filter-row');
                        const input = row.querySelector('.doc-filter-value');
                        input.value = item.dataset.value ?? item.textContent;
                        // Labeled (value-first) suggestion: lock the field it came
                        // from so the search runs field-precise from here on.
                        if (item.dataset.field) {
                            const hiddenInput = row.querySelector('.doc-filter-field');
                            const fieldSearch = row.querySelector('.doc-filter-field-search');
                            if (hiddenInput) {
                                hiddenInput.value = item.dataset.field;
                                hiddenInput._userSelected = true;
                            }
                            if (fieldSearch) fieldSearch.value = fieldLabelFor(item.dataset.field);
                        }
                        syncClearButton(row);
                        hideRowList(row);
                        const form = document.getElementById('filterForm');
                        if (form?.requestSubmit) form.requestSubmit(); else fetchAndUpdateWorkitems();
                    }
                    if (e.target.closest('.remove-doc-filter')) {
                        const row = e.target.closest('.doc-filter-row');
                        row.remove();
                        const form = document.getElementById('filterForm');
                        if (form?.requestSubmit) form.requestSubmit(); else fetchAndUpdateWorkitems();
                    }
                    if (e.target.closest('.clear-doc-filter')) {
                        const row = e.target.closest('.doc-filter-row');
                        const fieldSearch = row.querySelector('.doc-filter-field-search');
                        const fieldHidden = row.querySelector('.doc-filter-field');
                        const opSelect = row.querySelector('.doc-filter-op');
                        const valueInput = row.querySelector('.doc-filter-value');
                        if (fieldSearch) fieldSearch.value = '';
                        if (fieldHidden) {
                            fieldHidden.value = '';
                            fieldHidden.removeAttribute('data-selected');
                            fieldHidden._userSelected = false;
                        }
                        if (opSelect) opSelect.selectedIndex = 0;
                        if (valueInput) valueInput.value = '';
                        syncClearButton(row);
                        const form = document.getElementById('filterForm');
                        if (form?.requestSubmit) form.requestSubmit(); else fetchAndUpdateWorkitems();
                    }
                });

                container.addEventListener('focusout', (e) => {
                    if (e.target.classList.contains('doc-filter-value')) {
                        const row = e.target.closest('.doc-filter-row');
                        setTimeout(() => hideRowList(row), 200);
                    }
                });

                // Field combobox selection (initDocFieldCombobox fires this on
                // the hidden input) -- keep row 1's clear button in sync.
                container.addEventListener('change', (e) => {
                    if (e.target.classList.contains('doc-filter-field')) {
                        syncClearButton(e.target.closest('.doc-filter-row'));
                    }
                });

                // Operator / AND-OR change -> re-run the search (the backend
                // skips rows whose value is still empty, so this is safe).
                container.addEventListener('change', (e) => {
                    if (e.target.classList.contains('doc-filter-op') ||
                        e.target.classList.contains('doc-filter-comb')) {
                        const form = document.getElementById('filterForm');
                        if (form?.requestSubmit) form.requestSubmit(); else fetchAndUpdateWorkitems();
                    }
                });

                const procSel = document.getElementById('prcfW');
                if (procSel) {
                    procSel.addEventListener('change', () => {
                        container.querySelectorAll('.doc-filter-field').forEach(hiddenInput => fillDocFieldSelect(hiddenInput, procSel.value));
                    });
                }
            })();


            function hideRowList(row) {

            async function fetchAndUpdateWorkitems(page = 1) {
                // Stale-response guard: rapid re-submits (e.g. two smart-search
                // chips added back-to-back) race, and the FIRST response can land
                // last, overwriting the newer result. Only the latest wins.
                const seq = fetchAndUpdateWorkitems._seq = (fetchAndUpdateWorkitems._seq || 0) + 1;
                const tbody = document.getElementById('workitemsTbody');
                const filterForm = document.getElementById('filterForm');
                const params = new URLSearchParams();
                for (const el of filterForm.elements) {
                    if (!el.name || el.disabled || el.type === 'file' || el.type === 'hidden') continue;
                    if ((el.type === 'checkbox' || el.type === 'radio') && !el.checked) continue;
                    params.append(el.name, el.value);
                }
                params.set('page', page);
                const fetchParams = new URLSearchParams(params);
                // Always the real requested perPage (40/100/200/500/1000), never
                // the fast-chunk override below -- the address bar/history entry
                // must reflect what the user actually asked for.
                const newUrl = `${window.location.pathname}?${params.toString()}`;
                window.history.pushState({ path: newUrl }, '', newUrl);

                // Skeleton rows, single source of truth in workitems_overview.html (#189)
                const loaderHtml = document.getElementById('workitemsSkeletonTpl').innerHTML;

                if (tbody) {
                    tbody.innerHTML = loaderHtml;
                }

                const requestedPerPage = parseInt(fetchParams.get('perPage') || '40', 10);
                const needsFastChunk = requestedPerPage > FAST_CHUNK_PER_PAGE;

                try {
                    if (needsFastChunk) {
                        const fastParams = new URLSearchParams(fetchParams);
                        fastParams.set('perPage', FAST_CHUNK_PER_PAGE);
                        const fastData = await _fetchWorkitemsJson(fastParams);
                        if (seq !== fetchAndUpdateWorkitems._seq) return;  // superseded
                        // Pagination is deliberately NOT updated from this partial
                        // chunk -- it's computed against perPage=40, so "1 / 25"
                        // would flash briefly before the real perPage=1000 numbers
                        // land a moment later. Only the rows themselves preview
                        // early; the count/pagination UI waits for the real data.
                        renderTable(fastData.workitems);
                        _appendLoadingMoreRow();
                    }

                    const data = await _fetchWorkitemsJson(fetchParams);
                    if (seq !== fetchAndUpdateWorkitems._seq) return;  // superseded
                    try { renderDegradedBanner(data.degradedSources || []); } catch (bannerErr) { console.warn('renderDegradedBanner error:', bannerErr); }
                    renderTable(data.workitems);
                    renderPagination(data.pagination);

                } catch (error) {
                    if (seq !== fetchAndUpdateWorkitems._seq) return;
                    console.error("Failed to fetch or render workitems:", error);
                    if (tbody) {
                        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-10 text-red-500">{{ _("Failed to load data. Please try again.") }}</td></tr>`;
                    }
                }
            }

            async function runExport() {
                _setExportSpinner(true);
                const btn = document.getElementById('confirmExportModalBtn');

                // Build params from current filter form
                const filterForm = document.getElementById('filterForm');
                const params = new URLSearchParams();
                for (const el of filterForm.elements) {

                if (document.getElementById('exportOptImages')?.checked)  include.push('images');

                    const resp = await fetch(url, { headers: { 'X-CSRFToken': csrfToken } });
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

            let sortState = {
                columnIndex: -1,
                ascending: true
            };

            function sortTable(columnIndex) {
                const table = document.getElementById("workitemsTable");
                const tbody = table.tBodies[0];
                const headers = table.querySelectorAll('.sortable-header');

                if (sortState.columnIndex === columnIndex) {
                    sortState.ascending = !sortState.ascending;
                } else {
                    sortState.columnIndex = columnIndex;
                    sortState.ascending = true;
                }

                const rowsToSort = Array.from(tbody.querySelectorAll(".workitem-row")).map(row => {
                    return {
                        mainRow: row,
                        detailsRow: row.nextElementSibling
                    };
                });

                rowsToSort.sort((a, b) => {
                    const aCell = a.mainRow.cells[columnIndex];
                    const bCell = b.mainRow.cells[columnIndex];
                    if (!aCell || !bCell) return 0;

                    const aText = aCell.textContent.trim();
                    const bText = bCell.textContent.trim();

                    let comparison = 0;
                    if (columnIndex === 3) {
                        // renderTable writes ISO "YYYY-MM-DD HH:MM:SS" (see the
                        // "Last movement at" cell). Parse that directly; fall back
                        // to plain string comparison for this pair if either side
                        // isn't a valid date, rather than letting NaN silently no-op
                        // the whole sort.
                        const parseDate = (str) => new Date(str.replace(' ', 'T'));
                        const aDate = parseDate(aText);
                        const bDate = parseDate(bText);
                        if (isNaN(aDate) || isNaN(bDate)) {
                            comparison = aText.localeCompare(bText, undefined, {
                                numeric: true
                            });
                        } else {
                            comparison = aDate - bDate;
                        }
                    } else {
                        comparison = aText.localeCompare(bText, undefined, {
                            numeric: true
                        });
                    }

                    return sortState.ascending ? comparison : -comparison;
                });

                tbody.innerHTML = '';
                rowsToSort.forEach(pair => {
                    tbody.appendChild(pair.mainRow);
                    if (pair.detailsRow && pair.detailsRow.classList.contains('details-row')) {
                        tbody.appendChild(pair.detailsRow);
                    }
                });

                headers.forEach((header) => {
                    const icon = header.querySelector('i');
                    if (icon) {
                        icon.className = 'fas fa-sort text-gray-400 group-hover:text-gray-600 transition-colors';
                        if (parseInt(header.dataset.columnIndex, 10) === columnIndex) {
                            icon.classList.remove('fa-sort');
                            icon.classList.add(sortState.ascending ? 'fa-sort-up' : 'fa-sort-down');
                            icon.classList.add('text-[var(--nx-accent)]');
                        }
                    }
                });
            }

            const exportCsvBtn    = document.getElementById('exportCsvBtn');

            if (bulkExportBtn) {
                bulkExportBtn.addEventListener('click', () => openExportModal(new Set(selectedWorkitemIds)));
            }
            if (bulkDeselectBtn) {
                bulkDeselectBtn.addEventListener('click', () => {
                    selectedWorkitemIds.clear();
                    document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = false);
                    const sAll = document.getElementById('selectAllCheckbox');
                    if (sAll) { sAll.checked = false; sAll.indeterminate = false; }
                    updateBulkBar();
                });
            }
            if (exportCsvBtn) {
                exportCsvBtn.addEventListener('click', () => openExportModal(new Set()));
            }

            // ---- Export modal buttons ----
            document.getElementById('closeExportModalBtn')?.addEventListener('click', closeExportModal);
            document.getElementById('cancelExportModalBtn')?.addEventListener('click', closeExportModal);
            document.getElementById('confirmExportModalBtn')?.addEventListener('click', runExport);
            document.getElementById('exportOptionsModal')?.addEventListener('click', e => {
                if (e.target === e.currentTarget) closeExportModal();
            });

            // Show helper info when images checkbox is ticked; highlight once on first show
            let _helperHighlighted = false;
            document.getElementById('exportOptImages')?.addEventListener('change', e => {
                document.getElementById('exportImagesHelperInfo').classList.toggle('[display:none]!', !e.target.checked);
                if (e.target.checked && !_helperHighlighted) {
                    const codeEl = document.getElementById('exportHelperScript');
                    if (codeEl && window.hljs) { hljs.highlightElement(codeEl); }
                    _helperHighlighted = true;
                }
            });

            document.getElementById('copyHelperScriptBtn')?.addEventListener('click', function() {
                const codeEl = document.getElementById('exportHelperScript');
                navigator.clipboard.writeText(codeEl.innerText).then(() => {
                    this.innerHTML = '<i class="fas fa-check text-xs"></i>';
                    setTimeout(() => { this.innerHTML = '<i class="fas fa-copy text-xs"></i>'; }, 1500);
                });
            });

            // ---- Saved filter views (issue #170) ----
            // Per-user named presets of the whole filter form (incl. Advanced +
            // doc-value rows), shown as chips between the filter card and the
            // table. Persisted via /api/workitem_filter_views as the same
            // [name, value] pair list the form serializer builds above.
            const savedViewsBar = document.getElementById('savedViewsBar');
            let savedViews = [];
            let activeViewId = null;

            function serializeFilters() {
                const pairs = [];
                for (const el of filterForm.elements) {
                    if (!el.name || el.disabled || el.type === 'file' || el.type === 'hidden') continue;
                    if ((el.type === 'checkbox' || el.type === 'radio') && !el.checked) continue;
                    pairs.push([el.name, el.value]);
                }
                return pairs;
            }

            async function viewsApi(path, opts = {}) {
                const res = await fetch(`${API_PREFIX}api/workitem_filter_views${path}`, {
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                    ...opts,
                });
                const body = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
                return body;
            }

            // Chip styling shared by plain view chips and folder chips (#186).
            const CHIP_ACTIVE = 'bg-[var(--nx-accent)] border-[var(--nx-accent)] text-white';
            const CHIP_IDLE = 'bg-white border-gray-200 text-gray-600 hover:border-[var(--nx-accent)] hover:text-[var(--nx-accent-hover)]';

            function makeActionBtn(icon, title, active, hoverColor, handler) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'px-1 py-1.5 ' +
                    (active ? 'text-[var(--nx-accent-tint)] hover:text-white' : `text-gray-300 ${hoverColor}`);
                btn.innerHTML = `<i class="fas ${icon} text-xs"></i>`;
                btn.title = title;
                btn.setAttribute('aria-label', title);
                btn.addEventListener('click', handler);
                return btn;
            }

            function makeViewChip(v) {
                const active = v.id === activeViewId;
                const chip = document.createElement('span');
                chip.className = 'saved-view-chip inline-flex items-center rounded-full border text-sm font-medium transition-colors pr-1 ' +
                    (active ? CHIP_ACTIVE : CHIP_IDLE);
                chip.dataset.testid = 'workitems-view-chip';

                const nameBtn = document.createElement('button');
                nameBtn.type = 'button';
                nameBtn.className = 'pl-3 pr-1 py-1.5 cursor-pointer';
                nameBtn.textContent = v.name;
                nameBtn.title = active ? {{ _("Deselect view")|tojson }} : {{ _("Apply view")|tojson }};
                nameBtn.addEventListener('click', () => active ? deselectView() : applyView(v));
                chip.appendChild(nameBtn);
                // A dedicated pencil, NOT dblclick-on-name: applying re-renders
                // the chips, so the second click of a dblclick lands on a
                // replaced node and the rename handler never fires. The editor
                // it opens is also where DELETE lives — an always-visible x
                // deleted views when people expected it to deselect them.
                chip.appendChild(makeActionBtn('fa-pen', {{ _("Edit view")|tojson }}, active,
                    'hover:text-[var(--nx-accent)]', () => startEdit(v)));
                if (active) {
                    chip.appendChild(makeActionBtn('fa-times', {{ _("Deselect view")|tojson }}, active,
                        'hover:text-red-500', deselectView));
                }
                return chip;
            }

            // Folder chip (#186): one chip per folder, opening a dropdown that
            // lists the folder's views (click applies / toggles off, pencil edits).
            function makeFolderChip(folder, views) {
                const wrap = document.createElement('span');
                wrap.className = 'saved-view-folder relative inline-flex';
                const hasActive = views.some(v => v.id === activeViewId);

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'inline-flex items-center gap-2 px-3 py-1.5 rounded-full border text-sm font-medium transition-colors ' +
                    (hasActive ? CHIP_ACTIVE : CHIP_IDLE);
                btn.dataset.testid = 'workitems-view-folder';
                btn.title = folder;
                const icon = document.createElement('i');
                icon.className = 'fas fa-folder text-xs';
                const label = document.createElement('span');
                label.textContent = `${folder} (${views.length})`;
                const chev = document.createElement('i');
                chev.className = 'fas fa-chevron-down text-xs';
                btn.append(icon, label, chev);

                const menu = document.createElement('div');
                menu.className = 'saved-view-folder-menu hidden absolute z-20 top-full left-0 mt-1 min-w-56 bg-white border border-gray-200 rounded-lg shadow-lg py-1';
                views.forEach(v => {
                    const active = v.id === activeViewId;
                    const row = document.createElement('div');
                    row.className = 'flex items-center px-2 py-0.5';
                    const applyBtn = document.createElement('button');
                    applyBtn.type = 'button';
                    applyBtn.className = 'flex-1 text-left px-2 py-1 text-sm rounded truncate ' +
                        (active ? 'bg-[var(--nx-accent-tint)] font-semibold text-[var(--nx-accent-hover)]' : 'text-gray-700 hover:bg-[var(--nx-accent-tint)]');
                    applyBtn.textContent = v.name;
                    applyBtn.title = active ? {{ _("Deselect view")|tojson }} : {{ _("Apply view")|tojson }};
                    applyBtn.dataset.testid = 'workitems-view-menu-apply';
                    applyBtn.addEventListener('click', () => active ? deselectView() : applyView(v));
                    row.appendChild(applyBtn);
                    row.appendChild(makeActionBtn('fa-pen', {{ _("Edit view")|tojson }}, false,
                        'hover:text-[var(--nx-accent)]', () => startEdit(v)));
                    menu.appendChild(row);
                });

                btn.addEventListener('click', () => {
                    const wasHidden = menu.classList.contains('hidden');
                    savedViewsBar.querySelectorAll('.saved-view-folder-menu').forEach(m => m.classList.add('hidden'));
                    menu.classList.toggle('hidden', !wasHidden);
                });
                wrap.append(btn, menu);
                return wrap;
            }

            function renderSavedViews() {
                savedViewsBar.querySelectorAll('.saved-view-chip, .saved-view-folder').forEach(c => c.remove());
                const folders = new Map();
                savedViews.forEach(v => {
                    if (!v.folder) return;
                    if (!folders.has(v.folder)) folders.set(v.folder, []);
                    folders.get(v.folder).push(v);
                });
                savedViews.filter(v => !v.folder).forEach(v => savedViewsBar.appendChild(makeViewChip(v)));
                folders.forEach((views, folder) => savedViewsBar.appendChild(makeFolderChip(folder, views)));
                savedViewsBar.classList.toggle('hidden',
                    savedViews.length === 0 && !savedViewsBar.querySelector('input'));
            }

            const sortViews = () => savedViews.sort((a, b) =>
                (a.folder || '').localeCompare(b.folder || '') || a.name.localeCompare(b.name));

            // Close any open folder dropdown on a click outside its chip.
            document.addEventListener('mousedown', e => {
                if (!e.target.closest('.saved-view-folder')) {
                    savedViewsBar.querySelectorAll('.saved-view-folder-menu').forEach(m => m.classList.add('hidden'));
                }
            });

            // Inline editor shared by save + edit: view name + optional
            // folder (#186). The folder input opens a dropdown of the folders
            // that already exist — click to pick, or type a new name (a
            // datalist was tried first and nobody found it). Enter commits,
            // Escape or focusing elsewhere cancels. When editing an existing
            // view (onDelete given), a trash button deletes it — deletion
            // lives here, behind the pencil, on purpose.
            function viewEditor(initial, onCommit, onDelete) {
                const wrap = document.createElement('span');
                wrap.className = 'saved-view-editor inline-flex items-center gap-2';

                const nameIn = document.createElement('input');
                nameIn.type = 'text';
                nameIn.maxLength = 100;
                nameIn.value = initial.name || '';
                nameIn.placeholder = {{ _("View name…")|tojson }};
                nameIn.className = 'nx-input h-9 w-48 text-sm';
                nameIn.dataset.testid = 'workitems-view-name-input';

                const folderWrap = document.createElement('span');
                folderWrap.className = 'relative inline-flex';
                const folderIn = document.createElement('input');
                folderIn.type = 'text';
                folderIn.maxLength = 100;
                folderIn.autocomplete = 'off';
                folderIn.value = initial.folder || '';
                folderIn.placeholder = {{ _("optional")|tojson }};
                folderIn.className = 'nx-input h-9 w-40 text-sm pr-7';
                folderIn.dataset.testid = 'workitems-view-folder-input';
                const chev = document.createElement('span');
                chev.className = 'pointer-events-none absolute inset-y-0 right-0 flex items-center pr-2 text-gray-400';
                chev.innerHTML = '<i class="fa-solid fa-chevron-down text-xs"></i>';
                const folderList = document.createElement('div');
                folderList.className = 'hidden absolute z-30 top-full left-0 mt-1 w-full bg-white border border-gray-200 rounded-lg shadow-lg max-h-48 overflow-y-auto';
                folderList.dataset.testid = 'workitems-view-folder-options';
                const existingFolders = [...new Set(savedViews.map(v => v.folder).filter(Boolean))].sort();
                const renderFolderList = q => {
                    folderList.innerHTML = '';
                    const ql = (q || '').toLowerCase();
                    existingFolders.filter(f => !ql || f.toLowerCase().includes(ql)).forEach(f => {
                        const opt = document.createElement('div');
                        opt.className = 'px-3 py-1.5 text-sm cursor-pointer text-gray-700 hover:bg-[var(--nx-accent-tint)] truncate';
                        opt.textContent = f;
                        // mousedown, not click: keeps focus in the input so the
                        // editor's focusout-cancel doesn't fire first.
                        opt.addEventListener('mousedown', ev => {
                            ev.preventDefault();
                            folderIn.value = f;
                            folderList.classList.add('hidden');
                        });
                        folderList.appendChild(opt);
                    });
                    folderList.classList.toggle('hidden', !folderList.children.length);
                };
                folderIn.addEventListener('focus', () => renderFolderList(folderIn.value));
                folderIn.addEventListener('input', () => renderFolderList(folderIn.value));
                folderWrap.append(folderIn, chev, folderList);

                let done = false;
                const finish = commit => {
                    if (done) return;
                    done = true;
                    const name = nameIn.value.trim();
                    const folder = folderIn.value.trim();
                    wrap.remove();
                    renderSavedViews();
                    if (commit && name) onCommit(name, folder);
                };
                [nameIn, folderIn].forEach(inp => inp.addEventListener('keydown', e => {
                    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
                    if (e.key === 'Escape') finish(false);
                }));
                wrap.addEventListener('focusout', e => {
                    if (!wrap.contains(e.relatedTarget)) finish(false);
                });
                wrap.append(nameIn, folderWrap);
                if (onDelete) {
                    const del = document.createElement('button');
                    del.type = 'button';
                    del.className = 'px-2 py-1.5 text-gray-400 hover:text-red-500 transition-colors';
                    del.innerHTML = '<i class="fas fa-trash text-sm"></i>';
                    del.title = {{ _("Delete view")|tojson }};
                    del.setAttribute('aria-label', {{ _("Delete view")|tojson }});
                    del.dataset.testid = 'workitems-view-delete';
                    del.addEventListener('click', () => {
                        done = true;
                        wrap.remove();
                        onDelete();
                    });
                    wrap.appendChild(del);
                }
                return wrap;
            }

            function startSave() {
                if (savedViewsBar.querySelector('input')) return;
                const editor = viewEditor({}, async (name, folder) => {
                    const filters = serializeFilters();
                    try {
                        const saved = await viewsApi('', {
                            method: 'POST',
                            body: JSON.stringify({ name, folder, filters }),
                        });
                        savedViews = savedViews.filter(v => v.id !== saved.id);
                        savedViews.push({ id: saved.id, name: saved.name, folder: saved.folder || '', filters });
                        sortViews();
                        activeViewId = saved.id;
                        showNotification({{ _("View saved.")|tojson }});
                    } catch (e) {
                        showNotification(e.message, 'error');
                    }
                    renderSavedViews();
                });
                savedViewsBar.classList.remove('hidden');
                savedViewsBar.appendChild(editor);
                editor.querySelector('input').focus();
            }

            function startEdit(v) {
                if (savedViewsBar.querySelector('input')) return;
                savedViewsBar.querySelectorAll('.saved-view-folder-menu').forEach(m => m.classList.add('hidden'));
                const editor = viewEditor({ name: v.name, folder: v.folder }, async (name, folder) => {
                    if (name !== v.name || folder !== (v.folder || '')) {
                        try {
                            await viewsApi('', {
                                method: 'POST',
                                body: JSON.stringify({ id: v.id, name, folder, filters: v.filters }),
                            });
                            v.name = name;
                            v.folder = folder;
                            sortViews();
                        } catch (e) {
                            showNotification(e.message, 'error');
                        }
                    }
                    renderSavedViews();
                }, () => deleteView(v));
                savedViewsBar.appendChild(editor);
                const nameIn = editor.querySelector('input');
                nameIn.focus();
                nameIn.select();
            }

            // Deselect = back to the default, unfiltered list: applying an
            // empty view resets every filter and clears the highlight.
            function deselectView() {
                applyView({ id: null, filters: [] });
            }

            async function deleteView(v) {
                try {
                    await viewsApi(`/${v.id}`, { method: 'DELETE' });
                    savedViews = savedViews.filter(x => x.id !== v.id);
                    if (activeViewId === v.id) activeViewId = null;
                    renderSavedViews();
                } catch (e) {
                    showNotification(e.message, 'error');
                }
            }

            function applyView(v) {
                const byName = {};
                v.filters.forEach(([k, val]) => { (byName[k] = byName[k] || []).push(val); });
                const one = k => (byName[k] || [''])[0];

                const prcfW = document.getElementById('prcfW');
                prcfW.value = one('prcfW') || 'all';
                if (prcfW._nxScopeSync) prcfW._nxScopeSync();
                _updatePreparedDocsLink();

                document.getElementById('searchInput').value = one('search');
                document.getElementById('stageFilter').value = one('stage');
                document.getElementById('statusFilter').value = one('status');
                if (datePreset) datePreset.value = '';
                ['startDate', 'endDate'].forEach(id => {
                    const el = document.getElementById(id);
                    el.value = one(id);
                    if (el._flatpickr) el._flatpickr.setDate(el.value || null, false);
                });
                if (byName.perPage) document.getElementById('filterPerPage').value = one('perPage');

                // Doc-value rows: prune to row 1, re-add as needed, fill
                // index-aligned (doccomb/docfield/docop/docvalue).
                const container = document.getElementById('docFiltersContainer');
                container.querySelectorAll('.doc-filter-row').forEach((row, i) => { if (i > 0) row.remove(); });
                const nRows = Math.max(1, (byName.docfield || []).length);
                for (let i = 1; i < nRows; i++) addDocFilterRow();
                const process = prcfW.value || 'all';
                container.querySelectorAll('.doc-filter-row').forEach((row, i) => {
                    const comb = row.querySelector('select[name="doccomb"]');
                    if (comb) comb.value = (byName.doccomb || [])[i] || 'and';
                    const hidden = row.querySelector('.doc-filter-field');
                    hidden.value = (byName.docfield || [])[i] || '';
                    hidden.setAttribute('data-selected', hidden.value);
                    // Restores the visible label; a field the user can no longer
                    // see simply resolves to "All fields" (permission drop).
                    fillDocFieldSelect(hidden, process);
                    row.querySelector('.doc-filter-op').value = (byName.docop || [])[i] || 'contains';
                    row.querySelector('.doc-filter-value').value = (byName.docvalue || [])[i] || '';
                    syncClearButton(row);
                });

                // Open Advanced when the view actually uses it (mirrors the
                // URL-restore auto-open above), close it otherwise.
                const usesAdvanced = one('startDate') || one('endDate') ||
                    (byName.docfield || []).some(x => x) || (byName.docvalue || []).some(x => x);
                advancedContainer.classList.toggle('hidden', !usesAdvanced);

                activeViewId = v.id;
                renderSavedViews();
                fetchAndUpdateWorkitems(1);
            }

            // Editing any filter by hand means the chip no longer describes the
            // list — drop the highlight. applyView sets values without firing
            // events, so applying itself doesn't clear it. The bar lives inside
            // the filter form's toolbar row, so ignore events bubbling out of
            // the chips/editor themselves (typing a view name is not a filter
            // edit).
            function clearActiveView(e) {
                if (e && savedViewsBar.contains(e.target)) return;
                if (activeViewId === null) return;
                activeViewId = null;
                renderSavedViews();
            }
            filterForm.addEventListener('input', clearActiveView);
            filterForm.addEventListener('change', clearActiveView);

            document.getElementById('saveViewBtn')?.addEventListener('click', startSave);
            viewsApi('').then(data => {
                savedViews = (data.views || []).map(v => ({ ...v, folder: v.folder || '' }));
                sortViews();
                renderSavedViews();
            }).catch(() => { /* bar just stays hidden */ });
        });
    </script>
</body>
