<script nonce="{{ csp_nonce() }}">
  // Jinja-rendered data for static/js/workitems_overview.js (#191): the
  // details-panel permission flags, the current doc-field filter value
  // (restored server-side on a direct link) and the strings the behaviour
  // needs. Babel still extracts from templates/**.html.
  window.NX_WORKITEMS_OVERVIEW = {
    perms: {
      images: {{ details_images_perm|tojson }},
      audit:  {{ details_audit_perm|tojson }},
      fields: {{ details_fields_perm|tojson }}
    },
    stages: {{ workitem_stages|tojson }},
    docfield: {{ (docfield or '')|tojson }},
    i18n: {
      pleaseSelectValidPdf: {{ _("Please select valid PDF files.")|tojson }},
      filesSelected: {{ _("files selected")|tojson }},
      import_: {{ _("Import")|tojson }},
      importFile: {{ _("Import File")|tojson }},
      noFieldsAvailable: {{ _("No fields available")|tojson }},
      noResults: {{ _("No results")|tojson }},
      allFields: {{ _("All fields")|tojson }},
      primarySource: {{ _("primary")|tojson }},
      someUnavailable: {{ _("Some workitems are temporarily unavailable:")|tojson }},
      loadingRest: {{ _("Loading the rest in the background…")|tojson }},
      failedToLoad: {{ _("Failed to load data. Please try again.")|tojson }},
      selected: {{ _("selected")|tojson }},
      selectedWillExport: {{ _("selected workitems will be exported")|tojson }},
      allWillExport: {{ _("All workitems matching current filters will be exported")|tojson }},
      exportFailed: {{ _("Export failed. Please try again.")|tojson }},
      noWorkitemsFound: {{ _("No workitems match the current filters.")|tojson }},
      {# count=/n= echo their own placeholder token: gettext's %-substitution
         always runs (jinja2.ext, unlike flask_babel's, doesn't skip it for
         zero variables), so a bare %(count)s with no kwarg raises KeyError.
         Substituting the token for itself keeps ".po" msgids readable for
         translators while leaving the literal token in place for JS's own
         .replace() to fill in per render. #}
      shownSortedByLastMovement: {{ _("%(count)s shown · sorted by last movement", count="%(count)s")|tojson }},
      minAgo: {{ _("%(n)s min ago", n="%(n)s")|tojson }},
      hAgo: {{ _("%(n)s h ago", n="%(n)s")|tojson }},
      dAgo: {{ _("%(n)s d ago", n="%(n)s")|tojson }},
      previous: {{ _("Previous")|tojson }},
      next: {{ _("Next")|tojson }},
      deselectView: {{ _("Deselect view")|tojson }},
      applyView: {{ _("Apply view")|tojson }},
      editView: {{ _("Edit view")|tojson }},
      viewNamePlaceholder: {{ _("View name…")|tojson }},
      optional: {{ _("optional")|tojson }},
      deleteView: {{ _("Delete view")|tojson }},
      viewSaved: {{ _("View saved.")|tojson }}
    }
  };
</script>
<script src="{{ static_v('js/workitems_overview.js') }}"></script>
