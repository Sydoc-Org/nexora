<script>
    const API_PREFIX = window.location.href.includes("nexora") ? "/nexora/" : "/";
    const canEdit         = document.getElementById('recordsTable').dataset.canEdit === 'true';
    const canEditTransOrg  = document.getElementById('recordsTable').dataset.canEditTransorg === 'true';
    const currentOrgCode   = document.getElementById('recordsTable').dataset.orgCode || null;
    const canAdd           = document.getElementById('recordsTable').dataset.canAdd  === 'true';
    const canAddForOrg     = document.getElementById('recordsTable').dataset.canAddForOrg === 'true';
    const canAddTransOrg   = document.getElementById('recordsTable').dataset.canAddTransorg === 'true';
    function canEditRecord(r) {
        return canEdit && (canEditTransOrg || r.orgCode === currentOrgCode);
    }
    const colSpan = canEdit ? 6 : 5;

    const BASE_CATEGORIES = [
        "Physical Mailroom, AVOR & Scanning",
        "Nk1 & NK2",
        "POE / PPR"
    ];

    let currentPage = 1;
    let _currentRecords = [];

    function populateCategorySelect(selectEl, selected) {
        while (selectEl.options.length > 1) selectEl.remove(1);
        BASE_CATEGORIES.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat;
            opt.textContent = cat;
            if (cat === selected) opt.selected = true;
            selectEl.appendChild(opt);
        });
    }

    function populateFilterCategorySelect() {
        const sel = document.getElementById('filterCategory');
        BASE_CATEGORIES.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat;
            opt.textContent = cat;
            sel.appendChild(opt);
        });
    }

    function formatDate(dateStr) {
        if (!dateStr) return '—';
        return dateStr.split('T')[0];
    }

    function formatDateTime(dtStr) {
        if (!dtStr) return '—';
        return dtStr.replace('T', ' ').substring(0, 16);
    }

    function formatHours(h) {
        if (h === null || h === undefined) return '—';
        return Number(h) % 1 === 0 ? Number(h).toFixed(0) : Number(h).toFixed(1);
    }

    function buildParams(page) {
        const p = new URLSearchParams();
        const start    = document.getElementById('filterStartDate').value;
        const end      = document.getElementById('filterEndDate').value;
        const category = document.getElementById('filterCategory').value;
        const org      = document.getElementById('filterOrganizationCode').value;
        if (start)    p.set('startDate', start);
        if (end)      p.set('endDate', end);
        if (category) p.set('category', category);
        if (org)      p.set('organizationcode', org);
        p.set('page', page);
        return p;
    }

    function loadOrganizations() {
        fetch(API_PREFIX + 'api/generali/baseservices/organizations', {
            headers: { 'X-CSRFToken': csrfToken }
        })
        .then(r => r.json())
        .then(data => {
            if (!data.success) return;
            const sel = document.getElementById('filterOrganizationCode');
            if (!sel) return;
            (data.organizations || []).forEach(o => {
                const opt = document.createElement('option');
                opt.value = o.code;
                opt.textContent = o.name || o.code;
                sel.appendChild(opt);
            });
        })
        .catch(e => console.error('Failed to load organizations', e));
    }

    function renderRow(r) {
        const editable = canEditRecord(r);
        const actionsCell = canEdit ? `
            <td class="px-4 py-3 text-center whitespace-nowrap">
                <button ${editable ? `onclick="openEditModal(${r.id})"` : 'disabled'}
                    class="inline-flex items-center gap-1 text-xs font-semibold px-2 py-1 rounded-lg transition mr-1
                        ${editable ? 'text-indigo-600 hover:text-indigo-800 hover:bg-indigo-50' : 'text-gray-300 cursor-not-allowed'}">
                    <i class="fas fa-pen text-xs"></i>
                </button>
                <button ${editable ? `onclick="deleteRecord(${r.id})"` : 'disabled'}
                    class="inline-flex items-center gap-1 text-xs font-semibold px-2 py-1 rounded-lg transition
                        ${editable ? 'text-red-500 hover:text-red-700 hover:bg-red-50' : 'text-gray-300 cursor-not-allowed'}">
                    <i class="fas fa-trash text-xs"></i>
                </button>
            </td>` : '';

        return `<tr class="hover:bg-gray-50 transition" data-record-id="${r.id}" data-for-date="${r.forDate || ''}" data-category="${(r.category||'').replace(/"/g,'&quot;')}" data-effort="${r.effortInHours !== null ? r.effortInHours : ''}">
            <td class="px-4 py-3 text-center whitespace-nowrap">
                <span class="text-sm font-semibold text-gray-800">${formatDate(r.forDate)}</span>
            </td>
            <td class="px-4 py-3 text-center whitespace-nowrap">
                <span class="text-sm text-gray-700">${r.fullname || r.userId || '—'}</span>
            </td>
            <td class="px-4 py-3 text-left">
                <span class="text-sm text-gray-800">${r.category || '—'}</span>
            </td>
            <td class="px-4 py-3 text-center whitespace-nowrap">
                <span class="px-2.5 py-1 text-xs font-semibold rounded-full bg-indigo-50 text-indigo-700">${formatHours(r.effortInHours)} h</span>
            </td>
            <td class="px-4 py-3 text-center whitespace-nowrap">
                <span class="text-xs text-gray-400">${formatDateTime(r.recordDateTime)}</span>
            </td>
            ${actionsCell}
        </tr>`;
    }

    function loadRecords(page) {
        currentPage = page;
        const tbody = document.getElementById('recordsTbody');
        tbody.innerHTML = `<tr><td colspan="${colSpan}" class="text-center py-16"><i class="fas fa-spinner fa-spin text-3xl text-indigo-600"></i></td></tr>`;

        const params = buildParams(page);
        fetch(API_PREFIX + 'api/generali/baseservices?' + params.toString(), {
            headers: { 'X-CSRFToken': csrfToken }
        })
        .then(r => r.json())
        .then(data => {
            if (!data.success) {
                tbody.innerHTML = `<tr><td colspan="${colSpan}" class="text-center py-10 text-red-500 text-sm">${data.error || 'Error'}</td></tr>`;
                return;
            }

            const th = data.totalHours;
            document.getElementById('totalHoursDisplay').textContent =
                th !== undefined ? formatHours(th) + ' h' : '—';

            _currentRecords = data.records;
            if (!data.records.length) {
                tbody.innerHTML = `<tr><td colspan="${colSpan}" class="text-center py-16 text-gray-400 text-sm">{{ _("No records found") }}</td></tr>`;
            } else {
                tbody.innerHTML = data.records.map(renderRow).join('');
            }

            const pg = data.pagination;
            const showing = Math.min((pg.page - 1) * pg.per_page + data.records.length, pg.total_records);
            document.getElementById('showingCount').textContent = showing;
            document.getElementById('totalCount').textContent = pg.total_records;
            renderPagination(pg.page, pg.total_pages);
        })
        .catch(e => {
            tbody.innerHTML = `<tr><td colspan="${colSpan}" class="text-center py-10 text-red-500 text-sm">Network error</td></tr>`;
            console.error(e);
        });
    }

    function renderPagination(page, totalPages) {
        const container = document.getElementById('paginationControls');
        container.innerHTML = '';
        if (totalPages <= 1) return;

        function btn(label, targetPage, disabled, active) {
            const b = document.createElement('button');
            b.innerHTML = label;
            b.disabled = disabled;
            b.className = [
                'px-3 py-1.5 rounded-lg text-sm font-semibold transition',
                active   ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white border border-gray-200 text-gray-600 hover:bg-gray-50',
                disabled ? 'opacity-40 cursor-not-allowed' : ''
            ].join(' ');
            if (!disabled) b.onclick = () => loadRecords(targetPage);
            return b;
        }

        container.appendChild(btn('<i class="fas fa-chevron-left"></i>', page - 1, page === 1, false));

        const pages = new Set([1, totalPages, page]);
        if (page > 2) pages.add(page - 1);
        if (page < totalPages - 1) pages.add(page + 1);

        let prev = 0;
        [...pages].sort((a,b) => a-b).forEach(p => {
            if (p - prev > 1) {
                const dots = document.createElement('span');
                dots.textContent = '…';
                dots.className = 'px-2 text-gray-400 text-sm';
                container.appendChild(dots);
            }
            container.appendChild(btn(p, p, false, p === page));
            prev = p;
        });

        container.appendChild(btn('<i class="fas fa-chevron-right"></i>', page + 1, page === totalPages, false));
    }

    document.getElementById('applyFilterBtn').addEventListener('click', () => loadRecords(1));
    document.getElementById('resetFilterBtn').addEventListener('click', () => {
        document.getElementById('filterStartDate').value = '';
        document.getElementById('filterEndDate').value = '';
        document.getElementById('filterCategory').value = '';
        document.getElementById('filterOrganizationCode').value = '';
        loadRecords(1);
    });

    flatpickr('#filterStartDate', { dateFormat: 'Y-m-d', allowInput: true });
    flatpickr('#filterEndDate',   { dateFormat: 'Y-m-d', allowInput: true });

    {% if can_add %}
    function loadOrgUsers() {
        if (!canAddForOrg && !canAddTransOrg) return;
        fetch(API_PREFIX + 'api/generali/baseservices/orgUsers', {
            headers: { 'X-CSRFToken': csrfToken }
        })
        .then(r => r.json())
        .then(data => {
            if (!data.success) return;
            const sel = document.getElementById('addUserId');
            if (!sel) return;
            (data.users || []).forEach(u => {
                const opt = document.createElement('option');
                opt.value = u.userId;
                opt.textContent = u.fullname || u.userId;
                sel.appendChild(opt);
            });
        })
        .catch(e => console.error('Failed to load org users', e));
    }

    function openAddModal() {
        document.getElementById('addForDate').value = '';
        document.getElementById('addCategory').value = '';
        document.getElementById('addEffortHours').value = '';
        if (canAddForOrg) document.getElementById('addUserId').value = '';
        document.getElementById('addModalError').classList.add('hidden');
        document.getElementById('addModalError').textContent = '';
        document.getElementById('addModal').classList.remove('hidden');
        document.getElementById('addModal').classList.add('flex');
    }

    function closeAddModal() {
        document.getElementById('addModal').classList.add('hidden');
        document.getElementById('addModal').classList.remove('flex');
    }

    document.getElementById('openAddModalBtn').addEventListener('click', openAddModal);
    document.getElementById('closeAddModalBtn').addEventListener('click', closeAddModal);
    document.getElementById('cancelAddModalBtn').addEventListener('click', closeAddModal);

    flatpickr('#addForDate', { dateFormat: 'Y-m-d', allowInput: true, maxDate: 'today' });

    document.getElementById('submitAddBtn').addEventListener('click', function() {
        const forDate  = document.getElementById('addForDate').value.trim();
        const category = document.getElementById('addCategory').value;
        const effort   = document.getElementById('addEffortHours').value;
        const errEl    = document.getElementById('addModalError');

        if (!forDate || !category || !effort) {
            errEl.textContent = {{ _("Please fill in all fields.") | tojson }};
            errEl.classList.remove('hidden');
            return;
        }

        const payload = { forDate, category, effortInHours: parseFloat(effort) };
        if (canAddForOrg) {
            const selectedUser = document.getElementById('addUserId').value;
            if (selectedUser) payload.userId = parseInt(selectedUser, 10);
        }

        this.disabled = true;
        fetch(API_PREFIX + 'api/generali/baseservices', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
            body: JSON.stringify(payload)
        })
        .then(r => r.json())
        .then(data => {
            this.disabled = false;
            if (data.success) {
                closeAddModal();
                loadRecords(1);
            } else {
                errEl.textContent = data.error || {{ _("Error saving record.") | tojson }};
                errEl.classList.remove('hidden');
            }
        })
        .catch(() => {
            this.disabled = false;
            errEl.textContent = {{ _("Network error.") | tojson }};
            errEl.classList.remove('hidden');
        });
    });
    {% endif %}

    let editingId = null;

    function openEditModal(id) {
        editingId = id;
        const row = document.querySelector(`[data-record-id="${id}"]`);
        if (!row) return;

        document.getElementById('editForDate').value = row.dataset.forDate || '';
        populateCategorySelect(document.getElementById('editCategory'), row.dataset.category || '');
        document.getElementById('editEffortHours').value = row.dataset.effort || '';
        document.getElementById('editError').classList.add('hidden');
        document.getElementById('editError').textContent = '';

        document.getElementById('editModal').classList.remove('hidden');
        document.getElementById('editModal').classList.add('flex');
    }

    function closeEditModal() {
        document.getElementById('editModal').classList.add('hidden');
        document.getElementById('editModal').classList.remove('flex');
        editingId = null;
    }

    document.getElementById('closeEditBtn').addEventListener('click', closeEditModal);
    document.getElementById('cancelEditBtn').addEventListener('click', closeEditModal);

    flatpickr('#editForDate', { dateFormat: 'Y-m-d', allowInput: true, maxDate: 'today' });

    document.getElementById('saveEditBtn').addEventListener('click', function() {
        const forDate  = document.getElementById('editForDate').value.trim();
        const category = document.getElementById('editCategory').value;
        const effort   = document.getElementById('editEffortHours').value;
        const errEl    = document.getElementById('editError');

        if (!forDate || !category || !effort) {
            errEl.textContent = {{ _("Please fill in all fields.") | tojson }};
            errEl.classList.remove('hidden');
            return;
        }

        this.disabled = true;
        fetch(API_PREFIX + `api/generali/baseservices/${editingId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
            body: JSON.stringify({ forDate, category, effortInHours: parseFloat(effort) })
        })
        .then(r => r.json())
        .then(data => {
            this.disabled = false;
            if (data.success) {
                closeEditModal();
                loadRecords(currentPage);
            } else {
                errEl.textContent = data.error || {{ _("Error saving record.") | tojson }};
                errEl.classList.remove('hidden');
            }
        })
        .catch(() => {
            this.disabled = false;
            errEl.textContent = {{ _("Network error.") | tojson }};
            errEl.classList.remove('hidden');
        });
    });

    let pendingDeleteId = null;

    function deleteRecord(id) {
        pendingDeleteId = id;
        document.getElementById('deleteModal').classList.remove('hidden');
        document.getElementById('deleteModal').classList.add('flex');
    }

    function closeDeleteModal() {
        document.getElementById('deleteModal').classList.add('hidden');
        document.getElementById('deleteModal').classList.remove('flex');
        pendingDeleteId = null;
    }

    document.getElementById('cancelDeleteBtn').addEventListener('click', closeDeleteModal);
    document.getElementById('deleteModal').addEventListener('click', function(e) {
        if (e.target === this) closeDeleteModal();
    });

    document.getElementById('confirmDeleteBtn').addEventListener('click', function() {
        if (!pendingDeleteId) return;
        const id = pendingDeleteId;
        this.disabled = true;
        this.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i>{{ _("Deleting…") }}';
        fetch(API_PREFIX + `api/generali/baseservices/${id}`, {
            headers: { 'X-CSRFToken': csrfToken },
            method: 'DELETE'
        })
        .then(r => r.json())
        .then(data => {
            this.disabled = false;
            this.innerHTML = {{ _("Delete") | tojson }};
            closeDeleteModal();
            if (data.success) loadRecords(currentPage);
            else {
                const errDiv = document.createElement('div');
                errDiv.className = 'fixed bottom-4 right-4 z-50 bg-red-500 text-white text-sm font-semibold px-4 py-3 rounded-xl shadow-lg';
                errDiv.textContent = data.error || {{ _("Error deleting record.") | tojson }};
                document.body.appendChild(errDiv);
                setTimeout(() => errDiv.remove(), 4000);
            }
        })
        .catch(() => {
            this.disabled = false;
            this.innerHTML = {{ _("Delete") | tojson }};
            closeDeleteModal();
        });
    });

    populateFilterCategorySelect();
    populateCategorySelect(document.getElementById('editCategory'));
    // ----------------------------- excel export ----------------------------- //
    function showExportError(msg) {
        const errDiv = document.createElement('div');
        errDiv.className = 'fixed bottom-4 right-4 z-50 bg-red-500 text-white text-sm font-semibold px-4 py-3 rounded-xl shadow-lg';
        errDiv.textContent = msg;
        document.body.appendChild(errDiv);
        setTimeout(() => errDiv.remove(), 4000);
    }

    async function exportToExcel() {
        const btn = document.getElementById('exportExcelBtn');
        const icon = btn ? btn.querySelector('i') : null;
        const originalIconClass = icon ? icon.className : '';
        if (btn) btn.disabled = true;
        if (icon) icon.className = 'fas fa-spinner fa-spin';
        try {
            const params = buildParams(1);
            params.set('all', 'true');
            const res = await fetch(API_PREFIX + 'api/generali/baseservices?' + params.toString(), {
                headers: { 'X-CSRFToken': csrfToken }
            });
            const data = await res.json();
            if (!data.success) throw new Error(data.error || 'Export failed');
            const records = data.records || [];
            if (!records.length) return;
            const today = new Date().toISOString().split('T')[0];
            const rows = records.map(r => ({
                'ID':          r.id,
                'Date':        r.forDate ? r.forDate.split('T')[0] : '',
                'Full Name':   r.fullname,
                'User ID':     r.userId,
                'Category':    r.category,
                'Effort (h)':  r.effortInHours,
                'Recorded At': r.recordDateTime ? r.recordDateTime.replace('T', ' ').substring(0, 16) : ''
            }));
            const ws = XLSX.utils.json_to_sheet(rows);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Base Services');
            XLSX.writeFile(wb, `generali_baseservices_${today}.xlsx`);
        } catch (e) {
            console.error('Export failed:', e);
            showExportError({{ _("Export failed.") | tojson }});
        } finally {
            if (btn) btn.disabled = false;
            if (icon) icon.className = originalIconClass;
        }
    }

    {% if can_add %}
    populateCategorySelect(document.getElementById('addCategory'));
    loadOrgUsers();
    {% endif %}
    loadOrganizations();
    loadRecords(1);
</script>
