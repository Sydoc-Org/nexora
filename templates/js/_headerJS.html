<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <script>
        const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

        function defaultIcon() {
            document.getElementById('profilePicture').src = "{{ url_for('static',filename='images/default-Icon.png') }}"
        }

        /* ---- Dark mode ---- */
        (function() {
            const saved = localStorage.getItem('nexora-theme');
            if (saved === 'dark') document.documentElement.classList.add('dark');
        })();

        /* ---- Session liveness poll ----
           Polls /api/session/heartbeat every 5s. If the admin force-logs us out,
           the before_request hook returns 401 and we bounce to /login. */
        (function() {
            const PUBLIC_PATHS = ['/login', '/logout', '/forgot_password',
                '/set_new_password', '/init_reset', '/init_2FA', '/verify_2fa',
                '/reset_password'];
            if (PUBLIC_PATHS.some(p => window.location.pathname.startsWith(p))) return;

            let stopped = false;
            async function ping() {
                if (stopped) return;
                try {
                    const r = await fetch("{{ url_for('session_heartbeat') }}", {
                        credentials: 'same-origin',
                        cache: 'no-store',
                        headers: { 'X-CSRFToken': csrfToken }
                    });
                    if (r.status === 401) {
                        stopped = true;
                        window.location.href = "{{ url_for('login') }}";
                    }
                } catch (e) {
                    // Network blip — keep trying.
                }
            }
            // First check after 2s, then every 5s.
            setTimeout(ping, 2000);
            setInterval(ping, 5000);
        })();

        /* ---- Command palette (Ctrl/Cmd+K) ----
           Server populates the action list based on the user's permissions.
           Adding new commands later = appending to the array below. */
        (function() {
            const ACTIONS = [
                {% if pageV.adminPagePerm %}
                { section: "{{ _('Admin') }}", label: "{{ _('Admin Overview') }}", icon: 'fa-shield-halved', url: "{{ url_for('admin_dashboard') }}" },
                { section: "{{ _('Admin') }}", label: "{{ _('Access Control') }}",   icon: 'fa-id-badge',  url: "{{ url_for('admin_access_control') }}" },
                { section: "{{ _('Admin') }}", label: "{{ _('Organizations') }}",    icon: 'fa-building',  url: "{{ url_for('admin_organizations_view') }}" },
                { section: "{{ _('Admin') }}", label: "{{ _('Active Sessions') }}",  icon: 'fa-users',     url: "{{ url_for('admin_sessions_view') }}" },
                { section: "{{ _('Admin') }}", label: "{{ _('System Logs') }}",      icon: 'fa-list-ul',   url: "{{ url_for('admin_logs_view') }}" },
                {% endif %}
                {% if has_permission('admin.create.user') %}
                { section: "{{ _('Admin action') }}", label: "{{ _('Add user') }}",         icon: 'fa-user-plus',   url: "{{ url_for('admin_access_control') }}#add-user" },
                {% endif %}
                {% if has_permission('admin.add.organization') %}
                { section: "{{ _('Admin action') }}", label: "{{ _('Add organization') }}", icon: 'fa-circle-plus', url: "{{ url_for('admin_organizations_view') }}#add-org" },
                {% endif %}
                {% if pageV.dashboardPagePerm %}
                { section: "{{ _('Workspace') }}", label: "{{ _('Dashboard') }}",              icon: 'fa-chart-line', url: "{{ url_for('dashboard') }}" },
                {% endif %}
                {% if pageV.biPagePerm %}
                { section: "{{ _('Workspace') }}", label: "{{ _('Business Intelligence') }}", icon: 'fa-chart-pie',  url: "{{ url_for('bi_page') }}" },
                {% endif %}
                {% if pageV.workitemsPagePerm %}
                { section: "{{ _('Workspace') }}", label: "{{ _('Work items') }}", icon: 'fa-list-check', url: "{{ url_for('workitems_overview') }}" },
                {% endif %}
                {% if pageV.invoicesPagePerm %}
                { section: "{{ _('Workspace') }}", label: "{{ _('Invoices') }}",   icon: 'fa-file-invoice', url: "{{ url_for('invoices') }}" },
                {% endif %}
                {% if pageV.chatPagePerm %}
                { section: "{{ _('Workspace') }}", label: "{{ _('Chat') }}",       icon: 'fa-comment',    url: "{{ url_for('chat_page') }}" },
                {% endif %}
                {% if pageV.generaliPagePerm %}
                { section: "Generali", label: "{{ _('Dashboard') }}",            icon: 'fa-chart-line',      url: "{{ url_for('generali_evaluation') }}" },
                {% endif %}
                {% if pageV.generaliDocumentsPerm %}
                { section: "Generali", label: "{{ _('Document List') }}",        icon: 'fa-table-list',      url: "{{ url_for('generali_documents') }}" },
                {% endif %}
                {% if pageV.generaliReportingPerm %}
                { section: "Generali", label: "{{ _('Reporting') }}",            icon: 'fa-clipboard-list',  url: "{{ url_for('generali_reporting') }}" },
                {% endif %}
                {% if pageV.generaliAdditionalServicesPerm %}
                { section: "Generali", label: "{{ _('Additional Services') }}",  icon: 'fa-clock',           url: "{{ url_for('generali_additionalServices') }}" },
                {% endif %}
                {% if pageV.generaliBaseServicesPerm %}
                { section: "Generali", label: "{{ _('Base Services') }}",        icon: 'fa-inbox',           url: "{{ url_for('generali_baseServices') }}" },
                {% endif %}
                {% if pageV.generaliProjectManagementPerm %}
                { section: "Generali", label: "{{ _('Project Management') }}",   icon: 'fa-diagram-project', url: "{{ url_for('generali_projectManagement') }}" },
                {% endif %}
                {% if pageV.generaliPDQMPerm %}
                { section: "Generali", label: "{{ _('PDQM') }}",                 icon: 'fa-file-lines',      url: "{{ url_for('generali_pdqm') }}" },
                {% endif %}
                { section: "{{ _('Quick action') }}", label: "{{ _('Toggle dark mode') }}", icon: 'fa-moon', action: 'toggle-dark' },
                { section: "{{ _('Account') }}", label: "{{ _('Sign out') }}", icon: 'fa-sign-out-alt', url: "{{ url_for('logout') }}" },
            ];

            const overlay = document.getElementById('cmdkOverlay');
            const input   = document.getElementById('cmdkInput');
            const list    = document.getElementById('cmdkList');
            if (!overlay || !input || !list) return;

            let visible = false;
            let selectedIdx = 0;
            let filtered = ACTIONS.slice();

            function buildItem(action, index) {
                const li = document.createElement('li');
                li.className = 'cmdk-item' + (index === selectedIdx ? ' is-selected' : '');
                li.setAttribute('role', 'option');
                li.dataset.idx = String(index);

                const icon = document.createElement('i');
                icon.className = 'fas ' + (action.icon || 'fa-arrow-right') + ' cmdk-item-icon';
                li.appendChild(icon);

                const label = document.createElement('span');
                label.className = 'cmdk-item-label';
                label.textContent = action.label || '';
                li.appendChild(label);

                if (action.section) {
                    const sec = document.createElement('span');
                    sec.className = 'cmdk-item-section';
                    sec.textContent = action.section;
                    li.appendChild(sec);
                }

                li.addEventListener('click', () => activate(index));
                li.addEventListener('mouseenter', () => { selectedIdx = index; updateSelection(); });
                return li;
            }

            function render() {
                while (list.firstChild) list.removeChild(list.firstChild);
                if (filtered.length === 0) {
                    const empty = document.createElement('li');
                    empty.className = 'cmdk-empty';
                    empty.textContent = '{{ _("No matching commands.") }}';
                    list.appendChild(empty);
                    return;
                }
                filtered.forEach((a, i) => list.appendChild(buildItem(a, i)));
            }
            function updateSelection() {
                list.querySelectorAll('.cmdk-item').forEach((el, i) => {
                    el.classList.toggle('is-selected', i === selectedIdx);
                    if (i === selectedIdx) el.scrollIntoView({block: 'nearest'});
                });
            }
            function activate(i) {
                const a = filtered[i];
                if (!a) return;
                if (a.action === 'toggle-dark') {
                    const dmToggle = document.getElementById('dark-mode-toggle');
                    if (dmToggle) dmToggle.click();
                    close();
                    return;
                }
                if (a.url) {
                    close();
                    window.location.href = a.url;
                }
            }
            function applyFilter(q) {
                q = (q || '').trim().toLowerCase();
                if (!q) {
                    filtered = ACTIONS.slice();
                } else {
                    filtered = ACTIONS.filter(a =>
                        (a.label || '').toLowerCase().includes(q) ||
                        (a.section || '').toLowerCase().includes(q)
                    );
                }
                selectedIdx = 0;
                render();
            }
            function open() {
                visible = true;
                overlay.hidden = false;
                input.value = '';
                applyFilter('');
                setTimeout(() => input.focus(), 10);
            }
            function close() {
                visible = false;
                overlay.hidden = true;
                input.blur();
            }

            input.addEventListener('input', e => applyFilter(e.target.value));

            input.addEventListener('keydown', e => {
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    selectedIdx = Math.min(filtered.length - 1, selectedIdx + 1);
                    updateSelection();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    selectedIdx = Math.max(0, selectedIdx - 1);
                    updateSelection();
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    activate(selectedIdx);
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    close();
                }
            });

            overlay.addEventListener('click', e => {
                if (e.target === overlay) close();
            });

            // Global hotkey
            document.addEventListener('keydown', e => {
                const isCmdK = (e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K');
                if (isCmdK) {
                    e.preventDefault();
                    visible ? close() : open();
                }
            });

            render();
        })();

        document.addEventListener('DOMContentLoaded', function () {
            const dmToggle = document.getElementById('dark-mode-toggle');
            const dmIcon  = document.getElementById('dark-mode-icon');
            const dmLabel = document.getElementById('dark-mode-label');

            function applyTheme(isDark) {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                    dmIcon.className  = 'fas fa-sun sidebar-nav-icon';
                    if (dmLabel) dmLabel.textContent = 'Light Mode';
                } else {
                    document.documentElement.classList.remove('dark');
                    dmIcon.className  = 'fas fa-moon sidebar-nav-icon';
                    if (dmLabel) dmLabel.textContent = 'Dark Mode';
                }
            }

            // Apply on load
            applyTheme(document.documentElement.classList.contains('dark'));

            if (dmToggle) {
                dmToggle.addEventListener('click', () => {
                    const nowDark = !document.documentElement.classList.contains('dark');
                    localStorage.setItem('nexora-theme', nowDark ? 'dark' : 'light');
                    applyTheme(nowDark);
                });
            }
        });

        document.addEventListener('DOMContentLoaded', function () {
            const bellButton = document.getElementById('bell-button');
            const notificationCountBadge = document.getElementById('notification-count');
            const notificationPanel = document.getElementById('notification-panel');
            const notificationList = document.getElementById('notification-list');
            let unreadNotificationIds = [];

            function timeAgo(date) {
                let seconds = Math.floor((new Date() - new Date(date)) / 1000);

                if (seconds < 0) {
                    seconds = 0;
                }

                let interval = seconds / 31536000;
                if (interval > 1) return Math.floor(interval) + ` {{ _("years ago") }}`;
                
                interval = seconds / 2592000;
                if (interval > 1) return Math.floor(interval) + ` {{ _("months ago") }}`;
                
                interval = seconds / 86400;
                if (interval > 1) return Math.floor(interval) + ` {{ _("days ago") }}`;
                
                interval = seconds / 3600;
                if (interval > 1) return Math.floor(interval) + ` {{ _("hours ago") }}`;
                
                interval = seconds / 60;
                if (interval > 1) return Math.floor(interval) + ` {{ _("minutes ago") }}`;
                
                if (seconds < 5) return `{{ _("Just now") }}`;

                return Math.floor(seconds) + ` {{ _("seconds ago") }}`;
            }

            async function fetchNotifications() {
                try {
                    const response = await fetch("{{ url_for('get_notifications') }}", {headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken  
                    }});
                    if (!response.ok) return;

                    const notifications = await response.json();
                    updateNotificationUI(notifications);
                } catch (error) {
                    console.error('Failed to fetch notifications:', error);
                    notificationList.innerHTML = `<p class="px-4 py-3 text-sm text-red-500">{{ _("Could not load notifications.") }}</p>`;
                }
            }

            function updateNotificationUI(notifications) {
                unreadNotificationIds = notifications.map(n => n.NotificationID);

                if (notifications.length > 0) {
                    notificationCountBadge.textContent = notifications.length;
                    notificationCountBadge.classList.remove('hidden');
                    notificationCountBadge.classList.add('flex');
                } else {
                    notificationCountBadge.classList.add('hidden');
                    notificationCountBadge.classList.remove('flex');
                }

                notificationList.innerHTML = '';
                if (notifications.length === 0) {
                    notificationList.innerHTML = `<p class="px-4 py-3 text-sm text-gray-500">{{ _("No new notifications.") }}</p>`;
                    return;
                }

                notifications.forEach(n => {
                    const link = n.Link ? `href="${n.Link}"` : 'href="#"';
                    const icon = n.Icon || 'fa-info-circle';
                    const timestamp = new Date(n.Timestamp + 'Z');

                    const itemHTML = `
                    <a ${link} class="flex items-start px-4 py-3 text-sm text-gray-700 hover:bg-gray-100 transition">
                        <i class="fas ${icon} text-indigo-500 mt-1 mr-3"></i>
                        <div>
                            <p class="font-medium">${n.Message}</p>
                            <p class="text-xs text-gray-500">${timeAgo(timestamp)}</p>
                        </div>
                    </a>`;
                    notificationList.insertAdjacentHTML('beforeend', itemHTML);
                });
            }

            async function markAsRead() {
                if (unreadNotificationIds.length === 0) return;

                try {
                    await fetch("{{ url_for('mark_notifications_as_read') }}", {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' , 'X-CSRFToken': csrfToken},
                        body: JSON.stringify({ ids: unreadNotificationIds })
                    });
                    unreadNotificationIds = [];
                    setTimeout(() => notificationCountBadge.classList.add('hidden'), 2000);
                } catch (error) {
                    console.error('Failed to mark notifications as read:', error);
                }
            }

            bellButton.addEventListener('click', (event) => {
                event.stopPropagation();
                notificationPanel.classList.toggle('hidden');
                if (!notificationPanel.classList.contains('hidden') && unreadNotificationIds.length > 0) {
                    markAsRead();
                }
            });

            document.addEventListener('click', (event) => {
                const container = document.getElementById('notification-dropdown-container');
                if (!container.contains(event.target)) {
                    notificationPanel.classList.add('hidden');
                }
            });

            fetchNotifications();
            setInterval(fetchNotifications, 60000);
        });

        /* ---- Responsive table: auto-apply column labels so rows render as cards on mobile ---- */
        (function() {
            function headerTextFor(th) {
                // Prefer visible text, ignore icon-only headers like <i class="fas fa-flag"></i>
                const t = (th.innerText || th.textContent || '').trim().replace(/\s+/g, ' ');
                // If the header contains only an <i> icon and no text, the title attribute is a decent fallback
                if (!t) {
                    const iconWithTitle = th.querySelector('[title]');
                    return iconWithTitle ? iconWithTitle.getAttribute('title') : '';
                }
                return t;
            }

            function applyLabels(table) {
                const headers = Array.from(table.querySelectorAll('thead th')).map(headerTextFor);
                if (!headers.length) return;
                table.classList.add('responsive-card-table');
                table.querySelectorAll('tbody tr').forEach(tr => {
                    const cells = tr.querySelectorAll(':scope > td');
                    // Skip special rows (spinner/no-results/details) — they use colspan
                    if (cells.length !== headers.length) return;
                    cells.forEach((td, i) => {
                        if (!td.hasAttribute('data-label')) {
                            td.setAttribute('data-label', headers[i] || '');
                        }
                    });
                });
            }

            function scan(root) {
                (root.querySelectorAll ? root.querySelectorAll('table') : []).forEach(applyLabels);
            }

            document.addEventListener('DOMContentLoaded', function () {
                scan(document);

                // Re-apply whenever tbody content changes (AJAX table renders)
                const observer = new MutationObserver((mutations) => {
                    const seen = new Set();
                    for (const m of mutations) {
                        let node = m.target;
                        while (node && node !== document) {
                            if (node.tagName === 'TABLE' && !seen.has(node)) {
                                seen.add(node);
                                applyLabels(node);
                                break;
                            }
                            node = node.parentNode;
                        }
                    }
                });
                observer.observe(document.body, { childList: true, subtree: true });
            });
        })();

        /* ---- Mobile sidebar drawer toggle ---- */
        document.addEventListener('DOMContentLoaded', function () {
            const toggle   = document.getElementById('sidebar-toggle');
            const sidebar  = document.getElementById('nexora-sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            if (!toggle || !sidebar || !backdrop) return;

            function openSidebar() {
                sidebar.classList.add('open');
                backdrop.classList.add('open');
                toggle.querySelector('i').className = 'fas fa-times';
            }
            function closeSidebar() {
                sidebar.classList.remove('open');
                backdrop.classList.remove('open');
                toggle.querySelector('i').className = 'fas fa-bars';
            }

            toggle.addEventListener('click', (e) => {
                e.stopPropagation();
                if (sidebar.classList.contains('open')) closeSidebar();
                else openSidebar();
            });
            backdrop.addEventListener('click', closeSidebar);

            // Close when a nav link is tapped (keeps drawer UX snappy)
            sidebar.querySelectorAll('a.sidebar-nav-item').forEach(link => {
                link.addEventListener('click', () => {
                    if (window.matchMedia('(max-width: 768px)').matches) closeSidebar();
                });
            });

            // Auto-close when resizing back to desktop
            window.addEventListener('resize', () => {
                if (window.innerWidth > 768) closeSidebar();
            });
        });

        document.addEventListener('DOMContentLoaded', function () {
            const group    = document.getElementById('generaliNavGroup');
            const header   = document.getElementById('generaliNavHeader');
            const subitems = group && group.querySelector('.sidebar-nav-subitems');
            if (!group || !header || !subitems) return;

            function setSubitemsHeight() {
                // Temporarily make it visible to measure its full height
                subitems.style.maxHeight = 'none';
                const h = subitems.scrollHeight;
                subitems.style.maxHeight = '';
                group.style.setProperty('--generali-subitems-height', h + 'px');
            }

            setSubitemsHeight();

            // auto-open when on a generali page, otherwise restore saved state
            const isActive = group.dataset.active === 'true';
            const savedOpen = localStorage.getItem('nexora-generali-nav') === 'true';
            if (isActive || savedOpen) group.classList.add('generali-open');

            header.addEventListener('click', () => {
                const nowOpen = group.classList.toggle('generali-open');
                localStorage.setItem('nexora-generali-nav', nowOpen ? 'true' : 'false');
            });
        });

        document.addEventListener('DOMContentLoaded', function () {
            const group    = document.getElementById('adminNavGroup');
            const header   = document.getElementById('adminNavHeader');
            const subitems = group && group.querySelector('.sidebar-nav-subitems');
            if (!group || !header || !subitems) return;

            function setSubitemsHeight() {
                subitems.style.maxHeight = 'none';
                const h = subitems.scrollHeight;
                subitems.style.maxHeight = '';
                group.style.setProperty('--admin-subitems-height', h + 'px');
            }

            setSubitemsHeight();

            const isActive = group.dataset.active === 'true';
            const savedOpen = localStorage.getItem('nexora-admin-nav') === 'true';
            if (isActive || savedOpen) group.classList.add('admin-open');

            header.addEventListener('click', () => {
                const nowOpen = group.classList.toggle('admin-open');
                localStorage.setItem('nexora-admin-nav', nowOpen ? 'true' : 'false');
            });
        });
    </script>
</body>

</html>
