<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <script>
        const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

        function defaultIcon() {
            document.getElementById('profilePicture').src = "{{ url_for('static',filename='images/default-Icon.png') }}"
        }

        /* ---- Dark mode ---- */
        (function() {
            const saved = localStorage.getItem('nexora-theme');
            if (saved === 'dark') document.documentElement.classList.add('dark');
        })();

        document.addEventListener('DOMContentLoaded', function () {
            const dmToggle = document.getElementById('dark-mode-toggle');
            const dmIcon  = document.getElementById('dark-mode-icon');
            const dmLabel = document.getElementById('dark-mode-label');

            function applyTheme(isDark) {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                    dmIcon.className  = 'fas fa-sun sidebar-nav-icon';
                    if (dmLabel) dmLabel.textContent = 'Light Mode';
                } else {
                    document.documentElement.classList.remove('dark');
                    dmIcon.className  = 'fas fa-moon sidebar-nav-icon';
                    if (dmLabel) dmLabel.textContent = 'Dark Mode';
                }
            }

            // Apply on load
            applyTheme(document.documentElement.classList.contains('dark'));

            if (dmToggle) {
                dmToggle.addEventListener('click', () => {
                    const nowDark = !document.documentElement.classList.contains('dark');
                    localStorage.setItem('nexora-theme', nowDark ? 'dark' : 'light');
                    applyTheme(nowDark);
                });
            }
        });

        document.addEventListener('DOMContentLoaded', function () {
            const bellButton = document.getElementById('bell-button');
            const notificationCountBadge = document.getElementById('notification-count');
            const notificationPanel = document.getElementById('notification-panel');
            const notificationList = document.getElementById('notification-list');
            let unreadNotificationIds = [];

            function timeAgo(date) {
                let seconds = Math.floor((new Date() - new Date(date)) / 1000);

                if (seconds < 0) {
                    seconds = 0;
                }

                let interval = seconds / 31536000;
                if (interval > 1) return Math.floor(interval) + ` {{ _("years ago") }}`;
                
                interval = seconds / 2592000;
                if (interval > 1) return Math.floor(interval) + ` {{ _("months ago") }}`;
                
                interval = seconds / 86400;
                if (interval > 1) return Math.floor(interval) + ` {{ _("days ago") }}`;
                
                interval = seconds / 3600;
                if (interval > 1) return Math.floor(interval) + ` {{ _("hours ago") }}`;
                
                interval = seconds / 60;
                if (interval > 1) return Math.floor(interval) + ` {{ _("minutes ago") }}`;
                
                if (seconds < 5) return `{{ _("Just now") }}`;

                return Math.floor(seconds) + ` {{ _("seconds ago") }}`;
            }

            async function fetchNotifications() {
                try {
                    const response = await fetch("{{ url_for('get_notifications') }}", {headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken  
                    }});
                    if (!response.ok) return;

                    const notifications = await response.json();
                    updateNotificationUI(notifications);
                } catch (error) {
                    console.error('Failed to fetch notifications:', error);
                    notificationList.innerHTML = `<p class="px-4 py-3 text-sm text-red-500">{{ _("Could not load notifications.") }}</p>`;
                }
            }

            function updateNotificationUI(notifications) {
                unreadNotificationIds = notifications.map(n => n.NotificationID);

                if (notifications.length > 0) {
                    notificationCountBadge.textContent = notifications.length;
                    notificationCountBadge.classList.remove('hidden');
                    notificationCountBadge.classList.add('flex');
                } else {
                    notificationCountBadge.classList.add('hidden');
                    notificationCountBadge.classList.remove('flex');
                }

                notificationList.innerHTML = '';
                if (notifications.length === 0) {
                    notificationList.innerHTML = `<p class="px-4 py-3 text-sm text-gray-500">{{ _("No new notifications.") }}</p>`;
                    return;
                }

                notifications.forEach(n => {
                    const link = n.Link ? `href="${n.Link}"` : 'href="#"';
                    const icon = n.Icon || 'fa-info-circle';
                    const timestamp = new Date(n.Timestamp + 'Z');

                    const itemHTML = `
                    <a ${link} class="flex items-start px-4 py-3 text-sm text-gray-700 hover:bg-gray-100 transition">
                        <i class="fas ${icon} text-indigo-500 mt-1 mr-3"></i>
                        <div>
                            <p class="font-medium">${n.Message}</p>
                            <p class="text-xs text-gray-500">${timeAgo(timestamp)}</p>
                        </div>
                    </a>`;
                    notificationList.insertAdjacentHTML('beforeend', itemHTML);
                });
            }

            async function markAsRead() {
                if (unreadNotificationIds.length === 0) return;

                try {
                    await fetch("{{ url_for('mark_notifications_as_read') }}", {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' , 'X-CSRFToken': csrfToken},
                        body: JSON.stringify({ ids: unreadNotificationIds })
                    });
                    unreadNotificationIds = [];
                    setTimeout(() => notificationCountBadge.classList.add('hidden'), 2000);
                } catch (error) {
                    console.error('Failed to mark notifications as read:', error);
                }
            }

            bellButton.addEventListener('click', (event) => {
                event.stopPropagation();
                notificationPanel.classList.toggle('hidden');
                if (!notificationPanel.classList.contains('hidden') && unreadNotificationIds.length > 0) {
                    markAsRead();
                }
            });

            document.addEventListener('click', (event) => {
                const container = document.getElementById('notification-dropdown-container');
                if (!container.contains(event.target)) {
                    notificationPanel.classList.add('hidden');
                }
            });

            fetchNotifications();
            setInterval(fetchNotifications, 60000);
        });

        /* ---- Responsive table: auto-apply column labels so rows render as cards on mobile ---- */
        (function() {
            function headerTextFor(th) {
                // Prefer visible text, ignore icon-only headers like <i class="fas fa-flag"></i>
                const t = (th.innerText || th.textContent || '').trim().replace(/\s+/g, ' ');
                // If the header contains only an <i> icon and no text, the title attribute is a decent fallback
                if (!t) {
                    const iconWithTitle = th.querySelector('[title]');
                    return iconWithTitle ? iconWithTitle.getAttribute('title') : '';
                }
                return t;
            }

            function applyLabels(table) {
                const headers = Array.from(table.querySelectorAll('thead th')).map(headerTextFor);
                if (!headers.length) return;
                table.classList.add('responsive-card-table');
                table.querySelectorAll('tbody tr').forEach(tr => {
                    const cells = tr.querySelectorAll(':scope > td');
                    // Skip special rows (spinner/no-results/details) — they use colspan
                    if (cells.length !== headers.length) return;
                    cells.forEach((td, i) => {
                        if (!td.hasAttribute('data-label')) {
                            td.setAttribute('data-label', headers[i] || '');
                        }
                    });
                });
            }

            function scan(root) {
                (root.querySelectorAll ? root.querySelectorAll('table') : []).forEach(applyLabels);
            }

            document.addEventListener('DOMContentLoaded', function () {
                scan(document);

                // Re-apply whenever tbody content changes (AJAX table renders)
                const observer = new MutationObserver((mutations) => {
                    const seen = new Set();
                    for (const m of mutations) {
                        let node = m.target;
                        while (node && node !== document) {
                            if (node.tagName === 'TABLE' && !seen.has(node)) {
                                seen.add(node);
                                applyLabels(node);
                                break;
                            }
                            node = node.parentNode;
                        }
                    }
                });
                observer.observe(document.body, { childList: true, subtree: true });
            });
        })();

        /* ---- Mobile sidebar drawer toggle ---- */
        document.addEventListener('DOMContentLoaded', function () {
            const toggle   = document.getElementById('sidebar-toggle');
            const sidebar  = document.getElementById('nexora-sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            if (!toggle || !sidebar || !backdrop) return;

            function openSidebar() {
                sidebar.classList.add('open');
                backdrop.classList.add('open');
                toggle.querySelector('i').className = 'fas fa-times';
            }
            function closeSidebar() {
                sidebar.classList.remove('open');
                backdrop.classList.remove('open');
                toggle.querySelector('i').className = 'fas fa-bars';
            }

            toggle.addEventListener('click', (e) => {
                e.stopPropagation();
                if (sidebar.classList.contains('open')) closeSidebar();
                else openSidebar();
            });
            backdrop.addEventListener('click', closeSidebar);

            // Close when a nav link is tapped (keeps drawer UX snappy)
            sidebar.querySelectorAll('a.sidebar-nav-item').forEach(link => {
                link.addEventListener('click', () => {
                    if (window.matchMedia('(max-width: 768px)').matches) closeSidebar();
                });
            });

            // Auto-close when resizing back to desktop
            window.addEventListener('resize', () => {
                if (window.innerWidth > 768) closeSidebar();
            });
        });

        document.addEventListener('DOMContentLoaded', function () {
            const group    = document.getElementById('generaliNavGroup');
            const header   = document.getElementById('generaliNavHeader');
            const subitems = group && group.querySelector('.sidebar-nav-subitems');
            if (!group || !header || !subitems) return;

            function setSubitemsHeight() {
                // Temporarily make it visible to measure its full height
                subitems.style.maxHeight = 'none';
                const h = subitems.scrollHeight;
                subitems.style.maxHeight = '';
                group.style.setProperty('--generali-subitems-height', h + 'px');
            }

            setSubitemsHeight();

            // auto-open when on a generali page, otherwise restore saved state
            const isActive = group.dataset.active === 'true';
            const savedOpen = localStorage.getItem('nexora-generali-nav') === 'true';
            if (isActive || savedOpen) group.classList.add('generali-open');

            header.addEventListener('click', () => {
                const nowOpen = group.classList.toggle('generali-open');
                localStorage.setItem('nexora-generali-nav', nowOpen ? 'true' : 'false');
            });
        });
    </script>
</body>

</html>
