<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <script>
    const API_PREFIX = window.location.href.includes("nexora") ? "/nexora/" : "/";

    // Chart instances
    let processedChart, statusChart;

    // Chart Colors & Fonts
    const chartFontColor = '#6b7280'; // gray-500
    const chartGridColor = '#f3f4f6'; // gray-100
    Chart.defaults.font.family = "'Inter', sans-serif";
    Chart.defaults.color = chartFontColor;

    // ### CHART 1: PROCESSED OVER TIME (LINE CHART) ###
    async function updateProcessedOverTimeChart() {
      try {
        const response = await fetch(`${API_PREFIX}api/reports/processed_over_time?groupBy=day`);
        const data = await response.json();

        const ctx = document.getElementById('processedOverTimeChart').getContext('2d');
        
        const gradient = ctx.createLinearGradient(0, 0, 0, 300);
        gradient.addColorStop(0, 'rgba(79, 70, 229, 0.4)');
        gradient.addColorStop(1, 'rgba(79, 70, 229, 0)');

        if (processedChart) {
          processedChart.data.labels = data.labels;
          processedChart.data.datasets[0].data = data.data;
          processedChart.update();
        } else {
          processedChart = new Chart(ctx, {
            type: 'line',
            data: {
              labels: data.labels,
              datasets: [{
                label: '{{ _("Documents Processed") }}',
                data: data.data,
                fill: true,
                backgroundColor: gradient,
                borderColor: '#4F46E5', // indigo-600
                borderWidth: 2,
                pointBackgroundColor: '#4F46E5',
                tension: 0.4,
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                y: {
                  beginAtZero: true,
                  grid: { color: chartGridColor }
                },
                x: {
                  grid: { display: false }
                }
              },
              plugins: {
                legend: { display: false },
                tooltip: {
                  backgroundColor: '#1f2937', // gray-800
                  titleFont: { size: 14, weight: 'bold' },
                  bodyFont: { size: 12 },
                  padding: 10,
                  cornerRadius: 8
                }
              }
            }
          });
        }
      } catch (error) {
        console.error("Failed to fetch processed over time data:", error);
      }
    }

    // ### CHART 2: STATUS DISTRIBUTION (DOUGHNUT CHART) ###
    async function updateStatusDistributionChart() {
      try {
        const response = await fetch(`${API_PREFIX}api/reports/status_distribution`);
        const data = await response.json();
        
        const ctx = document.getElementById('statusDistributionChart').getContext('2d');
        
        if (statusChart) {
          statusChart.data.labels = data.labels;
          statusChart.data.datasets[0].data = data.data;
          statusChart.update();
        } else {
          statusChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels: data.labels,
              datasets: [{
                data: data.data,
                backgroundColor: ['#3B82F6', '#F59E0B', '#10B981', '#8B5CF6'], // blue-500, yellow-500, green-500, purple-500
                borderColor: '#ffffff',
                borderWidth: 4,
                hoverOffset: 8
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              cutout: '75%',
              plugins: {
                legend: {
                  position: 'bottom',
                  labels: {
                    padding: 20,
                    usePointStyle: true,
                    pointStyle: 'circle'
                  }
                },
                tooltip: {
                  backgroundColor: '#1f2937',
                  titleFont: { size: 14, weight: 'bold' },
                  bodyFont: { size: 12 },
                  padding: 10,
                  cornerRadius: 8,
                  callbacks: {
                    label: function(context) {
                      return `${context.label}: ${context.raw}`;
                    }
                  }
                }
              }
            }
          });
        }
      } catch (error) {
        console.error("Failed to fetch status distribution data:", error);
      }
    }

    // ### TIMELINE: ACTIVE DOCUMENT STATUS ###
    const activityDetails = {
      'InValidation': { icon: 'fa-solid fa-laptop-file', color: 'violet', text: `{{ _("In Validation") }}` },
      'InExport': { icon: 'fa-solid fa-file-export', color: 'green', text: `{{ _("In Export") }}` },
      'InImport': { icon: 'fa-solid fa-file-import', color: 'red', text: `{{ _("In Import") }}` },
      'InExtraction': { icon: 'fa-solid fa-file-waveform', color: 'blue', text: `{{ _("In Extraction") }}` },
      'InOCR': { icon: 'fa-solid fa-file-lines', color: 'sky', text: `{{ _("In OCR") }}` },
      'InDBSaving': { icon: 'fa-solid fa-database', color: 'orange', text: `{{ _("In DB Saving") }}` },
      'Processing': { icon: 'fa-solid fa-list-check', color: 'yellow', text: `{{ _("Processing") }}` }
    };

    async function updateDocumentTimeline() {
      const container = document.getElementById('document-timeline-container');
      try {
        const response = await fetch(`${API_PREFIX}api/dashboard_stats_document_preview`);
        const rows = await response.json();
        
        container.innerHTML = ''; // Clear previous content

        if (rows.length === 0) {
          container.innerHTML = `<p class="text-gray-500 text-center p-4">{{ _("No active documents to display.") }}</p>`;
          return;
        }

        rows.forEach(row => {
          const details = activityDetails[row.Activity] || activityDetails.Processing;
          const color = details.color;
          const timelineItem = document.createElement('div');
          timelineItem.className = 'timeline-item py-1';          
          timelineItem.innerHTML = `
            <div class="timeline-connector"></div>
            <div class="timeline-icon bg-${color}-100 text-${color}-600">
                <i class="${details.icon} text-2xl"></i>
            </div>
            <div class="flex-grow">
                <h4 class="font-bold text-gray-800">Barcode ${row.Barcode}</h4>
                <p class="text-sm text-gray-500">{{ _("Current Stage:") }} 
                  <span class="font-semibold text-${color}-700">${details.text}</span>
                </p>
            </div>
          `;
          container.appendChild(timelineItem);
        });
      } catch (error) {
        console.error("Failed to update document timeline:", error);
        container.innerHTML = `<div class="text-center text-red-500 p-4">{{ _("Error loading timeline data.") }}</div>`;
      }
    }

    // Initial load and interval setup
    document.addEventListener('DOMContentLoaded', () => {
      updateProcessedOverTimeChart();
      updateStatusDistributionChart();
      updateDocumentTimeline();

      setInterval(() => {
        updateProcessedOverTimeChart();
        updateStatusDistributionChart();
        updateDocumentTimeline();
      }, 15000); // Refresh every 15 seconds
    });
  </script>
</body>
</html>
