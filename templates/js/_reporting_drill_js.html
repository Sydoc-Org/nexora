<script nonce="{{ csp_nonce() }}">
/* Drill-through: click an aggregate number, see the rows behind it.
   Shared by the Simple and Advanced panes. */
window.ReportingDrill = (function () {
  'use strict';
  var csrf = document.querySelector('meta[name="csrf-token"]').content;
  var API_PREFIX = window.location.href.includes("nexora") ? "/nexora/" : "/";
  var I18N = {
    title: {{ _("Rows behind this number")|tojson }},
    distinctNote: {{ _("Rows contributing to this number — the distinct count may be smaller.")|tojson }},
    truncatedNote: {{ _("Showing the first {n} rows — export to get all.")|tojson }},
    nullLabel: {{ _("(empty)")|tojson }},
    exportName: {{ _("Detail rows")|tojson }},
    loading: {{ _("Loading the rows…")|tojson }},
    loadError: {{ _("Could not load the rows behind this number.")|tojson }},
    close: {{ _("Close")|tojson }},
    couldNotExport: {{ _("Could not export this report.")|tojson }},
    calloutText: {{ _("Click a workitem to open its read-only preview.")|tojson }},
    cannotFilter: {{ _("Could not filter this selection — drill cancelled.")|tojson }}
  };

  // Relative-date token labels — same msgids as _reporting_simple_js.html's
  // TOKEN_LABELS (this module is deliberately self-contained; dashboard-card
  // drills load it without the Simple partial).
  var TOKEN_LABELS = {
    today: {{ _("Today")|tojson }}, yesterday: {{ _("Yesterday")|tojson }},
    this_week: {{ _("This week")|tojson }}, last_week: {{ _("Last week")|tojson }},
    this_month: {{ _("This month")|tojson }}, last_month: {{ _("Last month")|tojson }},
    this_quarter: {{ _("This quarter")|tojson }}, last_quarter: {{ _("Last quarter")|tojson }},
    last_3_months: {{ _("Last 3 months")|tojson }}, this_year: {{ _("This year")|tojson }},
    last_year: {{ _("Last year")|tojson }}, last_n_days: {{ _("Last {n} days")|tojson }}
  };

  // A filter value may be a relative-date token object ({token, n?}) or a
  // list ('in'/'between') — format it instead of String()-ing to
  // "[object Object]".
  function chipValue(v) {
    if (v === null || v === undefined || v === '') return I18N.nullLabel;
    if (Array.isArray(v)) return v.join(', ');
    if (typeof v === 'object') {
      if (typeof v.token === 'string') {
        var lbl = TOKEN_LABELS[v.token] || v.token;
        return v.token === 'last_n_days' ? lbl.replace('{n}', v.n) : lbl;
      }
      return I18N.nullLabel;
    }
    return String(v);
  }

  var SMART_FIELDS = ['workitem_id', 'processname', 'import_date', 'export_date'];

  // In-page toast -- same DOM/CSS contract as the Advanced tab's private
  // toast() (.reporting-toast / data-testid="reporting-toast", defined in
  // _reporting_js.html): this module is self-contained (like the dashboard
  // builder's own toast()) so it draws its own, reusing the shared CSS class
  // rather than a new one. Used when a drill can't be safely opened (Task 35:
  // an unparseable grain bucket with no raw value to fall back on) -- the
  // drawer must never proceed unfiltered, so we tell the user instead.
  function toast(msg, isError) {
    var t = document.createElement('div');
    t.className = 'reporting-toast' + (isError ? ' reporting-toast--error' : '');
    t.setAttribute('role', 'status');
    t.setAttribute('data-testid', 'reporting-toast');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.classList.add('is-gone'); }, 2600);
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 3000);
  }

  function addGrainUpper(startStr, grain) {
    var s = String(startStr).slice(0, 10);
    var p = s.split('-');
    if (p.length !== 3) return null;
    var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
    if (isNaN(d.getTime())) return null;
    if (grain === 'day') d.setUTCDate(d.getUTCDate() + 1);
    else if (grain === 'week') d.setUTCDate(d.getUTCDate() + 7);
    else if (grain === 'month') d.setUTCMonth(d.getUTCMonth() + 1);
    else if (grain === 'quarter') d.setUTCMonth(d.getUTCMonth() + 3);
    else if (grain === 'year') d.setUTCFullYear(d.getUTCFullYear() + 1);
    else return null;
    return d.toISOString().slice(0, 10);
  }

  /* def: the definition that produced the current aggregate result.
     fields: the source catalog's field list ({field,label,grainable,filterable}).
     clicked: [{field, grain?, value}] — one entry per definition column, in order.
     Returns a raw-row drill definition, or null when drilling is not possible. */
  function buildDrillDefinition(def, fields, clicked) {
    if (!def || !def.source || !clicked || !clicked.length) return null;
    var byField = {};
    (fields || []).forEach(function (f) { byField[f.field] = f; });
    for (var i = 0; i < clicked.length; i++) {
      var cf = byField[clicked[i].field];
      if (!cf || cf.filterable === false) return null;
    }
    var filters = (def.filters || []).map(function (x) {
      return JSON.parse(JSON.stringify(x));
    });
    var unfilterable = false;
    clicked.forEach(function (c) {
      if (c.grain) {
        if (c.value === null || c.value === undefined || c.value === '') {
          // A genuinely NULL date bucket (the grained chart's own
          // "(empty)"/nullLabel bucket, see I18N.nullLabel above) is a real,
          // valid case -- not a parse failure. It's the same case the
          // non-grained branch below already handles correctly; handle it
          // identically here instead of falling through to the
          // unparseable-bucket toast-abort further down.
          filters.push({ field: c.field, op: 'is_null' });
          return;
        }
        var upper = addGrainUpper(c.value, c.grain);
        if (upper) {
          filters.push({ field: c.field, op: 'gte', value: String(c.value).slice(0, 10) });
          filters.push({ field: c.field, op: 'lt', value: upper });
        } else {
          // addGrainUpper couldn't read the bucket label as a date (e.g. a
          // "N/A"/malformed group key) -- fall back to an equality filter on
          // the raw value rather than silently dropping the constraint. An
          // unfiltered drill must never masquerade as a filtered one (Task 35).
          filters.push({ field: c.field, op: 'eq', value: c.value });
        }
      } else if (c.value === null || c.value === undefined || c.value === '') {
        filters.push({ field: c.field, op: 'is_null' });
      } else {
        filters.push({ field: c.field, op: 'eq', value: c.value });
      }
    });
    if (unfilterable) return null;
    var cols = [];
    SMART_FIELDS.concat(clicked.map(function (c) { return c.field; }))
      .forEach(function (fd) {
        if (byField[fd] && cols.indexOf(fd) === -1 && cols.length < 8) cols.push(fd);
      });
    var hasSmart = SMART_FIELDS.some(function (fd) { return !!byField[fd]; });
    if (!hasSmart) {           // generic table source: top up with leading columns
      for (var j = 0; j < (fields || []).length && cols.length < 6; j++) {
        if (cols.indexOf(fields[j].field) === -1) cols.push(fields[j].field);
      }
    }
    if (!cols.length) return null;
    var sortField = cols.indexOf('export_date') !== -1 ? 'export_date' : cols[0];
    var dd = {
      schemaVersion: 1,
      source: def.source,
      title: def.title || I18N.exportName,
      visualization: 'table',
      columns: cols.map(function (fd) { return { field: fd }; }),
      filters: filters,
      sort: [{ field: sortField, dir: sortField === 'export_date' ? 'desc' : 'asc' }],
      rowLimit: 100
    };
    if (def.scope) dd.scope = JSON.parse(JSON.stringify(def.scope));
    return dd;
  }

  function el(id) { return document.getElementById(id); }
  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  var current = null;   // {definition} of the open drill, for export

  /* Context chip row (#rdChips, testid reporting-drill-chips): indigo chips
     for filters already on the definition that produced the aggregate
     result (pre-existing), violet chips for the filters derived from the
     clicked cell(s) (opts.clicked). Reused verbatim by dashboard-card drills
     (see the plan's Task 15) -- keep this a general "definition filters +
     clicked filters" renderer, not result-view-specific. */
  function isDateField(fields, fieldName, grain) {
    if (grain) return true;
    for (var i = 0; i < (fields || []).length; i++) {
      if (fields[i].field === fieldName) return !!fields[i].grainable;
    }
    return false;
  }

  function fieldLabel(fields, fieldName) {
    for (var i = 0; i < (fields || []).length; i++) {
      if (fields[i].field === fieldName) return fields[i].label || fieldName;
    }
    return fieldName;
  }

  function chipHtml(colorClass, icon, text) {
    return '<span class="reporting-drill-chip ' + colorClass + '">' +
      '<i class="fas ' + icon + '" aria-hidden="true"></i><span>' + esc(text) + '</span></span>';
  }

  function renderChips(definition, fields, clicked) {
    var container = el('rdChips');
    if (!container) return;
    var parts = [];
    ((definition && definition.filters) || []).forEach(function (f) {
      parts.push(chipHtml('reporting-drill-chip--indigo',
        isDateField(fields, f.field) ? 'fa-calendar' : 'fa-filter',
        fieldLabel(fields, f.field) + ' · ' + chipValue(f.value)));
    });
    (clicked || []).forEach(function (c) {
      parts.push(chipHtml('reporting-drill-chip--violet',
        isDateField(fields, c.field, c.grain) ? 'fa-calendar' : 'fa-filter',
        fieldLabel(fields, c.field) + ' · ' + chipValue(c.value)));
    });
    container.innerHTML = parts.join('');
  }

  /* Info callout ("Click a workitem to open its read-only preview"): only
     meaningful when the workitem-preview modal is actually on the page --
     same availability check the click-delegation handler in wire() already
     uses (window.NexoraWorkitemDetail + #rdWiModal, both gated in
     templates/reporting.html behind details_images_perm/details_fields_perm)
     -- so this reuses that check rather than inventing a new one. Built
     once, lazily, right before the foot bar. */
  function ensureCallout() {
    if (el('rdCallout') || !window.NexoraWorkitemDetail || !el('rdWiModal')) return;
    var foot = document.querySelector('#rdPanel .reporting-drill-foot');
    if (!foot || !foot.parentNode) return;
    var div = document.createElement('div');
    div.id = 'rdCallout';
    div.className = 'reporting-drill-callout';
    div.setAttribute('data-testid', 'reporting-drill-callout');
    div.innerHTML = '<i class="fas fa-eye" aria-hidden="true"></i><span>' + esc(I18N.calloutText) + '</span>';
    foot.parentNode.insertBefore(div, foot);
  }

  function close() {
    el('rdPanel').hidden = true;
    el('rdBackdrop').hidden = true;
    current = null;
  }

  function renderRows(columns, rows, truncated, isDistinct) {
    var head = '<tr>' + columns.map(function (c) {
      return '<th>' + esc(c.header || c.field) + '</th>';
    }).join('') + '</tr>';
    var wiIdx = -1, typeIdx = -1;
    columns.forEach(function (c, i) {
      if (c.field === 'workitem_id') wiIdx = i;
      if (c.field === 'doctype') typeIdx = i;
    });
    var body = rows.map(function (r) {
      return '<tr>' + r.map(function (v, i) {
        var cell = v == null ? '<span class="reporting-drill-null">' + esc(I18N.nullLabel) + '</span>'
                             : esc(String(v).slice(0, 200));
        if (i === wiIdx && v != null) {
          cell = '<a href="' + API_PREFIX + 'workitems?search=' + encodeURIComponent(String(v)) +
                 '" target="_blank" rel="noopener" class="reporting-drill-wi-link" data-wid="' +
                 esc(String(v)) + '">' + esc(String(v)) + '</a>';
        } else if (i === typeIdx && v != null) {
          cell = '<span class="reporting-drill-type-pill">' + esc(String(v).slice(0, 200)) + '</span>';
        }
        return '<td>' + cell + '</td>';
      }).join('') + '</tr>';
    }).join('');
    el('rdBody').innerHTML = '<table><thead>' + head + '</thead><tbody>' + body + '</tbody></table>';
    var notes = [];
    if (isDistinct) notes.push(I18N.distinctNote);
    if (truncated) notes.push(I18N.truncatedNote.replace('{n}', String(rows.length)));
    el('rdNote').textContent = notes.join(' ');
  }

  /* opts: {definition, fields, clicked, header, isDistinct} */
  function open(opts) {
    var dd = buildDrillDefinition(opts.definition, opts.fields, opts.clicked);
    if (!dd) { toast(I18N.cannotFilter, true); return; }
    current = { definition: dd };
    var token = current;                          // guards against a stale response
                                                    // from an earlier open() call winning
                                                    // the race once current is reassigned
    el('rdTitle').textContent = opts.header || I18N.title;
    el('rdSubtitle').textContent = I18N.title;
    renderChips(opts.definition, opts.fields, opts.clicked);
    ensureCallout();
    el('rdBody').innerHTML =
      '<div class="reporting-ai-loading"><span class="reporting-ai-dots" aria-hidden="true">' +
      '<i></i><i></i><i></i></span><span role="status">' + esc(I18N.loading) + '</span></div>';
    el('rdNote').textContent = '';
    el('rdPanel').hidden = false;
    el('rdBackdrop').hidden = false;
    fetch(API_PREFIX + 'api/reporting/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf },
      body: JSON.stringify(dd)
    }).then(function (res) {
      return res.json().then(function (data) { return { ok: res.ok, data: data }; });
    }).then(function (r) {
      if (current !== token) return;               // closed, or superseded by a later open()
      if (!r.ok) {
        el('rdBody').innerHTML = '<p class="reporting-drill-note">' +
          esc((r.data && r.data.error) || I18N.loadError) + '</p>';
        return;
      }
      renderRows(r.data.columns || [], r.data.rows || [], !!r.data.truncated,
                 !!opts.isDistinct);
    }).catch(function () {
      if (current === token) {
        el('rdBody').innerHTML = '<p class="reporting-drill-note">' + esc(I18N.loadError) + '</p>';
      }
    });
  }

  /* Mirrors the rsExport click listener in _reporting_simple_js.html: same
     endpoint, same body shape, same blob/anchor download idiom — just swaps
     in the drill definition and the caller's chosen format. */
  async function exportDrill(format) {
    if (!current) return;
    var body = Object.assign({}, current.definition, { format: format });
    var res;
    try {
      res = await fetch(API_PREFIX + 'api/reporting/export', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf },
        body: JSON.stringify(body)
      });
    } catch (e) { res = { ok: false }; }
    if (!res.ok) {
      el('rdNote').textContent = I18N.couldNotExport;
      return;
    }
    var blob = await res.blob();
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (current.definition.title || I18N.exportName) + '.' + format;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  /* ---- Workitem detail panel: opened from a workitem-id link inside the
     drill body. Read-only, perm-gated (window.NexoraWorkitemDetail and the
     #rdWiModal shell only exist when templates/reporting.html included
     js/_workitem_detail_panel_js.html -- see details_images_perm /
     details_fields_perm in nx_lib/views/reporting.py's reporting()). Mirrors
     openPreview/closePreview in templates/js/_prepared_documents_js.html. ---- */
  var _wiLightbox = null;

  function openWorkitemPanel(wid) {
    var modal = el('rdWiModal');
    var body = el('rdWiBody');
    if (!modal || !body || !window.NexoraWorkitemDetail) return;
    if (!_wiLightbox && window.NexoraWorkitemDetail.attachLightbox) {
      _wiLightbox = window.NexoraWorkitemDetail.attachLightbox({
        modal: 'rdWiLightbox', image: 'rdWiImage',
        hlLayer: 'rdWiHlLayer', hlToggle: 'rdWiHlToggle',
        hlToggleLabel: 'rdWiHlToggleLabel',
        reviewPanel: 'rdWiReviewPanel', reviewPanelBody: 'rdWiReviewPanelBody'
      });
    }
    body.innerHTML = '';
    window.NexoraWorkitemDetail.render(wid, body, {
      readOnly: true,
      perms: window.__rpDrillPerms || {}
    });
    modal.hidden = false;
  }

  function closeWorkitemPanel() {
    var modal = el('rdWiModal');
    if (!modal) return;
    modal.hidden = true;
    var body = el('rdWiBody');
    if (body) body.innerHTML = '';
  }

  function wire() {
    el('rdClose').addEventListener('click', close);
    el('rdBackdrop').addEventListener('click', close);
    if (el('rdExportCsv')) {
      el('rdExportCsv').addEventListener('click', function () { exportDrill('csv'); });
      el('rdExportXlsx').addEventListener('click', function () { exportDrill('xlsx'); });
    }

    // Workitem-id links in the drill body: a plain click opens the shared
    // read-only detail panel in a modal instead of navigating; Ctrl/Cmd/Shift
    // click (and middle-click, which never fires 'click') keep the native
    // new-tab anchor behaviour. No-op entirely when the panel shell/module
    // isn't on the page (perm-gated out in templates/reporting.html).
    el('rdBody').addEventListener('click', function (e) {
      var link = e.target.closest('.reporting-drill-wi-link');
      if (!link || !window.NexoraWorkitemDetail || !el('rdWiModal')) return;
      if (e.ctrlKey || e.metaKey || e.shiftKey) return;
      e.preventDefault();
      openWorkitemPanel(link.dataset.wid);
    });
    var rdWiModal = el('rdWiModal');
    if (rdWiModal) {
      el('rdWiClose').addEventListener('click', closeWorkitemPanel);
      rdWiModal.addEventListener('click', function (e) {
        if (e.target === rdWiModal) closeWorkitemPanel();
      });
    }
    // Single Escape handler, innermost layer first: the lightbox's own
    // Escape handler (its shell is #rdWiLightbox, display:flex when open) --
    // same guard as _prepared_documents_js.html's closePreview -- then the
    // workitem panel, then the drill drawer itself. Only one layer closes
    // per press.
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      var lb = document.getElementById('rdWiLightbox');
      if (lb && lb.style.display === 'flex') return;
      if (rdWiModal && !rdWiModal.hidden) { closeWorkitemPanel(); return; }
      if (!el('rdPanel').hidden) close();
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', wire);
  } else {
    wire();
  }

  return {
    buildDrillDefinition: buildDrillDefinition,
    addGrainUpper: addGrainUpper,
    open: open,
    close: close,
    I18N: I18N
  };
})();
</script>
