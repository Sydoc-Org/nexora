<script>
(function () {
  const csrf = document.querySelector('meta[name="csrf-token"]').content;
  const state = { source: null, fields: [], columns: [], filters: [], sort: [], processes: [] };

  async function api(url, opts) {
    opts = opts || {};
    const res = await fetch(url, Object.assign(
      { headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf } },
      opts
    ));
    if (!res.ok) {
      const body = await res.json().catch(function () { return {}; });
      throw new Error(body.error || res.statusText);
    }
    return res;
  }

  function buildDefinition() {
    return {
      schemaVersion: 1,
      source: state.source,
      visualization: 'table',
      title: document.getElementById('rpTitle').value || 'Untitled report',
      subtitle: document.getElementById('rpSubtitle').value || null,
      columns: state.columns.map(function (c) {
        return { field: c.field, header: c.header || c.label, agg: null };
      }),
      groupBy: [],
      filters: state.filters,
      sort: state.sort,
      scope: { clients: [], processes: state.processes },
      rowLimit: 5000,
      sql: null,
      sqlTarget: null,
    };
  }

  function renderFields() {
    var q = document.getElementById('rpFieldSearch').value.toLowerCase();
    var ul = document.getElementById('rpFieldList');
    ul.innerHTML = '';
    state.fields.filter(function (f) {
      return f.label.toLowerCase().indexOf(q) !== -1;
    }).forEach(function (f) {
      var li = document.createElement('li');
      li.textContent = f.label;
      li.onclick = function () {
        if (!state.columns.find(function (c) { return c.field === f.field; })) {
          state.columns.push(Object.assign({}, f, { header: f.label }));
          renderWells();
        }
      };
      ul.appendChild(li);
    });
  }

  function renderWells() {
    var cols = document.getElementById('rpWellColumns');
    cols.innerHTML = '';
    state.columns.forEach(function (c, i) {
      var li = document.createElement('li');
      var inp = document.createElement('input');
      inp.value = c.header;
      inp.oninput = function (e) { c.header = e.target.value; };
      var rm = document.createElement('button');
      rm.textContent = '×';
      rm.onclick = function () { state.columns.splice(i, 1); renderWells(); };
      li.appendChild(inp);
      li.appendChild(rm);
      cols.appendChild(li);
    });
    // Sort entries reference selected columns, so drop any whose column was
    // removed, then re-render the Sort well.
    state.sort = state.sort.filter(function (s) {
      return state.columns.find(function (c) { return c.field === s.field; });
    });
    renderSort();
  }

  function renderResults(data) {
    var wrap = document.getElementById('rpResults');
    wrap.innerHTML = '';
    if (!data.rows.length) {
      var empty = document.createElement('p');
      empty.className = 'reporting-empty';
      empty.textContent = '{{ _("No rows.") }}';
      wrap.appendChild(empty);
      return;
    }
    var table = document.createElement('table');
    table.className = 'reporting-table';

    var thead = document.createElement('thead');
    var headRow = document.createElement('tr');
    data.columns.forEach(function (c) {
      var th = document.createElement('th');
      th.textContent = c.header;
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    var tbody = document.createElement('tbody');
    data.rows.forEach(function (r) {
      var tr = document.createElement('tr');
      r.forEach(function (v) {
        var td = document.createElement('td');
        td.textContent = (v == null ? '' : String(v));
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    wrap.appendChild(table);
  }

  function loadSources() {
    api('/api/reporting/sources').then(function (res) {
      return res.json();
    }).then(function (sources) {
      var sel = document.getElementById('rpSource');
      sel.innerHTML = '';
      sources.forEach(function (s) {
        var opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = s.label;
        sel.appendChild(opt);
      });
      function pick() {
        var s = sources.find(function (x) { return x.id === sel.value; });
        if (!s) return;
        state.source = s.id;
        state.fields = s.fields || [];
        state.processes = s.processes || [];
        state.columns = [];
        renderFields();
        renderWells();
      }
      sel.onchange = pick;
      if (sources.length) pick();
    }).catch(function (e) {
      console.error('{{ _("Could not load sources") }}:', e.message);
    });
  }

  function run() {
    api('/api/reporting/run', { method: 'POST', body: JSON.stringify(buildDefinition()) })
      .then(function (res) { return res.json(); })
      .then(function (data) { renderResults(data); })
      .catch(function (e) {
        var wrap = document.getElementById('rpResults');
        wrap.innerHTML = '';
        var p = document.createElement('p');
        p.className = 'reporting-error';
        p.textContent = e.message;
        wrap.appendChild(p);
      });
  }

  function save() {
    var name = window.prompt('{{ _("Report name") }}',
      document.getElementById('rpTitle').value || 'Report');
    if (!name) return;
    api('/api/reporting/reports', {
      method: 'POST',
      body: JSON.stringify({ name: name, definition: buildDefinition() }),
    }).then(function () {
      window.alert('{{ _("Saved") }}');
    }).catch(function (e) {
      window.alert('{{ _("Save failed") }}: ' + e.message);
    });
  }

  function exportXlsx() {
    api('/api/reporting/export', { method: 'POST', body: JSON.stringify(buildDefinition()) })
      .then(function (res) { return res.blob(); })
      .then(function (blob) {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = (document.getElementById('rpTitle').value || 'report') + '.xlsx';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
      }).catch(function (e) {
        window.alert('{{ _("Export failed") }}: ' + e.message);
      });
  }

  function addFilter() {
    if (!state.fields.length) return;
    state.filters.push({ field: state.fields[0].field, op: 'eq', value: '' });
    renderFilters();
  }

  function renderFilters() {
    var box = document.getElementById('rpWellFilters');
    box.innerHTML = '';
    state.filters.forEach(function (f, i) {
      var row = document.createElement('div');
      row.className = 'reporting-filter-row';

      var fld = document.createElement('select');
      state.fields.filter(function (x) {
        return x.filterable;
      }).forEach(function (x) {
        var opt = document.createElement('option');
        opt.value = x.field;
        opt.textContent = x.label;
        fld.appendChild(opt);
      });
      fld.value = f.field;
      // Re-render when field changes so flatpickr initializes for date fields.
      fld.onchange = function (e) { f.field = e.target.value; f.value = ''; renderFilters(); };

      var op = document.createElement('select');
      ['eq', 'ne', 'contains', 'starts_with', 'gt', 'gte', 'lt', 'lte',
        'is_null', 'is_not_null'].forEach(function (o) {
        var opt = document.createElement('option');
        opt.value = o;
        opt.textContent = o;
        op.appendChild(opt);
      });
      op.value = f.op;
      op.onchange = function (e) { f.op = e.target.value; };

      var val = document.createElement('input');
      val.value = f.value != null ? f.value : '';
      val.oninput = function (e) { f.value = e.target.value; };

      // Initialize flatpickr for date/datetime fields if the library is present.
      var fieldMeta = state.fields.find(function (x) { return x.field === f.field; });
      if (fieldMeta && /date/i.test(fieldMeta.type) && typeof flatpickr === 'function') {
        var fpOpts = { allowInput: true, onChange: function (d, s) { f.value = s; } };
        if (/time|datetime/i.test(fieldMeta.type)) {
          fpOpts.enableTime = true;
          fpOpts.dateFormat = 'Y-m-d H:i';
        } else {
          fpOpts.dateFormat = 'Y-m-d';
        }
        flatpickr(val, fpOpts);
      }

      var rm = document.createElement('button');
      rm.textContent = '×';
      rm.onclick = function () { state.filters.splice(i, 1); renderFilters(); };

      row.appendChild(fld);
      row.appendChild(op);
      row.appendChild(val);
      row.appendChild(rm);
      box.appendChild(row);
    });
  }

  function addSort() {
    // Sort fields must be among the selected columns (the backend rejects sort
    // fields not in the projection), so seed from the first selected column.
    if (!state.columns.length) return;
    state.sort.push({ field: state.columns[0].field, dir: 'asc' });
    renderSort();
  }

  function renderSort() {
    var box = document.getElementById('rpWellSort');
    box.innerHTML = '';
    state.sort.forEach(function (s, i) {
      var row = document.createElement('div');
      row.className = 'reporting-filter-row';

      var fld = document.createElement('select');
      state.columns.forEach(function (c) {
        var opt = document.createElement('option');
        opt.value = c.field;
        opt.textContent = c.header || c.label || c.field;
        fld.appendChild(opt);
      });
      fld.value = s.field;
      fld.onchange = function (e) { s.field = e.target.value; };

      var dir = document.createElement('select');
      ['asc', 'desc'].forEach(function (d) {
        var opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d;
        dir.appendChild(opt);
      });
      dir.value = s.dir;
      dir.onchange = function (e) { s.dir = e.target.value; };

      var rm = document.createElement('button');
      rm.textContent = '×';
      rm.onclick = function () { state.sort.splice(i, 1); renderSort(); };

      row.appendChild(fld);
      row.appendChild(dir);
      row.appendChild(rm);
      box.appendChild(row);
    });
  }

  document.getElementById('rpFieldSearch').addEventListener('input', renderFields);
  document.getElementById('rpRun').addEventListener('click', run);
  document.getElementById('rpSave').addEventListener('click', save);
  document.getElementById('rpExport').addEventListener('click', exportXlsx);
  document.getElementById('rpAddFilter').addEventListener('click', addFilter);
  document.getElementById('rpAddSort').addEventListener('click', addSort);

  loadSources();
}());
</script>
