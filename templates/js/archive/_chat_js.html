<script nonce="{{ csp_nonce() }}">
  let activeConversationId = null;
  let pollInterval = null;
  const API_PREFIX = window.location.href.includes("nexora") ? "/nexora/" : "/";

  document.addEventListener('DOMContentLoaded', loadConversations);

  setInterval(() => {
    loadConversations();
    if (activeConversationId) loadMessages(activeConversationId, false);
  }, 3000);

  function loadConversations() {
    fetch(`${API_PREFIX}api/chat/conversations`, {
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': csrfToken
      }
    })
      .then(r => r.json())
      .then(data => {
        const container = document.getElementById('conversationList');
        container.innerHTML = '';
        data.forEach(conv => {
          const isActive = activeConversationId === conv.id;
          const div = document.createElement('div');
          div.className = `p-3 rounded cursor-pointer flex items-center gap-3 ${isActive ? 'bg-indigo-50 border-l-4 border-indigo-600' : 'hover:bg-gray-100'}`;
          div.onclick = () => openChat(conv.id, conv.name, conv.avatar);
          div.setAttribute('data-testid', `chat-conversation-${conv.id}`);

          div.innerHTML = `
                        <img src="${conv.avatar}" class="w-10 h-10 rounded-full object-cover">
                        <div class="flex-1 overflow-hidden">
                            <div class="flex justify-between">
                                <span class="font-semibold text-sm">${conv.name}</span>
                                <span class="text-xs text-gray-400">${conv.last_time}</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <p class="text-xs text-gray-500 truncate w-3/4">${conv.last_message}</p>
                                ${conv.unread > 0 ? `<span class="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full">${conv.unread}</span>` : ''}
                            </div>
                        </div>
                    `;
          container.appendChild(div);
        });
      });
  }

  function startChat(userId) {
    fetch(`${API_PREFIX}api/chat/start/${userId}`, {
      method: 'POST', headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': csrfToken
      }
    })
      .then(r => r.json())
      .then(data => {
        document.getElementById('newChatModal').classList.add('hidden');
        loadConversations();
      });
  }

  function openChat(convId, name, avatar) {
    activeConversationId = convId;
    document.getElementById('chatHeader').classList.remove('hidden');
    document.getElementById('inputArea').classList.remove('hidden');
    document.getElementById('chatHeaderName').innerText = name;
    document.getElementById('chatHeaderImg').src = avatar;
    loadMessages(convId, true);
  }

  function formatChatMessage(text) {
    if (text.startsWith("FILE:")) {
      const [name, url] = text.replace("FILE:", "").split("|");
      const isImg = /\.(jpg|jpeg|png|gif)$/i.test(name);

      if (isImg) {
        return `<a href="${url}" target="_blank" data-testid="chat-attachment-image"><img src="${url}" class="max-w-xs rounded shadow-sm hover:opacity-90"></a>
                    <span class="text-xs block mt-1 opacity-70">${name}</span>`;
      }
      return `<a href="${url}" target="_blank" class="flex items-center gap-2 underline" data-testid="chat-attachment-file">
                  <i class="fa-solid fa-file-arrow-down"></i> ${name}
                </a>`;
    }
    const workitemRegex = /\/(\d+)/g;
    return text.replace(workitemRegex, (match, id) => {
      const url = `${API_PREFIX}workitems?search=${id}`;
      return `<a href="${url}" class="text-indigo-200 underline font-bold hover:text-white" data-testid="chat-workitem-link-${id}"><i class="fa-solid fa-file-lines mr-1"></i>${match}</a>`;
    });
  }

  function uploadFile() {
    const fileInput = document.getElementById('fileInput');
    if (!fileInput.files[0] || !activeConversationId) return;

    const formData = new FormData();
    formData.append('file', fileInput.files[0]);

    fetch(`${API_PREFIX}api/chat/${activeConversationId}/upload`, {
      method: 'POST',
      headers: { 'X-CSRFToken': '{{ csrf_token() }}' },
      body: formData
    }).then(r => r.json()).then(data => {
      if (data.success) {
        fileInput.value = '';
        loadMessages(activeConversationId, true);
      } else {
        alert(data.message);
      }
    });
  }
  function loadMessages(convId, scroll) {
    fetch(`${API_PREFIX}api/chat/${convId}/messages`, {
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken }
    })
      .then(r => r.json())
      .then(msgs => {
        const container = document.getElementById('messageContainer');
        container.innerHTML = '';

        msgs.forEach(msg => {
          const isMe = msg.is_me;
          const div = document.createElement('div');
          div.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`;

          const formattedText = formatChatMessage(msg.text);

          div.innerHTML = `
                <div class="flex flex-col max-w-[70%] ${isMe ? 'items-end' : 'items-start'}">
                    <div class="${isMe ? 'nx-bubble-me text-white' : 'bg-white border text-gray-800'} px-4 py-2 rounded-lg shadow-sm">
                        ${formattedText}
                    </div>
                    <span class="text-[10px] text-gray-400 mt-1">${msg.time}</span>
                </div>
            `;
          container.appendChild(div);
        });
        if (scroll) container.scrollTop = container.scrollHeight;
      });
  }
  document.getElementById('chatForm').onsubmit = (e) => {
    e.preventDefault();
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if (!text || !activeConversationId) return;

    fetch(`${API_PREFIX}api/chat/${activeConversationId}/send`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token() }}' },
      body: JSON.stringify({ message: text })
    }).then(() => {
      input.value = '';
      loadMessages(activeConversationId, true);
      loadConversations();
    });
  };

  const messageInput = document.getElementById('messageInput');
const commandHint = document.getElementById('commandHint');

messageInput.addEventListener('input', (e) => {
    const value = e.target.value;
    if (value.endsWith('/') || (value.startsWith('/') && !value.includes(' '))) {
        commandHint.classList.remove('hidden');
    } else {
        commandHint.classList.add('hidden');
    }
});

document.getElementById('chatForm').addEventListener('submit', () => {
    commandHint.classList.add('hidden');
});
</script>
