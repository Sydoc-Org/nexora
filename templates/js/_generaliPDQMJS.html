<script>
    const API_PREFIX = window.location.href.includes("nexora") ? "/nexora/" : "/";
    const canEdit = document.getElementById('pdqmTable').dataset.canEdit === 'true';
    const canAdd  = document.getElementById('pdqmTable').dataset.canAdd  === 'true';
    const colSpan = canEdit ? 8 : 7;

    let currentPage = 1;
    // categoriesData shape: { "Parent": { "": ["Sub1"], "ParentSub": ["Sub2"] } }
    // "" key means the DB row had NULL for ParentSubCategory
    let categoriesData = {};
    let translationsMap = {};

    // ----------------------------- category helpers ----------------------------- //
    function populateParentSelect(selectEl, selected) {
        const current = selected !== undefined ? selected : selectEl.value;
        while (selectEl.options.length > 1) selectEl.remove(1);
        Object.keys(categoriesData).sort().forEach(parent => {
            const opt = document.createElement('option');
            opt.value = parent;
            opt.textContent = translationsMap[parent] || parent;
            if (parent === current) opt.selected = true;
            selectEl.appendChild(opt);
        });
    }

    // Null ParentSubCategory entries use the sentinel "__null__" as option value
    // to avoid collision with the placeholder option (which also has value "").
    // "__null__" is translated back to "" before sending to the API.
    const NULL_SENTINEL = '__null__';

    function populateParentSubSelect(selectEl, parent, selected) {
        while (selectEl.options.length > 0) selectEl.remove(0);
        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = parent ? {{ _("Select…") | tojson }} : {{ _("Select parent first") | tojson }};
        selectEl.appendChild(placeholder);

        if (parent && categoriesData[parent]) {
            const keys = Object.keys(categoriesData[parent]).sort((a, b) => {
                if (a === '') return -1;
                if (b === '') return 1;
                return a.localeCompare(b);
            });
            keys.forEach(key => {
                const opt = document.createElement('option');
                opt.value = key === '' ? NULL_SENTINEL : key;  // "" → sentinel
                opt.textContent = key === '' ? '—' : (translationsMap[key] || key);
                if (opt.value === selected) opt.selected = true;
                selectEl.appendChild(opt);
            });
        }
    }

    // Auto-select the null sentinel if it's the only real option, then populate subs.
    function autoSelectNullIfOnly(pscEl, scEl, parent) {
        const real = Array.from(pscEl.options).slice(1);
        if (real.length === 1 && real[0].value === NULL_SENTINEL) {
            pscEl.value = NULL_SENTINEL;
            populateSubSelect(scEl, parent, NULL_SENTINEL);
        }
    }

    function populateSubSelect(selectEl, parent, parentSub, selected) {
        while (selectEl.options.length > 0) selectEl.remove(0);
        const ready = parentSub !== null && parentSub !== undefined && parentSub !== '';
        const isFilter = selectEl.id.startsWith('filter');

        if (!ready || !parent) {
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = isFilter ? {{ _("All") | tojson }} : {{ _("Select parent sub first") | tojson }};
            selectEl.appendChild(placeholder);
            selectEl.disabled = false;
            return;
        }

        // translate sentinel back to "" for data lookup
        const lookupKey = parentSub === NULL_SENTINEL ? '' : parentSub;
        const subs = (categoriesData[parent] && categoriesData[parent][lookupKey]) ? categoriesData[parent][lookupKey] : [];

        if (subs.length === 0) {
            const opt = document.createElement('option');
            opt.value = '';
            opt.textContent = isFilter ? {{ _("All") | tojson }} : '—';
            selectEl.appendChild(opt);
            selectEl.disabled = !isFilter;
            return;
        }

        selectEl.disabled = false;
        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = isFilter ? {{ _("All") | tojson }} : {{ _("Select…") | tojson }};
        selectEl.appendChild(placeholder);
        subs.forEach(sub => {
            const opt = document.createElement('option');
            opt.value = sub;
            opt.textContent = translationsMap[sub] || sub;
            if (sub === selected) opt.selected = true;
            selectEl.appendChild(opt);
        });
    }

    function loadCategories() {
        fetch(API_PREFIX + 'api/generali/pdqm/categories', { headers: { 'X-CSRFToken': csrfToken } })
            .then(r => r.json())
            .then(data => {
                if (!data.success) return;
                categoriesData = data.categories || {};
                translationsMap = data.translations || {};

                populateParentSelect(document.getElementById('filterParentCategory'));
                document.getElementById('filterParentCategory').options[0].textContent = {{ _("All") | tojson }};

                if (canAdd) populateParentSelect(document.getElementById('addParentCategory'));
                populateParentSelect(document.getElementById('editParentCategory'));
            })
            .catch(e => console.error('Failed to load PDQM categories', e));
    }

    // ----------------------------- formatting ----------------------------- //
    function formatDate(dateStr) {
        if (!dateStr) return '—';
        return dateStr.split('T')[0];
    }

    function formatDateTime(dtStr) {
        if (!dtStr) return '—';
        return dtStr.replace('T', ' ').substring(0, 16);
    }

    // ----------------------------- fetch / render ----------------------------- //
    function buildParams(page) {
        const p = new URLSearchParams();
        const start     = document.getElementById('filterStartDate').value;
        const end       = document.getElementById('filterEndDate').value;
        const parent    = document.getElementById('filterParentCategory').value;
        const parentSub = document.getElementById('filterParentSubCategory').value;
        const sub       = document.getElementById('filterSubCategory').value;
        if (start)     p.set('startDate', start);
        if (end)       p.set('endDate', end);
        if (parent)    p.set('parentCategory', parent);
        // send parentSubCategory only when a filter is actively selected
        if (document.getElementById('filterParentSubCategory').dataset.active === 'true') {
            p.set('parentSubCategory', parentSub === NULL_SENTINEL ? '' : parentSub);
        }
        if (sub)       p.set('subCategory', sub);
        p.set('page', page);
        return p;
    }

    function renderRow(r) {
        const tParent    = translationsMap[r.parentCategory]    || r.parentCategory    || '—';
        const tParentSub = r.parentSubCategory ? (translationsMap[r.parentSubCategory] || r.parentSubCategory) : null;
        const tSub       = translationsMap[r.subCategory]       || r.subCategory       || '—';
        const parentSubDisplay = tParentSub === null
            ? '<span class="text-gray-400">—</span>'
            : `<span class="text-sm text-gray-700">${tParentSub}</span>`;

        const actionsCell = canEdit ? `
            <td class="px-4 py-3 text-center whitespace-nowrap">
                <button onclick="openEditModal(${r.id})"
                    class="inline-flex items-center gap-1 text-xs font-semibold text-indigo-600 hover:text-indigo-800 px-2 py-1 rounded-lg hover:bg-indigo-50 transition mr-1">
                    <i class="fas fa-pen text-xs"></i>
                </button>
                <button onclick="deleteRecord(${r.id})"
                    class="inline-flex items-center gap-1 text-xs font-semibold text-red-500 hover:text-red-700 px-2 py-1 rounded-lg hover:bg-red-50 transition">
                    <i class="fas fa-trash text-xs"></i>
                </button>
            </td>` : '';

        const parentSubValue = r.parentSubCategory !== null && r.parentSubCategory !== undefined ? r.parentSubCategory : '';

        return `<tr class="hover:bg-gray-50 transition"
            data-record-id="${r.id}"
            data-for-date="${r.forDate || ''}"
            data-parent="${(r.parentCategory || '').replace(/"/g, '&quot;')}"
            data-parent-sub="${parentSubValue.replace(/"/g, '&quot;')}"
            data-sub="${(r.subCategory || '').replace(/"/g, '&quot;')}"
            data-quantity="${r.quantity !== null ? r.quantity : ''}">
            <td class="px-4 py-3 text-center whitespace-nowrap">
                <span class="text-sm font-semibold text-gray-800">${formatDate(r.forDate)}</span>
            </td>
            <td class="px-4 py-3 text-center whitespace-nowrap">
                <span class="text-sm text-gray-700">${r.fullname || r.userId || '—'}</span>
            </td>
            <td class="px-4 py-3 text-left">
                <span class="text-sm text-gray-800">${tParent}</span>
            </td>
            <td class="px-4 py-3 text-left">${parentSubDisplay}</td>
            <td class="px-4 py-3 text-left">
                <span class="text-sm text-gray-600">${tSub}</span>
            </td>
            <td class="px-4 py-3 text-center whitespace-nowrap">
                <span class="px-2.5 py-1 text-xs font-semibold rounded-full bg-indigo-50 text-indigo-700">${r.quantity !== null ? r.quantity : '—'}</span>
            </td>
            <td class="px-4 py-3 text-center whitespace-nowrap">
                <span class="text-xs text-gray-400">${formatDateTime(r.recordDateTime)}</span>
            </td>
            ${actionsCell}
        </tr>`;
    }

    function loadRecords(page) {
        currentPage = page;
        const tbody = document.getElementById('pdqmTbody');
        tbody.innerHTML = `<tr><td colspan="${colSpan}" class="text-center py-16"><i class="fas fa-spinner fa-spin text-3xl text-indigo-600"></i></td></tr>`;

        const params = buildParams(page);
        fetch(API_PREFIX + 'api/generali/pdqm?' + params.toString(), { headers: { 'X-CSRFToken': csrfToken } })
            .then(r => r.json())
            .then(data => {
                if (!data.success) {
                    tbody.innerHTML = `<tr><td colspan="${colSpan}" class="text-center py-10 text-red-500 text-sm">${data.error || 'Error'}</td></tr>`;
                    return;
                }

                document.getElementById('totalQuantityDisplay').textContent =
                    data.totalQuantity !== undefined ? data.totalQuantity : '—';

                if (!data.records.length) {
                    tbody.innerHTML = `<tr><td colspan="${colSpan}" class="text-center py-16 text-gray-400 text-sm">{{ _("No records found") }}</td></tr>`;
                } else {
                    tbody.innerHTML = data.records.map(renderRow).join('');
                }

                const pg = data.pagination;
                const showing = Math.min((pg.page - 1) * pg.per_page + data.records.length, pg.total_records);
                document.getElementById('showingCount').textContent = showing;
                document.getElementById('totalCount').textContent = pg.total_records;
                renderPagination(pg.page, pg.total_pages);
            })
            .catch(e => {
                tbody.innerHTML = `<tr><td colspan="${colSpan}" class="text-center py-10 text-red-500 text-sm">Network error</td></tr>`;
                console.error(e);
            });
    }

    // ----------------------------- pagination ----------------------------- //
    function renderPagination(page, totalPages) {
        const container = document.getElementById('paginationControls');
        container.innerHTML = '';
        if (totalPages <= 1) return;

        function btn(label, targetPage, disabled, active) {
            const b = document.createElement('button');
            b.innerHTML = label;
            b.disabled = disabled;
            b.className = [
                'px-3 py-1.5 rounded-lg text-sm font-semibold transition',
                active   ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white border border-gray-200 text-gray-600 hover:bg-gray-50',
                disabled ? 'opacity-40 cursor-not-allowed' : ''
            ].join(' ');
            if (!disabled) b.onclick = () => loadRecords(targetPage);
            return b;
        }

        container.appendChild(btn('<i class="fas fa-chevron-left"></i>', page - 1, page === 1, false));

        const pages = new Set([1, totalPages, page]);
        if (page > 2) pages.add(page - 1);
        if (page < totalPages - 1) pages.add(page + 1);

        let prev = 0;
        [...pages].sort((a, b) => a - b).forEach(p => {
            if (p - prev > 1) {
                const dots = document.createElement('span');
                dots.textContent = '…';
                dots.className = 'px-2 text-gray-400 text-sm';
                container.appendChild(dots);
            }
            container.appendChild(btn(p, p, false, p === page));
            prev = p;
        });

        container.appendChild(btn('<i class="fas fa-chevron-right"></i>', page + 1, page === totalPages, false));
    }

    // ----------------------------- filters ----------------------------- //
    document.getElementById('applyFilterBtn').addEventListener('click', () => loadRecords(1));

    document.getElementById('resetFilterBtn').addEventListener('click', () => {
        document.getElementById('filterStartDate').value = '';
        document.getElementById('filterEndDate').value = '';
        document.getElementById('filterParentCategory').value = '';
        const psc = document.getElementById('filterParentSubCategory');
        psc.dataset.active = 'false';
        while (psc.options.length > 1) psc.remove(1);
        psc.options[0].textContent = {{ _("All") | tojson }};
        psc.value = '';
        const sc = document.getElementById('filterSubCategory');
        while (sc.options.length > 1) sc.remove(1);
        sc.value = '';
        loadRecords(1);
    });

    document.getElementById('filterParentCategory').addEventListener('change', function() {
        const psc = document.getElementById('filterParentSubCategory');
        psc.dataset.active = 'false';
        const sc = document.getElementById('filterSubCategory');
        while (sc.options.length > 1) sc.remove(1);
        sc.value = '';

        populateParentSubSelect(psc, this.value);
        if (psc.options.length > 0) psc.options[0].textContent = {{ _("All") | tojson }};
        psc.value = '';

        // If only the null option exists, auto-select it and populate sub category
        const real = Array.from(psc.options).slice(1);
        if (real.length === 1 && real[0].value === NULL_SENTINEL) {
            psc.value = NULL_SENTINEL;
            psc.dataset.active = 'true';
            populateSubSelect(sc, this.value, NULL_SENTINEL);
            if (sc.options.length > 0) sc.options[0].textContent = {{ _("All") | tojson }};
        }
    });

    document.getElementById('filterParentSubCategory').addEventListener('change', function() {
        this.dataset.active = this.value !== '' ? 'true' : 'false';
        const parent = document.getElementById('filterParentCategory').value;
        const sc = document.getElementById('filterSubCategory');
        while (sc.options.length > 1) sc.remove(1);
        sc.value = '';
        if (parent && this.value !== '') {
            populateSubSelect(sc, parent, this.value);
            if (sc.options.length > 0) sc.options[0].textContent = {{ _("All") | tojson }};
        }
    });

    flatpickr('#filterStartDate', { dateFormat: 'Y-m-d', allowInput: true });
    flatpickr('#filterEndDate',   { dateFormat: 'Y-m-d', allowInput: true });

    // ----------------------------- Add Modal ----------------------------- //
    {% if can_add %}
    function openAddModal() {
        document.getElementById('addForDate').value = '';
        document.getElementById('addParentCategory').value = '';
        populateParentSubSelect(document.getElementById('addParentSubCategory'), '');
        populateSubSelect(document.getElementById('addSubCategory'), '', null);
        document.getElementById('addQuantity').value = '';
        document.getElementById('addModalError').classList.add('hidden');
        document.getElementById('addModalError').textContent = '';
        document.getElementById('addModal').classList.remove('hidden');
        document.getElementById('addModal').classList.add('flex');
    }

    function closeAddModal() {
        document.getElementById('addModal').classList.add('hidden');
        document.getElementById('addModal').classList.remove('flex');
    }

    document.getElementById('openAddModalBtn').addEventListener('click', openAddModal);
    document.getElementById('closeAddModalBtn').addEventListener('click', closeAddModal);
    document.getElementById('cancelAddModalBtn').addEventListener('click', closeAddModal);

    document.getElementById('addParentCategory').addEventListener('change', function() {
        const psc = document.getElementById('addParentSubCategory');
        const sc  = document.getElementById('addSubCategory');
        populateParentSubSelect(psc, this.value);
        populateSubSelect(sc, '', null);
        autoSelectNullIfOnly(psc, sc, this.value);
    });

    document.getElementById('addParentSubCategory').addEventListener('change', function() {
        const parent = document.getElementById('addParentCategory').value;
        populateSubSelect(document.getElementById('addSubCategory'), parent, this.value);
    });

    flatpickr('#addForDate', { dateFormat: 'Y-m-d', allowInput: true, maxDate: 'today' });

    document.getElementById('submitAddBtn').addEventListener('click', function() {
        const forDate    = document.getElementById('addForDate').value.trim();
        const parent     = document.getElementById('addParentCategory').value;
        const parentSub  = document.getElementById('addParentSubCategory').value;
        const sub        = document.getElementById('addSubCategory').value;
        const quantity   = document.getElementById('addQuantity').value;
        const errEl      = document.getElementById('addModalError');

        const addParentSubKey = parentSub === NULL_SENTINEL ? '' : parentSub;
        const addSubs = (categoriesData[parent] && categoriesData[parent][addParentSubKey]) ? categoriesData[parent][addParentSubKey] : [];
        if (!forDate || !parent || (addSubs.length > 0 && !sub) || !quantity) {
            errEl.textContent = {{ _("Please fill in all fields.") | tojson }};
            errEl.classList.remove('hidden');
            return;
        }

        this.disabled = true;
        fetch(API_PREFIX + 'api/generali/pdqm', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
            body: JSON.stringify({
                forDate,
                parentCategory: parent,
                parentSubCategory: parentSub === NULL_SENTINEL ? '' : parentSub,
                subCategory: sub || null,
                quantity: parseInt(quantity, 10)
            })
        })
        .then(r => r.json())
        .then(data => {
            this.disabled = false;
            if (data.success) {
                closeAddModal();
                loadRecords(1);
            } else {
                errEl.textContent = data.error || {{ _("Error saving record.") | tojson }};
                errEl.classList.remove('hidden');
            }
        })
        .catch(() => {
            this.disabled = false;
            errEl.textContent = {{ _("Network error.") | tojson }};
            errEl.classList.remove('hidden');
        });
    });
    {% endif %}

    // ----------------------------- Edit Modal ----------------------------- //
    let editingId = null;

    function openEditModal(id) {
        editingId = id;
        const row = document.querySelector(`[data-record-id="${id}"]`);
        if (!row) return;

        const forDate      = row.dataset.forDate   || '';
        const parent       = row.dataset.parent    || '';
        // data-parent-sub is "" when DB was NULL; map to sentinel for dropdown selection
        const rawParentSub = row.dataset.parentSub;
        const parentSubKey = (rawParentSub === '' || rawParentSub === undefined) ? NULL_SENTINEL : rawParentSub;
        const sub          = row.dataset.sub       || '';
        const quantity     = row.dataset.quantity  || '';

        document.getElementById('editForDate').value = forDate;
        populateParentSelect(document.getElementById('editParentCategory'), parent);
        const editPsc = document.getElementById('editParentSubCategory');
        const editSc  = document.getElementById('editSubCategory');
        populateParentSubSelect(editPsc, parent, parentSubKey);
        populateSubSelect(editSc, parent, parentSubKey, sub);
        // if only the null option exists, ensure it stays selected
        autoSelectNullIfOnly(editPsc, editSc, parent);
        document.getElementById('editQuantity').value = quantity;
        document.getElementById('editError').classList.add('hidden');
        document.getElementById('editError').textContent = '';

        document.getElementById('editModal').classList.remove('hidden');
        document.getElementById('editModal').classList.add('flex');
    }

    function closeEditModal() {
        document.getElementById('editModal').classList.add('hidden');
        document.getElementById('editModal').classList.remove('flex');
        editingId = null;
    }

    document.getElementById('closeEditBtn').addEventListener('click', closeEditModal);
    document.getElementById('cancelEditBtn').addEventListener('click', closeEditModal);

    document.getElementById('editParentCategory').addEventListener('change', function() {
        const psc = document.getElementById('editParentSubCategory');
        const sc  = document.getElementById('editSubCategory');
        populateParentSubSelect(psc, this.value);
        populateSubSelect(sc, '', null);
        autoSelectNullIfOnly(psc, sc, this.value);
    });

    document.getElementById('editParentSubCategory').addEventListener('change', function() {
        const parent = document.getElementById('editParentCategory').value;
        populateSubSelect(document.getElementById('editSubCategory'), parent, this.value);
    });

    flatpickr('#editForDate', { dateFormat: 'Y-m-d', allowInput: true, maxDate: 'today' });

    document.getElementById('saveEditBtn').addEventListener('click', function() {
        const forDate   = document.getElementById('editForDate').value.trim();
        const parent    = document.getElementById('editParentCategory').value;
        const parentSub = document.getElementById('editParentSubCategory').value;
        const sub       = document.getElementById('editSubCategory').value;
        const quantity  = document.getElementById('editQuantity').value;
        const errEl     = document.getElementById('editError');

        const editParentSubKey = parentSub === NULL_SENTINEL ? '' : parentSub;
        const editSubs = (categoriesData[parent] && categoriesData[parent][editParentSubKey]) ? categoriesData[parent][editParentSubKey] : [];
        if (!forDate || !parent || (editSubs.length > 0 && !sub) || !quantity) {
            errEl.textContent = {{ _("Please fill in all fields.") | tojson }};
            errEl.classList.remove('hidden');
            return;
        }

        this.disabled = true;
        fetch(API_PREFIX + `api/generali/pdqm/${editingId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
            body: JSON.stringify({
                forDate,
                parentCategory: parent,
                parentSubCategory: parentSub === NULL_SENTINEL ? '' : parentSub,
                subCategory: sub || null,
                quantity: parseInt(quantity, 10)
            })
        })
        .then(r => r.json())
        .then(data => {
            this.disabled = false;
            if (data.success) {
                closeEditModal();
                loadRecords(currentPage);
            } else {
                errEl.textContent = data.error || {{ _("Error saving record.") | tojson }};
                errEl.classList.remove('hidden');
            }
        })
        .catch(() => {
            this.disabled = false;
            errEl.textContent = {{ _("Network error.") | tojson }};
            errEl.classList.remove('hidden');
        });
    });

    // ----------------------------- Delete ----------------------------- //
    let pendingDeleteId = null;

    function deleteRecord(id) {
        pendingDeleteId = id;
        document.getElementById('deleteModal').classList.remove('hidden');
        document.getElementById('deleteModal').classList.add('flex');
    }

    function closeDeleteModal() {
        document.getElementById('deleteModal').classList.add('hidden');
        document.getElementById('deleteModal').classList.remove('flex');
        pendingDeleteId = null;
    }

    document.getElementById('cancelDeleteBtn').addEventListener('click', closeDeleteModal);

    document.getElementById('deleteModal').addEventListener('click', function(e) {
        if (e.target === this) closeDeleteModal();
    });

    document.getElementById('confirmDeleteBtn').addEventListener('click', function() {
        if (!pendingDeleteId) return;
        const id = pendingDeleteId;
        this.disabled = true;
        this.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i>{{ _("Deleting…") }}';
        fetch(API_PREFIX + `api/generali/pdqm/${id}`, {
            headers: { 'X-CSRFToken': csrfToken },
            method: 'DELETE'
        })
        .then(r => r.json())
        .then(data => {
            this.disabled = false;
            this.innerHTML = {{ _("Delete") | tojson }};
            closeDeleteModal();
            if (data.success) {
                loadRecords(currentPage);
            } else {
                const errDiv = document.createElement('div');
                errDiv.className = 'fixed bottom-4 right-4 z-50 bg-red-500 text-white text-sm font-semibold px-4 py-3 rounded-xl shadow-lg';
                errDiv.textContent = data.error || {{ _("Error deleting record.") | tojson }};
                document.body.appendChild(errDiv);
                setTimeout(() => errDiv.remove(), 4000);
            }
        })
        .catch(() => {
            this.disabled = false;
            this.innerHTML = {{ _("Delete") | tojson }};
            closeDeleteModal();
        });
    });

    // ----------------------------- init ----------------------------- //
    loadCategories();
    loadRecords(1);
</script>
