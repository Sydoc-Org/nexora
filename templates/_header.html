<!DOCTYPE html>
<html lang="{{ get_locale }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
        }
    </style>
  </head>
  <body>
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <a href="{{ url_for('dashboard') }}">
                        <i class="fas fa-file-alt text-3xl text-indigo-600 mr-3"></i>
                    </a>
                    <a href="{{ url_for('dashboard') }}" class="text-2xl font-bold text-gray-800 hover:text-indigo-600 transition">
                        Sydoc Portal
                    </a>
                </div>

                <div class="flex items-center space-x-5">
                    <nav class="hidden md:flex space-x-6">
                        <a href="{{ url_for('dashboard') }}"
                            class="{% if active_page == 'dashboard' %} text-white font-semibold bg-indigo-600 px-4 py-2 rounded-full shadow-md 
                            {% else %} text-gray-600 hover:text-indigo-600 transition px-4 py-2 rounded-full {% endif %}">
                            <i class="fas fa-tachometer-alt mr-2"></i>Dashboard
                        </a>
                        <a href="{{ url_for('workitems_overview') }}"
                            class="{% if active_page == 'workitems_overview' %} text-white font-semibold bg-indigo-600 px-4 py-2 rounded-full shadow-md
                            {% else %} text-gray-600 hover:text-indigo-600 transition px-4 py-2 rounded-full {% endif %}">
                            <i class="fas fa-list mr-2"></i>Workitems
                        </a>
                    </nav>
                 </div>

                <div class="flex items-center space-x-5">
                    <button class="bell relative mr-4 cursor-pointer">
                        <i class="fas fa-bell text-2xl text-gray-500 hover:text-indigo-600 transition cursor-pointer"></i>
                        <span class="absolute top-0 right-0 h-2 w-2 bg-red-500 rounded-full"></span>
                    </button>
                    <div class="relative">
                        <el-dropdown>
                            <button class="flex items-center space-x-2 cursor-pointer">
                                <img src="{{ url_for('static',filename='images/' + userid + '-Icon.png') }}"
                                    alt="User Avatar" class="h-10 w-10 rounded-full cursor-pointer">
                                <span class="hidden lg:inline font-semibold text-gray-700 cursor-pointer">{{ logged_in_user }}</span>
                            </button>
                            <el-menu anchor="bottom end" popover
                                class="w-48 origin-top-right rounded-md bg-white py-1 shadow-lg ring-1 ring-black/5 transition transition-discrete [--anchor-gap:--spacing(2)] focus:outline-hidden data-closed:scale-95 data-closed:transform data-closed:opacity-0 data-enter:duration-100 data-enter:ease-out data-leave:duration-75 data-leave:ease-in">
                                <a href="{{ url_for('profile') }}"
                                    class="block px-4 py-2 text-sm text-gray-700 focus:bg-gray-100 focus:outline-hidden">Your
                                    Profile</a>
                                <a href="{{ url_for('logout') }}"
                                    class="block px-4 py-2 text-sm text-gray-700 focus:bg-gray-100 focus:outline-hidden">Sign
                                    out</a>
                            </el-menu>
                        </el-dropdown>
                    </div>
                </div>
        </div>
    </header>
  </body>
</html>
