<!DOCTYPE html>
<html lang="{{ get_locale }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{{ _("Login - nexora") }} </title>
    <!-- Pre-paint theme apply -- see hero.html for the full explanation.
         Same localStorage keys, same anti-flash reasoning. -->
    <script nonce="{{ csp_nonce() }}">
        (function () {
            try {
                var ls = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
                var stored = {};
                try { stored = JSON.parse(ls('nexora-ui-prefs')) || {}; } catch (e) {}
                var theme = stored.theme || (ls('nexora-theme') === 'dark' ? 'dark' : 'light');
                var dark = theme === 'dark';
                if (dark) document.documentElement.classList.add('dark');

                // Accent: the logo/brand color follows the user's
                // Appearance pick even before login, via the same
                // localStorage mirror _header.html writes once they've
                // logged in once on this browser -- first-ever visit
                // falls through to the default indigo, same as everywhere
                // else this mirror is read pre-login.
                var accent = stored.accent || 'indigo';
                var d = document.documentElement;
                if (accent === 'custom') {
                    var m = /^#([0-9a-f]{6})$/i.exec(stored.accentHex || '');
                    if (m) {
                        var n = parseInt(m[1], 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
                        var mix = function (t, w) {
                            return 'rgb(' + Math.round(r + (w - r) * t) + ',' +
                                Math.round(g + (w - g) * t) + ',' + Math.round(b + (w - b) * t) + ')';
                        };
                        var mixc = function (t, wr, wg, wb) {
                            return 'rgb(' + Math.round(r + (wr - r) * t) + ',' +
                                Math.round(g + (wg - g) * t) + ',' + Math.round(b + (wb - b) * t) + ')';
                        };
                        var base = dark ? mix(0.30, 255) : 'rgb(' + r + ',' + g + ',' + b + ')';
                        var hover = dark ? mix(0.45, 255) : mix(0.15, 0);
                        var partner = dark ? mix(0.55, 255) : mixc(0.28, 124, 58, 237);
                        d.style.setProperty('--nx-accent', base);
                        d.style.setProperty('--nx-accent-hover', hover);
                        d.style.setProperty('--nx-violet', partner);
                    }
                } else if (accent !== 'indigo') {
                    d.setAttribute('data-accent', accent);
                }
            } catch (e) {}
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Config must come AFTER the CDN script -- setting it before gets
         silently overwritten when the script loads (see hero.html, this
         was a real bug there: without darkMode:'class', dark: utilities
         follow the OS color-scheme instead of the toggle button). -->
    <script nonce="{{ csp_nonce() }}">
        tailwind.config = { darkMode: 'class' };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha384-blOohCVdhjmtROpu8+CfTnUWham9nkX7P7OZQMst+RUnhtoY/9qemFAkIKOYxDI3" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ static_v('css/index.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ static_v('images/favicon.ico') }}">

    <link rel="stylesheet" href="{{ static_v('css/nexora-ui.css') }}">
    <link rel="stylesheet" href="{{ static_v('css/auth.css') }}">
</head>

<body class="min-h-screen flex flex-col">

    {% include '_maintenance_banner.html' %}

    <header class="bg-white shadow-sm">
        <div class="container mx-auto flex items-center justify-between px-6 py-4">
            {% include 'nexora_logo/_nexora_logo.html' %}
            <button type="button" class="auth-theme-toggle inline-flex items-center justify-center rounded-full w-10 h-10" aria-label="{{ _('Switch to dark mode') }}" aria-pressed="false" data-testid="login-theme-toggle">
                <i class="fas fa-sun dark:hidden" aria-hidden="true"></i>
                <i class="fas fa-moon hidden dark:inline" aria-hidden="true"></i>
            </button>
        </div>
    </header>
    <main class="flex-grow flex items-center justify-center">
        <section class="bg-white w-full">
            <div class="container mx-auto px-6 py-20">
                <div class="flex flex-col md:flex-row items-center justify-center">
                    <div id="login-form" class="md:w-1/2 lg:w-2/5">
                        <div class="bg-white rounded-xl shadow-2xl p-8">
                            <h3 class="text-2xl font-bold text-center text-gray-800 mb-6">Login</h3>
                            {% if error %}
                            <div class="error-message">{{ error }}</div>
                            {% endif %}
                            <form method="POST" action="{{ url_for('login') }}" data-testid="login-form">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                                <div class="mb-4">
                                    <label for="username" class="block text-gray-700 text-sm font-bold mb-2">
                                        {{ _("Username") }} </label>
                                    <div class="relative">
                                        <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                                            <i class="fas fa-user text-gray-400"></i>
                                        </span>
                                        <input type="text" id="username" name="username" autocomplete="username"
                                            class="w-full pl-10 pr-4 py-2 border rounded-lg text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                            placeholder='{{ _("Your Username") }}' data-testid="login-username">
                                    </div>
                                </div>
                                <div class="mb-6">
                                    <label for="password" class="block text-gray-700 text-sm font-bold mb-2">{{ _("Password") }} </label>
                                    <div class="relative">
                                        <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                                            <i class="fas fa-lock text-gray-400"></i>
                                        </span>
                                        <input type="password" id="password" name="password" autocomplete="current-password"
                                            class="w-full pl-10 pr-10 py-2 border rounded-lg text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                            data-testid="login-password">
                                        <button type="button" class="auth-pw-toggle absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600"
                                            data-target="password" aria-label="{{ _('Toggle password visibility') }}" data-testid="login-password-toggle">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="flex items-center justify-between mb-6">
                                    <!-- <label class="flex items-center text-sm text-gray-600">
                                        <input type="checkbox" class="form-checkbox h-4 w-4 text-indigo-600"
                                            id="remember" name="remember">
                                        <span class="ml-2">{{ _("Remember me") }} </span>
                                    </label> -->
                                    <a href="{{ url_for('forgot_password') }}"
                                        class="text-sm text-indigo-600 hover:underline" data-testid="login-forgot">{{ _("Forgot password") }}? </a>
                                </div>
                                <button type="submit"
                                    class="w-full bg-gradient-primary text-white font-bold py-3 px-4 rounded-lg hover:opacity-90 transition duration-300" data-testid="login-submit">
                                    {{ _("Sign in") }}
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    {% include '_small_footer.html' %}
    {% include 'js/_auth_pw_toggle_js.html' %}
    {% include 'js/_auth_theme_toggle_js.html' %}
</body>

</html>
