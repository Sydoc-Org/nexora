{# Applies the user's UI preferences before first paint: theme, accent,
   density, radius, contrast, motion, backdrop.

   JS ONLY -- no <script> tag. Every includer wraps it in its own
   <script nonce="{{ csp_nonce() }}">, which is why _header.html's rendered
   output is byte-identical to before this was extracted (#243).

   Reads two context vars, both injected on every response and both {} when
   logged out: `ui_prefs` (Users.ui_prefs) and `brand` (the org accent).
   That is what lets a PRE-AUTH page include this: on verify_2fa the session
   holds pre_2fa_userid, not userid, so the server has no prefs to give --
   and the localStorage mirror written at the end of this block supplies them
   instead, from that browser's last signed-in page load. No DB read on the
   login path, and nothing about the account is disclosed to someone holding
   only the password. #}

        /* ---- UI prefs (issue #155): apply server-stored prefs pre-paint ----
           DB (Users.ui_prefs) is authoritative; keys the user never saved fall
           back to the legacy localStorage keys, then to the defaults. */
        (function () {
            var stored = {{ ui_prefs | tojson }};
            var brand = {{ brand | tojson }};
            var d = document.documentElement;
            var ls = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
            /* Resilience: if a save never reached the server (offline, 401),
               the last locally-applied prefs fill any keys the DB lacks. */
            try {
                stored = Object.assign({}, JSON.parse(ls('nexora-ui-prefs')) || {}, stored);
            } catch (e) {}
            var eff = {
                theme:      stored.theme      || (ls('nexora-theme') === 'dark' ? 'dark' : 'light'),
                accent:     stored.accent     || (brand.accent_hex ? 'custom' : 'amber'),
                accentHex:  stored.accentHex  || brand.accent_hex || '#4f46e5',
                motion:     stored.motion     || 'full',
                entrance:   stored.entrance   || 'rise',
                animspeed:  stored.animspeed  || 'normal',
                density:    stored.density    || 'comfortable',
                sidebar:    stored.sidebar    || (ls('nexora-sidebar-pinned') === 'true' ? 'pinned' : 'auto'),
                fontscale:  stored.fontscale  || 'md',
                radius:     stored.radius     || 'default',
                contrast:   stored.contrast   || 'normal',
                stripes:    stored.stripes    || 'off',
                background: stored.background || 'plain'
            };
            var sysDark = window.matchMedia('(prefers-color-scheme: dark)');

            /* Custom accent: derive the token family (hover/soft/tint/gradient)
               from one hex, dark-aware, and pin it via inline style props. */
            var ACCENT_PROPS = ['--nx-accent', '--nx-accent-hover', '--nx-accent-soft',
                '--nx-accent-tint', '--nx-violet', '--nx-brand-grad',
                '--a-ink', '--a-ink-hover', '--a-indigo', '--a-indigo-soft'];
            function applyCustomAccent(dark) {
                var m = /^#([0-9a-f]{6})$/i.exec(eff.accentHex || '');
                if (!m) return false;
                var n = parseInt(m[1], 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
                function mix(t, w) {
                    return 'rgb(' + Math.round(r + (w - r) * t) + ',' +
                        Math.round(g + (w - g) * t) + ',' + Math.round(b + (w - b) * t) + ')';
                }
                function mixc(t, wr, wg, wb) {
                    return 'rgb(' + Math.round(r + (wr - r) * t) + ',' +
                        Math.round(g + (wg - g) * t) + ',' + Math.round(b + (wb - b) * t) + ')';
                }
                var base  = dark ? mix(0.30, 255) : 'rgb(' + r + ',' + g + ',' + b + ')';
                var hover = dark ? mix(0.45, 255) : mix(0.15, 0);
                var soft  = 'rgba(' + r + ',' + g + ',' + b + (dark ? ',0.22)' : ',0.12)');
                var tint  = dark ? mix(0.62, 0) : mix(0.90, 255);
                var partner = dark ? mix(0.55, 255) : mixc(0.28, 124, 58, 237);
                var vals = [base, hover, soft, tint, partner,
                    'linear-gradient(135deg, ' + base + ' 0%, ' + partner + ' 100%)',
                    base, hover, base, soft];
                for (var i = 0; i < ACCENT_PROPS.length; i++) d.style.setProperty(ACCENT_PROPS[i], vals[i]);
                return true;
            }

            function apply() {
                var dark = eff.theme === 'dark' || (eff.theme === 'system' && sysDark.matches);
                d.classList.toggle('dark', dark);
                d.removeAttribute('data-accent');
                for (var i = 0; i < ACCENT_PROPS.length; i++) d.style.removeProperty(ACCENT_PROPS[i]);
                if (eff.accent === 'custom') {
                    if (!applyCustomAccent(dark)) d.removeAttribute('data-accent');
                } else if (eff.accent !== 'indigo') {
                    d.setAttribute('data-accent', eff.accent);
                }
                d.classList.toggle('nx-motion-reduced', eff.motion === 'reduced');
                if (eff.entrance !== 'rise') d.setAttribute('data-entrance', eff.entrance);
                else d.removeAttribute('data-entrance');
                if (eff.animspeed !== 'normal') d.setAttribute('data-animspeed', eff.animspeed);
                else d.removeAttribute('data-animspeed');
                d.classList.toggle('nx-compact', eff.density === 'compact');
                d.classList.toggle('sidebar-pinned', eff.sidebar === 'pinned');
                if (eff.fontscale !== 'md') d.setAttribute('data-fontscale', eff.fontscale);
                else d.removeAttribute('data-fontscale');
                if (eff.radius !== 'default') d.setAttribute('data-radius', eff.radius);
                else d.removeAttribute('data-radius');
                d.classList.toggle('nx-contrast', eff.contrast === 'high');
                d.classList.toggle('nx-stripes', eff.stripes === 'on');
                if (eff.background !== 'plain') d.setAttribute('data-bg', eff.background);
                else d.removeAttribute('data-bg');
                // Fireflies need actual DOM nodes, not just the CSS attribute
                // selector Aurora/Grid rely on. __nxSyncFireflies is defined
                // later (_header_js.html) — undefined on this first,
                // pre-paint call, which is fine: that initial state is
                // covered by its own DOMContentLoaded sync. This call only
                // matters for later, live pref changes (Appearance page).
                if (window.__nxSyncFireflies) window.__nxSyncFireflies(eff.background);
            }
            apply();
            sysDark.addEventListener('change', function () { if (eff.theme === 'system') apply(); });

            window.__nxPrefs = eff;
            /* Mirror for pages whose own <head> runs before this script
               (e.g. the reporting rp-anim gate). */
            try { localStorage.setItem('nexora-ui-prefs', JSON.stringify(eff)); } catch (e) {}

            /* Shared setter: apply live, mirror legacy localStorage keys,
               persist to the server. Accepts a single key/value or an object
               patch: nxSetUiPref({theme:'dark',...}). Writes are coalesced
               and sent one at a time — parallel PATCHes would race the
               read-merge-write on the server (last writer wins). */
            var pendingPatch = null, patchInflight = false;
            function pushPatch() {
                if (patchInflight || !pendingPatch) return;
                var body = JSON.stringify(pendingPatch);
                pendingPatch = null;
                patchInflight = true;
                var meta = document.querySelector('meta[name="csrf-token"]');
                var API_PREFIX = window.location.href.includes("nexora") ? "/nexora/" : "/";
                fetch(API_PREFIX + 'profile/ui_prefs', {
                    method: 'POST',
                    credentials: 'same-origin',
                    // keepalive: lets this tiny PATCH survive a navigation that
                    // starts right after the click (e.g. picking a background
                    // then immediately clicking a sidebar link) — without it
                    // the browser aborts the in-flight request on unload, the
                    // DB write never lands, and the next page's server-
                    // rendered ui_prefs silently reverts the pick.
                    keepalive: true,
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': meta ? meta.getAttribute('content') : ''
                    },
                    body: body
                }).catch(function () {}).finally(function () {
                    patchInflight = false;
                    pushPatch();
                });
            }
            window.nxSetUiPref = function (key, value) {
                var patch = typeof key === 'object' ? key : (function () {
                    var p = {}; p[key] = value; return p;
                })();
                for (var k in patch) eff[k] = patch[k];
                apply();
                try {
                    localStorage.setItem('nexora-ui-prefs', JSON.stringify(eff));
                    if ('theme' in patch) {
                        localStorage.setItem('nexora-theme',
                            d.classList.contains('dark') ? 'dark' : 'light');
                    }
                    if ('sidebar' in patch) {
                        localStorage.setItem('nexora-sidebar-pinned',
                            patch.sidebar === 'pinned' ? 'true' : 'false');
                    }
                } catch (e) {}
                pendingPatch = Object.assign(pendingPatch || {}, patch);
                pushPatch();
            };
        })();
