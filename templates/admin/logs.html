<!DOCTYPE html>
<html lang="{{ get_locale }}">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ _("System Logs - nexora") }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
</head>
<body class="bg-gray-50 text-gray-800">
    {% set active_page = 'admin_logs' %}
    {% include '_header.html' %}
    
    <main class="container mx-auto p-6">
        <div class="flex items-center space-x-4 mb-6">
            <a href="{{ url_for('admin_dashboard') }}" class="text-gray-500 hover:text-indigo-600">
                <i class="fas fa-arrow-left"></i> {{ _("Back") }}
            </a>
            <h2 class="text-3xl font-bold text-gray-800">{{ _("System Logs Explorer") }}</h2>
        </div>

        <div class="bg-white rounded-xl shadow p-6 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ _("Username") }}</label>
                    <input type="text" id="filterUser" class="w-full rounded border-gray-300 focus:ring-indigo-500 focus:border-indigo-500 text-sm" placeholder="e.g. jdoe">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ _("Action Type") }}</label>
                    <input type="text" id="filterAction" class="w-full rounded border-gray-300 focus:ring-indigo-500 focus:border-indigo-500 text-sm" placeholder="e.g. login">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ _("Status") }}</label>
                    <select id="filterStatus" class="w-full rounded border-gray-300 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                        <option value="">{{ _("All") }}</option>
                        <option value="SUCCESS">SUCCESS</option>
                        <option value="FAILURE">FAILURE</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ _("Date Range") }}</label>
                    <div class="flex space-x-2">
                        <input type="date" id="filterStart" class="w-full rounded border-gray-300 text-sm">
                        <input type="date" id="filterEnd" class="w-full rounded border-gray-300 text-sm">
                    </div>
                </div>
                <div>
                    <button onclick="fetchLogs(1)" class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700 transition">
                        <i class="fas fa-search mr-2"></i>{{ _("Search Logs") }}
                    </button>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left text-gray-500">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-100">
                        <tr>
                            <th class="px-6 py-3">{{ _("Timestamp") }}</th>
                            <th class="px-6 py-3">{{ _("User") }}</th>
                            <th class="px-6 py-3">{{ _("Action") }}</th>
                            <th class="px-6 py-3">{{ _("Status") }}</th>
                            <th class="px-6 py-3">{{ _("IP") }}</th>
                            <th class="px-6 py-3 w-1/3">{{ _("Details") }}</th>
                        </tr>
                    </thead>
                    <tbody id="logsTableBody">
                        <tr><td colspan="6" class="px-6 py-4 text-center">{{ _("Use filters to search logs") }}</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="bg-gray-50 px-6 py-3 border-t border-gray-200 flex justify-between items-center" id="paginationControls">
                <span class="text-sm text-gray-700" id="pageInfo"></span>
                <div class="space-x-2">
                    <button id="prevBtn" class="px-3 py-1 border rounded bg-white disabled:opacity-50" onclick="changePage(-1)" disabled>{{ _("Previous") }}</button>
                    <button id="nextBtn" class="px-3 py-1 border rounded bg-white disabled:opacity-50" onclick="changePage(1)" disabled>{{ _("Next") }}</button>
                </div>
            </div>
        </div>
    </main>


    {% include 'js/admin/_logsJS.html' %}
</body>
</html>
