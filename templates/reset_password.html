<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Sydoc Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main {
            flex-grow: 1;
        }

        .bg-gradient-primary {
            background-image: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .success-message {
            padding: 12px;
            margin-bottom: 1.5rem;
            border-radius: 6px;
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid #10b981;
            color: #059669;
            text-align: center;
            font-size: 0.9rem;
        }

        .error-message {
            padding: 12px;
            margin-bottom: 1.5rem;
            border-radius: 6px;
            background-color: rgba(238, 12, 12, 0.1);
            border: 1px solid #ee0c0c;
            color: #eb1c0d;
            text-align: center;
            font-size: 0.9rem;
        }
    </style>
</head>

<body class="bg-gray-50">

    <header class="bg-white shadow-sm">
        <div class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <i class="fas fa-file-alt text-3xl text-indigo-600 mr-3"></i>
                    <h1 class="text-2xl font-bold text-gray-800">Sydoc Portal</h1>
                </div>
                <nav class="hidden md:flex items-center space-x-6">
                    <a href="https://sydoc.ch/"
                        class="text-gray-600 hover:text-indigo-600 transition duration-300">Homepage</a>
                    <a href="#services" class="text-gray-600 hover:text-indigo-600 transition duration-300">Services</a>
                    <a href="mailto:support.helpdesk@sydoc.ch"
                        class="text-gray-600 hover:text-indigo-600 transition duration-300">Contact</a>
                </nav>
                <button class="md:hidden">
                    <i class="fas fa-bars text-2xl text-gray-600"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex items-center justify-center py-12 md:py-20">
        <div class="container mx-auto px-6">
            <div class="flex justify-center">
                <div class="w-full max-w-md">
                    <div class="bg-white rounded-xl shadow-2xl p-8">
                        <div class="text-center mb-8">
                            <h2 class="text-2xl font-bold text-gray-800 mb-2">Set a New Password</h2>
                            <p class="text-gray-600">Your new password must be different from your previously used
                                password.</p>
                        </div>
                        {% if error %}
                        <div class="error-message">{{ error }}</div>
                        {% endif %}
                        {% if message %}
                        <div class="success-message">{{ message }}</div>
                        {% endif %}
                        <form id="resetForm" class="space-y-6" novalidate method="POST" action="/set_new_password">
                            <div class="mb-6">
                                <label for="new-password" class="block text-gray-700 text-sm font-bold mb-2">New
                                    Password</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                                        <i class="fas fa-lock text-gray-400"></i>
                                    </span>
                                    <input type="password" id="new-password" name="new-password"
                                        class="w-full pl-10 pr-4 py-2 border rounded-lg text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                        placeholder="Enter your new password" required>
                                </div>
                            </div>

                            <div class="mb-6">
                                <label for="confirm-password" class="block text-gray-700 text-sm font-bold mb-2">Confirm
                                    New Password</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                                        <i class="fas fa-lock text-gray-400"></i>
                                    </span>
                                    <input type="password" id="confirm-password" name="confirm-password"
                                        class="w-full pl-10 pr-4 py-2 border rounded-lg text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                        placeholder="Confirm your new password" required>
                                </div>
                            </div>

                            <button type="submit"
                                class="w-full bg-gradient-primary text-white font-bold py-3 px-4 rounded-lg hover:opacity-90 transition duration-300 mb-6">
                                Reset Password
                            </button>
                        </form>
                        <div class="text-center" style="margin-top: 20px;">
                        <a href="/" class="text-sm text-indigo-600 hover:underline font-medium">
                            <i class="fas fa-arrow-left mr-1"></i> Back to Login
                        </a>
                    </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-gray-50 mt-auto">
        <div class="container mx-auto px-6 py-6 text-center text-gray-500 text-sm">
            &copy; 2025 Sydoc Portal. All Rights Reserved.
        </div>
    </footer>

</body>

</html>
