<!DOCTYPE html>
<html lang="{{ get_locale }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Reset password - Sydoc Portal') }} </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static',filename='css/reset_password.css') }}">
</head>

<body class="bg-gray-50">

    <header class="bg-white shadow-sm">
        <div class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <i class="fas fa-file-alt text-3xl text-indigo-600 mr-3"></i>
                    <a href="{{ url_for('index') }}"><h1 class="text-2xl font-bold text-gray-800">Sydoc Portal</h1></a>
                </div>
                <button class="md:hidden">
                    <i class="fas fa-bars text-2xl text-gray-600"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex items-center justify-center py-12 md:py-20">
        <div class="container mx-auto px-6">
            <div class="flex justify-center">
                <div class="w-full max-w-md">
                    <div class="bg-white rounded-xl shadow-2xl p-8">
                        <div class="text-center mb-8">
                            <h2 class="text-2xl font-bold text-gray-800 mb-2">{{ _('Set a new password') }} </h2>
                            <p class="text-gray-600">{{ _('Your new password must be different from your previously used password.') }} </p>
                        </div>
                        {% if error %}
                        <div class="error-message">{{ error }}</div>
                        {% endif %}
                        {% if message %}
                        <div class="success-message">{{ message }}</div>
                        {% endif %}
                        <form id="resetForm" class="space-y-6" novalidate method="POST" action="{{ url_for('set_new_password') }}">
                            <div class="mb-6">
                                <label for="new-password" class="block text-gray-700 text-sm font-bold mb-2">{{ _('New password') }} </label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                                        <i class="fas fa-lock text-gray-400"></i>
                                    </span>
                                    <input type="password" id="new-password" name="new-password"
                                        class="w-full pl-10 pr-4 py-2 border rounded-lg text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                        placeholder="Enter your new password" required>
                                </div>
                            </div>

                            <div class="mb-6">
                                <label for="confirm-password" class="block text-gray-700 text-sm font-bold mb-2">{{ _('Confirm new password') }} </label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                                        <i class="fas fa-lock text-gray-400"></i>
                                    </span>
                                    <input type="password" id="confirm-password" name="confirm-password"
                                        class="w-full pl-10 pr-4 py-2 border rounded-lg text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                        placeholder="Confirm your new password" required>
                                </div>
                            </div>

                            <button type="submit"
                                class="w-full bg-gradient-primary text-white font-bold py-3 px-4 rounded-lg hover:opacity-90 transition duration-300 mb-6">
                                {{ _('Reset password') }} 
                            </button>
                        </form>
                        <div class="text-center" style="margin-top: 20px;">
                        <a href="{{ url_for('index') }}" class="text-sm text-indigo-600 hover:underline font-medium">
                            <i class="fas fa-arrow-left mr-1"></i> {{ _('Back to login') }}
                        </a>
                    </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-gray-50 mt-auto">
        <div class="container mx-auto px-6 py-6 text-center text-gray-500 text-sm">
            &copy; 2025 Sydoc Portal. {{ _('All rights reserved.') }} 
        </div>
    </footer>

</body>

</html>
