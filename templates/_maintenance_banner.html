<style>
  #maintenance-banner {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 35;
    display: none;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  /* When the sidebar is present (in-app pages), shift banner past the collapsed sidebar
     and let the sidebar (z-index 40) expand over it on hover. */
  @media (min-width: 769px) {
    #maintenance-banner.mb-with-sidebar { left: 64px; }
  }
  #maintenance-banner.mb-show { display: flex; align-items: center; gap: 12px; }
  #maintenance-banner .mb-icon { flex: 0 0 auto; font-size: 16px; }
  #maintenance-banner .mb-body { flex: 1 1 auto; min-width: 0; }
  #maintenance-banner .mb-title { font-weight: 700; margin-right: 6px; }
  #maintenance-banner .mb-window { opacity: 0.85; font-size: 12px; margin-left: 8px; white-space: nowrap; }
  #maintenance-banner .mb-dismiss {
    flex: 0 0 auto;
    background: transparent;
    border: 0;
    color: inherit;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    opacity: 0.8;
  }
  #maintenance-banner .mb-dismiss:hover { background: rgba(0,0,0,0.1); opacity: 1; }
  #maintenance-banner.mb-info     { background: #eef2ff; color: #3730a3; border-bottom: 1px solid #c7d2fe; }
  #maintenance-banner.mb-warning  { background: #fffbeb; color: #92400e; border-bottom: 1px solid #fde68a; }
  #maintenance-banner.mb-critical { background: #fef2f2; color: #991b1b; border-bottom: 1px solid #fecaca; }
  body.has-maintenance-banner { padding-top: 44px; }
  @media (max-width: 640px) {
    #maintenance-banner .mb-window { display: none; }
  }
</style>
<div id="maintenance-banner" role="alert" aria-live="polite" data-testid="maintenance-banner"></div>
<script nonce="{{ csp_nonce() }}">
(function() {
    if (window.__maintenanceBannerInit) return;
    window.__maintenanceBannerInit = true;
    const API_PREFIX = window.location.href.includes("nexora") ? "/nexora/" : "/";
    const SEVERITY_ICON = { info: 'fa-circle-info', warning: 'fa-triangle-exclamation', critical: 'fa-circle-exclamation' };
    const banner = document.getElementById('maintenance-banner');
    if (!banner) return;

    let _countdownInterval = null;
    let _activeBannerKey = null;

    function fmt(iso) {
        if (!iso) return '';
        return iso.replace('T', ' ').substring(0, 16);
    }

    function minutesUntil(isoStr) {
        return Math.max(0, Math.ceil((new Date(isoStr) - Date.now()) / 60000));
    }

    function hide() {
        _activeBannerKey = null;
        if (_countdownInterval) { clearInterval(_countdownInterval); _countdownInterval = null; }
        banner.classList.remove('mb-show');
        document.body.classList.remove('has-maintenance-banner');
        banner.replaceChildren();
    }

    function render(b) {
        const upcoming = !!b.upcoming;
        const dismissKey = upcoming ? ('mb-announced-' + b.id) : ('mb-dismissed-' + b.id);

        if (sessionStorage.getItem(dismissKey) === '1') return;

        const bannerKey = b.id + ':' + (upcoming ? 'up' : 'live');
        if (_activeBannerKey === bannerKey) return;
        _activeBannerKey = bannerKey;

        if (_countdownInterval) { clearInterval(_countdownInterval); _countdownInterval = null; }

        banner.replaceChildren();
        const hasSidebar = !!document.getElementById('nexora-sidebar');
        banner.className = 'mb-show mb-' + (b.severity || 'info') + (hasSidebar ? ' mb-with-sidebar' : '');

        const ico = document.createElement('i');
        ico.className = 'fas mb-icon ' + (upcoming ? 'fa-clock' : (SEVERITY_ICON[b.severity] || SEVERITY_ICON.info));
        banner.appendChild(ico);

        const body = document.createElement('div');
        body.className = 'mb-body';

        if (upcoming) {
            const prefix = document.createElement('span');
            prefix.className = 'mb-title';
            prefix.appendChild(document.createTextNode({{ _('Maintenance in') | tojson }} + ' '));
            const countSpan = document.createElement('span');
            countSpan.id = 'mb-countdown';
            countSpan.textContent = String(minutesUntil(b.startAt));
            prefix.appendChild(countSpan);
            prefix.appendChild(document.createTextNode(' ' + {{ _('min:') | tojson }} + ' '));
            body.appendChild(prefix);

            _countdownInterval = setInterval(function() {
                const mins = minutesUntil(b.startAt);
                const el = document.getElementById('mb-countdown');
                if (el) el.textContent = String(mins);
                if (mins === 0) {
                    clearInterval(_countdownInterval);
                    _countdownInterval = null;
                    poll();
                }
            }, 60000);
        } else if (b.title) {
            const t = document.createElement('span');
            t.className = 'mb-title';
            t.textContent = b.title;
            body.appendChild(t);
        }

        body.appendChild(document.createTextNode(b.message || ''));
        if (b.startAt && b.endAt) {
            const win = document.createElement('span');
            win.className = 'mb-window';
            win.textContent = '(' + fmt(b.startAt) + ' – ' + fmt(b.endAt) + ')';
            body.appendChild(win);
        }
        banner.appendChild(body);

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'mb-dismiss';
        btn.setAttribute('aria-label', 'Dismiss');
        btn.setAttribute('data-testid', 'maintenance-banner-dismiss');
        const x = document.createElement('i');
        x.className = 'fas fa-xmark';
        btn.appendChild(x);
        btn.addEventListener('click', function() {
            sessionStorage.setItem(dismissKey, '1');
            hide();
        });
        banner.appendChild(btn);

        document.body.classList.add('has-maintenance-banner');
    }

    function poll() {
        fetch(API_PREFIX + 'api/maintenance/active')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data && data.success && data.banner) render(data.banner);
                else hide();
            })
            .catch(function() {});
    }

    poll();
    setInterval(poll, 60000);
})();
</script>
